    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁ𝔠ⲉ | 收割機 PRO</title>
    
    <link rel="icon" href="https://mobsp.github.io/assets/brand/ms-logo1.webp" type="image/jpeg">
    <link rel="apple-touch-icon" href="https://mobsp.github.io/assets/brand/ms-logo1.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #000000; --bg-container: #0a0a0a;
            --text-main: #ffffff; --text-sub: #888888;
            --accent-color: #00cec9; --nav-bg: #111111;
            --border-color: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, sans-serif; 
            background-color: var(--bg-body); 
            height: 100dvh; overflow: hidden; 
        }

        #app-container { 
            max-width: 500px; margin: 0 auto; 
            background-color: var(--bg-container); 
            height: 100%; display: flex; flex-direction: column; 
            border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color);
        }

        .app-header { 
            flex-shrink: 0;
            padding: calc(15px + env(safe-area-inset-top)) 15px 10px; 
            background: var(--nav-bg); border-bottom: 1px solid var(--border-color);
        }
        .brand-title-img { width: 100%; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .brand-title-img:active { opacity: 0.7; transform: scale(0.98); }

        #main-view { flex: 1; overflow-y: auto; background: #000; -webkit-overflow-scrolling: touch; }

        /* 工具頁面矩陣樣式 */
        .tool-panel { padding: 20px; animation: toolSlide 0.4s ease-out; }
        .tool-card { background: #111; border: 1px solid #222; padding: 25px 20px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .tool-input { 
            width: 100%; background: #000; border: 1px solid #333; padding: 16px; 
            border-radius: 14px; color: #fff; margin-bottom: 20px; outline: none; 
            font-size: 14px; border-color: var(--accent-color);
        }

        .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .opt-item { 
            background: #161616; padding: 12px; border-radius: 12px; 
            display: flex; align-items: center; gap: 10px; cursor: pointer; 
            border: 1px solid #222; transition: 0.2s; 
        }
        .opt-item.active { border-color: var(--accent-color); background: rgba(0, 206, 201, 0.08); }
        .opt-item i { font-size: 14px; color: #444; }
        .opt-item.active i { color: var(--accent-color); }
        .opt-label { font-size: 11px; color: #777; font-weight: 600; letter-spacing: 0.5px; }
        .opt-item.active .opt-label { color: #fff; }

        .harvester-btn { 
            width: 100%; background: var(--accent-color); color: #000; padding: 18px; 
            border-radius: 50px; font-weight: 900; border: none; cursor: pointer; 
            font-size: 15px; letter-spacing: 1px; box-shadow: 0 5px 15px rgba(0,206,201,0.2);
            transition: 0.3s;
        }
        .harvester-btn:active { transform: scale(0.96); opacity: 0.9; }
        .status-msg { margin-top: 15px; font-size: 10px; color: #444; text-align: center; letter-spacing: 1px; }

        /* 列表樣式 */
        .article-row { display: flex; gap: 15px; padding: 15px; border-bottom: 1px solid #111; align-items: center; text-decoration: none; }
        .row-img { width: 55px; height: 55px; border-radius: 10px; object-fit: cover; background: #1a1a1a; }
        .row-info { flex: 1; overflow: hidden; }
        .row-title { font-size: 14px; font-weight: 600; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row-cate { font-size: 9px; color: var(--accent-color); font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }

        .bottom-nav { 
            height: calc(65px + env(safe-area-inset-bottom)); 
            background-color: var(--nav-bg); border-top: 1px solid var(--border-color); 
            display: flex; justify-content: space-around; align-items: center; 
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #444; text-decoration: none; font-size: 10px; gap: 4px; flex: 1; cursor: pointer; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--accent-color); }

        @keyframes toolSlide { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
<link rel="alternate" hreflang="x-default" href="https://your-supreme-site.com/blog/index.html"><link rel="preconnect" href="https://gstatic.com" crossorigin=""><script type="module">import {onLCP,onFID,onCLS} from 'https://unpkg.com;</script><meta property="og:type" content="website"><meta property="og:image" content="https://your-supreme-site.com/og-image.webp"><link rel="preconnect" href="https://gstatic.com" crossorigin=""><script type="module">import {onLCP,onFID,onCLS} from 'https://unpkg.com;</script></head>
<body>

    <div id="app-container">
        <header class="app-header">
            <img src="https://mobsp.github.io/assets/brand/ms-blog-title.webp" class="brand-title-img" onclick="location.reload()">
        </header>

        <main id="main-view">
            <div id="content-loader" style="text-align:center; padding:50px; color:#222; font-size:10px; letter-spacing:2px;">INITIALIZING...</div>
        </main>

        <nav class="bottom-nav">
            <a href="https://mobsp.github.io/music/" class="nav-item" rel="noopener noreferrer"><i class="fa-solid fa-circle-play"></i><span>音樂</span></a>
            <div id="btn-read" class="nav-item active" onclick="switchToRead()"><i class="fa-solid fa-book-open"></i><span>閱讀</span></div>
            <div id="btn-tool" class="nav-item" onclick="switchToTools()"><i class="fa-solid fa-microchip"></i><span>收割機</span></div>
            <a href="https://mobsp.github.io/setting" class="nav-item" rel="noopener noreferrer"><i class="fa-solid fa-sliders"></i><span>設定</span></a>
        </nav>
    </div>

    <script>
        let rawArticles = [];
        let harvestOptions = { img: true, dark: true, code: true, clean: false };

        /* 切換分頁邏輯 */
        function switchToRead() {
            setNavActive('btn-read');
            renderArticleList();
        }

        function switchToTools() {
            setNavActive('btn-tool');
            document.getElementById('main-view').innerHTML = `
                <div class="tool-panel">
                    <div class="tool-card">
                        <input type="text" id="target-url" class="tool-input" placeholder="貼上欲收割的網址 (https://...)">
                        
                        <div class="option-grid">
                            <div class="opt-item ${harvestOptions.img?'active':''}" onclick="toggleOpt(this,'img')">
                                <i class="fa-solid fa-image"></i><span class="opt-label">吸取影像</span>
                            </div>
                            <div class="opt-item ${harvestOptions.dark?'active':''}" onclick="toggleOpt(this,'dark')">
                                <i class="fa-solid fa-moon"></i><span class="opt-label">OLED黑</span>
                            </div>
                            <div class="opt-item ${harvestOptions.code?'active':''}" onclick="toggleOpt(this,'code')">
                                <i class="fa-solid fa-code"></i><span class="opt-label">代碼美化</span>
                            </div>
                            <div class="opt-item ${harvestOptions.clean?'active':''}" onclick="toggleOpt(this,'clean')">
                                <i class="fa-solid fa-leaf"></i><span class="opt-label">極簡過濾</span>
                            </div>
                        </div>

                        <button onclick="startHarvestPro()" class="harvester-btn">執行深度收割</button>
                        <div id="h-status" class="status-msg">READY TO HARVEST V1.2</div>
                    </div>
                </div>`;
        }

        function setNavActive(id) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function toggleOpt(el, key) {
            harvestOptions[key] = !harvestOptions[key];
            el.classList.toggle('active');
        }

        /* 🚀 核心：深度收割引擎 */
        async function startHarvestPro() {
            const urlInput = document.getElementById('target-url');
            const status = document.getElementById('h-status');
            const url = urlInput.value.trim();

            if (!url.startsWith('http')) return status.innerText = "❌ 網址無效";
            
            status.innerText = "📡 正在穿透目標伺服器...";
            try {
                // 使用跨域代理獲取源碼
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
                const data = await res.json();
                const doc = new DOMParser().parseFromString(data.contents, 'text/html');
                
                const title = doc.querySelector('h1')?.innerText || doc.title || "Ⲙ𝔬ⲃ¡ⳝ𝔭_Archive";
                let contentHtml = '';

                // 精確提取邏輯
                const selectors = harvestOptions.clean ? 'p' : 'p, h2, h3, img, pre, code, blockquote';
                doc.querySelectorAll(selectors).forEach(el => {
                    // 1. 影像提取與路徑補全
                    if (el.tagName === 'IMG' && harvestOptions.img) {
                        let src = el.getAttribute('src');
                        if (src) {
                            try { src = new URL(src, url).href; } catch(e){} // 補全相對路徑
                            contentHtml += `<div style="margin:25px 0;"><img src="${src}" style="max-width:100%; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.5);"></div>\n`;
                        }
                    } 
                    // 2. 文字內容提取
                    else if (el.innerText.trim().length > 5) {
                        const tag = el.tagName.toLowerCase();
                        let inner = el.innerHTML;
                        // 如果是極簡模式，移除內嵌連結
                        if (harvestOptions.clean) inner = el.innerText; 
                        contentHtml += `<${tag} style="margin-bottom:1.5rem;">${inner}</${tag}>\n`;
                    }
                });

                // 3. 樣式矩陣注入
                const styleTag = `
                    body { 
                        background:${harvestOptions.dark?'#000':'#fff'}; 
                        color:${harvestOptions.dark?'#ccc':'#333'}; 
                        padding:40px 25px; line-height:1.8; font-family:-apple-system, sans-serif; 
                        max-width:600px; margin:0 auto; 
                    }
                    h1 { color:#00cec9; font-size:2rem; margin-bottom:2rem; border-bottom:1px solid #222; padding-bottom:15px; }
                    h2, h3 { color:${harvestOptions.dark?'#eee':'#000'}; margin-top:2.5rem; }
                    pre { 
                        background:#111; padding:20px; border-radius:12px; overflow-x:auto; 
                        border:1px solid #222; color:#00cec9; font-family:monospace; margin:20px 0;
                        display: ${harvestOptions.code?'block':'none'};
                    }
                    p { margin-bottom:1.2rem; }
                    img { display:block; }
                `;

                // 4. 打包下載
                const finalBlob = new Blob([`
                    <!DOCTYPE html><html><head><meta charset="UTF-8"><title>${title}</title><style>${styleTag}</style></head>
                    <body><h1>${title}</h1>${contentHtml}</body></html>
                `], {type:'text/html'});

                const a = document.createElement('a');
                a.href = URL.createObjectURL(finalBlob);
                a.download = `MS_${title.substring(0,10)}.html`;
                a.click();

                status.innerText = "✅ 收割成功！檔案已彈出。";
            } catch (err) {
                status.innerText = "❌ 代理失效或目標封鎖請求。";
            }
        }

        /* 列表同步邏輯 */
        async function loadArticles() {
            const api = "https://api.github.com/repos/mobsp/mobsp.github.io/contents/blog/p/list?t=" + Date.now();
            try {
                const res = await fetch(api);
                const files = await res.json();
                rawArticles = files.filter(f => f.name.endsWith('.html')).reverse().map(f => ({
                    title: decodeURIComponent(f.name).replace('.html','').trim(),
                    path: f.path
                }));
                renderArticleList();
            } catch (e) {
                document.getElementById('main-view').innerHTML = '<div style="text-align:center; padding:50px; color:#333;">SYNC FAILED</div>';
            }
        }

        function renderArticleList() {
            const container = document.getElementById('main-view');
            if (rawArticles.length === 0) return;
            container.innerHTML = rawArticles.map(p => `
                <a class="article-row" href="https://mobsp.github.io/${p.path}">
                    <div class="row-img"></div>
                    <div class="row-info">
                        <div class="row-cate">ARCHIVE</div>
                        <div class="row-title">${p.title}</div>
                    </div>
                    <i class="fa-solid fa-chevron-right" style="color:#111; font-size:10px;"></i>
                </a>`).join('');
        }

        window.onload = loadArticles;
    </script>


</body></html>
