<!DOCTYPE html><html lang="zh-TW"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁ𝔠ⲉ | 莫比空間：數位資源入口</title>
    <style>
        :root {
            --brand-bg: #0d1117;
            --brand-primary: #58a6ff;
            --brand-text: #c9d1d9;
            --user-bubble: #21262d;
            --ai-bubble: #161b22;
        }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--brand-bg); color: var(--brand-text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        
        /* 對話主視窗 */
        #chat-app { display: flex; flex-direction: column; height: 100vh; max-width: 1200px; margin: 0 auto; }
        #display-area { flex: 1; overflow-y: auto; padding: 20px; scroll-behavior: smooth; }
        
        /* 訊息泡泡基礎樣式 */
        .brand-msg-wrapper { margin-bottom: 24px; max-width: 85%; animation: fadeIn 0.3s ease; }
        .role-user { margin-left: auto; text-align: right; }
        .role-assistant { margin-right: auto; }
        
        .brand-msg-label { font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; color: var(--brand-primary); }
        .brand-msg-content { padding: 12px 16px; border-radius: 12px; line-height: 1.6; word-wrap: break-word; }
        .role-user .brand-msg-content { background: var(--user-bubble); border-bottom-right-radius: 2px; }
        .role-assistant .brand-msg-content { background: var(--ai-bubble); border: 1px solid #30363d; border-bottom-left-radius: 2px; }

        /* 多媒體預覽區域 */
        .brand-media-area { margin-top: 10px; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
        .preview-img { width: 100%; border-radius: 8px; cursor: pointer; border: 1px solid #30363d; }
        .preview-video, .preview-audio { width: 100%; border-radius: 8px; }

        /* 輸入控制列 */
        #input-panel { padding: 20px; background: #161b22; border-top: 1px solid #30363d; display: flex; gap: 10px; }
        #user-input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; color: white; outline: none; }
        #user-input:focus { border-color: var(--brand-primary); box-shadow: 0 0 0 3px rgba(88,166,255,0.3); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
<meta name="description" content="Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁ𝔠ⲉ | 莫比空間：數位資源入口 | MOBSP"><link rel="canonical" href="https://mobsp.qzz.io/beta/js-read/index.html"><meta property="og:type" content="website"><meta property="og:title" content="Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁ𝔠ⲉ | 莫比空間：數位資源入口"><meta property="og:description" content="Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁ𝔠ⲉ | 莫比空間：數位資源入口 | MOBSP"><meta property="og:url" content="https://mobsp.qzz.io/beta/js-read/index.html"><meta property="og:site_name" content="MOBSP"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁ𝔠ⲉ | 莫比空間：數位資源入口"><meta name="twitter:description" content="Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁ𝔠ⲉ | 莫比空間：數位資源入口 | MOBSP"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="/manifest.json"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="/icons/icon-192.webp"></head>
<body>

<div id="chat-app">
    <div id="display-area">
        </div>

    <div id="input-panel">
        <input type="text" id="user-input" placeholder="輸入關鍵字檢索資源或呼叫功能 (例如: 2026研發...)" autocomplete="off">
        <button id="send-btn" style="background: var(--brand-primary); border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; color: white; font-weight: bold;">傳送</button>
    </div>
</div>

<script>
    // 這裡放入我們重構後的 MobSpaceEngine Class
    // (為了簡潔，這裡直接引用邏輯，您可以將之前的 JS 存為 mobspace-engine.js 引入)
    
    // 模擬我們剛才討論的「1.json」索引數據 (實際運作時會從 GitHub 抓取)
    const mockManifest = {
        files: [
            { id: "fileA", name: "2026研發紀錄", path: "data/A.json", tags: ["dev"] },
            { id: "fileB", name: "品牌資源庫", path: "data/B.json", tags: ["assets"] }
        ]
    };

    class BrandApp {
        constructor() {
            // 初始化渲染引擎
            this.engine = new MobSpaceEngine({
                container: document.getElementById('display-area'),
                brandName: "Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁ𝔠ⲉ"
            });
            this.input = document.getElementById('user-input');
            this.btn = document.getElementById('send-btn');
            this.setupEventListeners();
        }

        setupEventListeners() {
            this.btn.onclick = () => this.handleAction();
            this.input.onkeypress = (e) => { if(e.key === 'Enter') this.handleAction(); };
        }

        async handleAction() {
            const query = this.input.value.trim();
            if(!query) return;

            // 1. 顯示使用者輸入 (模擬聊天介面)
            this.appendMessage('user', query);
            this.input.value = '';

            // 2. 搜尋與調度邏輯
            const matchedFile = mockManifest.files.find(f => query.includes(f.name) || f.tags.some(t => query.includes(t)));

            if(matchedFile) {
                this.appendMessage('assistant', `正在為您檢索「${matchedFile.name}」並加載數位資源...`);
                // 模擬抓取 A.json 或 B.json 並渲染
                // 這裡會執行 engine.render(data)
                setTimeout(() => {
                    this.engine.render([{ role: 'assistant', text: `這是從 ${matchedFile.name} 找到的內容，包含 HTML 語法與多媒體預覽：`, id: 'msg_001' }]);
                    // 這裡可以觸發附件渲染
                }, 800);
            } else {
                this.appendMessage('assistant', `抱歉，找不到與「${query}」相關的內容。建議試試：2026研發、品牌資源。`);
            }
        }

        appendMessage(role, text) {
            const wrap = document.createElement('div');
            wrap.className = `brand-msg-wrapper role-${role}`;
            wrap.innerHTML = `
                <div class="brand-msg-label">${role === 'user' ? 'USER' : 'Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁ𝔠ⲉ'}</div>
                <div class="brand-msg-content">${text}</div>
            `;
            document.getElementById('display-area').appendChild(wrap);
            document.getElementById('display-area').scrollTop = document.getElementById('display-area').scrollHeight;
        }
    }

    // 啟動應用
    const app = new BrandApp();

    // 這裡預留給 MobSpaceEngine 的 Class 代碼部分...
</script>



<script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {})); }</script></body></html>
