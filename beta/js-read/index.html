<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand History - 私人對話紀錄庫</title>
    <style>
        /* --- 品牌自定義區域 --- */
        :root {
            --brand-primary: #007AFF; /* 您的品牌主色 */
            --brand-bg: #f8f9fa;      /* 頁面背景色 */
            --chat-user-bg: #e3f2fd;  /* 使用者對話框顏色 */
            --chat-ai-bg: #ffffff;    /* AI 對話框顏色 */
            --text-main: #2c3e50;     /* 主要文字顏色 */
            --border-radius: 12px;    /* 圓角弧度 */
            --font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--brand-bg);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            border-bottom: 2px solid var(--brand-primary);
            padding-bottom: 20px;
        }

        /* --- 對話主題外框 --- */
        .conversation-card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            overflow: hidden;
            border: 1px solid #eee;
        }

        .conv-header {
            background: var(--brand-primary);
            color: white;
            padding: 15px 25px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .conv-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* --- 對話泡泡樣式 --- */
        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: var(--border-radius);
            position: relative;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .author-label {
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            color: #888;
        }

        /* 使用者訊息靠右 */
        .message-user {
            align-self: flex-end;
            background-color: var(--chat-user-bg);
            border-bottom-right-radius: 2px;
            border: 1px solid #bbdefb;
        }

        /* Assistant 訊息靠左 */
        .message-assistant {
            align-self: flex-start;
            background-color: var(--chat-ai-bg);
            border-bottom-left-radius: 2px;
            border: 1px solid #e0e0e0;
        }

        /* 檔案與附件樣式 */
        .file-attachment {
            margin-top: 10px;
            padding: 8px;
            background: rgba(0,0,0,0.05);
            border-left: 4px solid var(--brand-primary);
            font-size: 0.9rem;
        }

        .file-attachment a {
            color: var(--brand-primary);
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>品牌專屬對話儲存庫</h1>
        <p>INTERNAL ARCHIVE / CONFIDENTIAL</p>
    </header>

    <div id="brand-root">
        </div>
</div>

<script>
    /* 這裡貼上您 conversations.json 的內容 */
    const chatData = [
        // 系統會在此處載入資料
    ];

    /* 如果有資源清單 (assets.json)，貼在此處 */
    const assetsData = null; 

    const rootElement = document.getElementById('brand-root');

    function renderApp() {
        if (!chatData || chatData.length === 0) {
            rootElement.innerHTML = "<p>尚未偵測到對話紀錄...</p>";
            return;
        }

        chatData.forEach(conv => {
            // 1. 創建對話大卡片
            const card = document.createElement('div');
            card.className = 'conversation-card';

            // 2. 標題區
            const header = document.createElement('div');
            header.className = 'conv-header';
            header.textContent = conv.title || "未命名對話";
            card.appendChild(header);

            // 3. 訊息容器
            const body = document.createElement('div');
            body.className = 'conv-body';

            // 4. 解析對話樹 (Mapping)
            const mapping = conv.mapping;
            for (let id in mapping) {
                const node = mapping[id];
                const msg = node.message;

                if (msg && msg.content && msg.content.parts) {
                    const role = msg.author.role;
                    const textContent = msg.content.parts.join('\n');
                    
                    if (textContent.trim() !== "") {
                        const msgDiv = createMessageBubble(role, textContent, id);
                        body.appendChild(msgDiv);
                    }
                }
            }

            card.appendChild(body);
            rootElement.appendChild(card);
        });
    }

    function createMessageBubble(role, text, msgId) {
        const wrapper = document.createElement('div');
        wrapper.className = `message message-${role === 'user' ? 'user' : 'assistant'}`;

        // 角色標籤
        const label = document.createElement('span');
        label.className = 'author-label';
        label.textContent = role === 'user' ? 'YOU' : 'BRAND AI';
        wrapper.appendChild(label);

        // 文字內容
        const textNode = document.createTextNode(text);
        wrapper.appendChild(textNode);

        // 檔案處理邏輯 (移植自原始碼)
        if (assetsData && assetsData[msgId]) {
            assetsData[msgId].forEach(fileName => {
                const fileDiv = document.createElement('div');
                fileDiv.className = 'file-attachment';
                fileDiv.innerHTML = `📎 附件：<a href="${fileName}" target="_blank">${fileName}</a>`;
                wrapper.appendChild(fileDiv);
            });
        }

        return wrapper;
    }

    // 啟動渲染
    window.onload = renderApp;
</script>

</body>
</html>
