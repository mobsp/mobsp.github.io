<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>GitHub Ultra Indexer - visionOS Edition</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-blur: 25px;
            --glass-border: rgba(255, 255, 255, 0.5);
            --ios-blue: #007AFF;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
            --text-main: #1d1d1f;
        }

        /* 減少透明度模式 (設定切換用) */
        .reduce-transparency {
            --glass-bg: rgba(245, 245, 247, 0.95) !important;
            --glass-blur: 0px !important;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* 禁止全域滾動 */
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            color: var(--text-main);
        }

        /* App 框架結構 */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        /* 頂部固定 Header (Liquid Glass) */
        header {
            flex-shrink: 0;
            height: 110px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
            border-bottom: 0.5px solid var(--glass-border);
            z-index: 100;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }

        /* 中間滾動內容區 */
        main {
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 15px;
        }

        /* 底部固定導航/狀態 */
        footer {
            flex-shrink: 0;
            height: 60px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-top: 0.5px solid var(--glass-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 5px;
        }

        /* visionOS 懸浮卡片設計 */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            margin-bottom: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            transform: translateZ(0); /* 液態玻璃層次感 */
        }

        .input-group {
            display: flex;
            background: rgba(0,0,0,0.05);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 10px;
        }

        input {
            background: transparent;
            border: none;
            flex: 1;
            padding: 10px;
            outline: none;
            font-size: 16px;
        }

        button {
            background: var(--ios-blue);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:active { transform: scale(0.95); opacity: 0.8; }

        /* 表格與左右滑動功能 */
        .folder-group { margin-bottom: 30px; }
        .folder-title { font-weight: 700; font-size: 18px; margin-bottom: 10px; color: var(--ios-blue); padding-left: 5px; }

        .table-scroll-container {
            width: 100%;
            overflow-x: auto; /* 支援左右滑動檢視內容過長 */
            background: rgba(255,255,255,0.3);
            border-radius: 15px;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 800px; /* 強制最小寬度確保可滑動 */
            border-collapse: collapse;
        }

        th { text-align: left; padding: 12px; font-size: 12px; text-transform: uppercase; color: #666; border-bottom: 0.5px solid #ccc; }
        td { padding: 12px; font-size: 13px; border-bottom: 0.5px solid rgba(0,0,0,0.05); white-space: nowrap; }

        /* 分頁器 */
        .pagination { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 15px 0; }

        /* 標籤設計 */
        .tag {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
            margin-right: 5px;
            background: rgba(0,0,0,0.1);
        }
        .tag-html { background: #E34F26; color: white; }
        .tag-pdf { background: #FF0000; color: white; }
        .tag-js { background: #F7DF1E; color: black; }

        /* 編輯器 Modal */
        #editorModal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--glass-bg); backdrop-filter: blur(30px);
            z-index: 1000; display: none; flex-direction: column;
            padding: var(--safe-top) 20px;
        }

        textarea { flex: 1; width: 100%; margin: 20px 0; border-radius: 15px; border: 1px solid var(--glass-border); padding: 15px; font-family: monospace; }

        .status-pill { background: rgba(0,0,0,0.1); padding: 5px 12px; border-radius: 20px; font-size: 12px; }

    </style>
</head>
<body id="appBody">

<div class="app-container">
    <header>
        <h2 style="margin:0; font-size: 20px;">🔍 GitHub Ultra Indexer</h2>
        <div style="display: flex; gap: 10px; margin-top: 8px;">
            <div class="status-pill" id="rateLimit">API: -- / 60</div>
            <div class="status-pill" id="totalCount">📦 0 Files</div>
            <div class="status-pill" onclick="toggleSettings()">⚙️ 設定</div>
        </div>
    </header>

    <main id="mainScroll">
        <section class="card">
            <div class="input-group">
                <input type="text" id="userInput" placeholder="使用者(逗號分隔), 如: mobsp, vuejs" value="mobsp">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button onclick="startBatchProcess()" id="mainBtn">⚡ 批量掃描全分支</button>
                <button onclick="exportFullReport()" style="background:#34c759;">📥 匯出完整報告</button>
            </div>
        </section>

        <div id="displayArea"></div>
    </main>

    <footer>
        <span onclick="window.scrollTo({top:0, behavior:'smooth'})">🏠 首頁</span>
        <span onclick="toggleSettings()">🛠️ 設置</span>
        <span id="scanStatus">Ready</span>
    </footer>
</div>

<div id="editorModal">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 id="editFileName">編輯檔案</h3>
        <button onclick="closeEditor()" style="background:#ff3b30;">取消</button>
    </div>
    <input type="text" id="editFilePath" style="background: rgba(255,255,255,0.5); margin-top: 10px; border-radius: 8px;">
    <textarea id="editContent"></textarea>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button onclick="saveEdit()" style="background:var(--ios-blue);">💾 儲存並準備匯出</button>
        <button onclick="downloadAs('txt')">📄 下載為 TXT</button>
    </div>
</div>

<script>
    let allFiles = []; // 格式: { user, repo, branch, path, type, url }
    let currentPage = 1;
    const itemsPerPage = 20;

    // --- 核心功能：掃描引擎 ---

    async function startBatchProcess() {
        const users = document.getElementById('userInput').value.split(',').map(s => s.trim());
        const display = document.getElementById('displayArea');
        const btn = document.getElementById('mainBtn');
        
        allFiles = [];
        display.innerHTML = "";
        btn.disabled = true;
        updateStatus("掃描中...");

        try {
            for (let user of users) {
                // 1. 抓取所有倉庫
                const repoRes = await fetch(`https://api.github.com/users/${user}/repos?per_page=100`);
                const repos = await repoRes.json();

                for (let repo of repos) {
                    // 2. 抓取該倉庫所有分支
                    const branchRes = await fetch(`https://api.github.com/repos/${user}/${repo.name}/branches`);
                    const branches = await branchRes.json();

                    for (let branch of branches) {
                        // 3. 遞迴抓取檔案樹
                        const treeRes = await fetch(`https://api.github.com/repos/${user}/${repo.name}/git/trees/${branch.name}?recursive=1`);
                        const treeData = await treeRes.json();

                        if (treeData.tree) {
                            treeData.tree.filter(i => i.type === 'blob').forEach(file => {
                                allFiles.push({
                                    user, repo: repo.name, branch: branch.name,
                                    path: file.path, ext: file.path.split('.').pop().toUpperCase(),
                                    raw: `https://raw.githubusercontent.com/${user}/${repo.name}/${branch.name}/${file.path}`
                                });
                            });
                        }
                        updateStatus(`已讀取: ${repo.name} (${branch.name})`);
                        refreshStats();
                    }
                }
            }
            renderGroupedData();
        } catch (e) {
            alert("API 限制或網路錯誤");
        } finally {
            btn.disabled = false;
        }
    }

    // --- 渲染引擎：依資料夾分組與分頁 ---

    function renderGroupedData() {
        const display = document.getElementById('displayArea');
        display.innerHTML = "";

        // 依資料夾分組
        const groups = allFiles.reduce((acc, file) => {
            const folder = file.path.includes('/') ? file.path.substring(0, file.path.lastIndexOf('/')) : '根目錄';
            if (!acc[folder]) acc[folder] = [];
            acc[folder].push(file);
            return acc;
        }, {});

        Object.keys(groups).forEach(folder => {
            const folderDiv = document.createElement('div');
            folderDiv.className = 'folder-group';
            folderDiv.innerHTML = `<div class="folder-title">📂 ${folder}</div>`;

            const tableWrap = document.createElement('div');
            tableWrap.className = 'table-scroll-container';
            
            const table = document.createElement('table');
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>檔案 (全路徑)</th>
                        <th>分支</th>
                        <th>操作</th>
                        <th>路徑複製</th>
                    </tr>
                </thead>
                <tbody>
                    ${groups[folder].map(f => `
                        <tr>
                            <td><span class="tag tag-${f.ext.toLowerCase()}">${f.ext}</span> ${f.path.split('/').pop()}</td>
                            <td><code style="font-size:10px;">${f.branch}</code></td>
                            <td>
                                <button onclick="openEditor('${f.raw}', '${f.path}')" style="font-size:10px; padding:4px;">編輯/下載</button>
                            </td>
                            <td style="color:#666; font-family:monospace;">./${f.path}</td>
                        </tr>
                    `).join('')}
                </tbody>
            `;
            tableWrap.appendChild(table);
            folderDiv.appendChild(tableWrap);
            display.appendChild(folderDiv);
        });
    }

    // --- 編輯與匯出功能 ---

    async function openEditor(rawUrl, path) {
        document.getElementById('editFileName').innerText = path;
        document.getElementById('editFilePath').value = path;
        document.getElementById('editorModal').style.display = 'flex';
        document.getElementById('editContent').value = "Loading content...";
        
        try {
            const res = await fetch(rawUrl);
            const text = await res.text();
            document.getElementById('editContent').value = text;
        } catch (e) {
            document.getElementById('editContent').value = "無法讀取內容 (可能是二進位檔案或跨域限制)";
        }
    }

    function closeEditor() { document.getElementById('editorModal').style.display = 'none'; }

    function downloadAs(format) {
        const content = document.getElementById('editContent').value;
        const fileName = document.getElementById('editFilePath').value.split('/').pop();
        const blob = new Blob([content], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${fileName}.${format}`;
        a.click();
    }

    // --- iOS & Liquid Glass 設定 ---

    function toggleSettings() {
        const isReduced = document.getElementById('appBody').classList.toggle('reduce-transparency');
        alert(isReduced ? "已開啟：減少透明度" : "已開啟：液態玻璃效果");
    }

    function updateStatus(msg) { document.getElementById('scanStatus').innerText = msg; }

    async function refreshStats() {
        const res = await fetch('https://api.github.com/rate_limit');
        const data = await res.json();
        document.getElementById('rateLimit').innerText = `API: ${data.rate.remaining} / 60`;
        document.getElementById('totalCount').innerText = `📦 ${allFiles.length} Files`;
    }

    // 禁止雙指縮放
    document.addEventListener('touchstart', (e) => {
        if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });

</script>
</body>
</html>
