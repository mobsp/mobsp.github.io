        .visually-hidden {

        @media (max-width: 420px) {

            .post-title.empty-slot:empty::before {
                font-size: 1.58rem;
            }

            .meta-row {
                gap: 10px;
            }

            .post-dates {

            }
        }

<body>
    <div class="mobi-flow-bg"></div>

    <div id="app-container">
        <header class="app-header">
            <h1 class="visually-hidden">MobiSpace 空白文章模板</h1>

            <div class="header-bar">

        </header>

        <main id="main-view">
            <section class="content">
                <h2 class="post-title empty-slot" data-placeholder="文章標題"></h2>

                <div class="summary-action">
                    <button class="summary-btn" id="summaryBtn" type="button">文章摘要</button>

                <div class="meta-row">
                    <div class="tag-cloud" aria-label="文章類別標籤">
                        <span class="tag-chip">#設計哲學</span>

                        <span class="tag-chip">#內容模板</span>

可直接貼入段落、圖片、引用區塊或其他內容模組。"></article>
            </section>

    <div class="modal-mask" id="summaryModal" aria-hidden="true">
        <div class="summary-modal" role="dialog" aria-modal="true" aria-labelledby="summaryModalTitle">
            <div class="summary-modal-head">
                <div class="summary-modal-title" id="summaryModalTitle">文章摘要</div>
                <button class="summary-close" id="summaryClose" type="button" aria-label="關閉摘要">✕</button>
            </div>
            <div class="summary-text">
這是一個適用於 MobiSpace 的通用文章模板，保留固定頁首、頁尾與動態公告區，並將文章資訊簡化為標題、摘要、分類標籤、日期與內容區，方便快速套用到不同主題的文章頁面。
            </div>
        </div>
    </div>

    <script>
        const ICONS = {
            moonFill: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-moon-stars-fill" viewBox="0 0 16 16"><path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/><path d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387a1.73 1.73 0 0 0-1.097 1.097l-.387 1.162a.217.217 0 0 1-.412 0l-.387-1.162A1.73 1.73 0 0 0 9.31 6.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a1.73 1.73 0 0 0 1.097-1.097zM13.863.099a.145.145 0 0 1 .274 0l.258.774c.115.346.386.617.732.732l.774.258a.145.145 0 0 1 0 .274l-.774.258a1.16 1.16 0 0 0-.732.732l-.258.774a.145.145 0 0 1-.274 0l-.258-.774a1.16 1.16 0 0 0-.732-.732l-.774-.258a.145.145 0 0 1 0-.274l.774-.258c.346-.115.617-.386.732-.732z"/></svg>`,
            sunFill: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-sun-fill" viewBox="0 0 16 16"><path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/></svg>`
        };

        const switchBtn = document.getElementById('themeSwitch');
        const html = document.documentElement;
        const summaryBtn = document.getElementById('summaryBtn');
        const summaryModal = document.getElementById('summaryModal');
        const summaryClose = document.getElementById('summaryClose');

        function updateThemeIcon(theme) {
            const isDark = theme === 'dark';
            switchBtn.innerHTML = isDark ? ICONS.sunFill : ICONS.moonFill;
            switchBtn.setAttribute('aria-label', isDark ? '切換淺色模式' : '切換深色模式');
            switchBtn.setAttribute('title', isDark ? '切換淺色模式' : '切換深色模式');
        }

        switchBtn.addEventListener('click', () => {
            const isDark = html.getAttribute('data-theme') === 'dark';
            const target = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', target);
            updateThemeIcon(target);
            localStorage.setItem('mobi-theme', target);
        });

        const savedTheme = localStorage.getItem('mobi-theme');
        if (savedTheme) {
            html.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            html.setAttribute('data-theme', 'dark');
            updateThemeIcon('dark');
        } else {
            updateThemeIcon('light');
        }

        summaryBtn.addEventListener('click', () => {
            summaryModal.classList.add('show');
            summaryModal.setAttribute('aria-hidden', 'false');
        });

        function closeSummaryModal() {
            summaryModal.classList.remove('show');
            summaryModal.setAttribute('aria-hidden', 'true');
        }

        summaryClose.addEventListener('click', closeSummaryModal);
        summaryModal.addEventListener('click', (event) => {
            if (event.target === summaryModal) closeSummaryModal();
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeSummaryModal();
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        initNoticeSystem();
    });

    const SUPABASE_URL = 'https://svwrvxomytbfaqpfnifg.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2d3J2eG9teXRiZmFxcGZuaWZnIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3MTI1Nzc2MS,"exp":2086833761}.15r8FoXm1YxdiioGWrkwdIwF6SQxCHtLJTF0BEruwZ8';

    async function initNoticeSystem() {
        const vTag = document.getElementById('v-tag');
        const mqText = document.getElementById('mq-text');
        const cachedData = localStorage.getItem('mobsp_notices');
        if (cachedData) renderNotice(JSON.parse(cachedData), true);

        try {
            if (typeof supabase === 'undefined') return;
            const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            const { data, error } = await client.from('notices').select('type, message').order('created_at', { ascending: false });
            if (!error && data.length > 0) {
                localStorage.setItem('mobsp_notices', JSON.stringify(data));
                renderNotice(data, false);
            }
        } catch (err) {
            console.warn('公告更新受阻');
        }
    }

    function renderNotice(data, isCached) {
        const vTag = document.getElementById('v-tag');
        const mqText = document.getElementById('mq-text');
        if (!vTag || !mqText || !data.length) return;

        const randomItem = data[Math.floor(Math.random() * data.length)];
        const category = randomItem.type || 'NEWS';
        vTag.classList.remove('tag-important', 'tag-update');
        if (category.match(/重要|守則/)) vTag.classList.add('tag-important');
        else if (category.match(/更新|系統/)) vTag.classList.add('tag-update');
        vTag.innerText = `${isCached ? 'OFFLINE' : 'v2.0'} | ${category}`;
        mqText.innerText = randomItem.message || '';
    }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
        }
    </script>
