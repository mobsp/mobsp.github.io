<body>

<div class="app-container">
    <header>
        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
            <h1 class="large-title">GIX</h1>
            <div id="rateLimit" style="font-size: 11px; opacity: 0.5; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 12px;">API: 獲取中...</div>

    <main>
        <div class="card">
            <label style="font-size: 11px; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px;">GitHub Username</label>
            <input type="text" id="userInput" value="mobsp" style="width: 100%; background: none; border: none; border-bottom: 0.5px solid #333; color: white; padding: 12px 0; margin-bottom: 22px; font-size: 30px; outline: none; font-weight: 700;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <button onclick="startDeepScan()" class="btn-ios">⚡ 深度掃描</button>

<div id="editorModal" class="sheet" style="height: 96vh;">

    <div style="display: flex; justify-content: space-between; align-items: center;">

    </div>

    <button onclick="downloadEditedFile()" class="btn-ios" style="background: var(--ios-green);">📥 下載並保存此檔案</button>
</div>

<div id="settingsModal" class="sheet">
    <div class="handle"></div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom:30px;">
        <h2 style="margin:0; font-size: 22px;">掃描過濾設定</h2>
        <span onclick="closeSettings()" style="color: var(--ios-blue); font-weight: 600; font-size: 17px;">完成</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 20px;">
        <div class="card" style="margin:0; background: rgba(255,255,255,0.05);">
            <label style="font-size: 11px; opacity: 0.5;">GITHUB TOKEN (提升 API 限制)</label>
            <input type="password" id="ghToken" placeholder="ghp_..." style="width: 100%; background: none; border: none; border-bottom: 0.5px solid #444; color: white; padding: 12px 0; outline: none;">
        </div>
        <div class="card" style="margin:0; background: rgba(255,255,255,0.05);">
            <label style="font-size: 11px; opacity: 0.5;">排除規則 (目前僅過濾圖檔與雜項)</label>
            <input type="text" id="excludeRules" value=".png, .jpg, .jpeg, .gif, .ico, .zip, .pdf, .mp4, node_modules, .git" style="width: 100%; background: none; border: none; border-bottom: 0.5px solid #444; color: white; padding: 12px 0; outline: none;">
        </div>
        <p style="font-size: 12px; opacity: 0.4; line-height: 1.5;">* 此設定會實時影響「深度掃描」的結果。排除規則是以關鍵字包含方式進行過濾。</p>
    </div>
</div>

<script>
    let allFiles = [];
    let currentBranch = "";
    let folderSet = new Set();

    / 核心還原：GitHub API 遞迴抓取
    async function startDeepScan() {
        const userInput = document.getElementById('userInput').value;
        const users = userInput.split(',').map(s => s.trim());
        const status = document.getElementById('scanStatus');
        const token = document.getElementById('ghToken').value;
        const excludes = document.getElementById('excludeRules').value.split(',').map(s => s.trim().toLowerCase());
        
        allFiles = [];
        folderSet = new Set();
        status.innerText = "掃描中...";

        const headers = token ? { 'Authorization': `token ${token}` } : {};

        try {
            for (let user of users) {
                const reposRes = await fetch(`https://api.github.com/users/${user}/repos?per_page=100`, { headers });
                const repos = await reposRes.json();
                
                for (let repo of repos) {
                    const branchesRes = await fetch(`https://api.github.com/repos/${user}/${repo.name}/branches`, { headers });
                    const branches = await branchesRes.json();
                    
                    for (let b of branches) {
                        const treeRes = await fetch(`https://api.github.com/repos/${user}/${repo.name}/git/trees/${b.name}?recursive=1`, { headers });
                        const treeData = await treeRes.json();
                        
                        if (treeData.tree) {
                            treeData.tree.filter(i => i.type === 'blob').forEach(f => {
                                / 過濾邏輯：排除圖檔，保留 .js, .vue, .html 等代碼
                                if (excludes.some(rule => f.path.toLowerCase().includes(rule.trim()))) return;

                                let folder = f.path.includes('/') ? f.path.substring(0, f.path.lastIndexOf('/')) : 'ROOT';
                                folderSet.add(folder);
                                
                                allFiles.push({
                                    user, repo: repo.name, branch: b.name, path: f.path, 
                                    name: f.path.split('/').pop(),
                                    raw: `https://raw.githubusercontent.com/${user}/${repo.name}/${b.name}/${f.path}`,
                                    link: `/tol/${f.path}`, / 修正部長指令路徑
                                    githubLink: `https://github.com/${user}/${repo.name}/blob/${b.name}/${f.path}`,
                                    folder: folder
                                });
                            });
                        }
                    }
                }
            }
            buildUI();
            status.innerText = "掃描完成";
            updateLimit();
        } catch (e) {
            console.error(e);
            alert("掃描出錯，請檢查 API 配額。");
            status.innerText = "掃描失敗";
        }
    }

    function buildUI() {
        const select = document.getElementById('folderSelect');
        select.innerHTML = '<option value="ALL">📂 顯示所有目錄</option><option value="ROOT">📂 根目錄 (Root)</option>';
        Array.from(folderSet).sort().forEach(f => { if(f !== 'ROOT') select.innerHTML += `<option value="${f}">${f}</option>`; });
        const uniqueBranches = [...new Set(allFiles.map(f => f.branch))];
        currentBranch = uniqueBranches[0] || "";
        renderBranches(uniqueBranches);
        updateView();
    }

    function renderBranches(list) {
        const slider = document.getElementById('branchSlider');
        slider.innerHTML = list.map(b => `<div class="branch-item ${b === currentBranch ? 'active' : ''}" onclick="selectBranch('${b}')">${b}</div>`).join('');
    }

    function selectBranch(b) {
        currentBranch = b;
        renderBranches([...new Set(allFiles.map(f => f.branch))]);
        updateView();
    }

    function updateView() {
        const folderVal = document.getElementById('folderSelect').value;
        const searchVal = document.getElementById('searchInput').value.toLowerCase();
        const area = document.getElementById('displayTable');
        
        const filtered = allFiles.filter(f => 
            f.branch === currentBranch && 
            (folderVal === 'ALL' || f.folder === folderVal) && 
            f.name.toLowerCase().includes(searchVal)
        );

        area.innerHTML = filtered.map(f => `
            <div class="file-row" onclick="openFileDetails('${f.path}')">
                <div style="display:flex; align-items:center; gap:14px;">
                    <div class="dot ${getDotClass(f.name)}"></div>
                    <div>
                        <div style="font-weight:600; font-size:16.5px; letter-spacing:-0.3px;">${f.name}</div>
                        <div style="font-size:11px; opacity:0.4; margin-top:2px;">${f.path}</div>
                    </div>
                </div>
                <button onclick="event.stopPropagation(); openEditor('${f.raw}', '${f.path}')" style="background:rgba(255,255,255,0.08); border:none; color:var(--ios-blue); padding:7px 14px; border-radius:10px; font-weight:600; font-size:13px;">編輯</button>
            </div>
        `).join('');
    }

    function getDotClass(name) {
        const ext = name.split('.').pop().toLowerCase();
        if (['html','htm'].includes(ext)) return 'dot-html';
        if (['js','json'].includes(ext)) return 'dot-js';
        if (['css'].includes(ext)) return 'dot-css';
        if (['vue'].includes(ext)) return 'dot-vue';
        return '';
    }

    function openFileDetails(path) {
        const f = allFiles.find(item => item.path === path && item.branch === currentBranch);
        document.getElementById('infoName').innerText = f.name;
        document.getElementById('infoBody').innerHTML = `
            <div style="display:flex; flex-direction:column; gap:16px;">
                <div style="background:rgba(255,255,255,0.05); padding:18px; border-radius:16px; border: 0.5px solid rgba(255,255,255,0.1);">
                    <label style="font-size:10px; opacity:0.5; text-transform:uppercase;">正式連結</label>
                    <div style="margin-top:6px; font-family:monospace; font-size:13px; word-break:break-all; color:var(--ios-blue);">${f.link}</div>
                </div>
                <div style="background:rgba(255,255,255,0.05); padding:18px; border-radius:16px; border: 0.5px solid rgba(255,255,255,0.1);">
                    <label style="font-size:10px; opacity:0.5; text-transform:uppercase;">原始路徑</label>
                    <div style="margin-top:6px; font-family:monospace; font-size:13px; word-break:break-all;">${f.path}</div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <button onclick="copyIt('${f.link}')" class="btn-ios" style="background:rgba(255,255,255,0.1);">複製連結</button>
                    <button onclick="window.open('${f.githubLink}')" class="btn-ios" style="background:rgba(255,255,255,0.1);">GitHub 源</button>
                </div>
            </div>
        `;
        document.getElementById('infoModal').classList.add('active');
    }

    async function openEditor(rawUrl, fullPath) {
        document.getElementById('editorModal').classList.add('active');
        document.getElementById('editFileName').value = fullPath;
        const ta = document.getElementById('editContent');
        ta.value = "正在讀取 Raw 代碼...";
        try {
            const res = await fetch(rawUrl);
            ta.value = await res.text();
        } catch(e) {
            ta.value = "讀取失敗：可能受到 GitHub CORS 限制，或該檔案不是文本格式。";
        }
    }

    function downloadEditedFile() {
        const content = document.getElementById('editContent').value;
        const filename = document.getElementById('editFileName').value.split('/').pop();
        const blob = new Blob([content], { type: 'text/plain' });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
    }

    function exportFullReport() {
        if(allFiles.length === 0) return alert("請先進行掃描");
        let csv = "\uFEFFUser,Repo,Branch,Path,PreviewLink\n" + 
                  allFiles.map(f => `"${f.user}","${f.repo}","${f.branch}","${f.path}","${f.link}"`).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `GIX_Report_${new Date().getTime()}.csv`;
        a.click();
    }

    function openSettings() { document.getElementById('settingsModal').classList.add('active'); }
    function closeSettings() { document.getElementById('settingsModal').classList.remove('active'); }
    function closeModal() { document.getElementById('infoModal').classList.remove('active'); }
    function closeEditor() { document.getElementById('editorModal').classList.remove('active'); }

    async function updateLimit() {
        const token = document.getElementById('ghToken').value;
        const headers = token ? { 'Authorization': `token ${token}` } : {};
        try {
            const res = await (await fetch('https://api.github.com/rate_limit', { headers })).json();
            document.getElementById('rateLimit').innerText = `API: ${res.rate.remaining} / ${res.rate.limit}`;
        } catch(e) {
            document.getElementById('rateLimit').innerText = `API: 離線`;
        }
    }

    function copyIt(t) { navigator.clipboard.writeText(t); alert("連結已複製"); }
    
    / 初始化
    updateLimit();
</script>
