    <style>
        :root {
            --bg-body: #000000; --bg-container: #0a0a0a;
            --text-main: #ffffff; --text-sub: #888888;
            --accent-color: #00cec9; --nav-bg: #111111;
            --border-color: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, sans-serif; 
            background-color: var(--bg-body); 
            height: 100dvh; overflow: hidden; 
        }

        #app-container { 
            max-width: 500px; margin: 0 auto; 
            background-color: var(--bg-container); 
            height: 100%; display: flex; flex-direction: column; 
            border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color);
        }

        .app-header { 
            flex-shrink: 0;
            padding: calc(15px + env(safe-area-inset-top)) 15px 10px; 
            background: var(--nav-bg); border-bottom: 1px solid var(--border-color);
        }
        .brand-title-img { width: 100%; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .brand-title-img:active { opacity: 0.7; transform: scale(0.98); }

        #main-view { flex: 1; overflow-y: auto; background: #000; -webkit-overflow-scrolling: touch; }

        /* 工具頁面矩陣樣式 */
        .tool-panel { padding: 20px; animation: toolSlide 0.4s ease-out; }
        .tool-card { background: #111; border: 1px solid #222; padding: 25px 20px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .tool-input { 
            width: 100%; background: #000; border: 1px solid #333; padding: 16px; 
            border-radius: 14px; color: #fff; margin-bottom: 20px; outline: none; 
            font-size: 14px; border-color: var(--accent-color);
        }

        .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .opt-item { 
            background: #161616; padding: 12px; border-radius: 12px; 
            display: flex; align-items: center; gap: 10px; cursor: pointer; 
            border: 1px solid #222; transition: 0.2s; 
        }
        .opt-item.active { border-color: var(--accent-color); background: rgba(0, 206, 201, 0.08); }
        .opt-item i { font-size: 14px; color: #444; }
        .opt-item.active i { color: var(--accent-color); }
        .opt-label { font-size: 11px; color: #777; font-weight: 600; letter-spacing: 0.5px; }
        .opt-item.active .opt-label { color: #fff; }

        .harvester-btn { 
            width: 100%; background: var(--accent-color); color: #000; padding: 18px; 
            border-radius: 50px; font-weight: 900; border: none; cursor: pointer; 
            font-size: 15px; letter-spacing: 1px; box-shadow: 0 5px 15px rgba(0,206,201,0.2);
            transition: 0.3s;
        }
        .harvester-btn:active { transform: scale(0.96); opacity: 0.9; }
        .status-msg { margin-top: 15px; font-size: 11px; color: #666; text-align: center; letter-spacing: 1px; line-height: 1.4; }

        /* 列表與分頁樣式 */
        .article-row { display: flex; gap: 15px; padding: 15px; border-bottom: 1px solid #111; align-items: center; text-decoration: none; }
        .row-img { width: 55px; height: 55px; border-radius: 10px; object-fit: cover; background: #1a1a1a; }
        .row-info { flex: 1; overflow: hidden; }
        .row-title { font-size: 14px; font-weight: 600; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row-cate { font-size: 9px; color: var(--accent-color); font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
        
        .pagination-container { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #050505; }
        .page-btn { background: #111; border: 1px solid #222; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .page-info { color: #555; font-size: 12px; font-weight: 600; }

        .bottom-nav { 
            height: calc(65px + env(safe-area-inset-bottom)); 
            background-color: var(--nav-bg); border-top: 1px solid var(--border-color); 
            display: flex; justify-content: space-around; align-items: center; 
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #444; text-decoration: none; font-size: 10px; gap: 4px; flex: 1; cursor: pointer; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--accent-color); }

        @keyframes toolSlide { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>

<body>

    <div id="app-container">
        <header class="app-header">
            <img src="/assets/brand/ms-blog-title.webp" class="brand-title-img" onclick="location.reload()">
        </header>

        <main id="main-view">
            <div id="content-loader" style="text-align:center; padding:50px; color:#222; font-size:10px; letter-spacing:2px;">INITIALIZING...</div>
        </main>

        <nav class="bottom-nav">
            <a href="/music/" class="nav-item" rel="noopener noreferrer"><i class="fa-solid fa-circle-play"></i><span>音樂</span></a>
            <div id="btn-read" class="nav-item active" onclick="switchToRead()"><i class="fa-solid fa-book-open"></i><span>閱讀</span></div>
            <div id="btn-tool" class="nav-item" onclick="switchToTools()"><i class="fa-solid fa-microchip"></i><span>收割機</span></div>
            <a href="/setting" class="nav-item" rel="noopener noreferrer"><i class="fa-solid fa-sliders"></i><span>設定</span></a>
        </nav>
    </div>

    <script>
        let rawArticles = [];
        let currentPage = 1;
        const itemsPerPage = 20;
        let harvestOptions = { img: true, dark: true, code: true, clean: false };

        // 多重代理伺服器集（提供自動故障轉移）
        const proxyPool = [
            (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
            (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
            (url) => `https://proxy.cors.sh/${url}`
        ];

        function switchToRead() {
            setNavActive('btn-read');
            renderArticleList();
        }

        function switchToTools() {
            setNavActive('btn-tool');
            document.getElementById('main-view').innerHTML = `
                <div class="tool-panel">
                    <div class="tool-card">
                        <input type="url" id="target-url" class="tool-input" placeholder="貼上欲收割的網址 (https://...)">
                        
                        <div class="option-grid">
                            <div class="opt-item ${harvestOptions.img?'active':''}" onclick="toggleOpt(this,'img')">
                                <i class="fa-solid fa-image"></i><span class="opt-label">吸取影像</span>
                            </div>
                            <div class="opt-item ${harvestOptions.dark?'active':''}" onclick="toggleOpt(this,'dark')">
                                <i class="fa-solid fa-moon"></i><span class="opt-label">OLED黑</span>
                            </div>
                            <div class="opt-item ${harvestOptions.code?'active':''}" onclick="toggleOpt(this,'code')">
                                <i class="fa-solid fa-code"></i><span class="opt-label">代碼美化</span>
                            </div>
                            <div class="opt-item ${harvestOptions.clean?'active':''}" onclick="toggleOpt(this,'clean')">
                                <i class="fa-solid fa-leaf"></i><span class="opt-label">極簡過濾</span>
                            </div>
                        </div>

                        <button onclick="startHarvestPro()" class="harvester-btn">執行深度收割</button>
                        <div id="h-status" class="status-msg">READY TO HARVEST V2.0<br>已啟用彈性閱讀演算法與安全沙箱</div>
                    </div>
                </div>`;
        }

        function setNavActive(id) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function toggleOpt(el, key) {
            harvestOptions[key] = !harvestOptions[key];
            el.classList.toggle('active');
        }

        // 彈性核心：多重代理管道請求
        async function fetchWithFallback(targetUrl) {
            let lastError = null;
            for (let i = 0; i < proxyPool.length; i++) {
                try {
                    const proxyUrl = proxyPool[i](targetUrl);
                    const res = await fetch(proxyUrl);
                    if (!res.ok) throw new Error(`HTTP status ${res.status}`);
                    
                    // 針對 AllOrigins 的 JSON 結構進行特殊解析，其餘代理通常直接返回 Text
                    if (proxyUrl.includes('allorigins.win')) {
                        const json = await res.json();
                        if (json.contents) return json.contents;
                    } else {
                        return await res.text();
                    }
                } catch (err) {
                    lastError = err;
                    console.warn(`代理節點 ${i+1} 穿透失敗，嘗試下一個節點...`);
                }
            }
            throw lastError || new Error("所有穿透節點均遭目標封鎖");
        }

        // 安全防護：HTML 消毒白名單過濾（杜絕 XSS 與惡意 Script）
        function sanitizeContent(htmlInput) {
            const sandbox = document.createElement('div');
            sandbox.innerHTML = htmlInput;
            
            // 徹底移除不安全標籤
            const forbiddenTags = ['script', 'iframe', 'object', 'embed', 'link', 'style', 'frameset', 'applet'];
            forbiddenTags.forEach(tag => {
                sandbox.querySelectorAll(tag).forEach(el => el.remove());
            });

            // 清理所有節點的 inline 惡意事件屬性（如 onerror, onclick）
            const allElements = sandbox.getElementsByTagName('*');
            for (let i = 0; i < allElements.length; i++) {
                const attrs = allElements[i].attributes;
                for (let j = attrs.length - 1; j >= 0; j--) {
                    const attrName = attrs[j].name.toLowerCase();
                    if (attrName.startsWith('on') || attrName === 'javascript:') {
                        allElements[i].removeAttribute(attrName);
                    }
                }
            }
            return sandbox.innerHTML;
        }

        // 開放式演算法：精準識別文章主要容器
        function findMainContentContainer(doc) {
            const indicators = [
                'article', 'main', '.post-content', '.entry-content', 
                '.markdown-body', '.content', '.prose', '#content', '#main'
            ];
            for (let selector of indicators) {
                const found = doc.querySelector(selector);
                if (found && found.innerText.trim().length > 200) {
                    return found;
                }
            }
            return doc.body; / 備用方案
        }

        // 進階提取：高相容性多元圖片、代碼區塊與語意內容抓取
        function extractAdaptiveHTML(container, baseUrl) {
            let extractedHtml = '';
            
            // 尋找主封面 Open Graph 圖片
            const ogImg = container.ownerDocument.querySelector('meta[property="og:image"]')?.getAttribute('content');
            if (ogImg && harvestOptions.img) {
                try { const fullOgImg = new URL(ogImg, baseUrl).href;
                    extractedHtml += `<div style="margin:25px 0; text-align:center;"><img src="${fullOgImg}" style="max-width:100%; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.5);"><p style="font-size:12px; color:#666; margin-top:8px;">Featured Image</p></div>\n`;
                } catch(e){}
            }

            // 多元素迭代處理
            const querySelectors = 'p, h1, h2, h3, h4, h5, h6, img, pre, code, blockquote, figure, table, .highlight';
            container.querySelectorAll(querySelectors).forEach(el => {
                // 1. 高度適應性圖片抓取 (含 Lazy Loading / srcset)
                if (el.tagName === 'IMG' && harvestOptions.img) {
                    let src = el.getAttribute('src') || el.getAttribute('data-src') || el.getAttribute('data-original') || el.getAttribute('data-lazy-src');
                    if (!src && el.getAttribute('srcset')) {
                        const srcsetItems = el.getAttribute('srcset').split(',');
                        if (srcsetItems.length > 0) src = srcsetItems[srcsetItems.length - 1].trim().split(' ')[0];
                    }
                    if (src) {
                        try { src = new URL(src, baseUrl).href; } catch(e){}
                        extractedHtml += `<div style="margin:25px 0;"><img src="${src}" style="max-width:100%; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.5);"></div>\n`;
                    }
                } 
                // 2. 進階多結構代碼塊適應 (如 highlight.js, prism 等)
                else if ((el.tagName === 'PRE' || el.classList.contains('highlight') || el.tagName === 'TABLE' && el.querySelector('pre')) && harvestOptions.code) {
                    const cleanCode = sanitizeContent(el.innerText.trim());
                    if (cleanCode.length > 0) {
                        extractedHtml += `<pre><code>${cleanCode}</code></pre>\n`;
                    }
                }
                // 3. 一般語意文字內容抓取
                else if (el.innerText.trim().length > 4 && !el.querySelector('pre') && !el.closest('pre')) {
                    const tag = ['H1','H2','H3','H4','H5','H6','BLOCKQUOTE'].includes(el.tagName) ? el.tagName.toLowerCase() : 'p';
                    let inner = harvestOptions.clean ? el.innerText.trim() : el.innerHTML;
                    inner = sanitizeContent(inner); / 通過安全過濾沙箱
                    extractedHtml += `<${tag} style="margin-bottom:1.5rem;">${inner}</${tag}>\n`;
                }
            });

            return extractedHtml;
        }

        /* 🚀 核心：修復與改進後的深度收割引擎 */
        async function startHarvestPro() {
            const urlInput = document.getElementById('target-url');
            const status = document.getElementById('h-status');
            const url = urlInput.value.trim();

            if (!url.startsWith('http')) return status.innerHTML = "❌ 網址格式錯誤，必須包含 http/https";
            
            status.innerHTML = "📡 正在調度彈性跨域代理穿透目標伺服器...";
            try {
                const rawHtml = await fetchWithFallback(url);
                status.innerHTML = "🧠 穿透成功！正在執行語意結構分析與安全沙箱洗滌...";
                
                const doc = new DOMParser().parseFromString(rawHtml, 'text/html');
                const title = doc.querySelector('h1')?.innerText.trim() || doc.title.trim() || "Ⲙ𝔬ⲃ¡ⳝ𝔭_Archive";
                
                // 執行主要內容區塊定位演算法
                const mainContainer = findMainContentContainer(doc);
                // 執行高相容性自適應 HTML 提取
                const contentHtml = extractAdaptiveHTML(mainContainer, url);

                if (!contentHtml || contentHtml.trim().length === 0) {
                    throw new Error("未能成功從目標網站內識別出可讀文本。");
                }

                // 樣式矩陣注入
                const styleTag = `
                    body { 
                        background:${harvestOptions.dark?'#000':'#fff'}; 
                        color:${harvestOptions.dark?'#ccc':'#333'}; 
                        padding:40px 25px; line-height:1.8; font-family:-apple-system, sans-serif; 
                        max-width:600px; margin:0 auto; 
                    }
                    h1 { color:#00cec9; font-size:1.8rem; margin-bottom:2rem; border-bottom:1px solid #222; padding-bottom:15px; line-height:1.4; }
                    h2, h3, h4 { color:${harvestOptions.dark?'#eee':'#000'}; margin-top:2.5rem; margin-bottom:1rem; }
                    pre { 
                        background:#111; padding:20px; border-radius:12px; overflow-x:auto; 
                        border:1px solid #222; color:#00cec9; font-family:monospace; margin:25px 0;
                        font-size:13px; line-height:1.5;
                        display: ${harvestOptions.code?'block':'none'};
                    }
                    p { margin-bottom:1.4rem; text-align: justify; }
                    blockquote { border-left: 4px solid var(--accent-color); padding-left: 15px; color: #666; margin: 20px 0; font-style: italic; }
                    img { display:block; height: auto; }
                `;

                // 打包安全 HTML 下載
                const finalBlob = new Blob([`
                    <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${title}</title><style>${styleTag}</style></head>
                    <body><h1>${title}</h1>${contentHtml}</body></html>
                `], {type:'text/html;charset=utf-8'});

                const a = document.createElement('a');
                a.href = URL.createObjectURL(finalBlob);
                a.download = `MS_${title.replace(/[\\/:*?"<>|]/g, "").substring(0,15)}.html`;
                a.click();

                status.innerHTML = "✅ 收割成功！安全離線沙箱檔案已匯出彈出。";
            } catch (err) {
                status.innerHTML = `❌ 錯誤: ${err.message}<br><span style="color:#444;font-size:10px;">代理已被拒絕或目標網站屬於完全動態結構(SPA)</span>`;
            }
        }

        /* 列表同步與優化分頁邏輯 */
        async function loadArticles() {
            const api = "https://api.github.com/repos/mobsp/contents/blog/p/list?t=" + Date.now();
            try {
                const res = await fetch(api);
                if (!res.ok) throw new Error();
                const files = await res.json();
                
                rawArticles = files.filter(f => f.name.endsWith('.html')).reverse().map(f => ({
                    title: decodeURIComponent(f.name).replace('.html','').trim(),
                    path: f.path
                }));
                renderArticleList();
            } catch (e) {
                document.getElementById('main-view').innerHTML = '<div style="text-align:center; padding:50px; color:#333; font-size:11px; letter-spacing:1px;">SYNC FAILED (GITHUBA_API_LIMIT)</div>';
            }
        }

        function changePage(direction) {
            currentPage += direction;
            renderArticleList();
            document.getElementById('main-view').scrollTop = 0;
        }

        function renderArticleList() {
            const container = document.getElementById('main-view');
            if (rawArticles.length === 0) return;

            // 計算分頁區間
            const totalPages = Math.ceil(rawArticles.length / itemsPerPage);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageItems = rawArticles.slice(startIndex, endIndex);

            let listHtml = pageItems.map(p => `
                <a class="article-row" href="/${p.path}">
                    <div class="row-img"></div>
                    <div class="row-info">
                        <div class="row-cate">ARCHIVE</div>
                        <div class="row-title">${p.title}</div>
                    </div>
                    <i class="fa-solid fa-chevron-right" style="color:#222; font-size:10px;"></i>
                </a>`).join('');

            // 底部注入分頁控制導航條
            listHtml += `
                <div class="pagination-container">
                    <button class="page-btn" onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}>上一頁</button>
                    <div class="page-info">${currentPage} / ${totalPages}</div>
                    <button class="page-btn" onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''}>下一頁</button>
                </div>
            `;
            container.innerHTML = listHtml;
        }

        window.onload = loadArticles;
    </script>

    <script>
        if ('serviceWorker' in navigator) { 
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {})); 
        }
    </script>
</body>
