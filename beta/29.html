		<script>
			var versions = document.querySelector('.versions');

			[].slice.call(versions.querySelectorAll('option')).forEach(function(option) {
				if (option.value === 'mobsp/mobsp.github.io@main') {
					option.selected = true;
				}
			});

			versions.addEventListener('change', function() {
				location.pathname = '/gh/' + this.value + '/tol/';
			});

			// 新增：攔截檔案/資料夾點擊事件並顯示彈窗
			const modal = document.getElementById('customModal');
			const modalFileName = document.getElementById('modalFileName');
			const btnJsdelivr = document.getElementById('btnJsdelivr');
			const btnQzz = document.getElementById('btnQzz');

			// 取得表格內除了返回上一層「...」以外的所有連結
			const fileLinks = document.querySelectorAll('.listing table tr td.name a');

			fileLinks.forEach(link => {
				// 略過返回上一層的連結
				if (link.getAttribute('href') === '../') return;

				link.addEventListener('click', function(e) {
					e.preventDefault(); // 阻止原本的直接跳轉

					const originalHref = this.getAttribute('href'); // 例如: /gh/mobsp/mobsp.github.io@main/tol/data.json
					
					// 透過 decodeURIComponent 確保中文或其他特殊檔名不會被 % 碼取代
					const rawPath = originalHref.replace(/^\/gh\/[^\/]+\/[^\/]+@([^\/]+)\//, '');
					const decodedPath = decodeURIComponent(rawPath);
					const displayName = decodedPath || originalFileName(this.innerText);

					// 設定 jsDelivr 網址 (維持原樣)
					btnJsdelivr.href = originalHref;

					// 設定 qzz 網址: https://mobsp.qzz.io/ + 原本的路徑檔名
					// 同時確保 qzz 的網址也不會把中文轉成 % 編碼
					const cleanPath = decodedPath;
					btnQzz.href = "https://mobsp.qzz.io/" + cleanPath;

					// 顯示彈窗與檔名
					modalFileName.innerText = "目標：" + displayName;
					modal.style.display = 'flex';
				});
			});

			function closeModal() {
				modal.style.display = 'none';
			}

			// 點擊彈窗外部也可以關閉
			window.addEventListener('click', function(e) {
				if (e.target === modal) {
					closeModal();
				}
			});
		</script>
