<script>
document.addEventListener('DOMContentLoaded', () => {
    const splash = document.getElementById('fake-splash');
    const hideSplash = () => {
        setTimeout(() => {
            if (splash) {
                splash.classList.add('fade-out');
                setTimeout(() => { if(splash.parentNode) splash.remove(); }, 800);
            }
        }, 1000);
    };
    window.addEventListener('load', hideSplash);
    setTimeout(hideSplash, 3500);
    initNoticeSystem();
});

const SUPABASE_URL = 'https://svwrvxomytbfaqpfnifg.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2d3J2eG9teXRiZmFxcGZuaWZnIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MT7MTI1Nzc2MSwiZXhwIjoyMDg2ODMzNzYxfQ.15r8FoXm1YxdiioGWrkwdIwF6SQxCHtLJTF0BEruwZ8';

async function initNoticeSystem() {
    const vTag = document.getElementById('v-tag');
    const mqText = document.getElementById('mq-text');
    const cachedData = localStorage.getItem('mobsp_notices');
    if (cachedData) renderNotice(JSON.parse(cachedData), true);

    try {
        if (typeof supabase === 'undefined') return;
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const { data, error } = await client.from('notices').select('type, message').order('created_at', { ascending: false });
        if (!error && data.length > 0) {
            localStorage.setItem('mobsp_notices', JSON.stringify(data));
            renderNotice(data, false);
        }
    } catch (err) {
        console.warn('公告更新受阻');
    }
}

function renderNotice(data, isCached) {
    const vTag = document.getElementById('v-tag');
    const mqText = document.getElementById('mq-text');
    if (!vTag || !mqText || !data.length) return;
    
    const randomItem = data[Math.floor(Math.random() * data.length)];
    const category = randomItem.type || "NEWS";
    vTag.classList.remove('tag-important', 'tag-update');
    if (category.match(/重要|守則/)) vTag.classList.add('tag-important');
    else if (category.match(/更新|系統/)) vTag.classList.add('tag-update');
    vTag.innerText = `${isCached ? 'OFFLINE' : 'v2.0'} | ${category}`;
    mqText.innerText = randomItem.message || "";
}
</script>
