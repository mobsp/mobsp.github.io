<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#f2f2f7">

<title>莫比空間｜本機檔案瀏覽器 & 編輯器</title>

<style>
/* =========================================================
   MOBSP LOCAL FILE BROWSER / EDITOR
   GitHub Pages / Local Browser Edition
   ---------------------------------------------------------
   本版本：
   1. 不需要後端
   2. 不需要 GitHub Token
   3. 不具備 GitHub Push / Commit 功能
   4. 編輯內容只存在瀏覽器記憶體
   5. 可複製 / 下載
   ========================================================= */

:root {
  --bg: #f2f2f7;
  --card: rgba(255,255,255,.78);
  --card-solid: #ffffff;
  --text: #1c1c1e;
  --secondary: #6e6e73;
  --border: rgba(60,60,67,.14);
  --separator: rgba(60,60,67,.12);
  --blue: #007aff;
  --green: #34c759;
  --orange: #ff9500;
  --red: #ff3b30;
  --purple: #af52de;
  --shadow:
    0 8px 30px rgba(0,0,0,.08);
  --radius-xl: 22px;
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 10px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "PingFang TC",
    "Noto Sans TC",
    Arial,
    sans-serif;

  color: var(--text);
  background:
    radial-gradient(
      circle at top left,
      rgba(255,255,255,.9),
      transparent 35%
    ),
    var(--bg);

  line-height: 1.5;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

/* =========================================================
   APP SHELL
   ========================================================= */

.app {
  width: min(100%, 980px);
  margin: 0 auto;
  padding:
    max(18px, env(safe-area-inset-top))
    18px
    max(30px, env(safe-area-inset-bottom));
}

/* =========================================================
   HEADER
   ========================================================= */

.header {
  position: sticky;
  top: 0;
  z-index: 50;

  margin-bottom: 16px;
  padding: 12px 0 14px;

  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);

  background: rgba(242,242,247,.72);
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.title {
  min-width: 0;
}

.title h1 {
  margin: 0;
  font-size: 25px;
  letter-spacing: -.5px;
}

.title p {
  margin: 3px 0 0;
  color: var(--secondary);
  font-size: 13px;
}

.header-actions {
  display: flex;
  gap: 8px;
}

.icon-button {
  width: 40px;
  height: 40px;
  border-radius: 50%;

  display: grid;
  place-items: center;

  background: rgba(255,255,255,.78);
  color: var(--blue);

  box-shadow: 0 4px 14px rgba(0,0,0,.06);

  transition:
    transform .15s ease,
    background .15s ease;
}

.icon-button:active {
  transform: scale(.92);
}

/* =========================================================
   SEARCH
   ========================================================= */

.search-wrap {
  margin-top: 13px;
}

.search {
  width: 100%;
  height: 44px;

  border: 1px solid var(--border);
  border-radius: 13px;

  padding: 0 15px;

  outline: none;

  background: rgba(255,255,255,.74);

  color: var(--text);

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

.search:focus {
  border-color: rgba(0,122,255,.45);
  box-shadow: 0 0 0 4px rgba(0,122,255,.10);
}

/* =========================================================
   TOOLBAR
   ========================================================= */

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;

  margin: 14px 0;
}

.tool {
  padding: 9px 13px;

  border-radius: 999px;

  background: rgba(255,255,255,.76);
  border: 1px solid var(--border);

  color: var(--text);

  font-size: 13px;

  transition:
    transform .15s ease,
    background .15s ease;
}

.tool:active {
  transform: scale(.96);
}

.tool.primary {
  color: white;
  background: var(--blue);
  border-color: var(--blue);
}

.tool.danger {
  color: var(--red);
}

.tool.active {
  background: #1c1c1e;
  color: white;
}

/* =========================================================
   STATS
   ========================================================= */

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;

  margin-bottom: 18px;
}

.stat {
  padding: 13px;

  background: var(--card);
  border: 1px solid var(--border);

  border-radius: var(--radius-md);

  box-shadow: 0 4px 18px rgba(0,0,0,.04);
}

.stat-label {
  color: var(--secondary);
  font-size: 11px;
}

.stat-value {
  margin-top: 2px;
  font-size: 20px;
  font-weight: 700;
}

/* =========================================================
   FOLDER SECTION
   ========================================================= */

.folder {
  margin-bottom: 18px;
}

.folder-title {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 5px 7px;

  color: var(--secondary);

  font-size: 12px;
  font-weight: 600;
}

.folder-count {
  font-weight: 500;
}

/* =========================================================
   FILE CARD
   ========================================================= */

.file-card {
  overflow: hidden;

  margin-bottom: 10px;

  border:
    1px solid var(--border);

  border-radius: var(--radius-lg);

  background: var(--card);

  box-shadow: 0 5px 20px rgba(0,0,0,.045);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.file-header {
  width: 100%;

  display: flex;
  align-items: center;

  gap: 12px;

  padding: 14px;

  background: transparent;

  text-align: left;
}

.file-header:active {
  background: rgba(0,0,0,.04);
}

.file-icon {
  width: 42px;
  height: 42px;

  flex: 0 0 42px;

  display: grid;
  place-items: center;

  border-radius: 11px;

  background: rgba(0,122,255,.10);

  color: var(--blue);

  font-size: 20px;
}

.file-main {
  min-width: 0;
  flex: 1;
}

.file-name {
  overflow: hidden;

  white-space: nowrap;
  text-overflow: ellipsis;

  font-size: 15px;
  font-weight: 600;
}

.file-type {
  margin-top: 2px;

  color: var(--secondary);

  font-size: 11px;
}

.chevron {
  color: #8e8e93;
  font-size: 18px;

  transition: transform .2s ease;
}

.file-card.open .chevron {
  transform: rotate(90deg);
}

/* =========================================================
   DETAIL
   ========================================================= */

.file-detail {
  display: none;

  padding: 0 14px 14px;

  border-top: 1px solid var(--separator);
}

.file-card.open .file-detail {
  display: block;
}

.detail-group {
  margin-top: 13px;
}

.detail-label {
  margin-bottom: 5px;

  color: var(--secondary);

  font-size: 11px;
  font-weight: 600;
}

.detail-value {
  word-break: break-all;

  padding: 10px 11px;

  border-radius: 10px;

  background: rgba(118,118,128,.10);

  color: var(--text);

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;

  font-size: 11px;
}

/* =========================================================
   LINKS
   ========================================================= */

.link-actions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;

  margin-top: 13px;
}

.link-button {
  min-height: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 8px 10px;

  border-radius: 11px;

  background: rgba(0,122,255,.10);

  color: var(--blue);

  font-size: 12px;
  font-weight: 600;

  text-align: center;
}

.link-button.github {
  background: rgba(0,0,0,.08);
  color: var(--text);
}

.link-button.raw {
  background: rgba(52,199,89,.11);
  color: #248a3d;
}

.link-button.visit {
  background: rgba(175,82,222,.11);
  color: var(--purple);
}

.link-button.edit {
  background: rgba(255,149,0,.13);
  color: #b36b00;
}

.link-button:active {
  transform: scale(.97);
}

/* =========================================================
   EDITOR OVERLAY
   ========================================================= */

.editor-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;

  display: none;

  background:
    rgba(242,242,247,.82);

  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
}

.editor-overlay.show {
  display: flex;
  flex-direction: column;
}

.editor {
  width: min(100%, 1100px);
  height: 100%;

  margin: 0 auto;

  display: flex;
  flex-direction: column;
}

/* =========================================================
   EDITOR HEADER
   ========================================================= */

.editor-header {
  flex: 0 0 auto;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;

  padding:
    max(12px, env(safe-area-inset-top))
    14px
    12px;

  border-bottom: 1px solid var(--border);

  background: rgba(255,255,255,.76);
}

.editor-title {
  min-width: 0;
}

.editor-title strong {
  display: block;

  overflow: hidden;

  white-space: nowrap;
  text-overflow: ellipsis;

  font-size: 15px;
}

.editor-title span {
  display: block;

  margin-top: 2px;

  color: var(--secondary);

  font-size: 11px;
}

.editor-header-actions {
  display: flex;
  gap: 7px;
}

.editor-btn {
  padding: 9px 11px;

  border-radius: 10px;

  background: rgba(118,118,128,.12);

  color: var(--text);

  font-size: 12px;
  font-weight: 600;
}

.editor-btn.primary {
  color: white;
  background: var(--blue);
}

.editor-btn.green {
  color: white;
  background: var(--green);
}

.editor-btn.close {
  color: var(--red);
}

/* =========================================================
   EDITOR BODY
   ========================================================= */

.editor-body {
  flex: 1;

  min-height: 0;

  display: flex;
  flex-direction: column;

  padding: 12px;
  gap: 10px;
}

.editor-info {
  flex: 0 0 auto;

  display: flex;
  flex-wrap: wrap;

  gap: 6px;
}

.editor-tag {
  padding: 5px 8px;

  border-radius: 999px;

  background: rgba(118,118,128,.12);

  color: var(--secondary);

  font-size: 10px;
}

.editor-status {
  margin-left: auto;

  color: var(--green);

  font-size: 11px;
}

/* =========================================================
   TEXTAREA
   ========================================================= */

.editor-textarea {
  width: 100%;
  min-height: 0;
  flex: 1;

  resize: none;

  padding: 15px;

  border:
    1px solid rgba(60,60,67,.18);

  border-radius: 15px;

  outline: none;

  background:
    rgba(255,255,255,.88);

  color: #1c1c1e;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    "Liberation Mono",
    monospace;

  font-size: 13px;

  line-height: 1.65;

  tab-size: 2;

  box-shadow:
    inset 0 1px 3px rgba(0,0,0,.04);
}

.editor-textarea:focus {
  border-color: rgba(0,122,255,.45);

  box-shadow:
    0 0 0 3px rgba(0,122,255,.10),
    inset 0 1px 3px rgba(0,0,0,.04);
}

/* =========================================================
   EDITOR FOOTER
   ========================================================= */

.editor-footer {
  flex: 0 0 auto;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;

  padding:
    10px
    12px
    max(12px, env(safe-area-inset-bottom));

  border-top: 1px solid var(--border);

  background: rgba(255,255,255,.78);
}

.editor-footer-left,
.editor-footer-right {
  display: flex;
  gap: 7px;
}

/* =========================================================
   EMPTY
   ========================================================= */

.empty {
  padding: 40px 20px;

  text-align: center;

  color: var(--secondary);
}

.empty-icon {
  font-size: 34px;
  margin-bottom: 8px;
}

.empty-title {
  font-weight: 600;
  color: var(--text);
}

.empty-text {
  margin-top: 3px;
  font-size: 12px;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast {
  position: fixed;

  left: 50%;
  bottom: 25px;

  z-index: 500;

  transform:
    translate(-50%, 20px);

  opacity: 0;
  pointer-events: none;

  padding: 10px 15px;

  border-radius: 999px;

  background: rgba(28,28,30,.92);

  color: white;

  font-size: 12px;

  transition:
    opacity .2s ease,
    transform .2s ease;
}

.toast.show {
  opacity: 1;

  transform:
    translate(-50%, 0);
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

  .app {
    padding-left: 12px;
    padding-right: 12px;
  }

  .stats {
    gap: 7px;
  }

  .stat {
    padding: 10px;
  }

  .stat-value {
    font-size: 18px;
  }

  .link-actions {
    grid-template-columns: 1fr 1fr;
  }

  .editor-header {
    align-items: flex-start;
  }

  .editor-header-actions {
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .editor-btn {
    padding: 8px 9px;
  }
}

/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="header">

    <div class="header-top">

      <div class="title">
        <h1>檔案瀏覽器</h1>
        <p>本機檢視・本機編輯・不寫回 GitHub</p>
      </div>

      <div class="header-actions">

        <button
          class="icon-button"
          id="expandAllBtn"
          title="全部展開"
          aria-label="全部展開"
        >
          ⤢
        </button>

        <button
          class="icon-button"
          id="collapseAllBtn"
          title="全部收合"
          aria-label="全部收合"
        >
          ⤡
        </button>

      </div>

    </div>

    <div class="search-wrap">

      <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="搜尋檔名、路徑、網站名稱..."
        autocomplete="off"
        spellcheck="false"
      >

    </div>

  </header>


  <!-- =====================================================
       TOOLBAR
       ===================================================== -->

  <div class="toolbar">

    <button
      class="tool active"
      data-filter="all"
    >
      全部
    </button>

    <button
      class="tool"
      data-filter="folder"
    >
      資料夾
    </button>

    <button
      class="tool"
      data-filter="file"
    >
      檔案
    </button>

    <button
      class="tool primary"
      id="loadLocalBtn"
    >
      載入本機檔案
    </button>

    <input
      id="localFileInput"
      type="file"
      hidden
      multiple
    >

  </div>


  <!-- =====================================================
       STATS
       ===================================================== -->

  <section class="stats">

    <div class="stat">
      <div class="stat-label">項目</div>
      <div
        class="stat-value"
        id="totalCount"
      >
        0
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">資料夾</div>
      <div
        class="stat-value"
        id="folderCount"
      >
        0
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">檔案</div>
      <div
        class="stat-value"
        id="fileCount"
      >
        0
      </div>
    </div>

  </section>


  <!-- =====================================================
       FILE LIST
       ===================================================== -->

  <main id="fileList"></main>

</div>


<!-- =======================================================
     EDITOR
     ======================================================= -->

<div
  class="editor-overlay"
  id="editorOverlay"
>

  <div class="editor">

    <header class="editor-header">

      <div class="editor-title">

        <strong id="editorFileName">
          未選擇檔案
        </strong>

        <span id="editorFilePath">
          本機編輯器
        </span>

      </div>

      <div class="editor-header-actions">

        <button
          class="editor-btn"
          id="copyBtn"
        >
          複製
        </button>

        <button
          class="editor-btn green"
          id="downloadBtn"
        >
          下載
        </button>

        <button
          class="editor-btn close"
          id="closeEditorBtn"
        >
          關閉
        </button>

      </div>

    </header>


    <section class="editor-body">

      <div class="editor-info">

        <span
          class="editor-tag"
          id="editorType"
        >
          TEXT
        </span>

        <span
          class="editor-tag"
        >
          LOCAL ONLY
        </span>

        <span
          class="editor-tag"
        >
          NO PUSH
        </span>

        <span
          class="editor-status"
          id="editorStatus"
        >
          未修改
        </span>

      </div>

      <textarea
        id="editorTextarea"
        class="editor-textarea"
        spellcheck="false"
      ></textarea>

    </section>


    <footer class="editor-footer">

      <div class="editor-footer-left">

        <button
          class="editor-btn"
          id="restoreBtn"
        >
          還原
        </button>

        <button
          class="editor-btn"
          id="clearEditorBtn"
        >
          清空
        </button>

      </div>

      <div class="editor-footer-right">

        <button
          class="editor-btn primary"
          id="saveLocalBtn"
        >
          暫存於本機
        </button>

      </div>

    </footer>

  </div>

</div>


<!-- =======================================================
     TOAST
     ======================================================= -->

<div
  class="toast"
  id="toast"
></div>


<script>
/* =========================================================
   MOBSP LOCAL FILE BROWSER / EDITOR
   ========================================================= */

"use strict";


/* =========================================================

   ========================================================= */

  "https://mobsp.qzz.io";

  REPO_OWNER +
  "/" +

  "/" +
  REPO_BRANCH;


/* =========================================================

  { name: "wiki", type: "folder", path: "wiki/" },

  /* .github */

/* =========================================================
   UTILITIES
   ========================================================= */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function encodePath(path) {

  return path
    .split("/")
    .map(part => encodeURIComponent(part))
    .join("/");

}


function getPageURL(path) {

  return SITE_BASE +
    "/" +
    encodePath(
      path.replace(/\/$/, "")
    ) +
    (path.endsWith("/") ? "/" : "");

}


function getGitHubURL(path) {

  return GITHUB_BASE +
    "/blob/" +
    REPO_BRANCH +
    "/" +
    encodePath(path);

}


function getGitHubEditURL(path) {

  return GITHUB_BASE +
    "/edit/" +
    REPO_BRANCH +
    "/" +
    encodePath(path);

}


function getRawURL(path) {

  return RAW_BASE +
    "/" +
    encodePath(path);

}


function getIcon(item) {

  if (item.type === "folder") {
    return "📁";
  }

  const ext =
    item.path
      .split(".")
      .pop()
      .toLowerCase();

  const map = {

    html: "🌐",
    htm: "🌐",

    css: "🎨",

    js: "📜",
    mjs: "📜",

    json: "🧩",

    py: "🐍",

    yml: "⚙️",
    yaml: "⚙️",

    md: "📝",

    txt: "📄",

    xml: "🗂️",

    svg: "🖼️",

    png: "🖼️",
    jpg: "🖼️",
    jpeg: "🖼️",
    webp: "🖼️",

    mp3: "🎵",
    wav: "🎵",

    mp4: "🎬",
    mov: "🎬",

    ico: "🖼️"

  };

  return map[ext] || "📄";

}


function getFileType(path) {

  if (path.endsWith("/")) {
    return "資料夾";
  }

  const dot =
    path.lastIndexOf(".");

  if (dot === -1) {
    return "檔案";
  }

  return (
    path
      .slice(dot + 1)
      .toUpperCase() +
    " 檔案"
  );

}


function isEditable(item) {

  if (item.type !== "file") {
    return false;
  }

  const ext =
    item.path
      .split(".")
      .pop()
      .toLowerCase();

  return [

    "html",
    "htm",
    "css",
    "js",
    "mjs",
    "json",
    "py",
    "yml",
    "yaml",
    "md",
    "txt",
    "xml",
    "svg",
    "txt",
    "csv"

  ].includes(ext);

}


function showToast(message) {

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(() => {

      toast.classList.remove("show");

    }, 1800);

}


/* =========================================================
   FILTER
   ========================================================= */

function matchesSearch(item) {

  if (!currentSearch) {
    return true;
  }

  const target =
    (
      item.name +
      " " +
      item.path
    ).toLowerCase();

  return target.includes(
    currentSearch.toLowerCase()
  );

}


function matchesFilter(item) {

  if (currentFilter === "all") {
    return true;
  }

  return item.type === currentFilter;

}


/* =========================================================
   GROUP BY FOLDER
   ========================================================= */

function getFolderName(path) {

  const clean =
    path.replace(/\/$/, "");

  const parts =
    clean.split("/");

  if (parts.length <= 1) {
    return "根目錄";
  }

  return parts
    .slice(0, -1)
    .join("/");

}


function buildGroups(items) {

  const groups = new Map();

  items.forEach(item => {

    const folder =
      item.type === "folder"
        ? getFolderName(item.path)
        : getFolderName(item.path);

    if (!groups.has(folder)) {
      groups.set(folder, []);
    }

    groups
      .get(folder)
      .push(item);

  });

  return groups;

}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

  const filtered =
    FILE_DATA
      .filter(matchesSearch)
      .filter(matchesFilter)
      .sort((a, b) =>
        a.path.localeCompare(
          b.path,
          "zh-Hant",
          {
            numeric: true
          }
        )
      );

  totalCount.textContent =
    filtered.length;

  folderCount.textContent =
    filtered.filter(
      item => item.type === "folder"
    ).length;

  fileCount.textContent =
    filtered.filter(
      item => item.type === "file"
    ).length;


  if (!filtered.length) {

    fileList.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          🔎
        </div>

        <div class="empty-title">
          找不到符合項目
        </div>

        <div class="empty-text">
          請嘗試其他搜尋關鍵字或切換篩選條件。
        </div>

      </div>
    `;

    return;

  }


  const groups =
    buildGroups(filtered);

  let html = "";

  for (const [
    folder,
    items
  ] of groups) {

    html += `

      <section
        class="folder"
        data-folder="${escapeHTML(folder)}"
      >

        <div class="folder-title">

          <span>
            ${escapeHTML(folder)}
          </span>

          <span class="folder-count">
            ${items.length}
          </span>

        </div>

    `;

    items.forEach(item => {

      html += renderItem(item);

    });

    html += `
      </section>
    `;

  }

  fileList.innerHTML = html;

}


function renderItem(item) {

  const pageURL =
    getPageURL(item.path);

  const githubURL =
    getGitHubURL(item.path);

  const editURL =
    getGitHubEditURL(item.path);

  const rawURL =
    getRawURL(item.path);

  const editable =
    isEditable(item);

  const type =
    getFileType(item.path);


  return `

    <article
      class="file-card"
      data-path="${escapeHTML(item.path)}"
      data-type="${item.type}"
    >

      <!-- =============================================
           第一層：
           只有檔名 / 網站名稱
           ============================================= -->

      <button
        class="file-header"
        type="button"
        data-action="toggle"
      >

        <div class="file-icon">
          ${getIcon(item)}
        </div>

        <div class="file-main">

          <div class="file-name">
            ${escapeHTML(item.name)}
          </div>

          <div class="file-type">
            ${type}
          </div>

        </div>

        <div class="chevron">
          ›
        </div>

      </button>


      <!-- =============================================
           第二層：
           點擊後才顯示完整資料
           ============================================= -->

      <div class="file-detail">

        <div class="detail-group">

          <div class="detail-label">
            相對路徑
          </div>

          <div class="detail-value">
            ${escapeHTML(item.path)}
          </div>

        </div>


        <div class="detail-group">

          <div class="detail-label">
            絕對路徑
          </div>

          <div class="detail-value">
            ${escapeHTML(pageURL)}
          </div>

        </div>


        <div class="detail-group">

          <div class="detail-label">
            GitHub 儲存庫路徑
          </div>

          <div class="detail-value">
            ${escapeHTML(
              GITHUB_BASE +
              "/tree/" +
              REPO_BRANCH +
              "/" +
              encodePath(item.path)
            )}
          </div>

        </div>


        <div class="detail-group">

          <div class="detail-label">
            RAW URL
          </div>

          <div class="detail-value">
            ${escapeHTML(rawURL)}
          </div>

        </div>


        <div class="link-actions">

          <a
            class="link-button visit"
            href="${pageURL}"
            target="_blank"
            rel="noopener noreferrer"
          >
            快速訪問
          </a>


          <a
            class="link-button github"
            href="${githubURL}"
            target="_blank"
            rel="noopener noreferrer"
          >
            GitHub 查看
          </a>


          <a
            class="link-button"
            href="${editURL}"
            target="_blank"
            rel="noopener noreferrer"
          >
            GitHub 編輯
          </a>


          <a
            class="link-button raw"
            href="${rawURL}"
            target="_blank"
            rel="noopener noreferrer"
          >
            RAW
          </a>


          ${
            editable
              ? `
                <button
                  class="link-button edit"
                  type="button"
                  data-action="local-edit"
                >
                  網頁編輯
                </button>
              `
              : ""
          }

        </div>

      </div>

    </article>

  `;

}


/* =========================================================
   EVENT DELEGATION
   ========================================================= */

fileList.addEventListener(
  "click",
  event => {

    const card =
      event.target.closest(
        ".file-card"
      );

    if (!card) {
      return;
    }


    const action =
      event.target.closest(
        "[data-action]"
      );


    if (!action) {
      return;
    }


    const type =
      action.dataset.action;


    if (type === "toggle") {

      card.classList.toggle("open");

      return;

    }


    if (type === "local-edit") {

      const path =
        card.dataset.path;

      const item =
        FILE_DATA.find(
          x => x.path === path
        );

      if (item) {
        openEditor(item);
      }

    }

  }
);


/* =========================================================
   SEARCH
   ========================================================= */

searchInput.addEventListener(
  "input",
  event => {

    currentSearch =
      event.target.value.trim();

    render();

  }
);


/* =========================================================
   FILTER BUTTONS
   ========================================================= */

document
  .querySelectorAll(
    "[data-filter]"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        currentFilter =
          button.dataset.filter;

        document
          .querySelectorAll(
            "[data-filter]"
          )
          .forEach(
            b => b.classList.remove(
              "active"
            )
          );

        button.classList.add(
          "active"
        );

        render();

      }
    );

  });


/* =========================================================
   EXPAND / COLLAPSE
   ========================================================= */

document
  .getElementById("expandAllBtn")
  .addEventListener(
    "click",
    () => {

      document
        .querySelectorAll(
          ".file-card"
        )
        .forEach(card => {

          card.classList.add(
            "open"
          );

        });

    }
  );


document
  .getElementById("collapseAllBtn")
  .addEventListener(
    "click",
    () => {

      document
        .querySelectorAll(
          ".file-card"
        )
        .forEach(card => {

          card.classList.remove(
            "open"
          );

        });

    }
  );


/* =========================================================
   LOCAL FILE LOADER
   ========================================================= */

document
  .getElementById("loadLocalBtn")
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "localFileInput"
        )
        .click();

    }
  );


document
  .getElementById("localFileInput")
  .addEventListener(
    "change",
    event => {

      const files =
        Array.from(
          event.target.files || []
        );

      if (!files.length) {
        return;
      }


      files.forEach(file => {

        const item = {

          name:
            file.name,

          path:
            file.webkitRelativePath ||
            file.name,

          type:
            "file",

          localFile:
            file

        };


        const exists =
          FILE_DATA.some(
            x =>
              x.path === item.path
          );


        if (!exists) {

          FILE_DATA.push(item);

        }

      });


      render();

      showToast(
        `已載入 ${files.length} 個本機檔案`
      );

      event.target.value = "";

    }
  );


/* =========================================================
   EDITOR
   ========================================================= */

async function openEditor(item) {

  currentEditorItem =
    item;

  editorFileName.textContent =
    item.name;

  editorFilePath.textContent =
    item.path;

  editorType.textContent =
    getFileType(item.path);


  editorTextarea.value =
    "正在載入檔案內容……";


  editorStatus.textContent =
    "載入中";

  localModified =
    false;


  editorOverlay.classList.add(
    "show"
  );


  try {

    let content = "";


    /* ================================================
       如果是本機 File API 檔案
       ================================================ */

    if (item.localFile) {

      content =
        await item.localFile.text();

    }

    /* ================================================
       如果不是本機檔案
       嘗試讀取 GitHub RAW
       ================================================ */

    else {

      const response =
        await fetch(
          getRawURL(item.path),
          {
            cache: "no-store"
          }
        );

      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }

      content =
        await response.text();

    }


    originalEditorContent =
      content;

    editorTextarea.value =
      content;

    editorStatus.textContent =
      "未修改";


  } catch (error) {

    editorTextarea.value =
      [
        "無法自動載入檔案內容。",
        "",
        "錯誤：",
        String(error),
        "",
        "你仍然可以直接在此編輯器中輸入內容。",
        "完成後可使用「複製」或「下載」。"
      ].join("\n");

    originalEditorContent =
      editorTextarea.value;

    editorStatus.textContent =
      "載入失敗";

  }

}


/* =========================================================
   EDITOR INPUT
   ========================================================= */

editorTextarea.addEventListener(
  "input",
  () => {

    localModified =
      editorTextarea.value !==
      originalEditorContent;

    editorStatus.textContent =
      localModified
        ? "● 已修改"
        : "未修改";

  }
);


/* =========================================================
   CLOSE EDITOR
   ========================================================= */

document
  .getElementById("closeEditorBtn")
  .addEventListener(
    "click",
    () => {

      if (
        localModified &&
        !confirm(
          "目前內容尚未下載或複製。\n\n確定要關閉編輯器嗎？"
        )
      ) {
        return;
      }

      editorOverlay.classList.remove(
        "show"
      );

    }
  );


/* =========================================================
   COPY
   ========================================================= */

document
  .getElementById("copyBtn")
  .addEventListener(
    "click",
    async () => {

      const content =
        editorTextarea.value;

      try {

        await navigator.clipboard.writeText(
          content
        );

        showToast(
          "已複製編輯後內容"
        );

      } catch {

        editorTextarea.select();

        document.execCommand(
          "copy"
        );

        showToast(
          "已複製編輯後內容"
        );

      }

    }
  );


/* =========================================================
   DOWNLOAD
   ========================================================= */

document
  .getElementById("downloadBtn")
  .addEventListener(
    "click",
    () => {

      if (!currentEditorItem) {
        return;
      }


      const content =
        editorTextarea.value;


      const blob =
        new Blob(
          [content],
          {
            type:
              "text/plain;charset=utf-8"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      const anchor =
        document.createElement(
          "a"
        );


      anchor.href =
        url;


      anchor.download =
        currentEditorItem.name ||
        "download.txt";


      document.body.appendChild(
        anchor
      );


      anchor.click();


      anchor.remove();


      URL.revokeObjectURL(
        url
      );


      showToast(
        "已下載本機修改版本"
      );

    }
  );


/* =========================================================
   RESTORE
   ========================================================= */

document
  .getElementById("restoreBtn")
  .addEventListener(
    "click",
    () => {

      if (
        !confirm(
          "確定要還原到原始載入內容嗎？"
        )
      ) {
        return;
      }


      editorTextarea.value =
        originalEditorContent;

      localModified =
        false;

      editorStatus.textContent =
        "未修改";

      showToast(
        "已還原"
      );

    }
  );


/* =========================================================
   CLEAR
   ========================================================= */

document
  .getElementById("clearEditorBtn")
  .addEventListener(
    "click",
    () => {

      if (
        !confirm(
          "確定要清空目前編輯器內容嗎？"
        )
      ) {
        return;
      }


      editorTextarea.value =
        "";

      localModified =
        true;

      editorStatus.textContent =
        "● 已修改";

    }
  );


/* =========================================================
   LOCAL SAVE
   ---------------------------------------------------------
   注意：
   這裡的「暫存」只存在瀏覽器 localStorage。
   不會寫入 GitHub。
   ========================================================= */

document
  .getElementById("saveLocalBtn")
  .addEventListener(
    "click",
    () => {

      if (!currentEditorItem) {
        return;
      }


      const key =
        "mobsp-local-edit:" +
        currentEditorItem.path;


      try {

        localStorage.setItem(
          key,
          editorTextarea.value
        );


        showToast(
          "已暫存於本機瀏覽器"
        );

      } catch {

        showToast(
          "瀏覽器暫存失敗"
        );

      }

    }
  );


/* =========================================================
   LOAD LOCAL SAVED VERSION
   ========================================================= */

function loadLocalSavedVersion(item) {

  const key =
    "mobsp-local-edit:" +
    item.path;


  try {

    return localStorage.getItem(
      key
    );

  } catch {

    return null;

  }

}


/* =========================================================
   INIT
   ========================================================= */

render();


/* =========================================================
   KEYBOARD SHORTCUTS
   ========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape" &&
      editorOverlay.classList.contains(
        "show"
      )
    ) {

      document
        .getElementById(
          "closeEditorBtn"
        )
        .click();

      return;

    }


    if (
      (event.metaKey ||
       event.ctrlKey) &&
      event.key.toLowerCase() === "s" &&
      editorOverlay.classList.contains(
        "show"
      )
    ) {

      event.preventDefault();

      document
        .getElementById(
          "saveLocalBtn"
        )
        .click();

    }

  }
);


/* =========================================================
   END
   ========================================================= */
</script>

</body>
</html>
