  <script>
    /**
     * 1. 全域動態數據暫存區 (全面解耦，拒絕寫死陣列)
     */
    let TOOLS = []; 
    const BASE_URL = "/tol/";

    let currentLang = "zh";
    const I18N = {
      zh: { title: "工具庫", search: "搜尋線上工具或標籤...", bannerT: "Mobispace 自動化就緒", bannerD: "優化極致原生工藝 99.9999% 高仿核心", all: "全部工具", feat: "精選推薦", tabH: "工具", tabF: "精選", tabT: "標籤", tabC: "後台", tabS: "設定", tTags: "熱門分類快捷檢索", tCms: "GitHub Actions 動態部署日誌", tLang: "環境語言偏好設定 (Language)" },
      en: { title: "Tools Hub", search: "Search tools or tags...", bannerT: "Mobispace Automation Ready", bannerD: "Highly optimized 99.9999% iOS UI Shell System", all: "All Tools", feat: "Featured", tabH: "Tools", tabF: "Featured", tabT: "Tags", tabC: "CMS", tabS: "Settings", tTags: "Popular Category Index", tCms: "GitHub Actions Deployment Logs", tLang: "Language Preferences" },
      ja: { title: "ツール壁", search: "ツールやタグを検索...", bannerT: "自動化システム稼働中", bannerD: "極限まで洗練された iOS UI シェル設計", all: "全ツール", feat: "おすすめ", tabH: "ツール", tabF: "おすすめ", tabT: "タグ", tabC: "ダッシュ", tabS: "設定", tTags: "人気カテゴリインデックス", tCms: "GitHub Actions デプロイログ", tLang: "言語設定 (Language)" }
    };

    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("search");
    const searchCancel = document.getElementById("searchCancel");
    const navBar = document.getElementById("navBar");
    const navSmallTitle = document.getElementById("navSmallTitle");
    const iosLargeTitle = document.getElementById("iosLargeTitle");
    const segmentSlider = document.getElementById("segmentSlider");
    
    let currentCategory = "all";
    let activeTab = "home";

    /**
     * 2. 📡 核心黑科技：全自動 GitHub 儲存庫資料夾深度收割引擎
     * 免金鑰、帶有時間戳快取破除機制、自動深入探測 config.json 與 README.md
     */
    async function loadToolsFromGitHub() {
      // 🔴 自動定位主倉庫下的 tol/ 資料夾，並加時間戳破除 API 快取
      const apiEndpoint = "https://api.github.com/repos/mobsp/mobsp.github.io/contents/tol?t=" + Date.now();
      
      try {
        const response = await fetch(apiEndpoint);
        if (!response.ok) throw new Error("API Route Blocked");
        const contents = await response.json();
        
        // 過濾出所有的實體子資料夾 (排除點開頭的隱藏檔)
        const directories = contents.filter(item => item.type === "dir" && !item.name.startswith("."));
        
        // 併發（Promise.all）加速收割每個資料夾內部的獨立設定檔
        TOOLS = await Promise.all(directories.map(async (dir) => {
          const folderName = dir.name;
          const folderDisplayName = folderName.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
          
          // 預設 Fallback 物件結構
          let toolObject = {
            id: folderName,
            name: folderDisplayName,
            desc: `Online ${folderDisplayName} System Center`,
            tags: [folderName.split('-')[0], "utils"],
            featured: false,
            icon: "🔧"
          };

          // 探測路徑：直接向 GitHub Pages 實體相對路徑調取，最安全且快
          const configUrl = `${BASE_URL}${folderName}/config.json?t=` + Date.now();
          const readmeUrl = `${BASE_URL}${folderName}/README.md?t=` + Date.now();

          // 嘗試深度收割 config.json
          try {
            const cfgRes = await fetch(configUrl);
            if (cfgRes.ok) {
              const cfg = await cfgRes.json();
              return {
                id: folderName,
                name: cfg.name || toolObject.name,
                desc: cfg.desc || toolObject.desc,
                tags: cfg.tags || toolObject.tags,
                featured: cfg.featured || false,
                icon: cfg.icon || "🛠️"
              };
            }
          } catch(e) {}

          // 備援收割：嘗試解析 README.md
          try {
            const mdRes = await fetch(readmeUrl);
            if (mdRes.ok) {
              const mdText = await mdRes.text();
              const lines = mdText.split("\n").map(l => l.strip()).filter(l => l);
              
              // 提取第一個 # 標題
              for (let line of lines) {
                if (line.startswith("# ")) {
                  toolObject.name = line.replace("# ", "").strip();
                  break;
                }
              }
              // 提取第一個非標題、非列表的純文字段落當描述
              const candidates = lines.filter(l => !l.startswith("#") && !l.startswith("-") && !l.startswith("!"));
              if (candidates.length > 0) {
                toolObject.desc = candidates[0];
              }
              toolObject.icon = "📝"; // 標記為文件解析來源
            }
          } catch(e) {}

          return toolObject;
        }));

        // 收割成功，啟動初始轉譯 UI
        updateLanguageUI("zh");
        performSearch();

      } catch (err) {
        console.error(err);
        grid.innerHTML = `<div style="text-align:center; padding:48px 16px; color:#ff3b30; font-size:13px;">📡 遠端儲存庫收割失敗，請確認網路連線或專案權限。</div>`;
      }
    }

    // 頂部大標題滾動回饋
    window.addEventListener("scroll", () => {
      if (window.scrollY > 44) navBar.classList.add("scrolled");
      else navBar.classList.remove("scrolled");
    });

    // iOS 觸控阻尼回饋監聽
    function attachIOSPhysics(element) {
      let touchTimeout;
      element.addEventListener("touchstart", () => {
        touchTimeout = setTimeout(() => element.classList.add("ios-active"), 50);
      }, { passive: true });
      const release = () => { clearTimeout(touchTimeout); element.classList.remove("ios-active"); };
      element.addEventListener("touchend", release, { passive: true });
      element.addEventListener("touchmove", release, { passive: true });
      element.addEventListener("touchcancel", release, { passive: true });
    }

    /**
     * 3. 內建輕量化文字權重模糊搜尋檢索演算法
     */
    function fuzzySearch(list, query) {
      if (!query) return list.map(item => ({ item, score: 1 }));
      const q = query.toLowerCase().trim();
      const results = [];

      list.forEach(item => {
        let score = 0;
        const name = item.name.toLowerCase();
        const id = item.id.toLowerCase();
        const desc = item.desc ? item.desc.toLowerCase() : "";

        if (name === q || id === q) score += 100;
        else if (name.startsWith(q)) score += 50;
        else if (name.includes(q)) score += 30;
        else if (desc.includes(q)) score += 10;

        item.tags.forEach(tag => {
          if (tag.toLowerCase() === q) score += 40;
          else if (tag.toLowerCase().includes(q)) score += 15;
        });

        if (score > 0) results.push({ item, score });
      });

      return results.sort((a, b) => b.score - a.score);
    }

    /**
     * 4. 100% 安全 DOM 渲染引擎（徹底防堵 XSS 安全漏洞）
     */
    function render(scoredList) {
      grid.innerHTML = "";

      if (scoredList.length === 0) {
        const empty = document.createElement("div");
        empty.style.cssText = "text-align:center; padding:48px 16px; color:var(--text-muted); font-size:14px;";
        empty.textContent = "無符合的工具項目 / No items found";
        grid.appendChild(empty);
        return;
      }

      const fragment = document.createDocumentFragment();

      scoredList.forEach(pack => {
        const tool = pack.item;
        const fullUrl = `${BASE_URL}${tool.id}/`;
        const a = document.createElement("a");
        a.href = fullUrl;
        a.className = "ios-cell";
        a.setAttribute("role", "listitem");

        const avatarBox = document.createElement("div");
        avatarBox.className = "cell-avatar-container";
        
        const iconSpan = document.createElement("span");
        iconSpan.className = "cell-fallback-icon";
        iconSpan.textContent = tool.icon || "⚙️";
        avatarBox.appendChild(iconSpan);

        const info = document.createElement("div");
        info.className = "cell-info";

        const title = document.createElement("div");
        title.className = "cell-title";
        title.textContent = tool.name;

        const subtitle = document.createElement("div");
        subtitle.className = "cell-subtitle";
        subtitle.textContent = tool.desc || `/tol/${tool.id}`;

        info.appendChild(title);
        info.appendChild(subtitle);

        const chevron = document.createElement("div");
        chevron.className = "cell-chevron";

        a.appendChild(avatarBox);
        a.appendChild(info);
        a.appendChild(chevron);

        attachIOSPhysics(a);
        fragment.appendChild(a);
      });

      grid.appendChild(fragment);
    }

    /**
     * 5. 異步免密鑰 GitHub API CMS 後台驅動
     */
    async function fetchGitHubLogs() {
      const logGroup = document.getElementById("cms-log-group");
      try {
        const res = await fetch("https://api.github.com/repos/mobsp/mobsp.github.io/commits?per_page=5");
        if (!res.ok) throw new Error();
        const data = await res.json();
        
        logGroup.innerHTML = "";
        const frag = document.createDocumentFragment();
        
        data.forEach(commit => {
          const card = document.createElement("div");
          card.className = "cms-card";
          card.style.position = "relative";
          
          const badge = document.createElement("div");
          badge.className = "cms-badge";
          badge.textContent = "DEPLOYED SUCCESS";

          const msg = document.createElement("div");
          msg.className = "commit-msg";
          msg.textContent = commit.commit.message;

          const meta = document.createElement("div");
          meta.className = "commit-meta";
          const date = new Date(commit.commit.author.date).toLocaleString();
          meta.textContent = `Author: ${commit.commit.author.name} | ${date}`;

          card.appendChild(badge);
          card.appendChild(msg);
          card.appendChild(meta);
          
          card.style.borderBottom = "var(--hairline) solid var(--border-color)";
          frag.appendChild(card);
        });
        logGroup.appendChild(frag);
      } catch (err) {
        logGroup.innerHTML = `<div style="padding:20px; color:var(--text-muted); font-size:13px;">無法連結至 GitHub API。</div>`;
      }
    }

    // 分類快速標籤抽屜渲染
    function renderTagsView() {
      const tagGroup = document.getElementById("tag-list-group");
      tagGroup.innerHTML = "";
      const uniqueTags = Array.from(new Set(TOOLS.flatMap(t => t.tags)));
      const frag = document.createDocumentFragment();

      uniqueTags.forEach(tag => {
        const cell = document.createElement("div");
        cell.className = "ios-cell";
        cell.style.cursor = "pointer";
        const info = document.createElement("div");
        info.className = "cell-info";
        const t = document.createElement("div");
        t.className = "cell-title";
        t.textContent = `# ${tag}`;
        info.appendChild(t);
        cell.appendChild(info);
        
        cell.addEventListener("click", () => {
          switchTab("home", I18N[currentLang].title);
          searchInput.value = tag;
          performSearch();
        });
        attachIOSPhysics(cell);
        frag.appendChild(cell);
      });
      tagGroup.appendChild(frag);
    }

    // 搜尋與防抖
    function debounce(func, delay = 150) {
      let timer;
      return (...args) => { clearTimeout(timer); timer = setTimeout(() => func.apply(this, args), delay); };
    }

    const performSearch = () => {
      const query = searchInput.value;
      let dataset = TOOLS;
      if (currentCategory === "featured" || activeTab === "featured") {
        dataset = TOOLS.filter(t => t.featured);
      }
      const searchResults = fuzzySearch(dataset, query);
      render(searchResults);
    };

    searchInput.addEventListener("input", debounce(performSearch));

    // Spotlight 景深控制
    searchInput.addEventListener("focus", () => document.body.classList.add("search-focused"));
    const exitSearch = () => {
      document.body.classList.remove("search-focused");
      searchInput.value = ""; searchInput.blur(); performSearch();
    };
    searchCancel.addEventListener("click", exitSearch);
    document.getElementById("spotlightMask").addEventListener("click", exitSearch);

    // Segmented Control 滑塊
    document.querySelectorAll(".segment-item").forEach((item, idx) => {
      item.addEventListener("click", () => {
        document.querySelector(".segment-item.active").classList.remove("active");
        item.classList.add("active");
        segmentSlider.style.transform = `translateX(${idx * 100}%)`;
        currentCategory = item.getAttribute("data-filter");
        performSearch();
      });
    });

    /**
     * 6. 多語系動態重新整合轉譯模組
     */
    function updateLanguageUI(lang) {
      currentLang = lang;
      const dict = I18N[lang];
      
      iosLargeTitle.textContent = activeTab === "home" ? "Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁⲉ" : dict[getTabKey(activeTab)];
      navSmallTitle.textContent = dict[getTabKey(activeTab)];
      searchInput.placeholder = dict.search;
      
      document.getElementById("bannerTitle").textContent = dict.bannerT;
      document.getElementById("bannerDesc").textContent = dict.bannerD;
      document.getElementById("segAll").textContent = dict.all;
      document.getElementById("segFeatured").textContent = dict.feat;
      
      document.getElementById("tabHome").textContent = dict.tabH;
      document.getElementById("tabFeatured").textContent = dict.tabF;
      document.getElementById("tabTags").textContent = dict.tabT;
      document.getElementById("tabCms").textContent = dict.tabC;
      document.getElementById("tabSettings").textContent = dict.tabS;

      document.getElementById("titleTags").textContent = dict.tTags;
      document.getElementById("titleCms").textContent = dict.tCms;
      document.getElementById("titleLang").textContent = dict.tLang;

      document.getElementById("check-zh").style.display = lang === "zh" ? "block" : "none";
      document.getElementById("check-en").style.display = lang === "en" ? "block" : "none";
      document.getElementById("check-ja").style.display = lang === "ja" ? "block" : "none";
    }

    function getTabKey(tab) {
      if (tab === "home") return "tabH";
      if (tab === "featured") return "tabF";
      if (tab === "tags") return "tabT";
      if (tab === "cms") return "tabC";
      return "tabS";
    }

    document.getElementById("btn-lang-zh").addEventListener("click", () => updateLanguageUI("zh"));
    document.getElementById("btn-lang-en").addEventListener("click", () => updateLanguageUI("en"));
    document.getElementById("btn-lang-ja").addEventListener("click", () => updateLanguageUI("ja"));

    /**
     * 7. 底部 5 個工具配置專用 Tab Bar 原生切換核心
     */
    function switchTab(targetId, titleText) {
      activeTab = targetId;
      document.querySelectorAll(".tab-item").forEach(t => t.classList.remove("active"));
      const activeBtn = document.querySelector(`.tab-item[data-target="${targetId}"]`);
      if (activeBtn) activeBtn.classList.add("active");

      document.querySelectorAll(".app-view").forEach(v => v.classList.remove("view-active"));
      const searchSec = document.getElementById("searchSection");
      
      if (targetId === "settings" || targetId === "tags" || targetId === "cms") {
        searchSec.style.display = "none";
      } else {
        searchSec.style.display = "flex";
      }

      iosLargeTitle.textContent = targetId === "home" ? "Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁⲉ" : I18N[currentLang][getTabKey(targetId)];
      navSmallTitle.textContent = I18N[currentLang][getTabKey(targetId)];

      if (targetId === "home") {
        document.getElementById("view-home").classList.add("view-active");
        currentCategory = "all";
        document.querySelector(".segment-item.active").classList.remove("active");
        document.querySelector('.segment-item[data-filter="all"]').classList.add("active");
        segmentSlider.style.transform = `translateX(0%)`;
        performSearch();
      } else if (targetId === "featured") {
        document.getElementById("view-home").classList.add("view-active");
        currentCategory = "featured";
        document.querySelector(".segment-item.active").classList.remove("active");
        document.querySelector('.segment-item[data-filter="featured"]').classList.add("active");
        segmentSlider.style.transform = `translateX(100%)`;
        performSearch();
      } else if (targetId === "tags") {
        document.getElementById("view-tags").classList.add("view-active");
        renderTagsView();
      } else if (targetId === "cms") {
        document.getElementById("view-cms").classList.add("view-active");
        fetchGitHubLogs();
      } else if (targetId === "settings") {
        document.getElementById("view-settings").classList.add("view-active");
      }

      window.scrollTo({ top: 0 });
    }

    document.querySelectorAll(".ios-tab-bar .tab-item").forEach(tab => {
      tab.addEventListener("click", () => {
        switchTab(tab.getAttribute("data-target"), tab.getAttribute("data-title"));
      });
    });

    // 🔴 終極亮點：拋棄 onLoad，直接在執行期發動非同步 GitHub 倉庫收割任務
    loadToolsFromGitHub();
  </script>
</body>
