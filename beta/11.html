<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁⲁ𝔠ⲉ | 工具庫展示牆</title>
  
  <link rel="icon" href="https://mobsp.github.io/assets/brand/ms-logo1.webp" type="image/jpeg">

  <style>
    :root {
      --bg: #0b0b0c;
      --panel: rgba(25, 27, 31, 0.95);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f1f2f6;
      --muted: #9aa3b2;
      --accent: #00cec9; /* 莫比空間主色調 */
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'PingFang TC', system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }

    /* 啟動畫面模擬背景 */
    .bg-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: url('https://mobsp.github.io/assets/brand/ms-tools.webp') center/cover no-repeat;
      opacity: 0.15; z-index: -1;
    }

    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(11, 11, 12, 0.85);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: 1.5rem; border-bottom: 1px solid var(--border);
      text-align: center;
    }

    header h1 {
      margin: 0 0 1rem 0; font-size: 1.5rem; letter-spacing: 4px; color: var(--accent);
    }

    #search {
      width: 100%; max-width: 400px; padding: .8rem 1.2rem;
      border-radius: 999px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text);
      font-size: 1rem; outline: none; transition: 0.3s;
    }

    #search:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 206, 201, 0.3); }

    main { padding: 2rem 1.5rem; max-width: 1200px; margin: 0 auto; }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0;
      text-align: center;
      text-decoration: none;
      color: inherit;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: var(--accent);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* 工具預覽圖區塊 */
    .img-container {
      width: 100%; aspect-ratio: 1/1;
      background: #1e272e;
      overflow: hidden;
    }

    .tool-img {
      width: 100%; height: 100%; object-fit: cover;
      transition: 0.5s;
    }

    .card:hover .tool-img { transform: scale(1.1); }

    .name-box { padding: 1rem; }

    .name {
      font-size: 0.95rem; font-weight: 600;
      color: var(--text); margin-bottom: 4px;
    }

    .url-hint {
      font-size: 0.7rem; color: var(--muted); letter-spacing: 0.5px;
      word-break: break-all;
    }

    footer {
      text-align: center; padding: 3rem 1rem;
      font-size: .75rem; color: var(--muted); opacity: 0.6;
    }
  </style>

  <link rel="canonical" href="https://mobsp.qzz.io/tol/index.html">
  <link rel="alternate" href="https://mobsp.qzz.io/tol/index.html" hreflang="x-default">
  <meta name="description" content="Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁⲁ𝔠ⲉ | 工具庫展示牆 | MOBSP">

  <meta property="og:title" content="Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁⲁ𝔠ⲉ | 工具庫展示牆">
  <meta property="og:description" content="Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁⲁ𝔠ⲉ | 工具庫展示牆 | MOBSP">
  <meta property="og:url" content="https://mobsp.qzz.io/tol/index.html">

<body>
  <div class="bg-overlay"></div>

  <header>
    <h1>Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁⲉ 工具庫</h1>
    <input id="search" type="search" placeholder="搜尋線上工具...">
  </header>

  <main>
    <section id="grid"></section>
  </main>

  <footer>
    © 2026 Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁⲁ𝔠ⲉ｜資源整合與數位服務
  </footer>

  <script>
    // 🛠️ GitHub 儲存庫配置（透過 API 自動遍歷）
    const GH_USER = "mobsp";
    const GH_REPO = "mobsp.github.io";
    const TARGET_FOLDER = "tol";

    // 基礎路徑與預覽圖設定
    const BASE_URL = "https://mobsp.qzz.io/tol/";
    const PREVIEW_IMG = "https://mobsp.github.io/assets/brand/ms-logo1.webp";

    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("search");
    
    // 全域工具儲存陣列
    let allTools = [];

    /**
     * 遞迴掃描 GitHub 資料夾內所有 HTML 檔案
     */
    async function scanRepository(path = TARGET_FOLDER) {
      const apiUrl = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${path}`;
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error(`讀取失敗: ${path}`);
        const items = await response.json();

        for (const item of items) {
          if (item.type === "dir") {
            // 進入深層資料夾遞迴掃描
            await scanRepository(item.path);
          } else if (item.type === "file" && item.name.endsWith(".html")) {
            // 過濾掉展示牆首頁本身
            if (item.path === `${TARGET_FOLDER}/index.html`) continue;

            // 取得相對於 /tol/ 的相對路徑
            const relativePath = item.path.substring(TARGET_FOLDER.length + 1);
            
            // 分析並產生展示名稱
            let rawName = item.name.replace(".html", "");
            if (rawName.toLowerCase() === "index") {
              // 如果是深層目錄裡的 index.html，抓取它的父資料夾名稱
              const pathParts = relativePath.split('/');
              rawName = pathParts[pathParts.length - 2] || "index";
            }

            // 字首轉大寫美化處理 (如: json-formatter -> Json Formatter)
            const displayName = rawName.split('-')
              .map(word => word.charAt(0).toUpperCase() + word.slice(1))
              .join(' ');

            allTools.push({
              name: displayName,
              url: `${BASE_URL}${relativePath}`,
              hint: `/tol/${relativePath}`
            });
          }
        }
      } catch (error) {
        console.error("掃描儲存庫發生錯誤:", error);
      }
    }

    // 渲染工具卡片至畫面
    function render(list) {
      grid.innerHTML = ""; 
      
      if (list.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; color: var(--muted); text-align: center; padding: 2rem;">沒有找到相符的線上工具</div>`;
        return;
      }

      list.forEach(tool => {
        const a = document.createElement("a");
        a.href = tool.url;                    
        a.className = "card";            

        a.innerHTML = `
          <div class="img-container">
            <img src="${PREVIEW_IMG}" class="tool-img" alt="${tool.name}" loading="lazy">
          </div>
          <div class="name-box">
            <div class="name">${tool.name}</div>
            <div class="url-hint">${tool.hint}</div>
          </div>
        `;

        grid.appendChild(a);
      });
    }

    // 關鍵字動態搜尋
    searchInput.addEventListener("input", () => {
      const keyword = searchInput.value.toLowerCase();
      const filtered = allTools.filter(t => 
        t.name.toLowerCase().includes(keyword) || 
        t.hint.toLowerCase().includes(keyword)
      );
      render(filtered);
    });

    // 初始化自動掃描
    (async () => {
      grid.innerHTML = `<div style="grid-column: 1/-1; color: var(--accent); text-align: center; padding: 2rem;">🔍 正在掃描雲端儲存庫...</div>`;
      await scanRepository();
      render(allTools);
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(reg => console.log('Service Worker 註冊成功，作用域：', reg.scope))
          .catch(err => console.log('Service Worker 註冊失敗：', err));
      });
    }
  </script>
</body>
