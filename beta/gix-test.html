<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <script>if(self!==top){top.location=self.location;}</script>
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GIX">
    <link rel="apple-touch-icon" href="https://mobsp.qzz.io/assets/brand/ms-logo1.webp">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>莫比空間｜GIX Indexer</title>
    
    <style>
        :root {
            --ios-blue: #0A84FF;
            --glass-bg: rgba(20, 20, 22, 0.85);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body.dark-mode {
            background: #000;
            background-image: radial-gradient(circle at 50% -20%, #1e293b, #000);
            --text-main: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; color: var(--text-main); font-family: -apple-system, system-ui, sans-serif; }
        
        .app-container { display: flex; flex-direction: column; height: 100dvh; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
        header { flex-shrink: 0; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); background: var(--glass-bg); border-bottom: 0.5px solid var(--glass-border); padding: 15px 20px; z-index: 100; }
        
        main { flex-grow: 1; overflow-y: auto; padding: 15px; }

        .card {
            background: var(--glass-bg); border-radius: 20px; padding: 15px; margin-bottom: 15px;
            border: 0.5px solid var(--glass-border); box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        /* 複選下拉選單 */
        .multi-select {
            width: 100%; background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 10px; font-size: 14px; margin-bottom: 10px;
        }

        /* 列表樣式 */
        .list-item {
            display: flex; flex-direction: column; gap: 8px; padding: 15px;
            background: rgba(255,255,255,0.03); border-radius: 18px; margin-bottom: 10px;
            border: 0.5px solid rgba(255,255,255,0.1);
        }

        /* iOS 26.5 Super Modal */
        #superModal {
            position: fixed; top: 100%; left: 0; width: 100%; height: 100dvh;
            background: rgba(15, 15, 17, 0.95); backdrop-filter: blur(50px) saturate(200%);
            z-index: 5000; transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            display: flex; flex-direction: column; border-radius: 40px 40px 0 0;
        }
        #superModal.active { top: 0; border-radius: 0; }
        #superModal.minimized { top: 50dvh; height: 50dvh; border-radius: 30px 30px 0 0; }

        .sm-header {
            padding: calc(var(--safe-top) + 15px) 20px 15px;
            display: flex; justify-content: space-between; align-items: center; border-bottom: 0.5px solid rgba(255,255,255,0.1);
        }
        .sm-nav-btn { color: var(--ios-blue); font-size: 18px; cursor: pointer; }
        
        .sm-body { flex: 1; overflow-y: auto; padding: 20px; }
        .sm-view { display: none; }
        .sm-view.active { display: block; }

        .code-box {
            background: #000; border-radius: 15px; padding: 15px; position: relative;
            font-family: 'SF Mono', monospace; font-size: 13px; color: #34C759;
            border: 1px solid rgba(255,255,255,0.1); margin-top: 15px;
        }
        .copy-icon { position: absolute; top: 10px; right: 10px; font-size: 18px; opacity: 0.6; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .ios-btn { padding: 14px; border-radius: 14px; border: none; font-weight: 600; cursor: pointer; text-align: center; }
    </style>
</head>
<body class="dark-mode">

<div class="app-container">
    <header>
        <h2 style="margin:0;">Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁ𝔠ⲉ - GIX</h2>
    </header>

    <main>
        <section class="card">
            <input type="text" id="userInput" value="mobsp" style="width:100%; padding:12px; border-radius:10px; background:rgba(0,0,0,0.2); border:none; color:white; margin-bottom:10px;">
            <button onclick="startScan()" class="ios-btn" style="background:var(--ios-blue); color:white; width:100%;">⚡ 掃描所有分支內容</button>
        </section>

        <div id="filterSection" style="display:none;">
            <p style="font-size:12px; opacity:0.6; margin: 10px 5px;">選擇要顯示/匯出的分支：</p>
            <select id="branchSelect" onchange="updateView()" class="multi-select"></select>
            
            <p style="font-size:12px; opacity:0.6; margin: 10px 5px;">資料夾過濾 (可複選)：</p>
            <select id="folderSelect" multiple onchange="updateView()" class="multi-select" style="height:100px;"></select>
        </div>

        <div id="fileList"></div>
    </main>
</div>

<div id="superModal">
    <div class="sm-header">
        <div class="sm-nav-btn" onclick="smBack()">〈 返回</div>
        <div class="sm-nav-btn" onclick="toggleMinimize()">⌤</div>
        <div class="sm-nav-btn" onclick="closeSM()" style="color:#ff3b30;">✕</div>
    </div>
    
    <div class="sm-body">
        <div id="smViewInfo" class="sm-view active">
            <h2 id="smTitle">檔案名稱</h2>
            <p id="smDesc" style="opacity:0.6; margin-bottom:25px;">作用說明</p>
            <div id="smLinks"></div>
            <button class="ios-btn" style="background:var(--ios-blue); color:white; width:100%; margin-top:20px;" onclick="smToContent()">查看檔案內容</button>
        </div>

        <div id="smViewContent" class="sm-view">
            <h3>內容詳情</h3>
            <div class="code-box">
                <span class="copy-icon" onclick="copyContent()">📋</span>
                <pre id="smCodeDisplay" style="margin:0; white-space:pre-wrap;"></pre>
            </div>
            <textarea id="smEditor" style="display:none; width:100%; height:300px; background:#000; color:white; border-radius:10px; padding:10px; margin-top:15px;"></textarea>
            
            <div class="btn-group">
                <button id="editBtn" class="ios-btn" style="background:rgba(255,255,255,0.1); color:white;" onclick="startEdit()">編輯檔案</button>
                <button id="saveBtn" class="ios-btn" style="background:#34C759; color:white; display:none;" onclick="saveLogic()">儲存檔案</button>
            </div>
        </div>
    </div>
</div>

<script>
    let allFiles = [];
    let activeFile = null;

    async function startScan() {
        const user = document.getElementById('userInput').value;
        allFiles = [];
        const repos = await (await fetch(`https://api.github.com/users/${user}/repos?per_page=100`)).json();
        
        for (let repo of repos) {
            const branches = await (await fetch(`https://api.github.com/repos/${user}/${repo.name}/branches`)).json();
            for (let b of branches) {
                const tree = await (await fetch(`https://api.github.com/repos/${user}/${repo.name}/git/trees/${b.name}?recursive=1`)).json();
                if (tree.tree) {
                    tree.tree.filter(i => i.type === 'blob').forEach(f => {
                        allFiles.push({
                            branch: b.name, repo: repo.name, path: f.path,
                            name: f.path.split('/').pop(),
                            raw: `https://raw.githubusercontent.com/${user}/${repo.name}/${b.name}/${f.path}`,
                            link: `https://mobsp.qzz.io/${f.path}`,
                            folder: f.path.includes('/') ? f.path.substring(0, f.path.lastIndexOf('/')) : 'ROOT'
                        });
                    });
                }
            }
        }
        initFilters();
    }

    function initFilters() {
        document.getElementById('filterSection').style.display = 'block';
        const bSelect = document.getElementById('branchSelect');
        const fSelect = document.getElementById('folderSelect');
        
        const branches = [...new Set(allFiles.map(f => f.branch))];
        bSelect.innerHTML = branches.map(b => `<option value="${b}">${b}</option>`).join('');
        
        const folders = [...new Set(allFiles.map(f => f.folder))].sort();
        fSelect.innerHTML = `<option value="ALL" selected>所有資料夾</option>` + 
                            folders.map(f => `<option value="${f}">${f}</option>`).join('');
        updateView();
    }

    function getPreciseDesc(f) {
        const name = f.name.toLowerCase();
        if(name === 'package.json') return "專案依賴與腳本定義中心";
        if(name.endsWith('.js')) return "核心邏輯控制與交互行為實作";
        if(name.endsWith('.html')) return "頁面結構佈局與 DOM 靜態定義";
        if(name.endsWith('.css')) return "視覺樣式渲染與介面美化配置";
        if(name.endsWith('.md')) return "專案技術文檔與使用指南說明";
        return "專案內部資源與數據存放檔案";
    }

    function updateView() {
        const targetBranch = document.getElementById('branchSelect').value;
        const selectedFolders = Array.from(document.getElementById('folderSelect').selectedOptions).map(o => o.value);
        const list = document.getElementById('fileList');

        const filtered = allFiles.filter(f => 
            f.branch === targetBranch && 
            (selectedFolders.includes('ALL') || selectedFolders.includes(f.folder))
        );

        list.innerHTML = filtered.map(f => `
            <div class="list-item">
                <div style="font-size:11px; color:var(--ios-blue);">[${f.branch}]</div>
                <div style="font-weight:600;">${f.repo} - ${f.name}</div>
                <div style="font-size:13px; opacity:0.6;">${getPreciseDesc(f)}</div>
                <button class="ios-btn" style="background:var(--ios-blue); color:white; font-size:12px; padding:8px; margin-top:5px;" onclick="openSM('${f.path}', '${f.branch}')">展開按鈕 ⚡</button>
            </div>
        `).join('');
    }

    // --- Modal Logic ---
    function openSM(path, branch) {
        activeFile = allFiles.find(f => f.path === path && f.branch === branch);
        document.getElementById('smTitle').innerText = activeFile.name;
        document.getElementById('smDesc').innerText = getPreciseDesc(activeFile);
        
        document.getElementById('smLinks').innerHTML = `
            <div class="card" style="background:rgba(255,255,255,0.05);">
                <p style="font-size:12px; margin:5px 0;">預覽連結: ${activeFile.link}</p>
                <p style="font-size:12px; margin:5px 0;">Raw 連結: ${activeFile.raw}</p>
            </div>
        `;

        fetch(activeFile.raw).then(r => r.text()).then(t => {
            document.getElementById('smCodeDisplay').innerText = t;
            document.getElementById('smEditor').value = t;
        });

        document.getElementById('superModal').classList.add('active');
    }

    function smToContent() {
        document.getElementById('smViewInfo').classList.remove('active');
        document.getElementById('smViewContent').classList.add('active');
    }

    function smBack() {
        if(document.getElementById('smViewContent').classList.contains('active')) {
            document.getElementById('smViewContent').classList.remove('active');
            document.getElementById('smViewInfo').classList.add('active');
        } else {
            closeSM();
        }
    }

    function startEdit() {
        document.getElementById('smCodeDisplay').parentElement.style.display = 'none';
        document.getElementById('smEditor').style.display = 'block';
        document.getElementById('editBtn').style.display = 'none';
        document.getElementById('saveBtn').style.display = 'block';
    }

    function saveLogic() {
        const res = prompt("請選擇：\n1. 下載修改後的檔案\n2. 下載原始檔案\n3. 推送到儲存庫更新 (需填入 Token)", "1");
        if(res === "1") {
            const blob = new Blob([document.getElementById('smEditor').value], {type:'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = activeFile.name; a.click();
        } else if (res === "3") {
            alert("正在調用 API 推送至 " + activeFile.branch + " 分支...");
        }
    }

    function closeSM() { document.getElementById('superModal').classList.remove('active', 'minimized'); }
    function toggleMinimize() { document.getElementById('superModal').classList.toggle('minimized'); }
    function copyContent() { navigator.clipboard.writeText(document.getElementById('smEditor').value); alert("複製成功"); }
</script>

</body>
</html>
