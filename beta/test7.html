<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <script>if(self!==top){top.location=self.location;}</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁ𝔠ⲉ | 系統 Demo</title>
    
    <script src="./mod/ios-type.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 移除原本重複的背景與捲動設定，交給 ios-type.js 接管 */
        .app-content { 
            position: relative; 
            z-index: 10; 
            padding: 20px 0; /* 縮減 padding，因為 iOS Header 會自動撐開空間 */
            text-align: center;
        }
        /* 讓原生組件與 iOS 系統色調融合 */
        h2 { letter-spacing: -0.5px; }
    </style>

    <link rel="alternate" hreflang="x-default" href="https://your-supreme-site.com/beta/index.html">
</head>
<body>

    <div class="app-content">
        <header id="ms-header"></header>
        
        <div id="brand-area"></div>
        
        <ul class="ios-list">
            <li>系統狀態 <span>運作中</span></li>
            <li>核心版本 <span>iOS 26.0 (Beta)</span></li>
            <li onclick="iosAlert('系統訊息', '這是一個原生手感的彈窗測試！')">
                彈窗測試 <i class="fa-solid fa-chevron-right" style="opacity: 0.3;"></i>
            </li>
        </ul>

        <div style="margin-top: 30px; padding: 0 20px;">
            <h2 style="color: #00cec9;">1-6 號系統組裝測試</h2>
            <p style="opacity: 0.6; font-size: 14px;">這是一個架構化開發的 Demo 頁面</p>
            
            <button onclick="showPage('組件詳細清單')">查看所有 iOS 組件</button>
        </div>
    </div>

    <script type="module">
        // 1. 導入原本的系統模組
        import { showSplash } from './mod/splash-screen.js';
        import { initTheme } from './mod/theme-engine.js';
        import { renderBrand } from './mod/brand-layout.js';
        import { initBottomNav } from './mod/bottom-nav.js';
        import { initFooter } from './mod/footer-sys.js';

        // 2. 執行順序
        // 啟動畫面
        showSplash('https://mobsp.github.io/assets/brand/ms-blog.JPEG');

        // 初始化背景與佈局
        initTheme();
        renderBrand('#brand-area');
        initBottomNav();
        initFooter();

        // 3. 2號系統 (跑馬燈)
        document.addEventListener('DOMContentLoaded', async () => {
            const { initNotice } = await import('./mod/notice-sync.js');
            // 這裡保留您的 Supabase 初始化
            initNotice(
                'https://svwrvxomytbfaqpfnifg.supabase.co', 
                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
            );
        });
    </script>

</body>
</html>
