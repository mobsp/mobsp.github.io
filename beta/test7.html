<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS 26 系統全功能檢視</title>
    
    <script src="./mod/ios-type.js"></script>

    <style>
        /* 這裡只需寫一些內容微調，系統樣式已由 JS 接管 */
        .section-title {
            padding: 20px 16px 8px;
            color: #8E8E93;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .demo-box { padding: 0 16px; margin-bottom: 30px; }
    </style>
</head>
<body>

    <div class="demo-box">
        <div class="ios-search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="搜尋組件或功能...">
        </div>
    </div>

    <div class="section-title">系統核心組件 (Mapping Test)</div>
    <ul>
        <li>
            動態島反饋 
            <span>已開啟</span>
        </li>
        <li onclick="iosAlert('系統權限', '您正在嘗試存取底層核心模組。')">
            安全性檢查 
            <span style="color: #0A84FF;">檢查中 〉</span>
        </li>
        <li>
            通知顯示
            <input type="checkbox" checked> </li>
        <li>
            開發者模式
            <input type="checkbox"> </li>
    </ul>

    <div class="section-title">數據輸入測試</div>
    <div class="demo-box">
        <input type="text" placeholder="請輸入使用者名稱" class="ios-input">
        <input type="password" placeholder="請輸入安全密碼" class="ios-input">
    </div>

    <div class="section-title">交互操作測試</div>
    <div class="demo-box">
        <button onclick="iosAlert('部署成功', 'iOS 26 Runtime 已經接管所有原生組件。')">
            觸發系統彈窗 (Alert)
        </button>
        
        <button style="background: #32D159;" onclick="showPage('系統詳細資訊')">
            切換至深層導航 (Navigation)
        </button>

        <a href="javascript:void(0)" onclick="alert('這是一個原生 Web 回饋')">
            超連結自動映射測試
        </a>
    </div>

    <div class="demo-box" style="margin-top: 40px; text-align: center; opacity: 0.5; font-size: 12px;">
        Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁ𝔠ⲉ Digital Resource Portal<br>
        Powered by iOS 26 Runtime Engine
    </div>

    <script>
        // 額外測試：點擊動態島的行為
        document.addEventListener('DOMContentLoaded', () => {
            const island = document.getElementById('island');
            if(island) {
                island.addEventListener('click', () => {
                    console.log("部長，動態島運作正常。");
                });
            }
        });
    </script>

</body>
</html>
