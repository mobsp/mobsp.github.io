<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁ𝔠ⲉ 旗艦系統</title>
    <style>
        :root {
            --ios-blue: #0A84FF; --ios-green: #30D158; --ios-red: #FF453A; --ios-gray: #8E8E93;
            --glass: rgba(20, 20, 20, 0.7); --ios-card: rgba(28, 28, 30, 0.8);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, sans-serif; }
        #ios-root { display: flex; flex-direction: column; height: 100dvh; width: 100vw; position: relative; }
        .ios-island { position: fixed; top: 11px; left: 50%; transform: translateX(-50%); width: 125px; height: 36px; background: #000; border-radius: 20px; z-index: 10000; transition: all 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.2); display: flex; align-items: center; justify-content: center; border: 0.5px solid rgba(255,255,255,0.1); }
        .ios-island.active { width: 300px; height: 60px; border-radius: 25px; }
        #island-msg { opacity: 0; font-size: 14px; transition: 0.3s; color: #fff; font-weight: 500; }
        .ios-header { padding: env(safe-area-inset-top, 20px) 20px 10px; background: var(--glass); backdrop-filter: blur(40px); border-bottom: 0.5px solid rgba(255,255,255,0.1); z-index: 1000; }
        .nav-row { display: flex; align-items: center; height: 30px; margin-bottom: 5px; }
        .back-btn { color: var(--ios-blue); font-size: 17px; visibility: hidden; opacity: 0; transition: 0.3s; cursor: pointer; }
        .back-btn.show { visibility: visible; opacity: 1; }
        .ios-header h1 { font-size: 34px; margin: 0; font-weight: 700; color: #fff; transition: 0.3s; }
        .ios-header.mini h1 { font-size: 18px; transform: translate(-40px, -28px); text-align: center; width: 100%; }
        .ios-scroller { flex: 1; overflow-y: auto; padding: 10px 16px 100px; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .section-label { padding: 20px 16px 8px; color: var(--ios-gray); font-size: 13px; text-transform: uppercase; }
        .ios-list { background: var(--ios-card); border-radius: 12px; padding: 0; margin: 0 0 20px; list-style: none; overflow: hidden; backdrop-filter: blur(20px); }
        .ios-list li { padding: 14px 16px; border-bottom: 0.5px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between; font-size: 17px; color: #fff; cursor: pointer; }
        .ios-list li:active { background: rgba(255,255,255,0.15); }
        .ios-search-box { background: var(--ios-card); border-radius: 12px; padding: 10px 15px; display: flex; align-items: center; margin-bottom: 15px; }
        .ios-search-box input { background: transparent; border: none; color: #fff; flex: 1; font-size: 17px; }
        .ios-switch { width: 51px; height: 31px; background: #39393D; border-radius: 20px; position: relative; transition: 0.3s; }
        .ios-switch.on { background: var(--ios-green); }
        .ios-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; background: #fff; border-radius: 50%; transition: 0.3s; box-shadow: 0 3px 8px rgba(0,0,0,0.2); }
        .ios-switch.on::after { transform: translateX(20px); }
        .alert-ov { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 11000; backdrop-filter: blur(5px); }
        .alert-box { width: 270px; background: rgba(40, 40, 40, 0.95); border-radius: 14px; overflow: hidden; text-align: center; border: 0.5px solid rgba(255,255,255,0.1); }
        .alert-body { padding: 20px; border-bottom: 0.5px solid rgba(255,255,255,0.1); color: #fff; }
        .alert-btns { display: flex; }
        .alert-btn { flex: 1; padding: 12px; color: var(--ios-blue); font-weight: 600; cursor: pointer; }
        .alert-btn:first-child { border-right: 0.5px solid rgba(255,255,255,0.1); font-weight: 400; }
        .home-bar { height: 5px; width: 134px; background: #fff; border-radius: 10px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); opacity: 0.4; z-index: 100; }
    </style>
</head>
<body>

    <div id="ios-root">
        <div class="ios-island" id="island"><div id="island-msg"></div></div>
        <header class="ios-header" id="header">
            <div class="nav-row"><span class="back-btn" id="back">〈 返回</span></div>
            <h1 id="mainTitle">控制中心</h1>
        </header>

        <main class="ios-scroller" id="scroller">
            <div class="ios-search-box">
                <input type="text" placeholder="搜尋中心功能..." oninput="window.ios.filter(this.value)">
            </div>

            <div class="section-label">系統操作</div>
            <ul class="ios-list">
                <li onclick="handleSync()">同步雲端數據 <span>現在同步</span></li>
                <li onclick="handleReset()">重置全域設定 <span style="color:var(--ios-red)">重置</span></li>
            </ul>

            <div class="section-label">功能開關</div>
            <ul class="ios-list">
                <li>Zenith 主題引擎 <input type="checkbox" checked onchange="window.ios.notify('主題已套用')"></li>
                <li>數據自動重試 <input type="checkbox" checked></li>
                <li onclick="openMore()">進階隱私設定 <span>〉</span></li>
            </ul>
        </main>
        <div class="home-bar"></div>
    </div>

    <div class="alert-ov" id="alertOv">
        <div class="alert-box">
            <div class="alert-body"><div id="a-t" style="font-weight:600; font-size:17px;"></div><div id="a-m" style="font-size:13px; margin-top:5px; opacity:0.8;"></div></div>
            <div class="alert-btns"><div class="alert-btn" id="a-cancel">取消</div><div class="alert-btn" id="a-ok">確認</div></div>
        </div>
    </div>

    <script src="./ios-type.js"></script>
    <script src="./theme-engine.js"></script>

    <script>
        // 確保 DOM 載入後執行
        window.addEventListener('load', () => {
            // 初始化引擎
            if(window.initTheme) window.initTheme();
            if(window.initSecurity) window.initSecurity();
            
            // 初始渲染 iOS 組件
            if(window.ios) {
                window.ios._render();
            }

            document.getElementById('back').onclick = () => window.ios.pop();
        });

        // 定義全域按鈕邏輯
        function handleSync() {
            window.ios.loading(true);
            setTimeout(() => {
                window.ios.loading(false);
                window.ios.notify("數據同步成功");
            }, 1500);
        }

        function handleReset() {
            window.ios.actionSheet([
                { id: 1, text: '僅清除快取', onClick: () => window.ios.notify('快取已清理') },
                { id: 2, text: '完整格式化', role: 'destructive', onClick: () => window.ios.alert('安全確認', '此操作無法復原，確定？', () => window.ios.notify('系統已重置')) },
                { id: 3, text: '取消', role: 'cancel' }
            ]);
        }

        function openMore() {
            const html = `
                <div class="section-label">隱私與安全</div>
                <ul class="ios-list">
                    <li>位置跟蹤 <input type="checkbox"></li>
                    <li>診斷數據發送 <input type="checkbox" checked></li>
                    <li onclick="window.ios.pop()">返回控制中心 〉</li>
                </ul>
            `;
            window.ios.push('隱私設定', html);
        }
    </script>
</body>
</html>
