<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁ𝔠ⲉ 旗艦測試中心</title>
    
    <script src="./mod/ios-type.js"></script>

    <style>
        .section-label { padding: 20px 16px 8px; color: #8E8E93; font-size: 13px; text-transform: uppercase; }
        .group { margin-bottom: 20px; }
        .ios-input-group { background: #1C1C1E; border-radius: 12px; margin: 0 16px; overflow: hidden; }
        .ios-input-group input { 
            width: 100%; background: transparent; border: none; color: #fff; 
            padding: 14px 16px; font-size: 17px; border-bottom: 0.5px solid #333;
        }
        .desc { padding: 10px 20px; font-size: 13px; opacity: 0.5; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="section-label">實體搜尋過濾</div>
    <div style="padding: 0 16px;">
        <div class="ios-search-box">
            <input type="text" placeholder="輸入關鍵字過濾下方列表..." oninput="window.ios.filter(this.value)">
        </div>
    </div>

    <div class="section-label">動態島與交互系統</div>
    <ul class="ios-list">
        <li onclick="window.ios.notify('⚡️ 系統核心已成功掛載！')">
            觸發動態島通知 <span class="val">點擊測試</span>
        </li>
        <li onclick="window.ios.alert('安全確認', '您確定要格式化目前所有的系統快取嗎？', () => { window.ios.notify('✅ 快取已清除'); }, '立即清除')">
            實體雙鈕彈窗 <span class="val">Callback 測試</span>
        </li>
    </ul>

    <div class="section-label">多層級導航 (Navigation Stack)</div>
    <div style="padding: 0 16px;">
        <button onclick="openSubPage()">進入進階設定子頁面</button>
    </div>
    <div class="desc">測試 `window.ios.push` 是否能確實紀錄歷史紀錄並透過「返回」按鈕回跳。</div>

    <div class="section-label">自動映射測試 (Mapping)</div>
    <ul class="ios-list">
        <li>
            Wi-Fi 無線網路 
            <input type="checkbox" checked onchange="window.ios.notify(this.checked ? 'Wi-Fi 已開啟' : 'Wi-Fi 已關閉')">
        </li>
        <li>
            飛航模式 
            <input type="checkbox" onchange="window.ios.notify('模式切換成功')">
        </li>
        <li>
            藍牙連接 <span>未連接 〉</span>
        </li>
    </ul>

    <div class="section-label">表單與數據收集</div>
    <div class="ios-input-group">
        <input type="text" placeholder="使用者帳號">
        <input type="password" placeholder="存取金鑰">
    </div>
    <div class="desc">這部分的樣式與原生 iOS 設定頁面的輸入框完全一致。</div>

    <script>
        // 模擬動態生成一個完整的子頁面內容
        function openSubPage() {
            const subHtml = `
                <div class="section-label">子頁面功能</div>
                <ul class="ios-list">
                    <li>深層設定 A <input type="checkbox"></li>
                    <li>深層設定 B <input type="checkbox" checked></li>
                    <li onclick="window.ios.alert('子頁面指令', '已收到您的操作指令！')">觸發內部指令 〉</li>
                </ul>
                <div style="padding: 0 16px;">
                    <button class="no-ios" style="background:#FF453A; color:#fff; border-radius:12px; padding:15px; width:100%; border:none; font-weight:600;" onclick="window.ios.pop()">
                        手動執行返回 (Pop)
                    </button>
                </div>
            `;
            window.ios.push('進階設定', subHtml);
        }

        // 啟動時自動通知
        setTimeout(() => {
            window.ios.notify("Welcome, 部長");
        }, 1000);
    </script>

</body>
</html>
