<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MOBSP iOS Navigation System</title>
    <style>
        /* ==========================================
           1. CSS 變數與基礎設定 (iOS 系統色彩與互動)
           ========================================== */
        :root {
            --tab-bar-height: 49px;
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --system-background: #f2f2f7;
            --system-grouped-background: #efeff4;
            --label-primary: #000000;
            --label-secondary: #3c3c4399;
            --accent-color: #007aff;
            --tab-blur-bg: rgba(248, 248, 248, 0.82);
            --tab-border: rgba(0, 0, 0, 0.15);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --system-background: #000000;
                --system-grouped-background: #1c1c1e;
                --label-primary: #ffffff;
                --label-secondary: #ebebf599;
                --accent-color: #0a84ff;
                --tab-blur-bg: rgba(22, 22, 22, 0.82);
                --tab-border: rgba(255, 255, 255, 0.15);
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--system-background);
            color: var(--label-primary);
        }

        /* ==========================================
           2. 頁面視圖與容器管理 (View Stack)
           ========================================== */
        #view-container {
            position: relative;
            width: 100%;
            height: calc(100% - var(--tab-bar-height) - var(--safe-area-bottom));
            overflow: hidden;
        }

        .tab-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 20px;
            display: none;
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
        }

        .tab-view.active {
            display: block;
            opacity: 1;
        }

        .content-card {
            background: var(--system-grouped-background);
            padding: 18px 20px;
            border-radius: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--label-primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .content-card:active {
            transform: scale(0.97);
            opacity: 0.8;
        }

        .tool-info h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .tool-info p {
            font-size: 12px;
            color: var(--label-secondary);
        }

        /* ==========================================
           3. iOS 頂級擬真 Tab Bar (毛玻璃 + 互動)
           ========================================== */
        #tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(var(--tab-bar-height) + var(--safe-area-bottom));
            padding-bottom: var(--safe-area-bottom);
            background-color: var(--tab-blur-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 0.5px solid var(--tab-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .tab-item {
            flex: 1;
            height: var(--tab-bar-height);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--label-secondary);
            transition: transform 0.1s ease, color 0.2s ease;
        }

        .tab-item:active {
            transform: scale(0.92);
        }

        .tab-item.active {
            color: var(--accent-color);
        }

        .tab-icon {
            font-size: 22px;
            line-height: 1;
            margin-bottom: 2px;
        }

        .tab-label {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: -0.2px;
        }
    </style>
</head>
<body>

    <!-- 頁面容器 -->
    <div id="view-container">
        <!-- 分頁 1: Today / 首頁 -->
        <div id="view-today" class="tab-view active">
            <h2>Today 導覽頁</h2>
            <p style="margin: 10px 0 20px 0; color: var(--label-secondary);">體驗原生 iOS 般的切換與捲動維持。</p>
            <div style="background: var(--system-grouped-background); padding: 20px; border-radius: 12px; margin-bottom: 16px;">下滑測試捲動位置保留</div>
            <div style="background: var(--system-grouped-background); padding: 20px; border-radius: 12px; margin-bottom: 16px;">模擬大量內容區塊 A</div>
            <div style="background: var(--system-grouped-background); padding: 20px; border-radius: 12px; margin-bottom: 16px;">模擬大量內容區塊 B</div>
        </div>

        <!-- 分頁 2: Tools / 工具牆 (動態從 tol/ 資料夾獲取) -->
        <div id="view-tools" class="tab-view">
            <h2>MOBSP 常用工具</h2>
            <p style="margin: 10px 0 20px 0; color: var(--label-secondary);">自動掃描 tol/ 資料夾產生的工具清單。</p>
            <div id="tools-container">
                <p style="color: var(--label-secondary); font-size: 14px;">正在載入工具清單...</p>
            </div>
        </div>

        <!-- 分頁 3: Wiki / 支援中心 -->
        <div id="view-wiki" class="tab-view">
            <h2>Wiki 說明文件</h2>
            <p style="margin: 10px 0 20px 0; color: var(--label-secondary);">系統架構與說明文件。</p>
            <div style="background: var(--system-grouped-background); padding: 20px; border-radius: 12px;">文件內容區塊 01</div>
        </div>

        <!-- 分頁 4: Settings / 設定 -->
        <div id="view-settings" class="tab-view">
            <h2>系統設定</h2>
            <p style="margin: 10px 0 20px 0; color: var(--label-secondary);">外觀與偏好調整。</p>
            <div style="background: var(--system-grouped-background); padding: 20px; border-radius: 12px;">外觀模式：自動適配</div>
        </div>
    </div>

    <!-- 底部導覽列 (已替換收割機為 Tools 工具牆) -->
    <nav id="tab-bar">
        <div class="tab-item active" onclick="switchTab('today', this)">
            <div class="tab-icon">􀋂</div>
            <div class="tab-label">Today</div>
        </div>
        <div class="tab-item" onclick="switchTab('tools', this)" id="btn-tools">
            <div class="tab-icon">􌂝</div>
            <div class="tab-label">Tools</div>
        </div>
        <div class="tab-item" onclick="switchTab('wiki', this)">
            <div class="tab-icon">􅜖</div>
            <div class="tab-label">Wiki</div>
        </div>
        <div class="tab-item" onclick="switchTab('settings', this)">
            <div class="tab-icon">􌅱</div>
            <div class="tab-label">Settings</div>
        </div>
    </nav>

    <script>
        /* ==========================================
           4. 輕量高效邏輯核心 (State & Switcher)
           ========================================== */
        let currentTabId = 'today';
        const scrollPositions = {};
        let toolsLoaded = false;

        function switchTab(tabId, element) {
            if (currentTabId === tabId) {
                const activeView = document.getElementById(`view-${tabId}`);
                activeView.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            // 1. 紀錄當前分頁的滾動位置
            const currentView = document.getElementById(`view-${currentTabId}`);
            if (currentView) {
                scrollPositions[currentTabId] = currentView.scrollTop;
            }

            // 2. 切換導覽列高亮狀態
            document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            // 3. 切換頁面顯示
            document.querySelectorAll('.tab-view').forEach(view => view.classList.remove('active'));
            const targetView = document.getElementById(`view-${tabId}`);
            targetView.classList.add('active');

            // 若切換到 tools 且尚未載入過，執行自動掃描載入
            if (tabId === 'tools' && !toolsLoaded) {
                loadToolsList();
            }

            // 4. 還原目標分頁的滾動位置
            if (scrollPositions[tabId] !== undefined) {
                targetView.scrollTop = scrollPositions[tabId];
            } else {
                targetView.scrollTop = 0;
            }

            currentTabId = tabId;
        }

        /* 🚀 自動讀取 GitHub 儲存庫 tol/ 資料夾的工具清單 */
        async function loadToolsList() {
            const container = document.getElementById('tools-container');
            // 替換為你的實際 GitHub 帳號與儲存庫名稱
            const owner = 'mobsp';
            const repo = 'mobsp.github.io'; 
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/tol`;

            try {
                const res = await fetch(apiUrl);
                if (!res.ok) throw new Error('無法讀取工具清單');
                const items = await res.json();

                // 過濾出資料夾項目
                const subDirs = items.filter(item => item.type === 'dir');
                
                if (subDirs.length === 0) {
                    container.innerHTML = `<p style="color: var(--label-secondary);">目前 tol/ 資料夾下尚無工具。</p>`;
                    return;
                }

                let html = '';
                for (let dir of subDirs) {
                    const toolName = dir.name;
                    const toolUrl = `/tol/${toolName}/`;
                    
                    html += `
                        <a href="${toolUrl}" class="content-card">
                            <div class="tool-info">
                                <h3>${toolName}</h3>
                                <p>${toolUrl}</p>
                            </div>
                            <span style="color: var(--label-secondary); font-size: 14px;">›</span>
                        </a>
                    `;
                }

                container.innerHTML = html;
                toolsLoaded = true;
            } catch (err) {
                // 若直接用 API 受限，退回預設路徑或提示
                container.innerHTML = `<p style="color: var(--label-secondary);">載入失敗，請確認 GitHub 儲存庫路徑設定。</p>`;
            }
        }
    </script>
</body>
</html>
