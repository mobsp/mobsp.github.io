<body>

    <div id="app-container">
        <header class="app-header">
            <img src="/assets/brand/ms-blog-title.webp" class="brand-title-img" onclick="handleHeaderClick()">
        </header>

        <!-- 獨立分頁檢視容器 -->
        <div id="view-container">
            <!-- 閱讀分頁 -->
            <div id="view-read" class="tab-view active">
                <div id="content-loader" style="text-align:center; padding:50px; color:#666; font-size:11px; letter-spacing:2px;">INITIALIZING...</div>
            </div>
            <!-- 工具牆分頁 (取代原先的收割機) -->
            <div id="view-tools" class="tab-view">
                <div id="tools-loader" style="text-align:center; padding:50px; color:#666; font-size:11px; letter-spacing:2px;">LOADING TOOLS...</div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="/music/" class="nav-item" rel="noopener noreferrer"><i class="fa-solid fa-circle-play"></i><span>音樂</span></a>
            <div id="btn-read" class="nav-item active" onclick="switchTab('read', this)"><i class="fa-solid fa-book-open"></i><span>閱讀</span></div>
            <div id="btn-tools" class="nav-item" onclick="switchTab('tools', this)"><i class="fa-solid fa-toolbox"></i><span>工具</span></div>
            <a href="/setting" class="nav-item" rel="noopener noreferrer"><i class="fa-solid fa-sliders"></i><span>設定</span></a>
        </nav>
    </div>

    <script>
        let rawArticles = [];
        let rawTools = [];
        let currentTabId = 'read';
        const scrollPositions = {};

        /* iOS 分頁切換與捲動記憶核心 */
        function switchTab(tabId, element) {
            if (currentTabId === tabId) {
                const activeView = document.getElementById(`view-${tabId}`);
                if (activeView) activeView.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            const currentView = document.getElementById(`view-${currentTabId}`);
            if (currentView) {
                scrollPositions[currentTabId] = currentView.scrollTop;
            }

            document.querySelectorAll('.bottom-nav .nav-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');

            document.querySelectorAll('.tab-view').forEach(view => view.classList.remove('active'));
            const targetView = document.getElementById(`view-${tabId}`);
            targetView.classList.add('active');

            if (scrollPositions[tabId] !== undefined) {
                targetView.scrollTop = scrollPositions[tabId];
            } else {
                targetView.scrollTop = 0;
            }

            currentTabId = tabId;
        }

        function handleHeaderClick() {
            const activeView = document.getElementById(`view-${currentTabId}`);
            if (activeView && activeView.scrollTop > 0) {
                activeView.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                location.reload();
            }
        }

        /* 載入文章列表 */
        async function loadArticles() {
            const api = "https://api.github.com/repos/mobsp/contents/blog/p/list?t=" + Date.now();
            try {
                const res = await fetch(api);
                const files = await res.json();
                rawArticles = files.filter(f => f.name.endsWith('.html')).reverse().map(f => ({
                    title: decodeURIComponent(f.name).replace('.html','').trim(),
                    path: f.path
                }));
                renderArticleList();
            } catch (e) {
                document.getElementById('view-read').innerHTML = '<div style="text-align:center; padding:50px; color:#333;">SYNC FAILED</div>';
            }
        }

        function renderArticleList() {
            const container = document.getElementById('view-read');
            if (rawArticles.length === 0) return;
            container.innerHTML = rawArticles.map(p => `
                <a class="article-row" href="/${p.path}">
                    <div class="row-img"></div>
                    <div class="row-info">
                        <div class="row-cate">ARCHIVE</div>
                        <div class="row-title">${p.title}</div>
                    </div>
                    <i class="fa-solid fa-chevron-right" style="color:#222; font-size:10px;"></i>
                </a>`).join('');
        }

        /* 載入自動產生的工具清單 (tools.json) */
        async function loadTools() {
            try {
                const res = await fetch('/tools.json?t=' + Date.now());
                if (!res.ok) throw new Error('Not found');
                rawTools = await res.json();
                renderToolList();
            } catch (e) {
                document.getElementById('view-tools').innerHTML = '<div style="text-align:center; padding:50px; color:#8E8E93; font-size:12px;">尚無工具清單資料</div>';
            }
        }

        function renderToolList() {
            const container = document.getElementById('view-tools');
            if (!rawTools || rawTools.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:50px; color:#8E8E93; font-size:12px;">目前沒有可用工具</div>';
                return;
            }
            container.innerHTML = rawTools.map(t => `
                <a class="article-row" href="${t.path}">
                    <div class="row-img" style="background: linear-gradient(135deg, #0A84FF, #0040dd);"></div>
                    <div class="row-info">
                        <div class="row-cate">TOOL PORTAL</div>
                        <div class="row-title">${t.name}</div>
                    </div>
                    <i class="fa-solid fa-chevron-right" style="color:#222; font-size:10px;"></i>
                </a>`).join('');
        }

        window.onload = () => {
            loadArticles();
            loadTools();
        };
    </script>
