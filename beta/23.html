<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS Settings V4 Native Replica</title>
    <style>
        :root {
            --ios-bg: #f2f2f7;
            --ios-card: #ffffff;
            --ios-pressed: #e5e5ea;
            --ios-text: #000000;
            --ios-sub: #8e8e93;
            --ios-border: rgba(60,60,67,.18);
            --ios-search: rgba(118,118,128,.12);
            --ios-green: #34c759;
            --ios-blue: #007aff;
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --ios-bg: #000000;
                --ios-card: #1c1c1e;
                --ios-pressed: #2c2c2e;
                --ios-text: #ffffff;
                --ios-sub: #8e8e93;
                --ios-border: #38383a;
                --ios-search: rgba(118,118,128,.24);
            }
        }

        * {
            margin: 0; padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden; /* 防止雙重滾動條 */
        }

        /* App 容器模擬 iOS View Hierarchy */
        .app-viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--ios-bg);
        }

        /* 視圖 (View) 容器，用於 Push 滑動頁面 */
        .view {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--ios-bg);
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: calc(60px + var(--sab));
            transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
            will-change: transform;
            z-index: 1;
        }

        .view.sub-page {
            transform: translateX(100%);
            z-index: 10;
        }

        .view.sub-page.active {
            transform: translateX(0);
        }

        .view.parent-pushed {
            transform: translateX(-30%);
            opacity: 0.9;
        }

        /* 導覽列 Nav Bar */
        .nav {
            position: sticky;
            top: 0;
            height: calc(44px + var(--sat));
            padding-top: var(--sat);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 10px;
            padding-right: 10px;
            z-index: 99;
            background: rgba(249, 249, 249, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid var(--ios-border);
            transform: translateZ(0);
        }

        @media (prefers-color-scheme: dark) {
            .nav { background: rgba(28,28,30,.78); }
        }

        .nav-back {
            display: flex;
            align-items: center;
            color: var(--ios-blue);
            font-size: 17px;
            cursor: pointer;
            visibility: hidden;
        }

        .sub-page .nav-back { visibility: visible; }

        .nav-back-arrow {
            width: 12px; height: 12px;
            border-left: 2.5px solid var(--ios-blue);
            border-bottom: 2.5px solid var(--ios-blue);
            transform: rotate(45deg);
            margin-right: 4px;
        }

        .nav-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--ios-text);
            text-align: center;
            flex: 1;
        }

        /* 內容與標題 */
        .content { padding-top: 8px; }
        .large-title { padding: 4px 16px 10px; }
        .large-title h1 { font-size: 34px; font-weight: 700; letter-spacing: -.5px; }

        /* 搜尋列 */
        .search-wrap { padding: 0 16px 12px; }
        .search {
            height: 36px;
            border-radius: 10px;
            background: var(--ios-search);
            display: flex;
            align-items: center;
            padding: 0 10px;
            color: var(--ios-sub);
        }
        .search input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 17px;
            color: var(--ios-text);
            width: 100%;
            margin-left: 6px;
        }

        /* 分組列表 */
        .group { margin: 0 16px 20px; }
        .group-title {
            font-size: 13px;
            color: var(--ios-sub);
            padding-left: 16px;
            padding-bottom: 6px;
            text-transform: uppercase;
        }

        .list {
            list-style: none;
            background: var(--ios-card);
            border-radius: 12px;
            overflow: hidden;
        }

        .cell {
            position: relative;
            display: flex;
            align-items: center;
            min-height: 48px;
            padding: 8px 16px;
            color: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: background .12s;
        }
        .cell:active { background: var(--ios-pressed); }

        li:not(:last-child) .cell::after {
            content: "";
            position: absolute;
            inset-inline-start: 56px;
            inset-inline-end: 0;
            bottom: 0;
            height: .5px;
            background: var(--ios-border);
        }

        /* 頭像與圖示 */
        .profile-cell { min-height: 66px; }
        .avatar {
            width: 52px; height: 52px;
            border-radius: 50%;
            background: #8e8e93;
            color: #fff;
            display: flex;
            align-items: center; justify-content: center;
            font-size: 18px; font-weight: 600;
            margin-right: 12px; flex-shrink: 0;
        }
        .profile-name { font-size: 17px; font-weight: 600; }
        .profile-sub { font-size: 12px; color: var(--ios-sub); }

        .icon {
            width: 29px; height: 29px;
            border-radius: 7px;
            margin-right: 12px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; flex-shrink: 0;
        }
        .icon svg { width: 18px; height: 18px; fill: currentColor; }

        .label { flex: 1; font-size: 17px; }
        .value { color: var(--ios-sub); font-size: 17px; margin-right: 6px; }

        .chevron {
            width: 8px; height: 8px;
            border-top: 1.5px solid #c7c7cc;
            border-right: 1.5px solid #c7c7cc;
            transform: rotate(45deg);
            flex-shrink: 0;
        }

        /* Switch 帶 iOS Spring 動畫 */
        .switch {
            appearance: none;
            -webkit-appearance: none;
            width: 51px; height: 31px;
            border-radius: 16px;
            background: #e4e4e7;
            position: relative;
            transition: background 0.25s;
            cursor: pointer;
        }
        .switch::before {
            content: "";
            position: absolute;
            width: 27px; height: 27px;
            left: 2px; top: 2px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 3px 8px rgba(0,0,0,.15);
            /* Spring 關鍵：cubic-bezier 彈簧擺動 */
            transition: transform 0.3s var(--spring);
        }
        .switch:checked { background: var(--ios-green); }
        .switch:checked::before { transform: translateX(20px); }

        @media (prefers-color-scheme: dark) {
            .switch { background: #39393d; }
        }
    </style>
</head>
<body>

<div class="app-viewport">

    <!-- 主頁面 View -->
    <div class="view" id="mainView">
        <div class="nav">
            <div style="width:50px;"></div>
            <div class="nav-title">設定</div>
            <div style="width:50px;"></div>
        </div>

        <div class="content">
            <div class="large-title">
                <h1>設定</h1>
            </div>

            <!-- Apple ID -->
            <div class="group">
                <ul class="list">
                    <li>
                        <div class="cell profile-cell" onclick="pushView('appleIdView')">
                            <div class="avatar">AC</div>
                            <div style="flex:1;">
                                <div class="profile-name">Alex Chen</div>
                                <div class="profile-sub">Apple 帳號、iCloud、訂閱項目</div>
                            </div>
                            <div class="chevron"></div>
                        </div>
                    </li>
                </ul>
            </div>

            <!-- 搜尋 -->
            <div class="search-wrap">
                <div class="search">
                    🔍 <input type="text" placeholder="搜尋" id="searchInput">
                </div>
            </div>

            <!-- 第一組選單 -->
            <div class="group">
                <ul class="list">
                    <li>
                        <div class="cell">
                            <div class="icon" style="background:#ff9500;">✈️</div>
                            <div class="label">飛航模式</div>
                            <input class="switch" type="checkbox" id="flightSwitch">
                        </div>
                    </li>
                    <li>
                        <div class="cell" onclick="pushView('wifiView')">
                            <div class="icon" style="background:#007aff;">📶</div>
                            <div class="label">Wi-Fi</div>
                            <div class="value" id="wifiVal">Home_Network</div>
                            <div class="chevron"></div>
                        </div>
                    </li>
                    <li>
                        <div class="cell" onclick="pushView('btView')">
                            <div class="icon" style="background:#007aff;">📡</div>
                            <div class="label">藍牙</div>
                            <div class="value" id="btVal">開啟</div>
                            <div class="chevron"></div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 子頁面：Wi-Fi View -->
    <div class="view sub-page" id="wifiView">
        <div class="nav">
            <div class="nav-back" onclick="popView()">
                <div class="nav-back-arrow"></div>
                <span>設定</span>
            </div>
            <div class="nav-title">Wi-Fi</div>
            <div style="width:50px;"></div>
        </div>
        <div class="content">
            <div class="group">
                <ul class="list">
                    <li>
                        <div class="cell">
                            <div class="label">Wi-Fi</div>
                            <input class="switch" type="checkbox" checked id="wifiToggle">
                        </div>
                    </li>
                </ul>
            </div>
            <div class="group">
                <div class="group-title">我的網路</div>
                <ul class="list">
                    <li>
                        <div class="cell">
                            <div class="label">Home_Network</div>
                            <div class="value" style="color:var(--ios-blue);">✓</div>
                        </div>
                    </li>
                    <li>
                        <div class="cell">
                            <div class="label">Office_5G</div>
                            <div class="chevron"></div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 子頁面：藍牙 View -->
    <div class="view sub-page" id="btView">
        <div class="nav">
            <div class="nav-back" onclick="popView()">
                <div class="nav-back-arrow"></div>
                <span>設定</span>
            </div>
            <div class="nav-title">藍牙</div>
            <div style="width:50px;"></div>
        </div>
        <div class="content">
            <div class="group">
                <ul class="list">
                    <li>
                        <div class="cell">
                            <div class="label">藍牙</div>
                            <input class="switch" type="checkbox" checked>
                        </div>
                    </li>
                </ul>
            </div>
            <div class="group">
                <div class="group-title">我的裝置</div>
                <ul class="list">
                    <li>
                        <div class="cell">
                            <div class="label">AirPods Pro</div>
                            <div class="value">已連線</div>
                            <div class="chevron"></div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>

</div>

<script>
    // 原生 Navigation Stack 推進邏輯
    let historyStack = ['mainView'];

    function pushView(viewId) {
        const currentView = document.getElementById(historyStack[historyStack.length - 1]);
        const targetView = document.getElementById(viewId);

        currentView.classList.add('parent-pushed');
        targetView.classList.add('active');
        historyStack.push(viewId);
    }

    function popView() {
        if (historyStack.length <= 1) return;

        const currentViewId = historyStack.pop();
        const parentViewId = historyStack[historyStack.length - 1];

        document.getElementById(currentViewId).classList.remove('active');
        document.getElementById(parentViewId).classList.remove('parent-pushed');
    }

    // 飛航模式連動邏輯
    document.getElementById('flightSwitch').addEventListener('change', (e) => {
        const isChecked = e.target.checked;
        document.getElementById('wifiVal').textContent = isChecked ? '關閉' : 'Home_Network';
        document.getElementById('btVal').textContent = isChecked ? '關閉' : '開啟';
    });

    // 針對安全的精準搜尋過濾
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const keyword = e.target.value.toLowerCase().trim();
        const groups = document.querySelectorAll('#mainView .group');

        groups.forEach(group => {
            let hasVisible = false;
            group.querySelectorAll('li').forEach(li => {
                const label = li.querySelector('.label')?.textContent.toLowerCase() || '';
                const name = li.querySelector('.profile-name')?.textContent.toLowerCase() || '';
                
                if (keyword === '' || label.includes(keyword) || name.includes(keyword)) {
                    li.style.display = '';
                    hasVisible = true;
                } else {
                    li.style.display = 'none';
                }
            });
            group.style.display = (hasVisible || keyword === '') ? '' : 'none';
        });
    });
</script>

</body>
</html>
