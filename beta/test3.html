    <title>Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁⲉ | Floating Reader Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --reader-bg: linear-gradient(135deg, #020202, #0a0a12, #050505);
            --reader-text: #888888;
            --accent: #a29bfe;
            --font-size: 19px;
            --panel-bg: rgba(44, 44, 46, 0.95);
        }

        /* 1. 封死全域 */
        html, body { 
            height: 100%; width: 100%; margin: 0; padding: 0; 
            overflow: hidden; position: fixed; 
            background: #000; color: var(--reader-text);
        }

        /* 動態流光背景 */
        .fluid-bg {
            position: fixed; inset: 0; background: var(--reader-bg);
            background-size: 400% 400%; animation: fluidMove 15s ease infinite; z-index: -1;
        }
        @keyframes fluidMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* 2. 閱讀區域 */
        #readerView {
            display: none; height: 100%; width: 100%;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding: 40px 20px 150px; box-sizing: border-box;
        }
        .article-container { max-width: 750px; margin: 0 auto; line-height: 1.8; }
        #readerView h1 { color: #fff; font-size: 2.2em; outline: none; }
        #readerView img { max-width: 100%; border-radius: 16px; margin: 25px 0; }

        /* 3. 懸浮按鈕 (FAB) - 發光邊框 */
        #fabBtn {
            position: fixed; bottom: 35px; right: 25px;
            width: 60px; height: 60px; border-radius: 50%;
            background: rgba(162, 155, 254, 0.2); backdrop-filter: blur(15px);
            border: 1.5px solid var(--accent); box-shadow: 0 0 20px rgba(162, 155, 254, 0.5);
            color: #fff; display: none; align-items: center; justify-content: center;
            z-index: 3000; cursor: pointer;
        }

        /* 4. 修正版：懸浮設定彈窗 (自適應模式) */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; align-items: center; justify-content: center;
            z-index: 4000; backdrop-filter: blur(5px);
        }
        .floating-panel {
            width: 90%; max-width: 450px; /* 自適應寬度 */
            max-height: 80vh; background: var(--panel-bg);
            border-radius: 28px; border: 1px solid rgba(255,255,255,0.1);
            padding: 25px; color: #fff; position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            overflow-y: auto; transform: scale(0.9); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.show { display: flex; }
        .modal-overlay.show .floating-panel { transform: scale(1); }

        /* 關閉按鈕 */
        .close-panel-btn {
            position: absolute; top: 15px; right: 15px;
            width: 30px; height: 30px; border-radius: 50%;
            background: rgba(255,255,255,0.1); display: flex;
            align-items: center; justify-content: center; cursor: pointer;
        }

        /* 功能項樣式 */
        .control-row { 
            background: rgba(255,255,255,0.05); padding: 15px; 
            border-radius: 18px; margin-bottom: 15px;
            display: flex; align-items: center; justify-content: space-between;
        }
        select { background: none; border: none; color: var(--accent); font-size: 16px; outline: none; width: 60%; text-align: right; }

        /* 原始網站暫存層 */
        #original-web { height: 100%; overflow-y: auto; padding: 20px; text-align: center; }
    </style>

<body>

    <div class="fluid-bg"></div>

    <div id="original-web">
        <article id="target-content">
            <h1>Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁⲉ 2026 原生技術報導</h1>
            <p>這是一個具備高度封裝性的網頁架構...</p>
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&amp;fit=crop&amp;w=800">
        </article>
        <button onclick="activateReader()" style="margin-top:50px; padding:15px 30px; border-radius:20px; background:var(--accent); border:none; color:#000; font-weight:bold;">啟動超 S 級閱讀器</button>
    </div>

    <main id="readerView">
        <div class="article-container">
            <header id="articleHeader">
                <span contenteditable="true" style="color:var(--accent); font-size:12px;"># 科技標籤</span>
                <h1 contenteditable="true" id="readerTitle">正在加載...</h1>
            </header>
            <div id="readerBody"></div>
            <footer id="articleFooter" style="text-align:center; padding:60px; opacity:0.3; font-size:11px;">
                © 2026 Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁⲉ | 離線存檔已就緒
            </footer>
        </div>
    </main>

    <div id="fabBtn" onclick="openModal()"><i class="fa-solid fa-sliders"></i></div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="floating-panel">
            <div class="close-panel-btn" onclick="closeModal(force=true)"><i class="fa-solid fa-xmark"></i></div>
            <h3 style="margin-top:0; text-align:center;">閱讀設定</h3>
            
            <div class="control-row">
                <span>字體大小</span>
                <div>
                    <button onclick="adjustFont(-2)" style="background:none; border:none; color:#fff; font-size:18px; padding:0 10px;">A-</button>
                    <button onclick="adjustFont(2)" style="background:none; border:none; color:#fff; font-size:18px; padding:0 10px;">A+</button>
                </div>
            </div>

            <div class="control-row">
                <span>選擇字型</span>
                <select onchange="changeFont(this.value)">
                    <option value="'PingFang TC'">萍方黑體</option>
                    <option value="'BiauKai'">標楷體</option>
                    <option value="'Microsoft JhengHei'">微軟正黑</option>
                    <option value="Helvetica">Helvetica</option>
                    <option value="serif">經典襯線</option>
                
                </select>
            </div>

            <div class="control-row">
                <span>顯示圖片</span>
                <input type="checkbox" checked="" onchange="document.getElementById('readerView').style.setProperty('--img-display', this.checked?'block':'none'); updateImgVisibility(this.checked)">
            </div>

            <div class="control-row">
                <span>顯示頁首頁尾</span>
                <input type="checkbox" checked="" onchange="toggleLayout(this.checked)">
            </div>

            <div class="control-row" style="background:var(--accent); color:#000; justify-content:center; font-weight:bold;" onclick="window.print()">
                📥 匯存多格式檔案
            </div>

            <div class="control-row" style="justify-content:center; color:#ff4d4d;" onclick="location.reload()">
                ❌ 關閉閱讀器模式
            </div>
        </div>
    </div>

    <script>
        / 進入閱讀器
        function activateReader() {
            const original = document.getElementById('target-content');
            const readerBody = document.getElementById('readerBody');
            const readerTitle = document.getElementById('readerTitle');

            const contentClone = original.cloneNode(true);
            readerTitle.innerText = contentClone.querySelector('h1').innerText;
            contentClone.querySelector('h1').remove();
            readerBody.innerHTML = contentClone.innerHTML;

            document.getElementById('original-web').style.display = 'none';
            document.getElementById('readerView').style.display = 'block';
            document.getElementById('fabBtn').style.display = 'flex';
        }

        / 彈窗開關邏輯
        function openModal() {
            document.getElementById('modalOverlay').classList.add('show');
        }

        function closeModal(event, force = false) {
            / 如果點擊的是遮罩區或強行關閉
            if (force || event.target.id === 'modalOverlay') {
                document.getElementById('modalOverlay').classList.remove('show');
            }
        }

        / 字體與排版控制
        function adjustFont(delta) {
            const root = document.documentElement;
            let current = parseInt(getComputedStyle(root).getPropertyValue('--font-size')) || 19;
            root.style.setProperty('--font-size', (current + delta) + 'px');
        }

        function changeFont(f) {
            document.body.style.fontFamily = f;
        }

        function updateImgVisibility(show) {
            document.querySelectorAll('#readerBody img').forEach(img => img.style.display = show ? 'block' : 'none');
        }

        function toggleLayout(show) {
            document.getElementById('articleHeader').style.display = show ? 'block' : 'none';
            document.getElementById('articleFooter').style.display = show ? 'block' : 'none';
        }

        / 全域鎖定補強
        document.addEventListener('touchmove', function(e) {
            if (document.getElementById('modalOverlay').classList.contains('show')) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
