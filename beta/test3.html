<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Safari-Style Reader Engine</title>
    <style>
        :root {
            --reader-bg: #ffffff;
            --reader-text: #333333;
            --reader-font-size: 20px;
            --reader-width: 700px;
        }

        /* 閱讀器遮罩層 */
        #reader-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--reader-bg);
            color: var(--reader-text);
            overflow-y: auto;
            padding: 40px 20px;
            font-family: "PingFang TC", "Microsoft JhengHei", serif;
        }

        /* 閱讀內容容器 */
        .reader-container {
            max-width: var(--reader-width);
            margin: 0 auto;
            line-height: 1.8;
            animation: fadeIn 0.4s ease;
        }

        .reader-container h1 { font-size: 2em; line-height: 1.2; margin-bottom: 0.5em; }
        .reader-container p { margin-bottom: 1.5em; text-align: justify; }
        .reader-container img { max-width: 100%; height: auto; border-radius: 8px; }

        /* 控制面板 */
        .reader-tools {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .tool-btn {
            background: rgba(0,0,0,0.1);
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 模擬原本網頁的干擾內容 (測試用) */
        .ads { background: #ffeded; padding: 20px; margin: 10px; border: 1px dashed red; }
    </style>
</head>
<body>

    <nav>導航欄 (會被過濾)</nav>
    <div id="main-article">
        <h1>這是文章標題</h1>
        <div class="ads">我是廣告 (應被剔除)</div>
        <p>這是第一段非常有意義的內容。Safari 的閱讀器會分析這段文字的長度與密度。</p>
        <p>這是第二段內容。包含了一些重要的技術細節。我們需要確保這些內容被提取出來。</p>
        <img src="https://via.placeholder.com/800x400" alt="測試圖片">
        <p>最後一段總結內容。</p>
    </div>
    <footer>頁尾資訊 (會被過濾)</footer>

    <button onclick="launchReader()" style="position:fixed; bottom:20px; right:20px; padding:15px; border-radius:50%; z-index:100;">📖</button>

    <div id="reader-overlay">
        <div class="reader-tools">
            <button class="tool-btn" onclick="toggleTheme('#fff', '#333')">白</button>
            <button class="tool-btn" onclick="toggleTheme('#1a1a1a', '#ccc')">黑</button>
            <button class="tool-btn" onclick="location.reload()">關閉</button>
        </div>
        <div class="reader-container" id="reader-content">
            </div>
    </div>

<script>
/**
 * 核心引擎：提取網頁主體內容
 */
function extractMainContent() {
    // 1. 複製目標節點 (避免破壞原網頁)
    const originalBody = document.body.cloneNode(true);
    
    // 2. 清洗噪音 (移除 script, style, ads, nav, footer)
    const noiseSelectors = 'script, style, nav, footer, .ads, #sidebar, .comments';
    originalBody.querySelectorAll(noiseSelectors).forEach(el => el.remove());

    // 3. 評分演算法 (簡化版：尋找包含最多 <p> 的容器)
    let bestCandidate = null;
    let maxScore = 0;

    const candidates = originalBody.querySelectorAll('div, article, section');
    candidates.forEach(el => {
        const pCount = el.querySelectorAll('p').length;
        const textLength = el.innerText.trim().length;
        const score = pCount * 20 + textLength; // 加權計算

        if (score > maxScore) {
            maxScore = score;
            bestCandidate = el;
        }
    });

    return bestCandidate ? bestCandidate.innerHTML : "無法辨識文章內容";
}

/**
 * 啟動閱讀器
 */
function launchReader() {
    const title = document.querySelector('h1')?.innerText || "未命名文章";
    const content = extractMainContent();
    
    document.getElementById('reader-content').innerHTML = `<h1>${title}</h1>${content}`;
    document.getElementById('reader-overlay').style.display = 'block';
    document.body.style.overflow = 'hidden'; // 鎖定原網頁捲動
}

function toggleTheme(bg, text) {
    document.documentElement.style.setProperty('--reader-bg', bg);
    document.documentElement.style.setProperty('--reader-text', text);
}
</script>

</body>
</html>
