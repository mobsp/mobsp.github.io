<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁⲉ | S-Rank Reader Integration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* 閱讀器預設背景：深黑流光 */
            --reader-bg: linear-gradient(135deg, #020202, #0a0a12, #050505);
            /* 字體顏色：深灰與淺灰中心點 (#888888) */
            --reader-text: #888888;
            --accent: #a29bfe;
            --font-size: 19px;
            --line-height: 1.8;
            --font-family: "PingFang TC", system-ui, sans-serif;
            /* 彈窗預設背景：深灰 */
            --panel-bg: #2c2c2e;
            --safe-bottom: env(safe-area-inset-bottom);
        }

        /* 1. 封死全域視窗，禁止非閱讀區滑動與縮放 */
        html, body { 
            height: 100%; width: 100%; margin: 0; padding: 0; 
            overflow: hidden; position: fixed; 
            background: #000; color: var(--reader-text);
            font-family: var(--font-family);
            -webkit-user-select: none;
        }

        /* 動態流光背景動畫 */
        .fluid-bg {
            position: fixed; inset: 0;
            background: var(--reader-bg);
            background-size: 400% 400%;
            animation: fluidMove 15s ease infinite;
            z-index: -1;
        }
        @keyframes fluidMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* 2. 分離式渲染：閱讀區域 */
        #readerView {
            display: none; /* 初始隱藏 */
            height: 100%; width: 100%;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding: 40px 20px 150px;
            box-sizing: border-box;
            overscroll-behavior: contain;
        }
        .article-container { max-width: 750px; margin: 0 auto; -webkit-user-select: text; }
        .article-header { margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
        .tag-label { display: inline-block; padding: 4px 12px; border-radius: 50px; background: rgba(162, 155, 254, 0.2); color: var(--accent); font-size: 12px; margin-bottom: 10px; }
        
        #readerView h1 { color: #fff; font-size: 2.2em; margin: 10px 0; outline: none; } /* 可編輯標題 */
        #readerView img { max-width: 100%; border-radius: 16px; margin: 25px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #readerView.hide-images img { display: none; }
        #readerView.hide-header .article-header { display: none; }

        /* 3. FAB 懸浮鈕：發光邊框 */
        .fab-trigger {
            position: fixed; bottom: 35px; right: 25px;
            width: 56px; height: 56px; border-radius: 50%;
            background: rgba(44, 44, 46, 0.8);
            backdrop-filter: blur(15px);
            border: 1.5px solid var(--accent);
            box-shadow: 0 0 15px rgba(162, 155, 254, 0.4);
            color: #fff; display: flex; align-items: center; justify-content: center;
            z-index: 3000; cursor: pointer; transition: transform 0.2s;
        }
        .fab-trigger:active { transform: scale(0.9); }

        /* 4. Bottom Sheet：仿 iOS 26.4 玻璃動態彈窗 */
        .bottom-sheet {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 75vh;
            background: rgba(44, 44, 46, 0.92);
            backdrop-filter: blur(30px) saturate(180%);
            border-radius: 30px 30px 0 0;
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 4000; padding: 20px;
            color: #fff; /* 彈窗文字預設白色 */
            display: flex; flex-direction: column;
        }
        .bottom-sheet.show { transform: translateY(0); }
        .handle { width: 36px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 10px; margin: 0 auto 20px; }

        /* 控制項佈局 */
        .panel-scroll { flex: 1; overflow-y: auto; padding-bottom: 50px; }
        .control-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 18px; margin-bottom: 12px; }
        .flex-row { display: flex; align-items: center; justify-content: space-between; }
        select { background: transparent; border: none; color: var(--accent); font-size: 16px; outline: none; text-align: right; }

        /* 原始網站隔離層 */
        #original-web { height: 100%; overflow-y: auto; padding: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="fluid-bg"></div>

    <div id="original-web">
        <nav>導航欄位 & 廣告</nav>
        <article id="target-content">
            <span class="tag-label">科技專欄</span>
            <h1>解構 iOS 26.4 介面美學</h1>
            <p>這是原始網頁內容。當閱讀器啟動時，此區塊將被 `display: none` 以釋放效能。</p>
            <img src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?auto=format&fit=crop&w=800" alt="動態背景">
            <p>透過分離式渲染技術，我們能確保閱讀體驗不受原網站腳本干擾。</p>
        </article>
        <button onclick="activateReader()" style="margin-top:50px; padding:15px 30px; border-radius:20px;">進入閱讀模式</button>
    </div>

    <main id="readerView">
        <div class="article-container">
            <header class="article-header" id="readerHeader">
                <span class="tag-label" contenteditable="true" id="readerTag">類別標籤</span>
                <h1 contenteditable="true" id="readerTitle">文章標題載入中...</h1>
            </header>
            <div id="readerBody">
                </div>
            <footer id="readerFooter" style="text-align:center; padding:50px; opacity:0.5; font-size:12px;">
                本文章已儲存至離線清單 | 2026 Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁⲉ
            </footer>
        </div>
    </main>

    <div class="fab-trigger" id="fabBtn" style="display:none;" onclick="togglePanel()">
        <i class="fa-solid fa-gear"></i>
    </div>

    <div class="bottom-sheet" id="controlPanel">
        <div class="handle"></div>
        <div class="panel-scroll">
            
            <div class="control-item">
                <div class="flex-row">
                    <span>字體大小</span>
                    <div>
                        <button onclick="adjustFont(-2)" style="background:none; border:none; color:#fff; padding:0 15px;">A-</button>
                        <button onclick="adjustFont(2)" style="background:none; border:none; color:#fff; padding:0 15px;">A+</button>
                    </div>
                </div>
            </div>

            <div class="control-item">
                <div class="flex-row">
                    <span>字型樣式</span>
                    <select onchange="changeFont(this.value)">
                        <optgroup label="中文字體">
                            <option value="'PingFang TC'">萍方黑體</option>
                            <option value="'BiauKai'">標楷體</option>
                            <option value="'Microsoft JhengHei'">微軟正黑</option>
                        </optgroup>
                        <optgroup label="英文字體">
                            <option value="Helvetica">Helvetica</option>
                            <option value="'Times New Roman'">Serif</option>
                            <option value="monospace">Monospace</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <div class="control-item">
                <div class="flex-row">
                    <span>顯示圖片</span>
                    <input type="checkbox" checked onchange="toggleMedia('img', this.checked)">
                </div>
            </div>

            <div class="control-item">
                <div class="flex-row">
                    <span>顯示頁首/頁尾</span>
                    <input type="checkbox" checked onchange="toggleLayout(this.checked)">
                </div>
            </div>

            <div class="control-item" style="background:var(--accent); color:#000; font-weight:bold; text-align:center;" onclick="exportPDF()">
                📥 下載並存檔為多格式 (PDF/HTML)
            </div>

            <div class="control-item" style="text-align:center;" onclick="saveOffline()">
                🔖 加入瀏覽器稍後閱讀 (離線儲存)
            </div>

            <div class="control-item" style="text-align:center; color:#ff4d4d;" onclick="location.reload()">
                ❌ 關閉閱讀器
            </div>
        </div>
    </div>

    <script>
        // 1. 自動識別與內容提取 (CloneNode 策略)
        function activateReader() {
            const original = document.getElementById('target-content');
            const readerBody = document.getElementById('readerBody');
            const readerTitle = document.getElementById('readerTitle');

            // 深度克隆並過濾噪音
            const contentClone = original.cloneNode(true);
            const noise = contentClone.querySelectorAll('nav, .ad, button, script');
            noise.forEach(n => n.remove());

            // 注入標題與正文
            readerTitle.innerText = contentClone.querySelector('h1').innerText;
            contentClone.querySelector('h1').remove(); // 避免重複標題
            readerBody.innerHTML = contentClone.innerHTML;

            // 分離渲染切換
            document.getElementById('original-web').style.display = 'none';
            document.getElementById('readerView').style.display = 'block';
            document.getElementById('fabBtn').style.display = 'flex';
        }

        // 2. 介面交互邏輯
        function togglePanel() {
            document.getElementById('controlPanel').classList.toggle('show');
        }

        function adjustFont(delta) {
            const root = document.documentElement;
            let current = parseInt(getComputedStyle(root).getPropertyValue('--font-size'));
            root.style.setProperty('--font-size', (current + delta) + 'px');
        }

        function changeFont(f) {
            document.documentElement.style.setProperty('--font-family', f);
        }

        function toggleMedia(type, show) {
            document.getElementById('readerView').classList.toggle('hide-images', !show);
        }

        function toggleLayout(show) {
            document.getElementById('readerView').classList.toggle('hide-header', !show);
            document.getElementById('readerFooter').style.display = show ? 'block' : 'none';
        }

        // 3. 進階儲存功能模擬
        function saveOffline() {
            const html = document.documentElement.outerHTML;
            localStorage.setItem('offline_article', html);
            alert('✅ 已存入離線緩存，可在無網路時瀏覽。');
        }

        function exportPDF() {
            alert('🚀 正在封裝多格式檔案：\n1. PDF 文章存檔\n2. 原生 HTML 封裝\n3. JSON 結構資料');
            window.print();
        }

        // iOS 防晃動補強
        document.addEventListener('touchmove', function(e) {
            if (isPanelOpen()) e.preventDefault(); 
        }, { passive: false });

        function isPanelOpen() {
            return document.getElementById('controlPanel').classList.contains('show');
        }
    </script>
</body>
</html>
