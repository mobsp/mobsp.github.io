<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>mobsp.github.io Navigator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; line-height: 1.6; color: #333; }
        .controls { margin-bottom: 20px; padding: 15px; background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px; }
        ul { list-style-type: none; padding-left: 20px; }
        li { margin: 5px 0; }
        .folder { font-weight: bold; color: #0969da; cursor: pointer; }
        .file { color: #57606a; text-decoration: none; }
        .file:hover { color: #0969da; text-decoration: underline; }
        #tree { border: 1px solid #d0d7de; padding: 20px; border-radius: 6px; }
    </style>
</head>
<body>

    <h2>儲存庫內容瀏覽器</h2>
    <div class="controls">
        <label>選擇分支: </label>
        <select id="branch-select"></select>
    </div>

    <div id="tree">正在連接 GitHub API...</div>

    <script>
        const OWNER = 'mobsp';
        const REPO = 'mobsp.github.io';
        const API_BASE = `https://api.github.com/repos/${OWNER}/${REPO}`;

        async function init() {
            try {
                const res = await fetch(`${API_BASE}/branches`);
                const branches = await res.json();
                const select = document.getElementById('branch-select');
                branches.forEach(b => {
                    const opt = document.createElement('option');
                    opt.value = b.name;
                    opt.textContent = b.name;
                    select.appendChild(opt);
                });
                loadTree(branches[0].name);
            } catch (err) {
                document.getElementById('tree').innerHTML = "載入失敗，請檢查網路或 API 限制。";
            }
        }

        async function loadTree(branch) {
            document.getElementById('tree').innerHTML = "讀取中...";
            // 使用 recursive=1 獲取所有深層檔案
            const res = await fetch(`${API_BASE}/git/trees/${branch}?recursive=1`);
            const data = await res.json();
            const root = { name: 'root', children: {} };

            data.tree.forEach(item => {
                const parts = item.path.split('/');
                let current = root;
                parts.forEach((part, index) => {
                    if (!current.children[part]) {
                        current.children[part] = { name: part, children: {}, type: item.type, path: item.path };
                    }
                    current = current.children[part];
                });
            });

            const container = document.getElementById('tree');
            container.innerHTML = '';
            renderUI(root, container);
        }

        function renderUI(node, container) {
            const ul = document.createElement('ul');
            for (let key in node.children) {
                const child = node.children[key];
                const li = document.createElement('li');
                if (child.type === 'tree') {
                    li.innerHTML = `<span>📁 <b>${child.name}</b></span>`;
                    renderUI(child, li);
                } else {
                    li.innerHTML = `<a href="https://github.com/${OWNER}/${REPO}/blob/main/${child.path}" target="_blank" class="file">📄 ${child.name}</a>`;
                }
                ul.appendChild(li);
            }
            container.appendChild(ul);
        }

        document.getElementById('branch-select').addEventListener('change', (e) => loadTree(e.target.value));
        init();
    </script>
</body>
</html>
