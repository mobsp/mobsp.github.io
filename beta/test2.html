<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GIX OS App</title>
    <style>
        :root { --bg-color: #000; --glass: rgba(255, 255, 255, 0.08); --accent: #06C755; }
        body { margin: 0; background: var(--bg-color); color: #fff; font-family: -apple-system, sans-serif; }
        
        header { position: fixed; top: 0; width: 100%; height: 88px; background: rgba(20,20,20,0.7); backdrop-filter: blur(20px); z-index: 100; display: flex; align-items: flex-end; padding: 0 20px 15px; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        
        main { margin-top: 100px; padding: 0 16px; padding-bottom: 100px; }
        
        .card { background: var(--glass); backdrop-filter: blur(10px); border-radius: 20px; padding: 16px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); transition: transform 0.2s; }
        .card:active { transform: scale(0.98); }
        
        /* 標籤樣式 */
        .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; background: rgba(255,255,255,0.1); }
        .badge.beta { color: #ff9500; background: rgba(255, 149, 0, 0.15); }
        .badge.blog { color: #ff375f; background: rgba(255, 55, 95, 0.15); }
        
        .card h3 { margin: 0; font-size: 16px; }
        .card p { margin: 8px 0 0; font-size: 12px; color: #aaa; }
        
        nav { position: fixed; bottom: 0; width: 100%; height: 85px; background: rgba(20,20,20,0.8); backdrop-filter: blur(30px); display: flex; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom); align-items: center; border-top: 0.5px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

<header><h1>GIX Library</h1></header>

<main id="app-view"></main>

<nav>
    <button onclick="renderList('all')">全部</button>
    <button onclick="renderList('beta')">Beta測試</button>
    <button onclick="renderList('blog')">風月文學</button>
</nav>

<script>
// 資料陣列：包含 path 用於標籤渲染
const rawData = [
    { name: ".htaccess", path: "root", type: "system" },
    { name: "beta/01.html", path: "beta", type: "beta" },
    { name: "beta/gix-test.html", path: "beta", type: "beta" },
    { name: "blog/p/list/母姦致孕計劃.html", path: "blog", type: "blog" },
    { name: "blog/p/list/阿姨的菊穴.html", path: "blog", type: "blog" }
];

function renderList(filter) {
    const main = document.getElementById('app-view');
    main.innerHTML = ''; 
    
    const filtered = filter === 'all' ? rawData : rawData.filter(d => d.type === filter);
    
    filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';
        
        // 生成路徑標籤
        const badgeClass = item.type === 'beta' ? 'beta' : (item.type === 'blog' ? 'blog' : '');
        
        div.innerHTML = `
            <span class="badge ${badgeClass}">${item.path}</span>
            <h3>${item.name}</h3>
            <p>點擊以瀏覽檔案詳情</p>
        `;
        
        div.onclick = () => {
            if (navigator.vibrate) navigator.vibrate(10);
            console.log('正在導航至: ' + item.name);
        };
        main.appendChild(div);
    });
}

// 初始化渲染
renderList('all');
</script>
</body>
</html>
