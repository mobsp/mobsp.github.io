<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GIX Library OS</title>
    <style>
        /* (樣式維持不變) */
        :root { --bg-color: #000; --glass: rgba(255, 255, 255, 0.08); }
        body { margin: 0; background: var(--bg-color); color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        header { position: fixed; top: 0; width: 100%; height: 88px; background: rgba(20,20,20,0.7); backdrop-filter: blur(20px); z-index: 100; display: flex; align-items: flex-end; padding: 0 20px 15px; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        main { margin-top: 100px; padding: 0 16px; padding-bottom: 120px; }
        .card { background: var(--glass); backdrop-filter: blur(10px); border-radius: 20px; padding: 16px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; margin-bottom: 8px; background: rgba(255,255,255,0.1); }
        .badge.beta { color: #ff9500; }
        .badge.blog { color: #ff375f; }
        .badge.system { color: #0a84ff; }
        .card h3 { margin: 0; font-size: 16px; }
        .card p { margin: 4px 0 0; font-size: 12px; color: #888; }
        nav { position: fixed; bottom: 0; width: 100%; height: 85px; background: rgba(20,20,20,0.8); backdrop-filter: blur(30px); display: flex; justify-content: space-around; align-items: center; border-top: 0.5px solid rgba(255,255,255,0.1); }
        nav button { background: none; border: none; color: #fff; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

<header><h1>GIX Library</h1></header>
<main id="app-view">載入資料中...</main>

<nav>
    <button onclick="renderList('all')">全部</button>
    <button onclick="renderList('beta')">Beta</button>
    <button onclick="renderList('blog')">文學</button>
</nav>

<script>
let globalData = [];

// 讀取並解析 CSV
async function loadCSV() {
    try {
        const response = await fetch('gix_data.csv');
        const text = await response.text();
        const lines = text.split('\n');
        
        // 解析 CSV (假設格式: User,Repo,Branch,Path,Link)
        globalData = lines.slice(1).map(line => {
            const [user, repo, branch, path, link] = line.split(',');
            if (!path) return null;
            
            // 根據路徑判斷類型 (可根據實際需求調整邏輯)
            let type = 'system';
            if (path.includes('beta/')) type = 'beta';
            else if (path.includes('blog/')) type = 'blog';
            
            return { name: path.split('/').pop(), path, link, type };
        }).filter(item => item !== null);
        
        renderList('all');
    } catch (err) {
        document.getElementById('app-view').innerHTML = '無法載入 CSV 資料';
    }
}

function renderList(filter) {
    const main = document.getElementById('app-view');
    main.innerHTML = '';
    
    const filtered = filter === 'all' ? globalData : globalData.filter(d => d.type === filter);
    
    filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
            <span class="badge ${item.type}">${item.type.toUpperCase()}</span>
            <h3>${item.name}</h3>
            <p>${item.path}</p>
        `;
        div.onclick = () => window.open(item.link, '_blank');
        main.appendChild(div);
    });
}

// 執行載入
loadCSV();
</script>
</body>
</html>
