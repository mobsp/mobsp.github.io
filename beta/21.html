<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS Native Pro Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            /* 蘋果原生字體族 */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            background-color: #000000; /* iOS 純黑背景 */
        }
        /* 毛玻璃效果 */
        .ios-blur {
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            background-color: rgba(28, 28, 30, 0.7); /* iOS SystemGray6 透明 */
        }
        /* 底部抽屜動畫 */
        .sheet-transition {
            transition: transform 0.35s cubic-bezier(0.15, 0.85, 0.35, 1.2);
        }
        /* 隱藏滾動條 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Markdown 預覽渲染樣式 */
        .prose h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; border-bottom: 1px solid #38383A; padding-bottom: 0.25rem; }
        .prose h2 { font-size: 1.4rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; }
        .prose p { margin-bottom: 0.75rem; line-height: 1.6; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .prose code { background: #2C2C2E; padding: 0.15rem 0.4rem; border-radius: 6px; font-family: ui-monospace, monospace; font-size: 0.9em; color: #FF9F0A; }
    </style>
</head>
<body class="text-white h-full flex flex-col justify-between overflow-hidden select-none pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)]">

    <header class="ios-blur px-4 py-3 flex items-center justify-between border-b border-[#38383A] z-30 sticky top-0">
        <button class="text-[#0A84FF] text-lg active:opacity-50 transition flex items-center gap-1">
            <i class="fa-solid fa-chevron-left"></i>
            <span class="text-base">返回</span>
        </button>
        
        <div class="flex flex-col items-center">
            <span class="text-base font-semibold leading-tight">未命名筆記.md</span>
            <span id="wordCount" class="text-[10px] text-[#8E8E93] font-medium leading-none mt-0.5">0 字元</span>
        </div>
        
        <button onclick="openActionSheet()" class="w-8 h-8 rounded-full bg-[#2C2C2E] flex items-center justify-center text-[#0A84FF] active:bg-[#3A3A3C] transition">
            <i class="fa-solid fa-ellipsis"></i>
        </button>
    </header>

    <div class="bg-[#000000] px-4 py-2 border-b border-[#38383A] z-20">
        <div class="bg-[#1C1C1E] p-1 rounded-lg flex w-full max-w-sm mx-auto shadow-sm">
            <button id="tabEdit" onclick="switchTab('edit')" class="flex-1 bg-[#3A3A3C] text-white rounded-md py-1.5 text-sm font-semibold shadow-sm transition">
                編輯
            </button>
            <button id="tabPreview" onclick="switchTab('preview')" class="flex-1 text-[#8E8E93] rounded-md py-1.5 text-sm font-medium transition">
                預覽
            </button>
        </div>
    </div>

    <main class="flex-1 relative overflow-hidden bg-[#000000] flex">
        
        <div id="editContainer" class="flex-1 relative h-full flex flex-col">
            <textarea id="editor" class="w-full flex-1 bg-transparent text-white text-[17px] p-4 outline-none resize-none leading-relaxed" spellcheck="false" placeholder="開始撰寫你的筆記或 Markdown..."></textarea>
            
            <div class="bg-[#1C1C1E] border-t border-[#38383A] px-2 py-2 flex items-center justify-between text-sm z-20">
                <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar pb-1">
                    <button onclick="insertText('# ')" class="px-4 py-1.5 bg-[#2C2C2E] active:bg-[#3A3A3C] rounded-lg text-lg text-white font-medium">H1</button>
                    <button onclick="insertText('**', '**')" class="px-4 py-1.5 bg-[#2C2C2E] active:bg-[#3A3A3C] rounded-lg text-white font-bold">B</button>
                    <button onclick="insertText('- ')" class="px-4 py-1.5 bg-[#2C2C2E] active:bg-[#3A3A3C] rounded-lg text-white"><i class="fa-solid fa-list-ul"></i></button>
                    <button onclick="insertText('`', '`')" class="px-4 py-1.5 bg-[#2C2C2E] active:bg-[#3A3A3C] rounded-lg text-white"><i class="fa-solid fa-code"></i></button>
                </div>
                <button onclick="dismissKeyboard()" class="px-4 py-1.5 ml-2 text-[#0A84FF] font-semibold active:opacity-50 whitespace-nowrap">
                    完成
                </button>
            </div>
        </div>

        <div id="previewContainer" class="hidden absolute inset-0 bg-[#000000] p-5 overflow-y-auto prose text-white">
            </div>
    </main>

    <div id="sheetOverlay" class="hidden fixed inset-0 bg-black/50 z-50 opacity-0 transition-opacity duration-300 flex items-end justify-center" onclick="closeActionSheet()">
        <div id="actionSheet" class="w-full max-w-md bg-[#1C1C1E] rounded-t-[24px] px-4 pt-3 pb-8 transform translate-y-full sheet-transition border-t border-[#38383A]" onclick="event.stopPropagation()">
            <div class="w-10 h-1.5 bg-[#48484A] rounded-full mx-auto mb-5"></div>
            
            <p class="text-center text-[13px] font-medium text-[#8E8E93] mb-3">檔案操作</p>

            <div class="bg-[#2C2C2E] rounded-[14px] overflow-hidden mb-4">
                <button onclick="exportAction('copy')" class="w-full px-4 py-3.5 text-left active:bg-[#3A3A3C] flex items-center justify-between border-b border-[#38383A] text-[17px] text-white">
                    <span>複製全文</span>
                    <i class="fa-regular fa-copy text-[#8E8E93]"></i>
                </button>
                <button onclick="exportAction('md')" class="w-full px-4 py-3.5 text-left active:bg-[#3A3A3C] flex items-center justify-between border-b border-[#38383A] text-[17px] text-white">
                    <span>匯出為 .md 檔案</span>
                    <i class="fa-solid fa-file-arrow-down text-[#8E8E93]"></i>
                </button>
                <button onclick="exportAction('share')" class="w-full px-4 py-3.5 text-left active:bg-[#3A3A3C] flex items-center justify-between text-[17px] text-[#0A84FF]">
                    <span>系統分享 (Share...)</span>
                    <i class="fa-solid fa-arrow-up-from-bracket"></i>
                </button>
            </div>

            <div class="bg-[#2C2C2E] rounded-[14px] overflow-hidden mb-4">
                <button onclick="clearText()" class="w-full px-4 py-3.5 text-left active:bg-[#3A3A3C] flex items-center justify-between text-[17px] text-[#FF453A]">
                    <span>清除所有內容</span>
                    <i class="fa-regular fa-trash-can"></i>
                </button>
            </div>

            <button onclick="closeActionSheet()" class="w-full bg-[#2C2C2E] text-[#0A84FF] font-semibold py-3.5 rounded-[14px] text-center text-[17px] active:bg-[#3A3A3C]">
                取消
            </button>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const wordCount = document.getElementById('wordCount');
        const overlay = document.getElementById('sheetOverlay');
        const sheet = document.getElementById('actionSheet');
        const editContainer = document.getElementById('editContainer');
        const previewContainer = document.getElementById('previewContainer');
        const tabEdit = document.getElementById('tabEdit');
        const tabPreview = document.getElementById('tabPreview');

        // 1. 即時字數統計
        editor.addEventListener('input', () => {
            wordCount.innerText = `${editor.value.length} 字元`;
        });

        // 2. iOS 風格分段控制項切換 (Segmented Control Logic)
        function switchTab(mode) {
            if (mode === 'edit') {
                // UI 切換
                tabEdit.className = "flex-1 bg-[#3A3A3C] text-white rounded-md py-1.5 text-sm font-semibold shadow-sm transition";
                tabPreview.className = "flex-1 text-[#8E8E93] rounded-md py-1.5 text-sm font-medium transition";
                // 容器切換
                editContainer.classList.remove('hidden');
                previewContainer.classList.add('hidden');
            } else {
                // UI 切換
                tabPreview.className = "flex-1 bg-[#3A3A3C] text-white rounded-md py-1.5 text-sm font-semibold shadow-sm transition";
                tabEdit.className = "flex-1 text-[#8E8E93] rounded-md py-1.5 text-sm font-medium transition";
                // 容器切換
                editContainer.classList.add('hidden');
                previewContainer.classList.remove('hidden');
                // 觸發 Markdown 渲染
                renderPreview();
            }
        }

        // 3. 輕量級 Markdown 渲染引擎
        function renderPreview() {
            let text = editor.value;
            if(!text.trim()) {
                previewContainer.innerHTML = '<div class="text-center text-[#8E8E93] mt-10">尚無內容可預覽</div>';
                return;
            }
            // 簡易正則替換 (H1, H2, 粗體, 程式碼, 換行)
            let html = text
                .replace(/^# (.*?)$/gm, '<h1>$1</h1>')
                .replace(/^## (.*?)$/gm, '<h2>$1</h2>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/^- (.*?)$/gm, '<ul><li>$1</li></ul>')
                .replace(/\n/g, '<br>');
            
            // 修復多重 ul 標籤包裹問題 (簡易處理)
            html = html.replace(/<\/ul><br><ul>/g, '');
            previewContainer.innerHTML = html;
        }

        // 4. 輸入法輔助快捷插入 (Accessory Toolbar)
        function insertText(before, after = '') {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value;
            editor.value = text.substring(0, start) + before + text.substring(start, end) + after + text.substring(end);
            editor.selectionStart = editor.selectionEnd = start + before.length;
            editor.focus();
            wordCount.innerText = `${editor.value.length} 字元`;
        }

        function dismissKeyboard() {
            editor.blur(); // 在 iOS 上，失去焦點會自動收起虛擬鍵盤
        }

        // 5. iOS 系統級 Action Sheet 控制
        function openActionSheet() {
            dismissKeyboard();
            overlay.classList.remove('hidden');
            // 延遲一點點讓 display:block 生效後再加透明度，觸發 transition 動畫
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                sheet.classList.remove('translate-y-full');
            }, 10);
        }

        function closeActionSheet() {
            overlay.classList.add('opacity-0');
            sheet.classList.add('translate-y-full');
            setTimeout(() => overlay.classList.add('hidden'), 350);
        }

        // 6. 選單功能操作
        function exportAction(type) {
            const content = editor.value;
            if (type === 'copy') {
                navigator.clipboard.writeText(content);
                alert('已複製到剪貼簿');
            } else if (type === 'md') {
                const blob = new Blob([content], { type: 'text/markdown;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `未命名筆記_${Date.now()}.md`;
                link.click();
            } else if (type === 'share') {
                if (navigator.share) {
                    navigator.share({
                        title: '分享筆記',
                        text: content
                    }).catch(console.error);
                } else {
                    alert('此瀏覽器不支援 Web Share API');
                }
            }
            closeActionSheet();
        }

        function clearText() {
            if(confirm('確定要刪除所有內容嗎？此操作無法復原。')) {
                editor.value = '';
                wordCount.innerText = '0 字元';
                closeActionSheet();
                if(!previewContainer.classList.contains('hidden')) {
                    renderPreview();
                }
            }
        }
    </script>
</body>
</html>
