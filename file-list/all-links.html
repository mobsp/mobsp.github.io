<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>所有連結清單 | file-list</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b11">
  <meta name="description" content="file-list 所有連結清單，支援即時搜尋、排序、顯示方式、媒體勾選篩選。">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/theme-mobsp-blog.css">
</head>
<body data-page="all-links">
  <header class="app-header">
    <div class="wrap app-header-inner">
      <div class="brand-block">
        <div class="brand-mark">FL</div>
        <div class="brand-copy">
          <div class="brand-title">所有連結清單</div>
          <div class="brand-sub">搜尋、排序、顯示切換、媒體控制</div>
        </div>
      </div>

      <div class="header-actions">
        <a class="icon-btn" href="./index.html" aria-label="首頁">⌂</a>
        <a class="icon-btn" href="./saved.html" aria-label="收藏">🔖</a>
        <a class="icon-btn" href="./settings.html" aria-label="設定">⚙️</a>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div class="wrap app-shell">
      <section class="panel section-card">
        <div class="section-title-row">
          <div>
            <h1>所有連結清單</h1>
            <p>支援即時搜尋、排序、資料夾/類型/風險篩選、圖檔/音訊/影片顯示控制。</p>
          </div>
          <button class="btn" id="reset-filters" type="button">重設</button>
        </div>

        <div class="toolbar-grid toolbar-grid-app">
          <div class="field field-span-2">
            <label for="search">即時搜尋</label>
            <input id="search" class="input" type="search" placeholder="搜尋名稱、路徑、說明、建議、風險">
          </div>

          <div class="field">
            <label for="folder">資料夾</label>
            <select id="folder" class="select"></select>
          </div>

          <div class="field">
            <label for="type">類型</label>
            <select id="type" class="select"></select>
          </div>

          <div class="field">
            <label for="risk">風險</label>
            <select id="risk" class="select">
              <option value="all">全部風險</option>
              <option value="高">高</option>
              <option value="中">中</option>
              <option value="低">低</option>
            </select>
          </div>

          <div class="field">
            <label for="sort">排序</label>
            <select id="sort" class="select">
              <option value="name-asc">名稱 A → Z</option>
              <option value="name-desc">名稱 Z → A</option>
              <option value="path-asc">路徑 A → Z</option>
              <option value="path-desc">路徑 Z → A</option>
              <option value="risk-desc">風險高 → 低</option>
            </select>
          </div>

          <div class="field">
            <label for="view">顯示方式</label>
            <select id="view" class="select">
              <option value="cards">卡片</option>
              <option value="compact">緊湊</option>
              <option value="table">表格</option>
            </select>
          </div>

          <div class="field">
            <label for="per-page">每頁顯示</label>
            <select id="per-page" class="select">
              <option value="12">12</option>
              <option value="24" selected>24</option>
              <option value="48">48</option>
              <option value="96">96</option>
            </select>
          </div>
        </div>

        <div class="media-toggle-row" aria-label="媒體顯示控制">
          <label class="check-pill">
            <input type="checkbox" id="show-images">
            <span>顯示圖檔</span>
          </label>
          <label class="check-pill">
            <input type="checkbox" id="show-audio">
            <span>顯示音訊</span>
          </label>
          <label class="check-pill">
            <input type="checkbox" id="show-video">
            <span>顯示影片</span>
          </label>
        </div>
      </section>

      <section class="result-head">
        <div id="result-meta" class="result-meta">載入中…</div>
      </section>

      <section id="results" aria-live="polite"></section>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <nav class="bottom-tabbar" aria-label="主要分頁">
    <a class="tab-link" href="./index.html">
      <span class="tab-icon">⌂</span>
      <span class="tab-label">首頁</span>
    </a>
    <a class="tab-link active" href="./all-links.html">
      <span class="tab-icon">≣</span>
      <span class="tab-label">清單</span>
    </a>
    <a class="tab-link" href="./saved.html">
      <span class="tab-icon">★</span>
      <span class="tab-label">收藏</span>
    </a>
    <a class="tab-link" href="./settings.html">
      <span class="tab-icon">⚙</span>
      <span class="tab-label">設定</span>
    </a>
  </nav>

  <script src="./assets/js/app.js"></script>
  <script src="./assets/js/all-links.js"></script>
</body>
</html>
