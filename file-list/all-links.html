<!doctype html>
<html lang="zh-Hant">
<head>
<title>所有連結清單 | file-list</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./assets/css/base.css">
<link rel="stylesheet" href="./assets/css/theme-mobsp-blog.css">
</head>
<body>

    <header class="topbar">
      <div class="wrap topbar-inner">
        <div class="brand">
          <div class="brand-badge">FL</div>
          <div>
            <div class="brand-title">Mobsp File List</div>
            <div class="brand-sub">由 xlsx 轉成可搜尋的站內索引網站</div>
          </div>
        </div>
        <nav class="nav">
          <a class="" href="./index.html">首頁</a>
          <a class="active" href="./all-links.html">所有連結清單</a>
          <a class="" href="./saved.html">收藏</a>
          <a class="" href="./settings.html">設定</a>
        </nav>
      </div>
    </header>
    

<main class="section">
  <div class="wrap">
    <div class="section-head">
      <div>
        <h1 style="margin:0">所有連結清單</h1>
        <p>已內建 123 筆。可排序、切換顯示方式、即時搜尋、篩選資料夾/類型/風險。</p>
      </div>
    </div>

    <section class="toolbar">
      <div class="toolbar-grid">
        <div class="field">
          <label for="search">即時搜尋</label>
          <input id="search" class="input" type="search" placeholder="搜尋名稱、路徑、說明、建議、風險">
        </div>
        <div class="field">
          <label for="folder">資料夾</label>
          <select id="folder" class="select"></select>
        </div>
        <div class="field">
          <label for="type">類型</label>
          <select id="type" class="select"></select>
        </div>
        <div class="field">
          <label for="risk">風險</label>
          <select id="risk" class="select">
            <option value="all">全部風險</option>
            <option value="高">高</option>
            <option value="中">中</option>
            <option value="低">低</option>
          </select>
        </div>
        <div class="field">
          <label for="sort">排序</label>
          <select id="sort" class="select">
            <option value="name-asc">名稱 A → Z</option>
            <option value="name-desc">名稱 Z → A</option>
            <option value="path-asc">路徑 A → Z</option>
            <option value="path-desc">路徑 Z → A</option>
            <option value="risk-desc">風險高 → 低</option>
          </select>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button class="btn" id="reset-filters">重設</button>
        </div>
        <div class="field">
          <label for="view">顯示方式</label>
          <select id="view" class="select">
            <option value="cards">卡片</option>
            <option value="compact">緊湊</option>
            <option value="table">表格</option>
          </select>
        </div>
        <div class="field">
          <label for="per-page">每頁顯示</label>
          <select id="per-page" class="select">
            <option value="12">12</option>
            <option value="24" selected>24</option>
            <option value="48">48</option>
            <option value="96">96</option>
          </select>
        </div>
      </div>
    </section>

    <div class="section-head" style="margin-top:16px">
      <p id="result-meta">載入中…</p>
    </div>

    <div id="results"></div>
    <div class="pagination" id="pagination"></div>
  </div>
</main>


    <footer class="footer">
      <div class="wrap">
        <div class="footer-card panel">
          <strong>file-list/</strong>
          <p>放在 repo 根目錄即可。網站會讀取 <span class="mono">./data/files.json</span> 顯示 123 筆清單資料。</p>
        </div>
      </div>
    </footer>
    
<script src="./assets/js/app.js"></script>
<script src="./assets/js/all-links.js"></script>
</body>
</html>
