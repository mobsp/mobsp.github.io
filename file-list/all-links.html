<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>全部連結</title>
  <meta name="theme-color" content="#f5f7fb" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/theme-mobsp-blog.css" />
</head>
<body data-page="all-links">
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar__left">
        <a class="icon-btn" href="./index.html" aria-label="返回">←</a>
        <div>
          <div class="eyebrow">Mobsp File List</div>
          <h1 class="topbar__title">全部連結</h1>
        </div>
      </div>
      <div class="topbar__right">
        <button class="icon-btn" id="toggle-filter-panel" aria-label="篩選">☰</button>
      </div>
    </header>

    <main class="page page-list">
      <section class="search-panel" id="search">
        <label class="searchbar">
          <span class="searchbar__icon">🔎</span>
          <input id="search-input" type="search" placeholder="搜尋名稱、路徑、說明..." />
        </label>

        <div class="toolbar-row">
          <select id="sort-select">
            <option value="name-asc">名稱 A-Z</option>
            <option value="name-desc">名稱 Z-A</option>
            <option value="path-asc">路徑 A-Z</option>
            <option value="path-desc">路徑 Z-A</option>
            <option value="risk-desc">風險高 → 低</option>
            <option value="risk-asc">風險低 → 高</option>
          </select>

          <select id="view-select">
            <option value="cards">卡片</option>
            <option value="compact">緊湊</option>
            <option value="table">表格</option>
          </select>

          <select id="page-size-select">
            <option value="12">12 / 頁</option>
            <option value="24" selected>24 / 頁</option>
            <option value="48">48 / 頁</option>
            <option value="96">96 / 頁</option>
          </select>
        </div>
      </section>

      <section class="filter-panel" id="filter-panel">
        <div class="filter-grid">
          <label>
            <span>資料夾</span>
            <select id="folder-filter">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            <span>類型</span>
            <select id="type-filter">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            <span>風險</span>
            <select id="risk-filter">
              <option value="">全部</option>
              <option value="高">高</option>
              <option value="中">中</option>
              <option value="低">低</option>
            </select>
          </label>
          <label class="inline-check">
            <input type="checkbox" id="public-filter" />
            <span>只看可公開頁面</span>
          </label>
        </div>
      </section>

      <section class="section-card section-card--flat">
        <div class="section-head">
          <h3 id="result-title">全部資料</h3>
          <span class="count-badge" id="result-count">0 筆</span>
        </div>
        <div id="result-area" class="result-area"></div>
        <div class="pagination" id="pagination"></div>
      </section>
    </main>

    <nav class="tabbar">
      <a class="tabbar__item" href="./index.html"><span>🏠</span><small>首頁</small></a>
      <a class="tabbar__item is-active" href="./all-links.html"><span>📚</span><small>清單</small></a>
      <a class="tabbar__item is-active" href="./all-links.html#search"><span>🔎</span><small>搜尋</small></a>
      <a class="tabbar__item" href="./saved.html"><span>⭐</span><small>收藏</small></a>
      <a class="tabbar__item" href="./settings.html"><span>⚙️</span><small>設定</small></a>
    </nav>
  </div>

  <script src="./assets/js/app.js"></script>
  <script src="./assets/js/all-links.js"></script>
</body>
</html>
