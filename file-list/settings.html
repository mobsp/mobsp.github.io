<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>設定</title>
  <meta name="theme-color" content="#f5f7fb" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/theme-mobsp-blog.css" />
</head>
<body data-page="settings">
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar__left">
        <div class="app-avatar">⚙</div>
        <div>
          <div class="eyebrow">Mobsp File List</div>
          <h1 class="topbar__title">設定</h1>
        </div>
      </div>
    </header>

    <main class="page">
      <section class="section-card">
        <div class="section-head">
          <h3>資料資訊</h3>
        </div>
        <div class="meta-list" id="dataset-meta"></div>
      </section>

      <section class="section-card">
        <div class="section-head">
          <h3>操作</h3>
        </div>
        <div class="settings-actions">
          <button class="btn btn-secondary" id="export-json">匯出 JSON</button>
          <button class="btn btn-secondary" id="clear-storage">清除收藏</button>
        </div>
      </section>

      <section class="section-card">
        <div class="section-head">
          <h3>說明</h3>
        </div>
        <div class="article-like">
          <p>這個站以 App 操作模式整理整個 repo 的連結資料。</p>
          <p>資料來源為 <code>file-list/data/files.json</code>，前端頁面會直接讀取這份資料。</p>
          <p>若你之後有自動同步流程，更新 repo 後可重建該 JSON，網站內容就會跟著更新。</p>
        </div>
      </section>
    </main>

      <a class="tabbar__item is-active" href="./settings.html"><span>⚙️</span><small>設定</small></a>
    </nav>
  </div>

  <script src="./assets/js/app.js"></script>
  <script src="./assets/js/settings.js"></script>
