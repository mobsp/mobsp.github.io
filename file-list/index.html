<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>Mobsp File List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b11">
  <meta name="description" content="Mobsp 檔案清單入口，支援搜尋、收藏、媒體控制、原始碼檢視與本地編輯。">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/theme-mobsp-blog.css">
</head>
<body data-page="home">
  <header class="app-header">
    <div class="wrap app-header-inner">
      <div class="brand-block">
        <div class="brand-mark">FL</div>
        <div class="brand-copy">
          <div class="brand-title">Mobsp File List</div>
          <div class="brand-sub">深色 App 式檔案入口</div>
        </div>
      </div>

      <div class="header-actions">
        <a class="icon-btn" href="./saved.html" aria-label="收藏">🔖</a>
        <a class="icon-btn" href="./all-links.html" aria-label="搜尋">🔎</a>
        <a class="icon-btn" href="./settings.html" aria-label="設定">⚙️</a>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div class="wrap app-shell">
      <section class="panel hero-mobile">
        <div class="hero-copy">
          <h1>網站檔案索引</h1>
          <p>手機優先、LINE app 模式結構、Mobsp 深色主題、可搜尋與可預覽的檔案入口。</p>
        </div>

        <a class="search-hero" href="./all-links.html" aria-label="進入搜尋">
          <span class="search-hero-icon">🔎</span>
          <span class="search-hero-text">搜尋名稱、路徑、說明、建議、風險</span>
        </a>

        <div class="hero-actions">
          <a class="btn primary block" href="./all-links.html">進入所有連結</a>
          <button class="btn block hide" id="install-btn" type="button">安裝網站</button>
        </div>
      </section>

      <section class="stats-row" aria-label="統計資訊">
        <article class="stat-card panel">
          <div class="stat-number" id="total-count">0</div>
          <div class="stat-label">總項目</div>
        </article>
        <article class="stat-card panel">
          <div class="stat-number" id="public-count">0</div>
          <div class="stat-label">公開頁</div>
        </article>
        <article class="stat-card panel">
          <div class="stat-number" id="folder-count">0</div>
          <div class="stat-label">資料夾</div>
        </article>
        <article class="stat-card panel">
          <div class="stat-number" id="high-risk-count">0</div>
          <div class="stat-label">高風險</div>
        </article>
      </section>

      <section class="panel section-card">
        <div class="section-title-row">
          <div>
            <h2>快速分類</h2>
            <p>直接依資料夾跳進清單頁。</p>
          </div>
          <a class="text-link" href="./all-links.html">顯示全部</a>
        </div>
        <div class="chip-row" id="folder-chips"></div>
      </section>

      <section class="panel section-card">
        <div class="section-title-row">
          <div>
            <h2>常用入口</h2>
            <p>優先顯示公開頁面與常見入口。</p>
          </div>
          <a class="text-link" href="./all-links.html">顯示全部</a>
        </div>
        <div class="app-quick-grid" id="public-shortcuts"></div>
      </section>

      <section class="panel section-card">
        <div class="section-title-row">
          <div>
            <h2>推薦卡片</h2>
            <p>可直接開啟、收藏、查看詳情。</p>
          </div>
          <a class="text-link" href="./all-links.html">顯示全部</a>
        </div>
        <div class="grid cards" id="featured-grid"></div>
      </section>
    </div>
  </main>

  <nav class="bottom-tabbar" aria-label="主要分頁">
    <a class="tab-link active" href="./index.html">
      <span class="tab-icon">⌂</span>
      <span class="tab-label">首頁</span>
    </a>
    <a class="tab-link" href="./all-links.html">
      <span class="tab-icon">≣</span>
      <span class="tab-label">清單</span>
    </a>
    <a class="tab-link" href="./saved.html">
      <span class="tab-icon">★</span>
      <span class="tab-label">收藏</span>
    </a>
    <a class="tab-link" href="./settings.html">
      <span class="tab-icon">⚙</span>
      <span class="tab-label">設定</span>
    </a>
  </nav>

  <script src="./assets/js/app.js"></script>
  <script src="./assets/js/index.js"></script>
</body>
</html>
