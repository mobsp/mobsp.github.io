<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>File List</title>
  <meta name="theme-color" content="#f5f7fb" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/theme-mobsp-blog.css" />
</head>
<body data-page="home">
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar__left">
        <div class="app-avatar">F</div>
        <div>
          <div class="eyebrow">Mobsp File List</div>
          <h1 class="topbar__title">首頁</h1>
        </div>
      </div>
      <div class="topbar__right">
        <a class="icon-btn" href="./settings.html" aria-label="設定">⚙</a>
      </div>
    </header>

    <main class="page page-home">
      <section class="hero-card">
        <div class="hero-card__content">
          <p class="eyebrow">資料驅動 · 手機優先</p>
          <h2>像 App 一樣操作整個連結索引</h2>
          <p class="muted">快速搜尋、篩選、收藏、查看詳情，全部以行動裝置操作習慣為核心。</p>
        </div>
        <div class="hero-card__actions">
          <a class="btn btn-primary" href="./all-links.html">打開全部連結</a>
          <a class="btn btn-secondary" href="./saved.html">查看收藏</a>
        </div>
      </section>

      <section class="stats-grid" id="home-stats"></section>

      <section class="section-card">
        <div class="section-head">
          <h3>快速入口</h3>
          <a href="./all-links.html" class="text-link">全部查看</a>
        </div>
        <div class="quick-grid">
          <a class="quick-tile" href="./all-links.html?public=1">
            <span class="quick-tile__icon">🌐</span>
            <span class="quick-tile__title">公開頁面</span>
            <span class="quick-tile__desc">優先看可直接開啟的頁面</span>
          </a>
          <a class="quick-tile" href="./all-links.html?risk=%E9%AB%98">
            <span class="quick-tile__icon">⚠️</span>
            <span class="quick-tile__title">高風險項目</span>
            <span class="quick-tile__desc">快速檢查注意事項</span>
          </a>
          <a class="quick-tile" href="./all-links.html?type=html-index">
            <span class="quick-tile__icon">📄</span>
            <span class="quick-tile__title">Index 頁面</span>
            <span class="quick-tile__desc">集中看入口型頁面</span>
          </a>
          <a class="quick-tile" href="./settings.html">
            <span class="quick-tile__icon">🧭</span>
            <span class="quick-tile__title">資料資訊</span>
            <span class="quick-tile__desc">查看來源與使用說明</span>
          </a>
        </div>
      </section>

      <section class="section-card">
        <div class="section-head">
          <h3>常用資料夾</h3>
        </div>
        <div class="chip-list" id="folder-chips"></div>
      </section>

      <section class="section-card">
        <div class="section-head">
          <h3>推薦項目</h3>
          <a href="./all-links.html" class="text-link">更多</a>
        </div>
        <div class="card-list" id="featured-list"></div>
      </section>
    </main>

    <nav class="tabbar">
      <a class="tabbar__item is-active" href="./index.html"><span>🏠</span><small>首頁</small></a>
      <a class="tabbar__item" href="./all-links.html"><span>📚</span><small>清單</small></a>
      <a class="tabbar__item" href="./all-links.html#search"><span>🔎</span><small>搜尋</small></a>
      <a class="tabbar__item" href="./saved.html"><span>⭐</span><small>收藏</small></a>
      <a class="tabbar__item" href="./settings.html"><span>⚙️</span><small>設定</small></a>
    </nav>
  </div>

  <script src="./assets/js/app.js"></script>
  <script src="./assets/js/index.js"></script>
</body>
</html>
