<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">


<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">


<title>
莫比空間｜導覽 Ⓒ 2026•Ⲙ𝔬ⲃⳝ𝔭
</title>



<meta name="description"
content="莫比空間｜導覽，MOBSP Website Navigation">



<meta name="theme-color"
content="#f2f2f7">



<style>

/*
================================================

莫比空間｜導覽

Mobsp-System Single File UI

CSS Layer

================================================
*/



:root {


    --bg:#f2f2f7;


    --card:#ffffff;


    --text:#111111;


    --sub:#666666;


    --blue:#007aff;


    --border:#dddddd;


    --glass:
    rgba(255,255,255,.65);



    --radius-xl:24px;


    --radius-lg:18px;


    --radius-md:14px;


}





* {


    box-sizing:border-box;


    -webkit-tap-highlight-color:transparent;


}





html,
body {


    width:100%;


    height:100%;


    margin:0;


    padding:0;


}





body {


    font-family:


    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;



    background:var(--bg);


    color:var(--text);



    overflow:hidden;


}





/*
================================================

Dark Theme

================================================
*/


body.dark {


    --bg:#000000;


    --card:#1c1c1e;


    --text:#ffffff;


    --sub:#aaaaaa;


    --border:#333333;


    --glass:
    rgba(28,28,30,.75);


}





/*
================================================

Application Container

================================================
*/


#app {


    width:100%;


    max-width:520px;


    height:100vh;


    margin:auto;



    display:flex;


    flex-direction:column;


}





/*
================================================

Navigation Bar

================================================
*/


.navbar {


    height:78px;



    padding:

    24px 20px 10px;



    display:flex;


    align-items:center;


    justify-content:space-between;



    backdrop-filter:blur(20px);


    -webkit-backdrop-filter:blur(20px);


}





.nav-left {


    display:flex;


    flex-direction:column;


}





.nav-title {


    font-size:30px;


    font-weight:700;


    letter-spacing:-0.5px;


}





.nav-subtitle {


    margin-top:3px;


    font-size:13px;


    color:var(--sub);


}





.icon-btn {


    width:42px;


    height:42px;



    border:none;


    border-radius:50%;



    background:var(--card);


    color:var(--text);



    font-size:20px;



    cursor:pointer;


}





/*
================================================

Content

================================================
*/


.content {


    flex:1;


    overflow-y:auto;


    padding:20px;


}





.section-title {


    font-size:24px;


    font-weight:700;


    margin-bottom:18px;


}





/*
================================================

iOS Grouped List Card

================================================
*/


.card {


    background:var(--card);



    border-radius:var(--radius-xl);



    padding:18px;



    margin-bottom:14px;



    border:

    1px solid var(--border);



    transition:

    transform .15s ease;


}





.card:active {


    transform:scale(.98);


}





.card-title {


    font-size:18px;


    font-weight:600;


}





.card-desc {


    margin-top:8px;



    font-size:14px;


    color:var(--sub);


    line-height:1.5;


}





.card-arrow {


    float:right;


    font-size:22px;


    color:var(--sub);


}





.action {


    margin-top:15px;



    padding:

    11px 18px;



    border:none;


    border-radius:14px;



    background:var(--blue);


    color:#ffffff;



    font-size:15px;


    cursor:pointer;


}





/*
================================================

Search

================================================
*/


.search {


    width:100%;



    padding:

    14px 18px;



    border:none;


    outline:none;



    border-radius:16px;



    background:var(--card);


    color:var(--text);



    font-size:16px;



    margin-bottom:20px;


}





/*
================================================

Bottom Tab Bar

================================================
*/


.tabbar {


    height:72px;



    display:flex;


    align-items:center;


    justify-content:space-around;



    background:var(--glass);



    border-top:

    1px solid var(--border);



    backdrop-filter:blur(20px);


    -webkit-backdrop-filter:blur(20px);


}





.tab {


    flex:1;


    text-align:center;



    color:var(--sub);



    font-size:13px;


}





.tab span {


    display:block;


    font-size:24px;



    margin-bottom:3px;


}





.tab.active {


    color:var(--blue);


    font-weight:700;


}





/*
================================================

Modal

================================================
*/


.modal {


    position:fixed;


    inset:0;



    background:

    rgba(0,0,0,.45);



    display:none;



    align-items:center;


    justify-content:center;


}





.modal.show {


    display:flex;


}





.modal-box {


    width:85%;



    background:var(--card);



    border-radius:28px;



    padding:25px;


}





.modal-box h2 {


    margin-top:0;


}





.modal-box p {


    color:var(--sub);


    line-height:1.6;


}





/*
================================================

Footer

================================================
*/


.site-footer {


    text-align:center;



    font-size:12px;



    color:var(--sub);



    padding:

    10px 0 20px;


}



</style>
<body>


<div id="app">



<!-- =========================
     Navigation Bar
========================= -->


<header class="navbar">


<div class="nav-left">


<div class="nav-title" id="title">

莫比空間

</div>



<div class="nav-subtitle">

導覽 Ⓒ 2026•Ⲙ𝔬ⲃⳝ𝔭

</div>


</div>




<button class="icon-btn"
onclick="toggleTheme()"
aria-label="切換主題">


🌙


</button>



</header>






<!-- =========================
     Main Content View
========================= -->


<main class="content" id="view">


</main>








<!-- =========================
     Bottom Tab Navigation
========================= -->


<nav class="tabbar">





<div class="tab active"
onclick="navigate('home')">


<span>

🏠

</span>


首頁


</div>







<div class="tab"
onclick="navigate('system')">


<span>

🧩

</span>


系統


</div>







<div class="tab"
onclick="navigate('settings')">


<span>

⚙️

</span>


設定


</div>







</nav>




</div>








<!-- =========================
     Modal Layer
========================= -->


<div class="modal" id="modal">



<div class="modal-box">





<h2 id="modalTitle">

</h2>





<p id="modalText">

</p>






<button class="action"
onclick="closeModal()">


關閉


</button>






</div>



</div>
</body>
</html>
