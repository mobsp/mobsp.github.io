<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS V7.0 Ultimate Web Simulator</title>
    
    <!-- PWA & Standalone Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="iOS WebOS">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" id="manifestPlaceholder">

    <style>
        :root {
            --ios-bg: #f2f2f7;
            --ios-card: #ffffff;
            --ios-pressed: #e5e5ea;
            --ios-text: #000000;
            --ios-sub: #8e8e93;
            --ios-border: rgba(60,60,67,.18);
            --ios-search: rgba(118,118,128,.12);
            --ios-green: #34c759;
            --ios-blue: #007aff;
            --ios-red: #ff3b30;
            --ios-orange: #ff9500;
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --ios-spring: cubic-bezier(0.22, 1, 0.36, 1);
        }

        [data-theme="dark"] {
            --ios-bg: #000000;
            --ios-card: #1c1c1e;
            --ios-pressed: #2c2c2e;
            --ios-text: #ffffff;
            --ios-sub: #8e8e93;
            --ios-border: #38383a;
            --ios-search: rgba(118,118,128,.24);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
        }

        html, body {
            width: 100%; height: 100%; height: 100dvh;
            background: #000000; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            overflow: hidden; -webkit-font-smoothing: antialiased;
        }

        .app-viewport {
            position: relative; width: 100%; height: 100%;
            background: var(--ios-bg); overflow: hidden;
        }

        /* ---------------- 1. Dynamic Island ---------------- */
        .island-container {
            position: absolute; top: calc(8px + var(--sat)); left: 50%;
            transform: translateX(-50%); z-index: 2000; pointer-events: auto;
        }

        .dynamic-island {
            width: 120px; height: 36px; background: #000000; border-radius: 20px;
            color: #fff; display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px; transition: all 0.4s var(--ios-spring);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4); overflow: hidden; cursor: pointer;
        }

        .dynamic-island.expanded {
            width: 330px; height: 90px; border-radius: 38px; padding: 16px;
        }

        /* ---------------- 2. Navigation & Views ---------------- */
        .view-container { position: absolute; inset: 0; }

        .view {
            position: absolute; inset: 0; background: var(--ios-bg); color: var(--ios-text);
            overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding-bottom: calc(80px + var(--sab)); transition: transform 0.42s var(--ios-spring), opacity 0.35s ease;
            will-change: transform; z-index: 1; display: none;
        }

        .view.mounted { display: block; }
        .view.sub-page { transform: translateX(100%); z-index: 10; box-shadow: -12px 0 40px rgba(0,0,0,0.25); }
        .view.sub-page.active { transform: translateX(0); }
        .view.parent-pushed { transform: translateX(-20%); opacity: 0.88; }

        .nav {
            position: sticky; top: 0; height: calc(44px + var(--sat)); padding-top: var(--sat);
            display: flex; justify-content: space-between; align-items: center; padding-left: 8px; padding-right: 8px;
            z-index: 99; background: rgba(249, 249, 249, 0.78); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid transparent;
        }
        [data-theme="dark"] .nav { background: rgba(28, 28, 30, 0.78); }

        .nav-back { display: flex; align-items: center; color: var(--ios-blue); font-size: 17px; cursor: pointer; }
        .nav-back-arrow { width: 10px; height: 10px; border-left: 2.5px solid var(--ios-blue); border-bottom: 2.5px solid var(--ios-blue); transform: rotate(45deg); margin-right: 4px; }
        .nav-title { font-size: 17px; font-weight: 600; color: var(--ios-text); text-align: center; flex: 1; }

        .content { padding-top: 8px; }
        .large-title { padding: 4px 16px 10px; font-size: 34px; font-weight: 700; }

        /* ---------------- 3. Group & Cell ---------------- */
        .group { margin: 0 16px 20px; }
        .group-title { font-size: 13px; color: var(--ios-sub); padding: 0 0 6px 16px; text-transform: uppercase; }
        .list { list-style: none; background: var(--ios-card); border-radius: 12px; overflow: hidden; }

        .cell {
            position: relative; display: flex; align-items: center; min-height: 48px; padding: 8px 16px;
            color: inherit; cursor: pointer;
        }
        .cell:active { background: var(--ios-pressed); }
        li:not(:last-child) .cell::after {
            content: ""; position: absolute; inset-inline-start: 56px; inset-inline-end: 0; bottom: 0;
            height: .5px; background: var(--ios-border);
        }

        .icon { width: 29px; height: 29px; border-radius: 7px; margin-right: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .icon-symbol { width: 18px; height: 18px; background-color: #fff; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; }
        .label { flex: 1; font-size: 17px; }
        .value { color: var(--ios-sub); font-size: 17px; margin-right: 6px; }
        .chevron { width: 8px; height: 8px; border-top: 1.5px solid #c7c7cc; border-right: 1.5px solid #c7c7cc; transform: rotate(45deg); flex-shrink: 0; }

        .switch {
            appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 16px;
            background: #e4e4e7; position: relative; transition: background 0.25s; cursor: pointer;
        }
        .switch::before {
            content: ""; position: absolute; width: 27px; height: 27px; left: 2px; top: 2px; border-radius: 50%;
            background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15); transition: transform 0.35s var(--ios-spring);
        }
        .switch:checked { background: var(--ios-green); }
        .switch:checked::before { transform: translateX(20px); }
        [data-theme="dark"] .switch { background: #39393d; }

        /* ---------------- 4. App Switcher & Lock Screen ---------------- */
        .app-switcher {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 1800; display: flex; align-items: center; padding: 20px; gap: 20px; overflow-x: auto;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .app-switcher.active { opacity: 1; pointer-events: auto; }
        .switcher-card {
            min-width: 260px; height: 480px; background: var(--ios-bg); border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); padding: 16px; display: flex; flex-direction: column;
            transition: transform 0.3s; cursor: pointer;
        }

        .lock-screen {
            position: fixed; inset: 0; background: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%);
            z-index: 3000; color: #fff; display: flex; flex-direction: column; align-items: center;
            padding-top: calc(40px + var(--sat)); transition: transform 0.5s var(--ios-spring);
        }
        .lock-screen.unlocked { transform: translateY(-100%); }
        .ls-widgets { display: flex; gap: 12px; margin-top: 15px; }
        .ls-widget-card { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-radius: 16px; padding: 10px 16px; font-size: 13px; text-align: center; }

        /* Spotlight Search Overlay */
        .spotlight-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 1700; padding: calc(60px + var(--sat)) 20px 20px; display: none; flex-direction: column; gap: 16px;
        }
        .spotlight-overlay.active { display: flex; }
        .spotlight-input { width: 100%; height: 44px; border-radius: 12px; border: none; background: rgba(255,255,255,0.2); color: #fff; padding: 0 16px; font-size: 18px; outline: none; }

        /* Developer Console */
        .dev-console {
            position: fixed; bottom: calc(10px + var(--sab)); left: 10px; background: rgba(0,0,0,0.85);
            color: #00ff00; font-family: monospace; font-size: 11px; padding: 8px 12px; border-radius: 8px;
            z-index: 4000; pointer-events: none; display: none;
        }
    </style>
</head>
<body>

<div class="app-viewport" id="appViewport">

    <!-- 1. 動態島 Dynamic Island -->
    <div class="island-container">
        <div class="dynamic-island" id="dynamicIsland" data-action="toggle-island">
            <div style="display:flex; align-items:center; gap:8px; width:100%; justify-content:space-between;">
                <span id="diIcon" style="font-size:14px;">⚡</span>
                <span id="diText" style="font-size:12px; font-weight:600;">72% 電量</span>
            </div>
        </div>
    </div>

    <!-- 2. View 容器 (SPA 快取池) -->
    <div class="view-container" id="viewContainer"></div>

    <!-- 3. Spotlight 全域模糊搜尋 -->
    <div class="spotlight-overlay" id="spotlight">
        <input type="text" class="spotlight-input" placeholder="搜尋 App、設定與聯絡人..." id="spotlightInput">
        <div id="spotlightResults" style="color:#fff; font-size:15px; display:flex; flex-direction:column; gap:10px;"></div>
    </div>

    <!-- 4. App Switcher 多工介面 -->
    <div class="app-switcher" id="appSwitcher">
        <div class="switcher-card" data-action="switch-app" data-target="mainView">
            <h3 style="margin-bottom:10px;">設定</h3>
            <div style="flex:1; background:var(--ios-card); border-radius:12px;"></div>
        </div>
        <div class="switcher-card" data-action="switch-app" data-target="cameraView">
            <h3 style="margin-bottom:10px;">相機</h3>
            <div style="flex:1; background:#000; border-radius:12px; display:flex; align-items:center; justify-content:center; color:#fff;">📷 Preview</div>
        </div>
    </div>

    <!-- 5. 鎖定畫面 Lock Screen -->
    <div class="lock-screen" id="lockScreen" data-action="unlock">
        <div style="font-size:20px;">🔒</div>
        <div style="font-size:20px; opacity:0.9; margin-top:10px;" id="lsDate">7月27日 星期一</div>
        <div style="font-size:76px; font-weight:700;" id="lsTime">16:08</div>
        
        <div class="ls-widgets">
            <div class="ls-widget-card">🌤️ 高雄 28°C</div>
            <div class="ls-widget-card">🔋 電池 72%</div>
        </div>
        <div style="margin-top:auto; padding-bottom:calc(30px + var(--sab)); font-size:13px; opacity:0.7;">點擊或向上滑動解鎖</div>
    </div>

    <!-- 6. 開發者 HUD -->
    <div class="dev-console" id="devConsole">
        FPS: <span id="fpsVal">60</span> | Memory: <span id="memVal">14.2</span>MB
    </div>

</div>

<script>
    /* ===================================================
       1. SVG Safe Encoder
    =================================================== */
    function svgMask(svgContent) {
        const fullSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">${svgContent}</svg>`;
        return `url("data:image/svg+xml;charset=UTF-8,${encodeURIComponent(fullSvg)}")`;
    }

    /* ===================================================
       2. 統一 Store (單一 JSON 樹儲存架構)
    =================================================== */
    const DEFAULT_STORE = {
        version: "7.0",
        user: { name: "Alex Chen", email: "alex.chen@apple.com" },
        system: { theme: "auto", developerMode: true, battery: 72, lowPower: false },
        network: { flight: false, wifi: true, bluetooth: true }
    };

    const Store = {
        data: JSON.parse(localStorage.getItem('ios_v7_store')) || DEFAULT_STORE,
        save() {
            localStorage.setItem('ios_v7_store', JSON.stringify(this.data));
        },
        get(path) {
            return path.split('.').reduce((acc, part) => acc && acc[part], this.data);
        },
        set(path, value) {
            const parts = path.split('.');
            let curr = this.data;
            for (let i = 0; i < parts.length - 1; i++) {
                curr = curr[parts[i]];
            }
            curr[parts[parts.length - 1]] = value;
            this.save();
            this.notify(path, value);
        },
        listeners: [],
        subscribe(fn) { this.listeners.push(fn); },
        notify(path, value) { this.listeners.forEach(fn => fn(path, value)); }
    };

    /* ===================================================
       3. Haptic Feedback 震動反饋模組
    =================================================== */
    function haptic(type = 'light') {
        if (!navigator.vibrate) return;
        if (type === 'light') navigator.vibrate(10);
        if (type === 'medium') navigator.vibrate(20);
        if (type === 'heavy') navigator.vibrate([30, 20, 30]);
    }

    /* ===================================================
       4. View Templates 快取資料庫
    =================================================== */
    const SETTINGS_GROUPS = [
        {
            title: "網路連線",
            items: [
                { id: "flight", label: "飛航模式", iconBg: "#ff9500", type: "switch", key: "network.flight", icon: '<path d="M22 16v-2l-8.5-5V3.5C13.5 2.67 12.83 2 12 2s-1.5.67-1.5 1.5V9L2 14v2l8.5-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13.5 19v-5.5L22 16z"/>' },
                { id: "wifi", label: "Wi-Fi", iconBg: "#007aff", type: "link", target: "wifiView", value: "Home_5G", icon: '<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 6c2.92 0 5.57 1.05 7.65 2.79L12 20.08l-7.65-7.29C6.43 11.05 9.08 10 12 10z"/>' }
            ]
        },
        {
            title: "系統與硬體",
            items: [
                { id: "display", label: "顯示與亮度", iconBg: "#007aff", type: "link", target: "displayView", icon: '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1z"/>' },
                { id: "battery", label: "電池健康度", iconBg: "#34c759", type: "link", target: "batteryView", value: "98%", icon: '<path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/>' },
                { id: "camera", label: "相機 (WebRTC)", iconBg: "#8e8e93", type: "link", target: "cameraView", icon: '<path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>' }
            ]
        }
    ];

    const ViewTemplates = {
        mainView: () => `
            <div class="nav"><div style="width:70px;"></div><div class="nav-title">設定</div><div style="width:70px;"></div></div>
            <div class="content">
                <div class="large-title">設定</div>
                <div class="group">
                    <ul class="list">
                        <li>
                            <div class="cell" data-action="navigate" data-target="appleIdView">
                                <div class="icon" style="background:#8e8e93;"><div class="icon-symbol" style="-webkit-mask-image:${svgMask('<path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>')}"></div></div>
                                <div class="label" style="font-weight:600;">${Store.get('user.name')}</div>
                                <div class="chevron"></div>
                            </div>
                        </li>
                    </ul>
                </div>
                ${SETTINGS_GROUPS.map(g => `
                    <div class="group">
                        <div class="group-title">${g.title}</div>
                        <ul class="list">
                            ${g.items.map(i => `
                                <li>
                                    <div class="cell" ${i.target ? `data-action="navigate" data-target="${i.target}"` : ''}>
                                        <div class="icon" style="background:${i.iconBg};"><div class="icon-symbol" style="-webkit-mask-image:${svgMask(i.icon)}; mask-image:${svgMask(i.icon)};"></div></div>
                                        <div class="label">${i.label}</div>
                                        ${i.type === 'switch' ? `<input class="switch" type="checkbox" data-action="toggle" data-key="${i.key}" ${Store.get(i.key) ? 'checked' : ''}>` : ''}
                                        ${i.value ? `<div class="value">${i.value}</div>` : ''}
                                        ${i.type === 'link' ? `<div class="chevron"></div>` : ''}
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `).join('')}
            </div>
        `,
        cameraView: () => `
            <div class="nav"><div class="nav-back" data-action="pop"><div class="nav-back-arrow"></div><span>設定</span></div><div class="nav-title">相機取景</div><div style="width:70px;"></div></div>
            <div class="content" style="text-align:center;">
                <video id="cameraVideo" autoplay playsinline style="width:90%; height:320px; background:#000; border-radius:20px; object-fit:cover; margin-top:10px;"></video>
                <button data-action="start-camera" style="margin-top:16px; padding:10px 20px; border-radius:10px; border:none; background:var(--ios-blue); color:#fff; font-size:16px;">開啟相機</button>
            </div>
        `,
        displayView: () => `
            <div class="nav"><div class="nav-back" data-action="pop"><div class="nav-back-arrow"></div><span>設定</span></div><div class="nav-title">顯示與亮度</div><div style="width:70px;"></div></div>
            <div class="content">
                <div class="group"><div class="group-title">外觀模式</div><ul class="list">
                    <li><div class="cell"><div class="label">深色模式</div><input class="switch" type="checkbox" data-action="toggle-dark" ${Store.get('system.theme') === 'dark' ? 'checked' : ''}></div></li>
                </ul></div>
            </div>
        `,
        batteryView: () => `
            <div class="nav"><div class="nav-back" data-action="pop"><div class="nav-back-arrow"></div><span>設定</span></div><div class="nav-title">電池健康度</div><div style="width:70px;"></div></div>
            <div class="content">
                <div class="group"><ul class="list">
                    <li><div class="cell"><div class="label">最大容量</div><div class="value">98%</div></div></li>
                    <li><div class="cell"><div class="label">低耗電模式</div><input class="switch" type="checkbox" data-action="toggle" data-key="system.lowPower" ${Store.get('system.lowPower') ? 'checked' : ''}></div></li>
                </ul></div>
            </div>
        `,
        appleIdView: () => `
            <div class="nav"><div class="nav-back" data-action="pop"><div class="nav-back-arrow"></div><span>設定</span></div><div class="nav-title">Apple 帳號</div><div style="width:70px;"></div></div>
            <div class="content">
                <div class="group"><ul class="list">
                    <li><div class="cell"><div class="label">姓名</div><input type="text" value="${Store.get('user.name')}" data-action="input-name" style="border:none; background:transparent; text-align:right; font-size:17px; color:var(--ios-text);"></div></li>
                </ul></div>
            </div>
        `
    };

    /* ===================================================
       5. ViewManager (快取池 + 智慧生命週期)
    =================================================== */
    const viewContainer = document.getElementById('viewContainer');
    const viewCache = new Map();
    const historyStack = ['mainView'];

    const Router = {
        getView(viewId) {
            if (!viewCache.has(viewId)) {
                const el = document.createElement('div');
                el.className = `view ${historyStack.length > 1 ? 'sub-page' : ''}`;
                el.id = viewId;
                el.innerHTML = ViewTemplates[viewId] ? ViewTemplates[viewId]() : '';
                viewContainer.appendChild(el);
                viewCache.set(viewId, el);
            }
            return viewCache.get(viewId);
        },
        push(viewId) {
            haptic('light');
            const currentEl = this.getView(historyStack.at(-1));
            const nextEl = this.getView(viewId);

            nextEl.classList.add('mounted');
            requestAnimationFrame(() => {
                currentEl.classList.add('parent-pushed');
                nextEl.classList.add('active');
            });
            historyStack.push(viewId);
        },
        pop() {
            if (historyStack.length <= 1) return;
            haptic('light');
            const topId = historyStack.pop();
            const topEl = this.getView(topId);
            const parentEl = this.getView(historyStack.at(-1));

            topEl.classList.remove('active');
            parentEl.classList.remove('parent-pushed');

            setTimeout(() => {
                topEl.classList.remove('mounted');
            }, 400);
        }
    };

    /* ===================================================
       6. 統一事件委派引擎 (Data-Action Handler)
    =================================================== */
    document.addEventListener('click', e => {
        const target = e.target.closest('[data-action]');
        if (!target) return;

        const action = target.dataset.action;
        if (action === 'navigate') Router.push(target.dataset.target);
        if (action === 'pop') Router.pop();
        if (action === 'unlock') {
            document.getElementById('lockScreen').classList.add('unlocked');
            haptic('medium');
        }
        if (action === 'toggle-island') {
            document.getElementById('dynamicIsland').classList.toggle('expanded');
            haptic('light');
        }
        if (action === 'start-camera') initCamera();
        if (action === 'switch-app') {
            document.getElementById('appSwitcher').classList.remove('active');
            Router.push(target.dataset.target);
        }
    });

    document.addEventListener('change', e => {
        const target = e.target.closest('[data-action]');
        if (!target) return;

        if (target.dataset.action === 'toggle') {
            Store.set(target.dataset.key, target.checked);
            haptic('light');
        }
        if (target.dataset.action === 'toggle-dark') {
            Store.set('system.theme', target.checked ? 'dark' : 'light');
            syncTheme();
            haptic('medium');
        }
    });

    document.addEventListener('input', e => {
        if (e.target.dataset.action === 'input-name') {
            Store.set('user.name', e.target.value);
        }
    });

    /* ===================================================
       7. Siri / Camera / Developer Console 模組
    =================================================== */
    function syncTheme() {
        const theme = Store.get('system.theme');
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else document.documentElement.removeAttribute('data-theme');
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            const video = document.getElementById('cameraVideo');
            if (video) video.srcObject = stream;
        } catch (err) {
            alert('無法獲取相機權限: ' + err.message);
        }
    }

    // Developer FPS Counter
    let lastTime = performance.now(), frames = 0;
    function loopFPS() {
        const now = performance.now();
        frames++;
        if (now > lastTime + 1000) {
            document.getElementById('fpsVal').textContent = Math.round((frames * 1000) / (now - lastTime));
            lastTime = now; frames = 0;
        }
        requestAnimationFrame(loopFPS);
    }
    if (Store.get('system.developerMode')) {
        document.getElementById('devConsole').style.display = 'block';
        loopFPS();
    }

    // 手勢：滑動與多工
    let touchStartY = 0;
    document.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
    document.addEventListener('touchend', e => {
        const deltaY = e.changedTouches[0].clientY - touchStartY;
        // 底部向上滑動觸發多工 App Switcher
        if (touchStartY > window.innerHeight - 40 && deltaY < -80) {
            document.getElementById('appSwitcher').classList.add('active');
            haptic('heavy');
        }
        // 頂部向下滑動觸發 Spotlight
        if (touchStartY < 100 && deltaY > 120) {
            document.getElementById('spotlight').classList.add('active');
            haptic('light');
        }
    });

    document.getElementById('spotlight').addEventListener('click', e => {
        if (e.target.id === 'spotlight') document.getElementById('spotlight').classList.remove('active');
    });

    // 初始進入點
    Router.getView('mainView').classList.add('mounted');
    syncTheme();
</script>
</body>
</html>
