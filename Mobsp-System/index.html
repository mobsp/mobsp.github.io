<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">


<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">


<title>
莫比空間｜導覽 Ⓒ 2026•Ⲙ𝔬ⲃⳝ𝔭
</title>



<meta name="description"
content="莫比空間｜導覽，MOBSP Website Navigation">



<meta name="theme-color"
content="#f2f2f7">



<style>

/*
================================================

莫比空間｜導覽

Mobsp-System Single File UI

CSS Layer

================================================
*/



:root {


    --bg:#f2f2f7;


    --card:#ffffff;


    --text:#111111;


    --sub:#666666;


    --blue:#007aff;


    --border:#dddddd;


    --glass:
    rgba(255,255,255,.65);



    --radius-xl:24px;


    --radius-lg:18px;


    --radius-md:14px;


}





* {


    box-sizing:border-box;


    -webkit-tap-highlight-color:transparent;


}





html,
body {


    width:100%;


    height:100%;


    margin:0;


    padding:0;


}





body {


    font-family:


    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;



    background:var(--bg);


    color:var(--text);



    overflow:hidden;


}





/*
================================================

Dark Theme

================================================
*/


body.dark {


    --bg:#000000;


    --card:#1c1c1e;


    --text:#ffffff;


    --sub:#aaaaaa;


    --border:#333333;


    --glass:
    rgba(28,28,30,.75);


}





/*
================================================

Application Container

================================================
*/


#app {


    width:100%;


    max-width:520px;


    height:100vh;


    margin:auto;



    display:flex;


    flex-direction:column;


}





/*
================================================

Navigation Bar

================================================
*/


.navbar {


    height:78px;



    padding:

    24px 20px 10px;



    display:flex;


    align-items:center;


    justify-content:space-between;



    backdrop-filter:blur(20px);


    -webkit-backdrop-filter:blur(20px);


}





.nav-left {


    display:flex;


    flex-direction:column;


}





.nav-title {


    font-size:30px;


    font-weight:700;


    letter-spacing:-0.5px;


}





.nav-subtitle {


    margin-top:3px;


    font-size:13px;


    color:var(--sub);


}





.icon-btn {


    width:42px;


    height:42px;



    border:none;


    border-radius:50%;



    background:var(--card);


    color:var(--text);



    font-size:20px;



    cursor:pointer;


}





/*
================================================

Content

================================================
*/


.content {


    flex:1;


    overflow-y:auto;


    padding:20px;


}





.section-title {


    font-size:24px;


    font-weight:700;


    margin-bottom:18px;


}





/*
================================================

iOS Grouped List Card

================================================
*/


.card {


    background:var(--card);



    border-radius:var(--radius-xl);



    padding:18px;



    margin-bottom:14px;



    border:

    1px solid var(--border);



    transition:

    transform .15s ease;


}





.card:active {


    transform:scale(.98);


}





.card-title {


    font-size:18px;


    font-weight:600;


}





.card-desc {


    margin-top:8px;



    font-size:14px;


    color:var(--sub);


    line-height:1.5;


}





.card-arrow {


    float:right;


    font-size:22px;


    color:var(--sub);


}





.action {


    margin-top:15px;



    padding:

    11px 18px;



    border:none;


    border-radius:14px;



    background:var(--blue);


    color:#ffffff;



    font-size:15px;


    cursor:pointer;


}





/*
================================================

Search

================================================
*/


.search {


    width:100%;



    padding:

    14px 18px;



    border:none;


    outline:none;



    border-radius:16px;



    background:var(--card);


    color:var(--text);



    font-size:16px;



    margin-bottom:20px;


}





/*
================================================

Bottom Tab Bar

================================================
*/


.tabbar {


    height:72px;



    display:flex;


    align-items:center;


    justify-content:space-around;



    background:var(--glass);



    border-top:

    1px solid var(--border);



    backdrop-filter:blur(20px);


    -webkit-backdrop-filter:blur(20px);


}





.tab {


    flex:1;


    text-align:center;



    color:var(--sub);



    font-size:13px;


}





.tab span {


    display:block;


    font-size:24px;



    margin-bottom:3px;


}





.tab.active {


    color:var(--blue);


    font-weight:700;


}





/*
================================================

Modal

================================================
*/


.modal {


    position:fixed;


    inset:0;



    background:

    rgba(0,0,0,.45);



    display:none;



    align-items:center;


    justify-content:center;


}





.modal.show {


    display:flex;


}





.modal-box {


    width:85%;



    background:var(--card);



    border-radius:28px;



    padding:25px;


}





.modal-box h2 {


    margin-top:0;


}





.modal-box p {


    color:var(--sub);


    line-height:1.6;


}





/*
================================================

Footer

================================================
*/


.site-footer {


    text-align:center;



    font-size:12px;



    color:var(--sub);



    padding:

    10px 0 20px;


}

/*
================================================

Mobsp-System v1.1

iOS Settings Navigation Engine

================================================
*/


/* Navigation Stack */

.page-stack {

    width:100%;

    height:100%;

    position:relative;

    overflow:hidden;

}




.page-view {

    width:100%;

    min-height:100%;

    animation:

    pageIn .25s ease;

}




@keyframes pageIn {


from {

    transform:translateX(30px);

    opacity:0;

}


to {

    transform:translateX(0);

    opacity:1;

}


}




/*
===========================
iOS Settings Section
===========================
*/


.settings-section {


    margin-bottom:25px;


}



.settings-header {


    font-size:15px;


    color:var(--sub);


    padding:

    0 16px 8px;


}







/*
===========================
Settings Cell
===========================
*/


.settings-cell {


    display:flex;


    align-items:center;


    gap:14px;


    background:var(--card);


    min-height:60px;


    padding:

    12px 16px;


    border-bottom:

    1px solid var(--border);


}



.settings-cell:first-child {


    border-radius:

    18px 18px 0 0;


}



.settings-cell:last-child {


    border-radius:

    0 0 18px 18px;


    border-bottom:none;


}




.cell-icon {


    width:34px;


    height:34px;


    border-radius:10px;


    display:flex;


    align-items:center;


    justify-content:center;


    font-size:20px;


}




.cell-content {


    flex:1;


}




.cell-title {


    font-size:16px;


    font-weight:600;


}




.cell-subtitle {


    font-size:13px;


    color:var(--sub);


    margin-top:3px;


}




.cell-arrow {


    font-size:24px;


    color:var(--sub);


}




/*
===========================
Detail Page Header
===========================
*/


.detail-header {


    display:flex;


    align-items:center;


    gap:10px;


    margin-bottom:20px;


}



.back-button {


    border:none;


    background:none;


    color:var(--blue);


    font-size:17px;


}





.detail-title {


    font-size:28px;


    font-weight:700;


}

</style>
<body>


<div id="app">



<!-- =========================
     Navigation Bar
========================= -->


<header class="navbar">


<div class="nav-left">


<div class="nav-title" id="title">

莫比空間

</div>



<div class="nav-subtitle">

導覽 Ⓒ 2026•Ⲙ𝔬ⲃⳝ𝔭

</div>


</div>




<button class="icon-btn"
onclick="toggleTheme()"
aria-label="切換主題">


🌙


</button>



</header>






<!-- =========================
     Main Content View
========================= -->


<main class="content" id="view">


</main>








<!-- =========================
     Bottom Tab Navigation
========================= -->


<nav class="tabbar">





<div class="tab active"
onclick="navigate('home')">


<span>

🏠

</span>


首頁


</div>







<div class="tab"
onclick="navigate('system')">


<span>

🧩

</span>


系統


</div>







<div class="tab"
onclick="navigate('settings')">


<span>

⚙️

</span>


設定


</div>







</nav>




</div>








<!-- =========================
     Modal Layer
========================= -->


<div class="modal" id="modal">



<div class="modal-box">





<h2 id="modalTitle">

</h2>





<p id="modalText">

</p>






<button class="action"
onclick="closeModal()">


關閉


</button>






</div>



</div>
<script>

/*
================================================

莫比空間｜導覽

Mobsp-System Single File UI

JavaScript Layer

================================================
*/



/*
===========================
App State
===========================
*/


const state = {


    page:"home",


    theme:"light",


    search:""


};






/*
===========================
Navigation Data
===========================
*/


const data = {



home:[


{

title:"網站首頁",

desc:"莫比空間主要入口與網站資訊導覽。"

},


{

title:"內容中心",

desc:"文章、資訊、公告與公開內容入口。"

},


{

title:"工具中心",

desc:"各類 Web 工具與功能集合。"

}


],






system:[


{

title:"Mobsp-System",

desc:"莫比空間系統導覽核心。"

},


{

title:"UI System",

desc:"iOS Style Interface Design System。"

},


{

title:"Component Library",

desc:"網站元件與互動模組管理。"

}


],






settings:[


{

title:"主題模式",

desc:"切換亮色與深色顯示模式。"

},


{

title:"網站設定",

desc:"管理網站顯示與使用體驗。"

},


{

title:"關於莫比空間",

desc:"站點資訊與版本資訊。"

}


]



};








/*
===========================
HTML Escape
安全文字處理
===========================
*/


function escapeHTML(value){


return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");


}








/*
===========================
Render Engine
===========================
*/


function render(){



const view =

document.getElementById("view");



const title =

document.getElementById("title");





const pageTitle = {


home:"首頁",


system:"系統",


settings:"設定"


}[state.page];






title.innerText =

"莫比空間";







let html = "";







if(state.page==="system"){


html += `


<input

class="search"

placeholder="搜尋系統項目..."

value="${escapeHTML(state.search)}"

oninput="search(this.value)">


`;


}








html += `


<div class="section-title">

${pageTitle}

</div>


`;








data[state.page]


.filter(item =>


item.title

.toLowerCase()

.includes(

state.search.toLowerCase()

)


)

.forEach(item=>{


const safeTitle =

escapeHTML(item.title);



const safeDesc =

escapeHTML(item.desc);




html += `


<div class="card"

onclick="openModalByData('${encodeURIComponent(item.title)}','${encodeURIComponent(item.desc)}')">





<div class="card-title">


${safeTitle}



<span class="card-arrow">

›

</span>


</div>






<div class="card-desc">


${safeDesc}


</div>






<button class="action">


開啟


</button>





</div>


`;



});








html += `


<div class="site-footer">


莫比空間｜導覽


<br>


Ⓒ 2026•Ⲙ𝔬ⲃⳝ𝔭


</div>


`;






view.innerHTML = html;



updateTabs();



}









/*
===========================
Navigation Controller
===========================
*/


function navigate(page){



state.page = page;


state.search = "";



render();



}








function updateTabs(){



const tabs =

document.querySelectorAll(".tab");



const pages = [


"home",


"system",


"settings"


];






tabs.forEach((tab,index)=>{


tab.classList.remove("active");



if(

pages[index] === state.page

){


tab.classList.add("active");


}


});



}









/*
===========================
Theme Controller
===========================
*/


function toggleTheme(){



document.body.classList.toggle("dark");





state.theme =

document.body.classList.contains("dark")

?

"dark"

:

"light";



}









/*
===========================
Search Controller
===========================
*/


function search(value){



state.search = value;



render();



}









/*
===========================
Modal Controller
===========================
*/


function openModalByData(title,desc){



openModal(

decodeURIComponent(title),

decodeURIComponent(desc)

);


}







function openModal(title,text){



document

.getElementById("modalTitle")

.innerText = title;






document

.getElementById("modalText")

.innerText = text;






document

.getElementById("modal")

.classList

.add("show");



}








function closeModal(){



document

.getElementById("modal")

.classList

.remove("show");



}









/*
===========================
Initial Launch
===========================
*/


render();



</script>


</body>

</html>
