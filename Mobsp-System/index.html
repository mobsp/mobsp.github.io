<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS V10 Ultimate WebOS</title>
    
    <!-- PWA & Standalone Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="iOS WebOS">
    <meta name="theme-color" content="#000000">
    <!-- 正確的 Manifest 連結 -->
    <link rel="manifest" href="manifest.json">

    <style>
        /* 基礎 CSS 變數與原版相同，省略部分重複樣式以維持簡潔 */
        :root {
            --ios-bg: #f2f2f7; --ios-card: #ffffff; --ios-pressed: #e5e5ea;
            --ios-text: #000000; --ios-sub: #8e8e93; --ios-border: rgba(60,60,67,.18);
            --ios-green: #34c759; --ios-blue: #007aff; --ios-red: #ff3b30; --ios-orange: #ff9500;
            --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
            --ios-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --ios-smooth: cubic-bezier(0.22, 1, 0.36, 1);
        }
        [data-theme="dark"] {
            --ios-bg: #000000; --ios-card: #1c1c1e; --ios-pressed: #2c2c2e;
            --ios-text: #ffffff; --ios-border: #38383a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
        html, body { width: 100%; height: 100%; height: 100dvh; background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }
        
        .app-viewport { position: relative; width: 100%; height: 100%; background: var(--ios-bg); overflow: hidden; }
        
        /* Dynamic Island */
        .island-container { position: absolute; top: calc(8px + var(--sat)); left: 50%; transform: translateX(-50%); z-index: 3500; pointer-events: auto; }
        .dynamic-island { width: 120px; height: 36px; background: #000; border-radius: 20px; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; transition: all 0.4s var(--ios-spring); box-shadow: 0 6px 20px rgba(0,0,0,0.4); cursor: pointer; }
        
        /* View Container */
        .view-container { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
        .view { position: absolute; inset: 0; background: var(--ios-bg); color: var(--ios-text); overflow-y: auto; padding-bottom: calc(80px + var(--sab)); transition: transform 0.4s var(--ios-smooth), opacity 0.35s ease; z-index: 1; display: none; pointer-events: auto; }
        .view.mounted { display: block; }
        .view.sub-page { transform: translateX(100%); z-index: 10; box-shadow: -12px 0 40px rgba(0,0,0,0.25); }
        .view.sub-page.active { transform: translateX(0); }
        .view.parent-pushed { transform: translateX(-20%); opacity: 0.88; }
        
        /* Navbar */
        .nav { position: sticky; top: 0; height: calc(44px + var(--sat)); padding-top: var(--sat); display: flex; justify-content: space-between; align-items: center; padding: 0 8px; z-index: 99; background: rgba(249, 249, 249, 0.78); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 0.5px solid var(--ios-border); }
        [data-theme="dark"] .nav { background: rgba(28, 28, 30, 0.78); }
        .nav-back { display: flex; align-items: center; color: var(--ios-blue); font-size: 17px; cursor: pointer; }
        .nav-back-arrow { width: 10px; height: 10px; border-left: 2.5px solid var(--ios-blue); border-bottom: 2.5px solid var(--ios-blue); transform: rotate(45deg); margin-right: 4px; }
        .nav-title { font-size: 17px; font-weight: 600; text-align: center; flex: 1; }
        .content { padding-top: 8px; }
        .large-title { padding: 4px 16px 10px; font-size: 34px; font-weight: 700; }

        /* SpringBoard */
        .home-screen { position: absolute; inset: 0; z-index: 5; background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); padding: calc(60px + var(--sat)) 20px calc(100px + var(--sab)); display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: max-content; gap: 20px 16px; transition: transform 0.4s var(--ios-smooth), opacity 0.3s; }
        .app-icon-wrapper { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; position: relative; }
        .app-icon { width: 60px; height: 60px; border-radius: 14px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); transition: transform 0.2s; }
        .app-icon-wrapper:active .app-icon { transform: scale(0.9); }
        .app-label { font-size: 11px; color: #fff; font-weight: 500; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
        
        /* Jiggle Mode */
        .jiggle .app-icon { animation: jiggle 0.22s infinite alternate ease-in-out; }
        @keyframes jiggle { 0% { transform: rotate(-2.5deg) scale(1.02); } 100% { transform: rotate(2.5deg) scale(0.98); } }
        .app-delete-btn { position: absolute; top: -6px; left: -6px; width: 22px; height: 22px; background: rgba(120,120,120,0.9); color: #fff; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; z-index: 2; }
        .jiggle .app-delete-btn { display: flex; }

        .dock { position: absolute; bottom: calc(20px + var(--sab)); left: 16px; right: 16px; height: 90px; background: rgba(255,255,255,0.25); backdrop-filter: blur(30px); border-radius: 32px; display: flex; justify-content: space-around; align-items: center; padding: 0 12px; z-index: 6; }
        
        /* List UI */
        .group { margin: 0 16px 20px; }
        .list { list-style: none; background: var(--ios-card); border-radius: 12px; overflow: hidden; }
        .cell { position: relative; display: flex; align-items: center; min-height: 48px; padding: 8px 16px; cursor: pointer; }
        .cell:active { background: var(--ios-pressed); }
        li:not(:last-child) .cell::after { content: ""; position: absolute; inset-inline-start: 56px; inset-inline-end: 0; bottom: 0; height: .5px; background: var(--ios-border); }
        .icon { width: 29px; height: 29px; border-radius: 7px; margin-right: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .label { flex: 1; font-size: 17px; }
    </style>
</head>
<body>

<div class="app-viewport" id="appViewport">
    <!-- Dynamic Island -->
    <div class="island-container">
        <div class="dynamic-island" id="dynamicIsland">
            <span id="diIcon" style="font-size:14px;">⚡</span>
            <span id="diText" style="font-size:12px; font-weight:600;">System Ready</span>
        </div>
    </div>

    <!-- SpringBoard (動態生成) -->
    <div class="home-screen" id="homeScreen"></div>
    <div class="dock" id="dockContainer"></div>

    <!-- View Container -->
    <div class="view-container" id="viewContainer"></div>
</div>

<script>
    /* ===================================================
       [Phase 1] Kernel & System Store (kernel.js / store.js)
    =================================================== */
    class KernelEventBus {
        constructor() { this.listeners = {}; }
        on(event, callback) {
            if (!this.listeners[event]) this.listeners[event] = [];
            this.listeners[event].push(callback);
        }
        emit(event, data) {
            if (this.listeners[event]) this.listeners[event].forEach(cb => cb(data));
        }
    }
    const SysEvents = new KernelEventBus();

    // 升級版的狀態管理器，負責持久化與資料存取
    const Store = {
        data: JSON.parse(localStorage.getItem('ios_v10_store')) || {
            version: "10.0",
            system: { theme: "auto" },
            apps: {
                // 預設安裝的 App
                settings: true, camera: true, safari: true, appstore: true, phone: true, messages: true
            }
        },
        save() { localStorage.setItem('ios_v10_store', JSON.stringify(this.data)); },
        get(path) { return path.split('.').reduce((acc, part) => acc && acc[part], this.data); },
        set(path, value) {
            const parts = path.split('.');
            let curr = this.data;
            for (let i = 0; i < parts.length - 1; i++) curr = curr[parts[i]];
            curr[parts[parts.length - 1]] = value;
            this.save();
            SysEvents.emit('store.changed', { path, value });
        }
    };

    /* ===================================================
       [Phase 2] App Registry (apps/registry.js)
    =================================================== */
    const AppRegistry = {
        settings: { name: "設定", icon: "⚙️", bg: "#8e8e93", isSystem: true, inDock: true },
        safari: { name: "Safari", icon: "🌐", bg: "#fff", color: "#007aff", isSystem: true, inDock: true },
        camera: { name: "相機", icon: "📷", bg: "#333", isSystem: true },
        appstore: { name: "App Store", icon: "🅰️", bg: "#007aff", isSystem: true },
        phone: { name: "電話", icon: "📞", bg: "#34c759", isSystem: true, inDock: true },
        messages: { name: "訊息", icon: "💬", bg: "#34c759", isSystem: true, inDock: true },
        photos: { name: "照片", icon: "🌄", bg: "#fff", isSystem: false },
        music: { name: "音樂", icon: "🎵", bg: "#ff2d55", isSystem: false },
        maps: { name: "地圖", icon: "🗺️", bg: "#34c759", isSystem: false }
    };

    /* ===================================================
       [Phase 1] View Manager (修復 DOM 記憶體洩漏)
    =================================================== */
    class ViewManager {
        constructor() {
            this.stack = [];
            this.cache = {}; // 只暫存活躍的 View
            this.container = document.getElementById('viewContainer');
        }

        mount(appId) {
            if (!this.cache[appId]) {
                const el = document.createElement('div');
                el.className = `view ${this.stack.length > 0 ? 'sub-page' : ''}`;
                el.id = appId;
                
                // 動態取得 View Template
                el.innerHTML = ViewTemplates[appId] ? ViewTemplates[appId]() : `
                    <div class="nav"><div class="nav-back" data-action="pop"><div class="nav-back-arrow"></div><span>返回</span></div><div class="nav-title">${AppRegistry[appId]?.name || appId}</div><div style="width:70px;"></div></div>
                    <div class="content"><div class="large-title">開發中...</div></div>
                `;
                this.container.appendChild(el);
                this.cache[appId] = el;
            }
            return this.cache[appId];
        }

        destroy(appId) {
            if (this.cache[appId]) {
                // 等待動畫結束後移除 DOM
                setTimeout(() => {
                    if (this.cache[appId]) {
                        this.cache[appId].remove();
                        delete this.cache[appId];
                    }
                }, 400);
            }
        }

        push(appId) {
            const currentId = this.stack.at(-1);
            const nextEl = this.mount(appId);

            nextEl.classList.add('mounted');
            requestAnimationFrame(() => {
                if (currentId) this.cache[currentId].classList.add('parent-pushed');
                nextEl.classList.add('active');
            });
            this.stack.push(appId);
            
            if (this.stack.length === 1) {
                document.getElementById('homeScreen').style.opacity = '0';
                document.getElementById('homeScreen').style.pointerEvents = 'none';
            }
        }

        pop() {
            if (this.stack.length === 0) return;
            const topId = this.stack.pop();
            const topEl = this.cache[topId];

            topEl.classList.remove('active');
            const parentId = this.stack.at(-1);
            
            if (parentId) {
                this.cache[parentId].classList.remove('parent-pushed');
            } else {
                document.getElementById('homeScreen').style.opacity = '1';
                document.getElementById('homeScreen').style.pointerEvents = 'auto';
            }

            // 真正釋放資源 (Phase 1 修復)
            this.destroy(topId);
        }
    }
    const Router = new ViewManager();

    /* ===================================================
       [Phase 3] App Store & SpringBoard Engine (springboard.js)
    =================================================== */
    const SpringBoard = {
        render() {
            const home = document.getElementById('homeScreen');
            const dock = document.getElementById('dockContainer');
            home.innerHTML = '';
            dock.innerHTML = '';

            const installed = Store.get('apps');
            
            Object.keys(AppRegistry).forEach(id => {
                if (!installed[id]) return;
                
                const app = AppRegistry[id];
                const isJiggling = home.classList.contains('jiggle');
                const deleteBtn = !app.isSystem ? `<div class="app-delete-btn" data-action="uninstall-app" data-appid="${id}">✕</div>` : '';
                
                const html = `
                    <div class="app-icon-wrapper" data-action="${isJiggling ? '' : 'launch-app'}" data-app="${id}">
                        ${deleteBtn}
                        <div class="app-icon" style="background:${app.bg}; color:${app.color || '#fff'};">${app.icon}</div>
                        <span class="app-label">${app.inDock ? '' : app.name}</span>
                    </div>
                `;

                if (app.inDock) dock.innerHTML += html;
                else home.innerHTML += html;
            });
        },
        
        install(id) {
            Store.set(`apps.${id}`, true);
            this.render();
            alert(`已安裝 ${AppRegistry[id].name} 至主畫面`);
        },
        
        uninstall(id) {
            if (AppRegistry[id].isSystem) return;
            Store.set(`apps.${id}`, false);
            this.render();
        }
    };

    /* App 模板定義 */
    const ViewTemplates = {
        appstore: () => `
            <div class="nav"><div class="nav-back" data-action="pop"><div class="nav-back-arrow"></div><span>主畫面</span></div><div class="nav-title">App Store</div><div style="width:70px;"></div></div>
            <div class="content">
                <div class="large-title">探索 App</div>
                <div class="group">
                    <ul class="list">
                        ${Object.keys(AppRegistry).filter(id => !AppRegistry[id].isSystem).map(id => `
                            <li>
                                <div class="cell">
                                    <div class="icon" style="background:${AppRegistry[id].bg}; font-size:18px;">${AppRegistry[id].icon}</div>
                                    <div class="label">${AppRegistry[id].name}</div>
                                    <button data-action="install-app" data-appid="${id}" style="padding:6px 16px; border-radius:14px; border:none; background:var(--ios-blue); color:#fff; font-weight:bold;">取得</button>
                                </div>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            </div>
        `
    };

    /* ===================================================
       Global Event Listener (事件代理)
    =================================================== */
    document.addEventListener('click', e => {
        const target = e.target.closest('[data-action]');
        if (!target) return;

        const action = target.dataset.action;
        if (action === 'launch-app') Router.push(target.dataset.app);
        if (action === 'pop') Router.pop();
        if (action === 'install-app') {
            SpringBoard.install(target.dataset.appid);
            // 安裝後稍微震動回饋 (若裝置支援)
            if (navigator.vibrate) navigator.vibrate(20);
        }
        if (action === 'uninstall-app') {
            e.stopPropagation(); // 防止觸發 launch-app
            SpringBoard.uninstall(target.dataset.appid);
            if (navigator.vibrate) navigator.vibrate([20, 50, 20]);
        }
    });

    /* Jiggle Mode (長按編輯主畫面) */
    let longPressTimer;
    document.getElementById('homeScreen').addEventListener('touchstart', (e) => {
        if (e.target.closest('[data-action="uninstall-app"]')) return;
        longPressTimer = setTimeout(() => {
            document.getElementById('homeScreen').classList.add('jiggle');
            document.getElementById('dockContainer').classList.add('jiggle');
            if (navigator.vibrate) navigator.vibrate([40, 20, 40]);
            SpringBoard.render(); // 重新渲染以綁定/解綁點擊事件
        }, 800);
    }, { passive: true });
    
    document.getElementById('homeScreen').addEventListener('touchend', () => clearTimeout(longPressTimer));
    
    // 點擊空白處解除 Jiggle Mode
    document.getElementById('homeScreen').addEventListener('click', (e) => {
        if (e.target.id === 'homeScreen' && e.target.classList.contains('jiggle')) {
            document.getElementById('homeScreen').classList.remove('jiggle');
            document.getElementById('dockContainer').classList.remove('jiggle');
            SpringBoard.render();
        }
    });

    /* 啟動 Service Worker */
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js')
            .then(() => console.log('V10 Service Worker 註冊成功'))
            .catch(err => console.error('SW 註冊失敗', err));
    }

    // 初始化系統
    SpringBoard.render();
</script>
</body>
</html>
