<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS UI Framework</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <style>
        :root {
            --ios-bg: #000000;
            --ios-card: #1c1c1e;
            --ios-pressed: #2c2c2e;
            --ios-text: #ffffff;
            --ios-sub: #8e8e93;
            --ios-border: #38383a;
            --ios-green: #34c759;
            --ios-blue: #0a84ff;
            --ios-red: #ff453a;
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --ios-smooth: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
        html, body { width: 100%; height: 100%; height: 100dvh; background: var(--ios-bg); color: var(--ios-text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; }

        /* 視窗與頁面路由系統 */
        .app-viewport { position: relative; width: 100%; height: 100%; background: var(--ios-bg); overflow: hidden; }
        .view-container { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
        .view { position: absolute; inset: 0; background: var(--ios-bg); color: var(--ios-text); overflow-y: auto; padding-bottom: calc(40px + var(--sab)); transition: transform 0.4s var(--ios-smooth), opacity 0.35s ease; z-index: 1; display: none; pointer-events: auto; }
        .view.mounted { display: block; }
        .view.sub-page { transform: translateX(100%); z-index: 10; box-shadow: -12px 0 40px rgba(0,0,0,0.5); }
        .view.sub-page.active { transform: translateX(0); }
        .view.parent-pushed { transform: translateX(-25%); opacity: 0.85; }

        /* Navigation Bar */
        .nav { position: sticky; top: 0; height: calc(44px + var(--sat)); padding-top: var(--sat); display: flex; justify-content: space-between; align-items: center; padding-inline: 8px; z-index: 99; background: rgba(28, 28, 30, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 0.5px solid var(--ios-border); }
        .nav-back { display: flex; align-items: center; color: var(--ios-blue); font-size: 17px; cursor: pointer; padding: 4px 8px; }
        .nav-back-arrow { width: 12px; height: 12px; border-left: 2px solid var(--ios-blue); border-bottom: 2px solid var(--ios-blue); transform: rotate(45deg); margin-right: 4px; }
        .nav-title { font-size: 17px; font-weight: 600; text-align: center; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .content { padding-top: 12px; }
        .large-title { padding: 4px 20px 12px; font-size: 34px; font-weight: 700; letter-spacing: 0.38px; }

        /* iOS Grouped List 元件 */
        .group { margin: 0 16px 20px; }
        .group-header { font-size: 13px; color: var(--ios-sub); margin-bottom: 6px; padding-left: 16px; text-transform: uppercase; letter-spacing: -0.08px; }
        .list { list-style: none; background: var(--ios-card); border-radius: 10px; overflow: hidden; }
        .cell { position: relative; display: flex; align-items: center; min-height: 44px; padding: 8px 16px; cursor: pointer; }
        .cell:active { background: var(--ios-pressed); }
        
        /* 列表格線分隔 */
        .list li:not(:last-child) .cell::after { content: ""; position: absolute; inset-inline-start: 52px; inset-inline-end: 0; bottom: 0; height: 0.5px; background: var(--ios-border); }
        
        .cell-icon { width: 29px; height: 29px; border-radius: 6px; margin-right: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; font-size: 15px; }
        .cell-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .cell-label { font-size: 17px; line-height: 22px; }
        .cell-sub { font-size: 13px; color: var(--ios-sub); line-height: 16px; }
        .cell-value { font-size: 17px; color: var(--ios-sub); margin-right: 6px; }
        
        /* Chevron 箭頭 */
        .chevron { width: 7px; height: 7px; border-top: 2px solid var(--ios-sub); border-right: 2px solid var(--ios-sub); transform: rotate(45deg); margin-left: 6px; flex-shrink: 0; }

        /* iOS Switch 開關元件 */
        .ios-switch { position: relative; display: inline-block; width: 51px; height: 31px; flex-shrink: 0; }
        .ios-switch input { opacity: 0; width: 0; height: 0; }
        .switch-slider { position: absolute; inset: 0; background-color: #39393d; border-radius: 31px; transition: 0.3s var(--ios-smooth); }
        .switch-slider:before { position: absolute; content: ""; height: 27px; width: 27px; left: 2px; bottom: 2px; background-color: white; border-radius: 50%; transition: 0.3s var(--ios-smooth); box-shadow: 0 3px 8px rgba(0,0,0,0.15); }
        input:checked + .switch-slider { background-color: var(--ios-green); }
        input:checked + .switch-slider:before { transform: translateX(20px); }

        /* 個人名片卡片特殊 Cell */
        .profile-cell { min-height: 80px; padding: 12px 16px; }
        .profile-avatar { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #0a84ff, #5e5ce6); display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; margin-right: 16px; flex-shrink: 0; }
    </style>
</head>
<body>

<div class="app-viewport" id="appViewport">
    <div class="view-container" id="viewContainer"></div>
</div>

<script>
    /* 核心視窗與頁面路由器 (ViewManager) */
    class ViewManager {
        constructor() {
            this.stack = [];
            this.cache = {};
            this.container = document.getElementById('viewContainer');
        }

        mount(viewId) {
            if (!this.cache[viewId]) {
                const el = document.createElement('div');
                el.className = `view ${this.stack.length > 0 ? 'sub-page' : ''}`;
                el.id = viewId;
                el.innerHTML = ViewTemplates[viewId] ? ViewTemplates[viewId]() : `<div class="nav"><div class="nav-back" data-action="pop"><div class="nav-back-arrow"></div><span>返回</span></div><div class="nav-title">詳細內容</div></div><div class="content"><div class="large-title">頁面</div></div>`;
                this.container.appendChild(el);
                this.cache[viewId] = el;
            }
            return this.cache[viewId];
        }

        push(viewId) {
            const currentId = this.stack.at(-1);
            const nextEl = this.mount(viewId);
            nextEl.classList.add('mounted');
            
            requestAnimationFrame(() => {
                if (currentId) this.cache[currentId].classList.add('parent-pushed');
                nextEl.classList.add('active');
            });
            this.stack.push(viewId);
        }

        pop() {
            if (this.stack.length <= 1) return;
            const topId = this.stack.pop();
            const topEl = this.cache[topId];

            topEl.classList.remove('active');
            const parentId = this.stack.at(-1);
            if (parentId) this.cache[parentId].classList.remove('parent-pushed');

            setTimeout(() => {
                topEl.remove();
                delete this.cache[topId];
            }, 400);
        }
    }

    const Router = new ViewManager();

    /* 純 UI 樣板庫 (模組化設計) */
    const ViewTemplates = {
        main: () => `
            <div class="nav"><div class="nav-title">設定</div></div>
            <div class="content">
                <div class="large-title">設定</div>
                
                <!-- 個人檔案卡片區塊 -->
                <div class="group">
                    <ul class="list">
                        <li>
                            <div class="cell profile-cell" data-action="push" data-target="profile">
                                <div class="profile-avatar">👤</div>
                                <div class="cell-content">
                                    <div class="cell-label" style="font-weight: 500;">使用者帳號</div>
                                    <div class="cell-sub">Apple 帳號、iCloud 與其他內容</div>
                                </div>
                                <div class="chevron"></div>
                            </div>
                        </li>
                    </ul>
                </div>

                <!-- 系統控制開關區塊 -->
                <div class="group">
                    <ul class="list">
                        <li>
                            <div class="cell">
                                <div class="cell-icon" style="background: var(--ios-orange);">✈️</div>
                                <div class="cell-label" style="flex:1;">飛航模式</div>
                                <label class="ios-switch"><input type="checkbox"><span class="switch-slider"></span></label>
                            </div>
                        </li>
                        <li>
                            <div class="cell">
                                <div class="cell-icon" style="background: var(--ios-blue);">🛜</div>
                                <div class="cell-label" style="flex:1;">Wi-Fi</div>
                                <div class="cell-value">連接中</div>
                                <div class="chevron"></div>
                            </div>
                        </li>
                        <li>
                            <div class="cell">
                                <div class="cell-icon" style="background: var(--ios-blue);">🔵</div>
                                <div class="cell-label" style="flex:1;">藍牙</div>
                                <div class="cell-value">開啟</div>
                                <div class="chevron"></div>
                            </div>
                        </li>
                    </ul>
                </div>

                <!-- 一般導覽列選項區塊 -->
                <div class="group">
                    <ul class="list">
                        <li>
                            <div class="cell" data-action="push" data-target="general">
                                <div class="cell-icon" style="background: var(--ios-sub);">⚙️</div>
                                <div class="cell-label">一般</div>
                                <div class="chevron"></div>
                            </div>
                        </li>
                        <li>
                            <div class="cell">
                                <div class="cell-icon" style="background: var(--ios-green);">♿</div>
                                <div class="cell-label">輔助使用</div>
                                <div class="chevron"></div>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        `,

        profile: () => `
            <div class="nav">
                <div class="nav-back" data-action="pop"><div class="nav-back-arrow"></div><span>設定</span></div>
                <div class="nav-title">Apple 帳號</div>
                <div style="width: 50px;"></div>
            </div>
            <div class="content">
                <div class="group" style="margin-top: 16px;">
                    <ul class="list">
                        <li><div class="cell"><div class="cell-label">個人資訊</div><div class="chevron"></div></div></li>
                        <li><div class="cell"><div class="cell-label">登入與安全性</div><div class="chevron"></div></div></li>
                        <li><div class="cell"><div class="cell-label">付款與寄送</div><div class="chevron"></div></div></li>
                    </ul>
                </div>
            </div>
        `,

        general: () => `
            <div class="nav">
                <div class="nav-back" data-action="pop"><div class="nav-back-arrow"></div><span>設定</span></div>
                <div class="nav-title">一般</div>
                <div style="width: 50px;"></div>
            </div>
            <div class="content">
                <div class="group" style="margin-top: 16px;">
                    <ul class="list">
                        <li><div class="cell"><div class="cell-label">關於本機</div><div class="chevron"></div></div></li>
                        <li><div class="cell"><div class="cell-label">軟體更新</div><div class="chevron"></div></div></li>
                        <li><div class="cell"><div class="cell-label">iPhone 儲存空間</div><div class="chevron"></div></div></li>
                    </ul>
                </div>
            </div>
        `
    };

    /* 全域點擊事件委派 */
    document.addEventListener('click', e => {
        const target = e.target.closest('[data-action]');
        if (!target) return;

        const action = target.dataset.action;
        if (action === 'push') {
            Router.push(target.dataset.target);
        } else if (action === 'pop') {
            Router.pop();
        }
    });

    /* 初始化首頁掛載 */
    Router.push('main');
</script>
</body>
</html>
