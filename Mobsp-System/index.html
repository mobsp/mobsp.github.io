<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS Settings V6.0 Ultimate Replica</title>
    
    <!-- PWA Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="設定">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" id="manifestPlaceholder">

    <style>
        :root {
            --ios-bg: #f2f2f7;
            --ios-card: #ffffff;
            --ios-pressed: #e5e5ea;
            --ios-text: #000000;
            --ios-sub: #8e8e93;
            --ios-border: rgba(60,60,67,.18);
            --ios-search: rgba(118,118,128,.12);
            --ios-green: #34c759;
            --ios-blue: #007aff;
            --ios-red: #ff3b30;
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --ios-spring: cubic-bezier(0.22, 1, 0.36, 1);
        }

        [data-theme="dark"] {
            --ios-bg: #000000;
            --ios-card: #1c1c1e;
            --ios-pressed: #2c2c2e;
            --ios-text: #ffffff;
            --ios-sub: #8e8e93;
            --ios-border: #38383a;
            --ios-search: rgba(118,118,128,.24);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --ios-bg: #000000;
                --ios-card: #1c1c1e;
                --ios-pressed: #2c2c2e;
                --ios-text: #ffffff;
                --ios-sub: #8e8e93;
                --ios-border: #38383a;
                --ios-search: rgba(118,118,128,.24);
            }
        }

        * {
            margin: 0; padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%; height: 100%;
            height: 100vh; height: 100dvh;
            min-height: -webkit-fill-available;
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            position: relative;
        }

        .app-viewport {
            position: relative;
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--ios-bg);
        }

        /* ---------------- Dynamic Island 動態島 ---------------- */
        .dynamic-island-container {
            position: absolute;
            top: calc(8px + var(--sat));
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            pointer-events: auto;
        }

        .dynamic-island {
            width: 120px; height: 35px;
            background: #000000;
            border-radius: 20px;
            color: #fff;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px;
            transition: all 0.4s var(--ios-spring);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .dynamic-island.expanded {
            width: 320px; height: 80px;
            border-radius: 35px;
            padding: 16px;
        }

        .di-content { display: flex; align-items: center; gap: 10px; width: 100%; justify-content: space-between; }
        .di-icon { width: 20px; height: 20px; background: var(--ios-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; }
        .di-title { font-size: 12px; font-weight: 600; white-space: nowrap; }

        /* ---------------- View & Navigation ---------------- */
        .view {
            position: absolute;
            inset: 0;
            background: var(--ios-bg);
            color: var(--ios-text);
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: none;
            padding-bottom: calc(60px + var(--sab));
            transition: transform 0.4s var(--ios-spring), opacity 0.3s ease;
            will-change: transform;
            z-index: 1;
        }

        .view.sub-page {
            transform: translateX(100%);
            z-index: 10;
            box-shadow: -12px 0 40px rgba(0, 0, 0, 0.25);
        }

        .view.sub-page.active { transform: translateX(0); }
        .view.parent-pushed { transform: translateX(-20%); opacity: 0.9; }

        .nav {
            position: sticky; top: 0;
            height: calc(44px + var(--sat));
            padding-top: var(--sat);
            display: flex; justify-content: space-between; align-items: center;
            padding-left: 8px; padding-right: 8px;
            z-index: 99;
            background: rgba(249, 249, 249, 0.85);
            transition: border-color .2s;
        }

        @supports (backdrop-filter: blur(20px)) or (-webkit-backdrop-filter: blur(20px)) {
            .nav {
                background: rgba(249, 249, 249, 0.75);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
            }
        }

        [data-theme="dark"] .nav { background: rgba(28, 28, 30, 0.85); }
        @supports (backdrop-filter: blur(20px)) or (-webkit-backdrop-filter: blur(20px)) {
            [data-theme="dark"] .nav { background: rgba(28, 28, 30, 0.75); }
        }

        .nav-back {
            display: flex; align-items: center; color: var(--ios-blue);
            font-size: 17px; cursor: pointer; min-width: 70px;
        }
        .nav-back-arrow {
            width: 10px; height: 10px;
            border-left: 2.5px solid var(--ios-blue);
            border-bottom: 2.5px solid var(--ios-blue);
            transform: rotate(45deg); margin-right: 4px; margin-left: 4px;
        }
        .nav-title {
            font-size: 17px; font-weight: 600; color: var(--ios-text);
            text-align: center; flex: 1; opacity: 1;
        }

        .content { padding-top: 8px; }
        .large-title { padding: 4px 16px 10px; }
        .large-title h1 { font-size: 34px; font-weight: 700; letter-spacing: -.5px; }

        /* ---------------- List & Group ---------------- */
        .group { margin: 0 16px 20px; }
        .group-title { font-size: 13px; color: var(--ios-sub); padding: 0 0 6px 16px; text-transform: uppercase; }
        .list { list-style: none; background: var(--ios-card); border-radius: 12px; overflow: hidden; }

        .cell {
            position: relative; display: flex; align-items: center;
            min-height: 48px; padding: 8px 16px; color: inherit; cursor: pointer;
        }
        .cell:active { background: var(--ios-pressed); }
        li:not(:last-child) .cell::after {
            content: ""; position: absolute; inset-inline-start: 56px; inset-inline-end: 0; bottom: 0;
            height: .5px; background: var(--ios-border);
        }

        .icon {
            width: 29px; height: 29px; border-radius: 7px; margin-right: 12px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .icon-symbol {
            width: 18px; height: 18px; background-color: #ffffff;
            -webkit-mask-size: contain; mask-size: contain;
            -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
            -webkit-mask-position: center; mask-position: center;
        }

        .label { flex: 1; font-size: 17px; letter-spacing: -.4px; }
        .value { color: var(--ios-sub); font-size: 17px; margin-right: 6px; }
        .chevron {
            width: 8px; height: 8px; border-top: 1.5px solid #c7c7cc; border-right: 1.5px solid #c7c7cc;
            transform: rotate(45deg); flex-shrink: 0;
        }

        /* Switch UI */
        .switch {
            appearance: none; -webkit-appearance: none; width: 51px; height: 31px;
            border-radius: 16px; background: #e4e4e7; position: relative; transition: background 0.25s; cursor: pointer;
        }
        .switch::before {
            content: ""; position: absolute; width: 27px; height: 27px; left: 2px; top: 2px;
            border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15);
            transition: transform 0.35s var(--ios-spring);
        }
        .switch:checked { background: var(--ios-green); }
        .switch:checked::before { transform: translateX(20px); }
        [data-theme="dark"] .switch { background: #39393d; }

        /* Search UI */
        .search-wrap { padding: 0 16px 12px; }
        .search {
            height: 36px; border-radius: 10px; background: var(--ios-search);
            display: flex; align-items: center; padding: 0 10px; color: var(--ios-sub);
        }
        .search input { border: none; background: transparent; outline: none; font-size: 17px; color: var(--ios-text); width: 100%; margin-left: 6px; }

        /* ---------------- Control Center 控制中心 ---------------- */
        .control-center-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 900; transform: translateY(-100%); transition: transform 0.4s var(--ios-spring);
            padding: calc(40px + var(--sat)) 20px 20px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
        }
        .control-center-overlay.active { transform: translateY(0); }
        .cc-tile { background: rgba(255,255,255,0.2); border-radius: 20px; padding: 16px; color: #fff; display: flex; flex-direction: column; justify-content: space-between; }
        .cc-slider { width: 100%; height: 120px; background: rgba(255,255,255,0.2); border-radius: 20px; position: relative; overflow: hidden; }
        .cc-slider-fill { position: absolute; bottom: 0; width: 100%; background: #fff; height: 60%; transition: height 0.1s; }

        /* ---------------- Lock Screen 鎖定畫面 ---------------- */
        .lock-screen {
            position: fixed; inset: 0; background: linear-gradient(180deg, #2b5876 0%, #4e4376 100%);
            z-index: 2000; color: #fff; display: flex; flex-direction: column; align-items: center;
            padding-top: calc(40px + var(--sat)); transition: transform 0.5s var(--ios-spring);
        }
        .lock-screen.unlocked { transform: translateY(-100%); }
        .ls-time { font-size: 72px; font-weight: 700; font-feature-settings: "tnum"; margin-top: 10px; }
        .ls-date { font-size: 20px; font-weight: 500; opacity: 0.9; }
        .ls-bottom { margin-top: auto; padding-bottom: calc(30px + var(--sab)); text-align: center; opacity: 0.8; font-size: 14px; }

        /* Face ID Modal */
        .faceid-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1500;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .faceid-modal.active { opacity: 1; pointer-events: auto; }
        .faceid-box {
            width: 120px; height: 120px; border: 2px solid rgba(255,255,255,0.2); border-radius: 28px;
            position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
        }
        .faceid-box.success { border-color: var(--ios-green); box-shadow: 0 0 30px var(--ios-green); }
    </style>
</head>
<body>

<div class="app-viewport" id="appViewport">

    <!-- 動態島 Dynamic Island -->
    <div class="dynamic-island-container">
        <div class="dynamic-island" id="dynamicIsland" onclick="toggleIslandExpand()">
            <div class="di-content" id="diContent">
                <div class="di-icon">⚡</div>
                <div class="di-title" id="diTitle">72% 電量</div>
            </div>
        </div>
    </div>

    <!-- 主 View 容器 (ViewManager 會於此進行 DOM 渲染) -->
    <div id="viewContainer"></div>

    <!-- 控制中心 Control Center Overlay -->
    <div class="control-center-overlay" id="controlCenter">
        <div class="cc-tile">
            <div style="font-weight: 600;">控制中心</div>
            <div style="font-size: 12px; opacity: 0.8;">向上滑動或點擊空白處關閉</div>
        </div>
        <div class="cc-tile" style="align-items: center; justify-content: center;" onclick="Store.set('flight', !Store.get('flight'))">
            <div style="font-size: 28px;" id="ccFlightIcon">✈️</div>
            <div style="font-size: 12px; margin-top: 6px;">飛航模式</div>
        </div>
        <div class="cc-slider" onmousedown="handleSlider(event)" ontouchmove="handleSlider(event)">
            <div class="cc-slider-fill" id="brightnessSlider"></div>
        </div>
        <div class="cc-slider" onmousedown="handleSlider(event)" ontouchmove="handleSlider(event)">
            <div class="cc-slider-fill" id="volumeSlider" style="height: 40%;"></div>
        </div>
    </div>

    <!-- 鎖定畫面 Lock Screen -->
    <div class="lock-screen" id="lockScreen" onclick="unlockDevice()">
        <div style="font-size: 22px;">🔒</div>
        <div class="ls-date" id="lsDate">7月27日 星期一</div>
        <div class="ls-time" id="lsTime">09:41</div>
        <div class="ls-bottom">向上滑動或點擊解鎖</div>
    </div>

</div>

<!-- Face ID Modal -->
<div class="faceid-modal" id="faceidModal">
    <div class="faceid-box" id="faceidBox"></div>
    <div style="font-weight:600; font-size:18px;" id="faceidStatus">正在識別 Face ID...</div>
</div>

<script>
    /* ===================================================
       0. PWA & Service Worker 註冊
    =================================================== */
    const manifestData = {
        "name": "iOS 設定",
        "short_name": "設定",
        "start_url": ".",
        "display": "standalone",
        "background_color": "#000000",
        "theme_color": "#000000",
        "icons": [{ "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%238e8e93'/></svg>", "sizes": "192x192", "type": "image/png" }]
    };
    document.getElementById('manifestPlaceholder').setAttribute('href', 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestData)));

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            const swCode = `
                self.addEventListener('install', e => e.waitUntil(caches.open('ios-v6').then(c => c.addAll(['/']))));
                self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        });
    }

    /* ===================================================
       1. SVG Safe Encoder (高優先級 Bug 修復)
    =================================================== */
    function svgMask(svgContent) {
        const fullSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">${svgContent}</svg>`;
        return `url("data:image/svg+xml;charset=UTF-8,${encodeURIComponent(fullSvg)}")`;
    }

    /* ===================================================
       2. Store 狀態集中管理模組
    =================================================== */
    const Store = {
        state: {
            flight: JSON.parse(localStorage.getItem('ios_flight') || 'false'),
            name: localStorage.getItem('ios_name') || 'Alex Chen',
            theme: localStorage.getItem('ios_theme') || 'auto',
            wifi: true,
            bluetooth: true
        },
        listeners: [],
        get(key) { return this.state[key]; },
        set(key, value) {
            this.state[key] = value;
            localStorage.setItem('ios_' + key, typeof value === 'object' ? JSON.stringify(value) : value);
            this.notify(key, value);
        },
        subscribe(fn) { this.listeners.push(fn); },
        notify(key, value) { this.listeners.forEach(fn => fn(key, value)); }
    };

    /* ===================================================
       3. 設定數據庫 SETTINGS_DATA
    =================================================== */
    const SETTINGS_DATA = [
        {
            group: "網絡與連線",
            items: [
                { id: "flight", label: "飛航模式", iconBg: "#ff9500", type: "switch", search: "飛航模式 airplane", iconSvg: '<path d="M22 16v-2l-8.5-5V3.5C13.5 2.67 12.83 2 12 2s-1.5.67-1.5 1.5V9L2 14v2l8.5-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13.5 19v-5.5L22 16z"/>' },
                { id: "wifi", label: "Wi-Fi", iconBg: "#007aff", type: "link", target: "wifiView", value: "Home_Network", search: "wifi 無線網絡", iconSvg: '<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 6c2.92 0 5.57 1.05 7.65 2.79L12 20.08l-7.65-7.29C6.43 11.05 9.08 10 12 10z"/>' },
                { id: "bt", label: "藍牙", iconBg: "#007aff", type: "link", target: "btView", value: "開啟", search: "藍牙 bluetooth", iconSvg: '<path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29z"/>' }
            ]
        },
        {
            group: "系統設定",
            items: [
                { id: "display", label: "顯示與亮度", iconBg: "#007aff", type: "link", target: "displayView", search: "顯示 亮度 深色模式", iconSvg: '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1z"/>' },
                { id: "faceid", label: "Face ID 與密碼", iconBg: "#34c759", type: "link", target: "faceIdView", search: "face id 解鎖 密碼", iconSvg: '<path d="M9 11.75c-.69 0-1.25.56-1.25 1.25s.56 1.25 1.25 1.25 1.25-.56 1.25-1.25-.56-1.25-1.25-1.25zm6 0c-.69 0-1.25.56-1.25 1.25s.56 1.25 1.25 1.25 1.25-.56 1.25-1.25-.56-1.25-1.25-1.25z"/>' }
            ]
        },
        {
            group: "應用程式權限",
            items: [
                { id: "apps", label: "App 權限管理", iconBg: "#8e8e93", type: "link", target: "appsView", search: "app 權限 隱私", iconSvg: '<path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/>' }
            ]
        }
    ];

    /* ===================================================
       4. ViewManager & Router 引擎
    =================================================== */
    const historyStack = ['mainView'];

    const ViewTemplates = {
        mainView: () => `
            <div class="nav"><div style="width:70px;"></div><div class="nav-title">設定</div><div style="width:70px;"></div></div>
            <div class="content">
                <div class="large-title"><h1>設定</h1></div>
                <div class="group">
                    <ul class="list">
                        <li>
                            <div class="cell" onclick="Router.push('appleIdView')">
                                <div class="icon" style="background:#8e8e93;"><div class="icon-symbol" style="-webkit-mask-image:${svgMask('<path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>')}"></div></div>
                                <div class="label" style="font-weight:600;">${Store.get('name')}</div>
                                <div class="chevron"></div>
                            </div>
                        </li>
                    </ul>
                </div>
                <div class="search-wrap"><div class="search"><input type="text" placeholder="搜尋" id="searchInput"></div></div>
                ${SETTINGS_DATA.map(g => `
                    <div class="group setting-group">
                        <div class="group-title">${g.group}</div>
                        <ul class="list">
                            ${g.items.map(i => `
                                <li data-search="${i.search}">
                                    <div class="cell" ${i.target ? `onclick="Router.push('${i.target}')"` : ''}>
                                        <div class="icon" style="background:${i.iconBg};"><div class="icon-symbol" style="-webkit-mask-image:${svgMask(i.iconSvg)}; mask-image:${svgMask(i.iconSvg)};"></div></div>
                                        <div class="label">${i.label}</div>
                                        ${i.type === 'switch' ? `<input class="switch" type="checkbox" id="${i.id}Switch" ${Store.get(i.id) ? 'checked' : ''}>` : ''}
                                        ${i.value ? `<div class="value">${i.value}</div>` : ''}
                                        ${i.type === 'link' ? `<div class="chevron"></div>` : ''}
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `).join('')}
            </div>
        `,
        wifiView: () => `
            <div class="nav"><div class="nav-back" onclick="Router.pop()"><div class="nav-back-arrow"></div><span>設定</span></div><div class="nav-title">Wi-Fi</div><div style="width:70px;"></div></div>
            <div class="content">
                <div class="group"><ul class="list"><li><div class="cell"><div class="label">Wi-Fi</div><input class="switch" type="checkbox" checked></div></li></ul></div>
                <div class="group"><div class="group-title">我的網路</div><ul class="list">
                    <li><div class="cell"><div class="label" style="color:var(--ios-blue);">Home_Network</div><div class="value">✓</div></div></li>
                    <li><div class="cell"><div class="label">Office_5G</div><div class="chevron"></div></div></li>
                </ul></div>
            </div>
        `,
        btView: () => `
            <div class="nav"><div class="nav-back" onclick="Router.pop()"><div class="nav-back-arrow"></div><span>設定</span></div><div class="nav-title">藍牙</div><div style="width:70px;"></div></div>
            <div class="content">
                <div class="group"><div class="group-title">我的裝置</div><ul class="list">
                    <li><div class="cell"><div class="label">AirPods Pro</div><div class="value">已連線</div><div class="chevron"></div></div></li>
                    <li><div class="cell"><div class="label">Apple Watch</div><div class="value">未連線</div><div class="chevron"></div></div></li>
                </ul></div>
            </div>
        `,
        displayView: () => `
            <div class="nav"><div class="nav-back" onclick="Router.pop()"><div class="nav-back-arrow"></div><span>設定</span></div><div class="nav-title">顯示與亮度</div><div style="width:70px;"></div></div>
            <div class="content">
                <div class="group"><div class="group-title">外觀</div><ul class="list">
                    <li><div class="cell"><div class="label">深色模式</div><input class="switch" type="checkbox" id="darkThemeSwitch" ${Store.get('theme') === 'dark' ? 'checked' : ''}></div></li>
                </ul></div>
            </div>
        `,
        faceIdView: () => `
            <div class="nav"><div class="nav-back" onclick="Router.pop()"><div class="nav-back-arrow"></div><span>設定</span></div><div class="nav-title">Face ID 與密碼</div><div style="width:70px;"></div></div>
            <div class="content">
                <div class="group"><ul class="list"><li><div class="cell" onclick="triggerFaceID()"><div class="label" style="color:var(--ios-blue);">測試 Face ID 解鎖</div></div></li></ul></div>
            </div>
        `,
        appsView: () => `
            <div class="nav"><div class="nav-back" onclick="Router.pop()"><div class="nav-back-arrow"></div><span>設定</span></div><div class="nav-title">App 權限管理</div><div style="width:70px;"></div></div>
            <div class="content">
                <div class="group"><ul class="list">
                    <li><div class="cell"><div class="label">相機權限</div><div class="value">4 個 App</div><div class="chevron"></div></div></li>
                    <li><div class="cell"><div class="label">麥克風權限</div><div class="value">2 個 App</div><div class="chevron"></div></div></li>
                </ul></div>
            </div>
        `,
        appleIdView: () => `
            <div class="nav"><div class="nav-back" onclick="Router.pop()"><div class="nav-back-arrow"></div><span>設定</span></div><div class="nav-title">Apple 帳號</div><div style="width:70px;"></div></div>
            <div class="content">
                <div class="group"><ul class="list"><li><div class="cell"><div class="label">姓名</div><input type="text" value="${Store.get('name')}" id="nameInput" style="border:none;background:transparent;text-align:right;font-size:17px;color:var(--ios-text);"></div></li></ul></div>
            </div>
        `
    };

    const Router = {
        render() {
            const container = document.getElementById('viewContainer');
            container.innerHTML = historyStack.map((vId, idx) => `
                <div class="view ${idx > 0 ? 'sub-page active' : ''} ${idx < historyStack.length - 1 ? 'parent-pushed' : ''}" id="${vId}">
                    ${ViewTemplates[vId] ? ViewTemplates[vId]() : ''}
                </div>
            `).join('');
            this.bindEvents();
        },
        push(viewId) {
            historyStack.push(viewId);
            this.render();
        },
        pop() {
            if (historyStack.length <= 1) return;
            const topView = document.getElementById(historyStack[historyStack.length - 1]);
            if (topView) topView.classList.remove('active');
            setTimeout(() => {
                historyStack.pop();
                this.render();
            }, 300);
        },
        bindEvents() {
            const sInput = document.getElementById('searchInput');
            if (sInput) {
                sInput.addEventListener('input', (e) => {
                    const kw = e.target.value.toLowerCase();
                    document.querySelectorAll('.setting-group').forEach(g => {
                        let has = false;
                        g.querySelectorAll('li').forEach(li => {
                            const match = (li.dataset.search || '').toLowerCase().includes(kw);
                            li.style.display = match ? '' : 'none';
                            if (match) has = true;
                        });
                        g.style.display = has ? '' : 'none';
                    });
                });
            }
        }
    };

    /* ===================================================
       5. 事件委派 (解決 darkThemeSwitch null 與 Event Re-bind)
    =================================================== */
    document.addEventListener('change', e => {
        if (e.target.id === 'darkThemeSwitch') {
            Store.set('theme', e.target.checked ? 'dark' : 'light');
            syncThemeUI();
        }
        if (e.target.id === 'flightSwitch') {
            Store.set('flight', e.target.checked);
        }
    });

    document.addEventListener('input', e => {
        if (e.target.id === 'nameInput') {
            Store.set('name', e.target.value);
        }
    });

    function syncThemeUI() {
        const theme = Store.get('theme');
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else document.documentElement.removeAttribute('data-theme');
    }

    /* ===================================================
       6. 手勢防禦修正 (Edge Swipe) & 控制中心手勢
    =================================================== */
    let startX = 0, startY = 0;
    document.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchend', e => {
        const endX = e.changedTouches[0].clientX;
        const endY = e.changedTouches[0].clientY;

        // 手勢 1: 左側边缘右滑返回 (僅限於 Stack > 1)
        if (historyStack.length > 1 && startX < 35 && (endX - startX) > 90) {
            Router.pop();
        }

        // 手勢 2: 右上角下滑開啟控制中心
        if (startX > window.innerWidth - 80 && startY < 80 && (endY - startY) > 100) {
            document.getElementById('controlCenter').classList.add('active');
        }
    });

    document.getElementById('controlCenter').addEventListener('click', (e) => {
        if (e.target.id === 'controlCenter') {
            document.getElementById('controlCenter').classList.remove('active');
        }
    });

    /* ===================================================
       7. Modal 背景滾動鎖定與 Face ID / 動態島 / 滑塊
    =================================================== */
    function triggerFaceID() {
        document.body.style.overflow = "hidden"; // 鎖定背景
        const modal = document.getElementById('faceidModal');
        const box = document.getElementById('faceidBox');
        modal.classList.add('active');
        box.classList.remove('success');

        // 動態島連動
        setIslandContent("🔍 正在進行 Face ID 驗證...");

        setTimeout(() => {
            box.classList.add('success');
            setIslandContent("✓ 解鎖成功");
            setTimeout(() => {
                modal.classList.remove('active');
                document.body.style.overflow = ""; // 恢復滾動
                resetIsland();
            }, 1000);
        }, 1200);
    }

    function setIslandContent(text) {
        const di = document.getElementById('dynamicIsland');
        di.style.width = "220px";
        document.getElementById('diTitle').textContent = text;
    }

    function resetIsland() {
        const di = document.getElementById('dynamicIsland');
        di.style.width = "120px";
        document.getElementById('diTitle').textContent = "72% 電量";
    }

    function toggleIslandExpand() {
        document.getElementById('dynamicIsland').classList.toggle('expanded');
    }

    function unlockDevice() {
        document.getElementById('lockScreen').classList.add('unlocked');
    }

    function handleSlider(e) {
        const rect = e.currentTarget.getBoundingClientRect();
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const height = Math.max(0, Math.min(100, ((rect.bottom - clientY) / rect.height) * 100));
        e.currentTarget.querySelector('.cc-slider-fill').style.height = height + '%';
    }

    // 更新鎖定時間
    setInterval(() => {
        const now = new Date();
        document.getElementById('lsTime').textContent = now.toTimeString().substring(0, 5);
    }, 1000);

    // 初始渲染
    Router.render();
    syncThemeUI();
</script>
</body>
</html>
