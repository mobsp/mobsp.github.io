# GitHub Actions Workflow for Deployment

name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Install dependencies
      run: npm install

    - name: Build project
      run: npm run build

    - name: Set up Git
      run: |
        git config --global user.name 'mobsp'
        git config --global user.email 'user@example.com'

    - name: Inject secure tokens
      env:
        NODE_ENV: production
        SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
      run: echo "Token injected successfully"  

    - name: Push changes
      run: |
        git add .
        git commit -m 'Auto-deployed on 2026-04-03 05:15:44' || echo 'No changes to commit'
        git push origin main
