name: Mobsp KYTK Automated Sync Core

on:
  workflow_dispatch:

  schedule:
    - cron: '0 * * * *' # 每小時自動維護一次

  push:
    branches:
      - main
      - master

# 防止 schedule / push / manual workflow 同時修改相同資料
concurrency:
  group: mbsp-kytk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-python-sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Validate Required Environment
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$GITHUB_REPOSITORY" ]; then
            echo "::error::GITHUB_REPOSITORY is not available."
            exit 1
          fi

          echo "GitHub repository: $GITHUB_REPOSITORY"

      - name: Run Automation Python Script
        env:
          MSK: ${{ secrets.MSK }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python scripts/mbsp-kytk.py