name: Mobsp KYTK Automated Sync Core

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # 可選：每小時自動維護執行一次
  push:
    branches:
      - main
      - master

jobs:
  run-python-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予 GitHub Actions 背景讀寫寫入權限
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Automation Python Script
        env:
          MSK: ${{ secrets.MSK }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/mbsp-kytk.py
