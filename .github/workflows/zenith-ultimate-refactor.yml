name: 🌌 Zenith Ultimate Repository Refactor

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  refactor-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 檢出程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 移除 cache 設定，避免找不到 lock 檔案的錯誤

      - name: 📦 強制初始化與安裝工具
        run: |
          # 檢查是否有 package.json，沒有就初始化
          if [ ! -f package.json ]; then npm init -y; fi
          # 直接安裝必要工具
          npm install glob fs-extra cheerio terser clean-css html-minifier-terser

      - name: 💎 執行「最頂配置」全方位優化腳本
        # 確保路徑指向你存放 master-optimizer-final.js 的位置
        run: node scripts/master-optimizer-final.js

      - name: 🔍 檔案變更審核與自動提交
        run: |
          git config --local user.email "zenith-bot@optimization.com"
          git config --local user.name "Zenith-Optimizer-Bot"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "🚀 [Zenith Ultimate] 自動化進化：全站配置補強"
            git push
          else
            echo "✨ 無變更內容"
          fi

      - name: 📊 生成優化報告
        if: success()
        run: |
          echo "### 🌌 Zenith 優化完成報告" >> $GITHUB_STEP_SUMMARY
          echo "✅ 環境初始化成功並已注入極致配置。" >> $GITHUB_STEP_SUMMARY
