name: Update Anywhere Door Portal

on:
  push:
    branches:
      - main
    paths:
      - 'Ⲙ𝔬ⲃⳝ𝔭_Indexer_Report.csv'  # 只有當報表更新時才觸發

permissions:
  contents: write

jobs:
  refresh-portal:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 檢出代碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: ⚙️ 執行自動化分類索引
        run: python scripts/auto_classify.py

      - name: 🚀 同步更新至 README
        run: |
          git config --global user.name "TiTi-Bot"
          git config --global user.email "titi@mobsp.qzz.io"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: 門禁系統自動更新全站索引" && git push)
