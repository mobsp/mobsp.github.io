name: Tools Premium Auto-Sync Flow

on:
  push:
    branches:
      - main
    paths:
      - 'tol/**'
      - 'scripts/tol_update.py'

permissions:
  contents: write

jobs:
  compile-and-sync:
    runs-on: ubuntu-latest

    steps:
    - name: 🗄️ Checkout Core Repository
      uses: actions/checkout@v4

    - name: 🐍 Initialize Optimized Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 🚀 Execute Engine Synchronization
      run: |
        cd scripts
        python tol_update.py

    - name: 📡 Automated Deployment Git Push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁⲁ𝔠ⲉ Bot"
        git add index.html
        if git diff --cached --quiet; then
          echo "No layout variance detected. Skipping commit."
        else
          git commit -m "chore(auto): fix javascript metrics and compilation matrix"
          git push
        fi
