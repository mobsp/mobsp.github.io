name: 自動解壓縮 file-list.zip

on:
  push:
    paths:
      - 'file-list/file-list.zip'
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 解壓縮 file-list.zip 到 file-list 資料夾
        run: |
          unzip -o file-list/file-list.zip -d file-list/

      - name: 提交並推送變更
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add file-list/
          git commit -m "自動解壓縮 file-list.zip 檔案" || echo "沒有變更需要提交"
          git push