name: 自動巡檢並修復 JS 語法錯誤

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 核心修正：加入這段以允許 Bot 推送程式碼
permissions:
  contents: write

jobs:
  inspect-and-fix:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 注意：請確保 fix_slashes.py 檔案在專案的根目錄下
    - name: Run Fix Slash Script
      run: python fix_slashes.py

    - name: Commit and Push if changed
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        if [ -n "$(git status --porcelain)" ]; then
          echo "偵測到程式碼修正，正在自動提交變更..."
          git add .
          git commit -m "style: 自動修復因腳本錯誤導致的單斜槓註解錯誤 [skip ci]"
          # 這裡直接推送到目前觸發的分支
          git push origin HEAD:${{ github.ref_name }}
        else
          echo "檔案一切正常，無需修改。"
        fi
