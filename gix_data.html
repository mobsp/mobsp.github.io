<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIX Export 資料表</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 20px; background-color: #f9f9f9; }
        h1 { color: #333; text-align: center; }
        
        /* 搜尋框樣式 */
        #searchBar { 
            width: 100%; padding: 12px; margin-bottom: 20px; 
            border: 1px solid #ddd; border-radius: 5px; 
            font-size: 16px; box-sizing: border-box; 
        }

        table { width: 100%; border-collapse: collapse; background-color: white; }
        th, td { padding: 12px; text-align: left; border: 1px solid #ddd; }
        th { background-color: #007bff; color: white; position: sticky; top: 0; }
        tr:nth-child(even) { background-color: #f2f2f2; }

        /* --- 行動版優化 (600px 以下) --- */
        @media screen and (max-width: 600px) {
            thead { display: none; }
            tr { display: block; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; background: white; }
            td { display: flex; justify-content: space-between; border: none; border-bottom: 1px solid #eee; padding: 10px; }
            td::before { content: attr(data-label); font-weight: bold; color: #007bff; margin-right: 10px; }
            td:last-child { word-break: break-all; display: block; text-align: left; border: none; }
            td:last-child::before { display: block; margin-bottom: 5px; }
        }
    </style>
</head>
<body>

    <h1>GIX Export 資料</h1>
    <input type="text" id="searchBar" onkeyup="filterTable()" placeholder="搜尋檔案路徑 (Path)...">

    <table id="dataTable">
        <thead>
            <tr>
                <th>User</th>
                <th>Repo</th>
                <th>Branch</th>
                <th>Path</th>
                <th>Link</th>
            </tr>
        </thead>
        <tbody>
            <tr><td data-label="User">mobsp</td><td data-label="Repo">mobsp.github.io</td><td data-label="Branch">gh-pages</td><td data-label="Path">.htaccess</td><td data-label="Link"><a href="https://mobsp.github.io/tol/.htaccess">連結</a></td></tr>
            <tr><td data-label="User">mobsp</td><td data-label="Repo">mobsp.github.io</td><td data-label="Branch">gh-pages</td><td data-label="Path">.nojekyll</td><td data-label="Link"><a href="https://mobsp.github.io/tol/.nojekyll">連結</a></td></tr>
            <tr><td data-label="User">mobsp</td><td data-label="Repo">mobsp.github.io</td><td data-label="Branch">main</td><td data-label="Path">wiki/index.html</td><td data-label="Link"><a href="https://mobsp.github.io/tol/wiki/index.html">連結</a></td></tr>
        </tbody>
    </table>

    <script>
        function filterTable() {
            let input = document.getElementById("searchBar");
            let filter = input.value.toLowerCase();
            let table = document.getElementById("dataTable");
            let tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) {
                let td = tr[i].getElementsByTagName("td")[3]; // 搜尋第 4 欄 Path
                if (td) {
                    let txtValue = td.textContent || td.innerText;
                    tr[i].style.display = (txtValue.toLowerCase().indexOf(filter) > -1) ? "" : "none";
                }
            }
        }
    </script>
</body>
</html>
