<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mobi UI Gallery｜UI 元件與變體展示</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: rgba(255,255,255,.82);
      --panel-solid: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: rgba(17,24,39,.12);
      --brand: #6d5dfc;
      --brand-2: #14b8a6;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #22c55e;
      --shadow: 0 18px 60px rgba(15,23,42,.10);
      --radius: 22px;
      --radius-sm: 14px;
      --code: #101827;
    }

    [data-theme="dark"] {
      --bg: #080b12;
      --panel: rgba(17,24,39,.78);
      --panel-solid: #111827;
      --text: #f9fafb;
      --muted: #9ca3af;
      --line: rgba(249,250,251,.14);
      --shadow: 0 18px 60px rgba(0,0,0,.42);
      --code: #020617;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(109,93,252,.24), transparent 28%),
        radial-gradient(circle at 80% 0%, rgba(20,184,166,.18), transparent 26%),
        radial-gradient(circle at 80% 80%, rgba(245,158,11,.10), transparent 32%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button, input, select { font: inherit; }

    .app {
      display: grid;
      grid-template-columns: 290px minmax(0,1fr);
      min-height: 100vh;
    }

    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 22px;
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,.36);
      backdrop-filter: blur(18px);
      overflow: auto;
    }

    [data-theme="dark"] aside { background: rgba(8,11,18,.48); }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 22px;
    }

    .logo {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: white;
      font-weight: 900;
      box-shadow: var(--shadow);
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .side-title {
      margin: 18px 0 10px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav button {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      text-align: left;
      border-radius: 14px;
      padding: 10px 12px;
      cursor: pointer;
    }

    .nav button.active,
    .nav button:hover {
      background: var(--panel);
      color: var(--text);
      border-color: var(--line);
    }

    main {
      padding: 28px;
      min-width: 0;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 18px;
      align-items: start;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .hero h2 {
      margin: 0;
      font-size: clamp(28px, 4vw, 52px);
      letter-spacing: -.05em;
      line-height: .95;
    }

    .hero p {
      margin: 14px 0 0;
      color: var(--muted);
      max-width: 820px;
      line-height: 1.8;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 18px 0;
    }

    .search {
      flex: 1;
      min-width: 230px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text);
      padding: 13px 16px;
      outline: none;
    }

    .chip, .theme-btn {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    .chip.active {
      background: var(--text);
      color: var(--bg);
      border-color: transparent;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
    }

    .card {
      grid-column: span 4;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      padding: 18px;
      min-width: 0;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: start;
      margin-bottom: 14px;
    }

    .card h3 {
      margin: 0;
      font-size: 19px;
      letter-spacing: -.02em;
    }

    .card .en {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .tag {
      white-space: nowrap;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 9px;
      color: var(--muted);
      font-size: 12px;
    }

    .preview {
      min-height: 112px;
      display: grid;
      place-items: center;
      border: 1px dashed var(--line);
      border-radius: 18px;
      background: rgba(127,127,127,.04);
      padding: 14px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .variants {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .variant {
      border: 1px solid var(--line);
      color: var(--muted);
      background: transparent;
      border-radius: 999px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    .variant:hover,
    .variant.active {
      color: white;
      background: var(--brand);
      border-color: transparent;
    }

    .demo-btn {
      border: 0;
      border-radius: 14px;
      padding: 11px 16px;
      color: white;
      background: var(--brand);
      font-weight: 700;
      box-shadow: 0 12px 28px rgba(109,93,252,.28);
    }

    .demo-btn.outline {
      color: var(--brand);
      background: transparent;
      border: 1px solid var(--brand);
      box-shadow: none;
    }

    .demo-btn.ghost {
      color: var(--text);
      background: transparent;
      box-shadow: none;
    }

    .demo-btn.danger { background: var(--danger); }
    .demo-btn.success { background: var(--success); }
    .demo-btn.warning { background: var(--warning); }

    .demo-card {
      width: min(220px,100%);
      border-radius: 18px;
      padding: 16px;
      background: var(--panel-solid);
      border: 1px solid var(--line);
      box-shadow: 0 12px 32px rgba(15,23,42,.10);
    }

    .demo-card.media::before {
      content: "";
      display: block;
      height: 70px;
      border-radius: 14px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
    }

    .demo-card h4 { margin: 0 0 6px; }
    .demo-card p { margin: 0; color: var(--muted); font-size: 13px; }

    .demo-input {
      width: min(260px,100%);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      background: var(--panel-solid);
      color: var(--text);
      outline: none;
    }

    .demo-table {
      width: 100%;
      max-width: 290px;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 14px;
      font-size: 13px;
      background: var(--panel-solid);
    }

    .demo-table td, .demo-table th {
      border-bottom: 1px solid var(--line);
      padding: 9px;
      text-align: left;
    }

    .demo-list {
      width: min(280px,100%);
      display: grid;
      gap: 8px;
    }

    .demo-list div {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel-solid);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
    }

    .dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
    }

    .demo-nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .demo-nav span {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 11px;
      background: var(--panel-solid);
      font-size: 13px;
    }

    .demo-alert {
      border-radius: 16px;
      border: 1px solid rgba(109,93,252,.3);
      background: rgba(109,93,252,.12);
      padding: 14px;
      max-width: 280px;
      line-height: 1.5;
    }

    .demo-avatar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: white;
      font-weight: 900;
    }

    .demo-layout {
      width: 230px;
      height: 120px;
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 8px;
    }

    .demo-layout div {
      border-radius: 12px;
      background: var(--panel-solid);
      border: 1px solid var(--line);
    }

    .demo-layout .main-zone {
      display: grid;
      grid-template-rows: 32px 1fr;
      gap: 8px;
      border: 0;
      background: transparent;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    @media (max-width: 1050px) {
      .app { grid-template-columns: 1fr; }
      aside {
        position: relative;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .nav {
        grid-template-columns: repeat(auto-fit,minmax(150px,1fr));
      }
      .card { grid-column: span 6; }
      .hero { grid-template-columns: 1fr; }
    }

    @media (max-width: 680px) {
      main { padding: 16px; }
      aside { padding: 16px; }
      .card { grid-column: span 12; }
      .hero { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <div class="logo">UI</div>
        <div>
          <h1>Mobi UI Gallery</h1>
          <p>元件 × 變體 × 展示</p>
        </div>
      </div>

      <div class="side-title">分類</div>
      <nav class="nav" id="categoryNav"></nav>
    </aside>

    <main>
      <section class="hero">
        <div>
          <h2>UI 元件與變體展示館</h2>
          <p>第一版：把 Layout、Navigation、Form、Feedback、Overlay、Action、Container、Screen 等 UI 元件整理成可搜尋、可切換主題、可點選變體的展示網站。這是後續 UI Builder / Design System Engine 的地基。</p>
        </div>
        <button class="theme-btn" id="themeBtn">切換深色</button>
      </section>

      <div class="toolbar">
        <input class="search" id="searchInput" placeholder="搜尋元件，例如：按鈕、卡片、表格、Modal、Button..." />
        <button class="chip active" data-filter="all">全部</button>
        <button class="chip" data-filter="基礎">基礎</button>
        <button class="chip" data-filter="互動">互動</button>
        <button class="chip" data-filter="系統">系統</button>
      </div>

      <section class="grid" id="gallery"></section>
    </main>
  </div>

  <script>
    const categories = [
      "全部", "Layout 版面", "Navigation 導航", "Typography 標題", "Data Display 資料展示",
      "Forms 表單", "Feedback 回饋", "Overlay 浮層", "Actions 操作", "Identity 身份",
      "Containers 容器", "Screens 螢幕", "System 系統"
    ];

    const components = [
      {
        category: "Actions 操作", level: "基礎", zh: "按鈕", en: "Button",
        variants: ["Primary 主要", "Outline 描邊", "Ghost 幽靈", "Danger 危險", "Success 成功", "Warning 警告", "Loading 載入", "Full-width 滿版"],
        render: v => {
          const key = v.toLowerCase();
          let cls = "demo-btn";
          if (key.includes("outline")) cls += " outline";
          if (key.includes("ghost")) cls += " ghost";
          if (key.includes("danger")) cls += " danger";
          if (key.includes("success")) cls += " success";
          if (key.includes("warning")) cls += " warning";
          const text = key.includes("loading") ? "載入中..." : key.includes("full") ? "滿版按鈕" : "操作按鈕";
          const style = key.includes("full") ? "width:100%;" : "";
          return `<button class="${cls}" style="${style}">${text}</button>`;
        }
      },
      {
        category: "Containers 容器", level: "基礎", zh: "卡片", en: "Card",
        variants: ["Basic 基本", "Media 媒體", "Stats 統計", "Profile 個人", "Outline 描邊", "Glass 玻璃", "Expandable 展開"],
        render: v => `<div class="demo-card ${v.includes("Media") ? "media" : ""}"><h4>${v.split(" ")[1] || "卡片"}</h4><p>這是一張可承載內容、圖片、統計或操作的卡片。</p></div>`
      },
      {
        category: "Forms 表單", level: "基礎", zh: "輸入框", en: "Input",
        variants: ["Text 文字", "Search 搜尋", "Password 密碼", "Outline 描邊", "Filled 填滿", "Error 錯誤", "Readonly 唯讀"],
        render: v => `<input class="demo-input" ${v.includes("Readonly") ? "readonly" : ""} ${v.includes("Password") ? "type='password'" : "type='text'"} placeholder="${v.includes("Search") ? "搜尋..." : v.includes("Error") ? "錯誤狀態" : "輸入內容"}" style="${v.includes("Error") ? "border-color:var(--danger)" : ""}" />`
      },
      {
        category: "Data Display 資料展示", level: "基礎", zh: "表格", en: "Table",
        variants: ["Basic 基本", "Zebra 斑馬紋", "Compact 緊湊", "Editable 可編輯", "Sortable 可排序", "Sticky 固定標題"],
        render: v => `<table class="demo-table"><thead><tr><th>名稱</th><th>狀態</th></tr></thead><tbody><tr><td>Button</td><td>Ready</td></tr><tr><td>Card</td><td>Draft</td></tr></tbody></table>`
      },
      {
        category: "Data Display 資料展示", level: "互動", zh: "列表", en: "List",
        variants: ["Simple 簡單", "Media 媒體", "Activity 動態", "Timeline 時間軸", "Draggable 可拖曳", "Infinite 無限"],
        render: v => `<div class="demo-list"><div><span class="dot"></span><span>元件項目 A</span></div><div><span class="dot"></span><span>元件項目 B</span></div><div><span class="dot"></span><span>元件項目 C</span></div></div>`
      },
      {
        category: "Navigation 導航", level: "互動", zh: "導航列", en: "Navbar",
        variants: ["Top 頂部", "Sticky 固定", "Floating 浮動", "Transparent 透明", "Collapsible 收合"],
        render: v => `<div class="demo-nav"><span>首頁</span><span>元件</span><span>文件</span><span>設定</span></div>`
      },
      {
        category: "Navigation 導航", level: "互動", zh: "標籤", en: "Tabs",
        variants: ["Underline 底線", "Pill 膠囊", "Segmented 分段", "Vertical 垂直", "Scrollable 滾動"],
        render: v => `<div class="demo-nav"><span>Overview</span><span>Variants</span><span>Code</span></div>`
      },
      {
        category: "Feedback 回饋", level: "基礎", zh: "警報", en: "Alert",
        variants: ["Info 資訊", "Success 成功", "Warning 警告", "Error 錯誤", "Loading 載入"],
        render: v => `<div class="demo-alert"><strong>${v.split(" ")[1]}</strong><br>這是一個系統回饋訊息，用來提醒使用者目前狀態。</div>`
      },
      {
        category: "Overlay 浮層", level: "互動", zh: "模態對話框", en: "Modal",
        variants: ["Alert 警示", "Confirm 確認", "Form 表單", "Fullscreen 全螢幕", "Draggable 可拖曳"],
        render: v => `<div class="demo-card"><h4>${v.split(" ")[1]}對話框</h4><p>覆蓋在頁面上的短暫互動層。</p></div>`
      },
      {
        category: "Identity 身份", level: "基礎", zh: "頭像", en: "Avatar",
        variants: ["Circle 圓形", "Rounded 圓角", "Square 方形", "Group 群組", "Status 狀態"],
        render: v => `<div class="demo-avatar"><div class="avatar" style="${v.includes("Square") ? "border-radius:14px" : v.includes("Rounded") ? "border-radius:22px" : ""}">M</div><div><strong>使用者</strong><br><span style="color:var(--muted);font-size:13px;">Online</span></div></div>`
      },
      {
        category: "Layout 版面", level: "系統", zh: "邊欄佈局", en: "Sidebar Layout",
        variants: ["Static 固定", "Mini 迷你", "Overlay 覆蓋", "Resizable 可調整", "Dock 停靠"],
        render: v => `<div class="demo-layout"><div></div><div class="main-zone"><div></div><div></div></div></div>`
      },
      {
        category: "Typography 標題", level: "基礎", zh: "頁面標題", en: "Page Title",
        variants: ["Hero 大標", "Section 章節", "Card 卡片", "With Action 帶操作", "Breadcrumb 麵包屑"],
        render: v => `<div><h2 style="margin:0;letter-spacing:-.04em;">頁面標題</h2><p style="margin:8px 0 0;color:var(--muted);">描述這個頁面的主要用途。</p></div>`
      },
      {
        category: "Screens 螢幕", level: "系統", zh: "設定螢幕", en: "Settings Screen",
        variants: ["Profile 個人", "Security 安全", "Theme 主題", "Notification 通知", "Billing 帳務"],
        render: v => `<div class="demo-card"><h4>設定</h4><p>帳號、主題、通知、權限等頁面模板。</p></div>`
      },
      {
        category: "System 系統", level: "系統", zh: "主題變體", en: "Theme Variants",
        variants: ["Light 亮色", "Dark 暗色", "AMOLED 純黑", "Glass 玻璃", "High Contrast 高對比"],
        render: v => `<div class="demo-card"><h4>${v.split(" ")[1]}</h4><p>透過 Token 控制色彩、陰影、圓角與狀態。</p></div>`
      }
    ];

    const nav = document.getElementById("categoryNav");
    const gallery = document.getElementById("gallery");
    const searchInput = document.getElementById("searchInput");
    const themeBtn = document.getElementById("themeBtn");
    let activeCategory = "全部";
    let activeLevel = "all";
    let selectedVariants = {};

    categories.forEach(cat => {
      const btn = document.createElement("button");
      btn.textContent = cat;
      btn.className = cat === "全部" ? "active" : "";
      btn.onclick = () => {
        activeCategory = cat;
        document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderGallery();
      };
      nav.appendChild(btn);
    });

    document.querySelectorAll(".chip").forEach(chip => {
      chip.onclick = () => {
        activeLevel = chip.dataset.filter;
        document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        renderGallery();
      };
    });

    searchInput.addEventListener("input", renderGallery);

    themeBtn.onclick = () => {
      const isDark = document.documentElement.dataset.theme === "dark";
      document.documentElement.dataset.theme = isDark ? "light" : "dark";
      themeBtn.textContent = isDark ? "切換深色" : "切換亮色";
    };

    function renderGallery() {
      const q = searchInput.value.trim().toLowerCase();

      const filtered = components.filter(item => {
        const matchCategory = activeCategory === "全部" || item.category === activeCategory;
        const matchLevel = activeLevel === "all" || item.level === activeLevel;
        const text = `${item.zh} ${item.en} ${item.category} ${item.level} ${item.variants.join(" ")}`.toLowerCase();
        return matchCategory && matchLevel && text.includes(q);
      });

      gallery.innerHTML = "";

      if (!filtered.length) {
        gallery.innerHTML = `<div class="empty" style="grid-column:1/-1;">找不到符合的元件。換個關鍵字試試。</div>`;
        return;
      }

      filtered.forEach((item, index) => {
        const selected = selectedVariants[item.en] || item.variants[0];

        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="card-head">
            <div>
              <h3>${item.zh}<span class="en">${item.en}</span></h3>
            </div>
            <span class="tag">${item.level}</span>
          </div>
          <div class="preview">${item.render(selected)}</div>
          <div class="variants">
            ${item.variants.map(v => `<button class="variant ${v === selected ? "active" : ""}" data-component="${item.en}" data-variant="${v}">${v}</button>`).join("")}
          </div>
        `;
        gallery.appendChild(card);
      });

      document.querySelectorAll(".variant").forEach(btn => {
        btn.onclick = () => {
          selectedVariants[btn.dataset.component] = btn.dataset.variant;
          renderGallery();
        };
      });
    }

    renderGallery();
  </script>
</body>
</html>
