        [data-theme="light"] {

        .brand-title-img { width: 100%; height: auto; display: block; border-radius: 8px; }

        /* 動態可調類別指示燈 */
        .v-tag { 
            background: var(--indicator-color); color: #000; font-size: 9px; font-weight: 900; 
            padding: 2px 6px; border-radius: 5px; margin-right: 10px; white-space: nowrap;
            transition: background-color 0.3s ease;
            animation: pulse-light var(--indicator-duration) infinite ease-in-out;
        }
        .v-tag.tag-disabled { animation: none !important; opacity: 0.6; }
        @keyframes pulse-light { 0%, 100% { opacity: 1; filter: brightness(1); } 50% { opacity: 0.4; filter: brightness(1.3); } }

        .mq-box { flex: 1; overflow: hidden; white-space: nowrap; position: relative; }
        .mq-text { 
            display: inline-block; padding-left: 100%;
            animation: mq var(--mq-duration) linear infinite;
            font-size: 11px; opacity: 0.9; letter-spacing: 0.5px; color: var(--mq-color);
        }
        @keyframes mq { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* 動態版型核心容器 */
        .app-main {
            flex: 1; transition: var(--transition); overflow-y: auto; overflow-x: hidden; padding: 20px; box-sizing: border-box;
        }

        /* 模式一：滑塊模式（原版橫向滑動） */
        .app-main.layout-slider {
            display: flex; align-items: center; overflow-x: auto; overflow-y: hidden;
            scroll-snap-type: x mandatory; padding: 0 40px; gap: 25px; scrollbar-width: none;
        }
        .app-main.layout-slider::-webkit-scrollbar { display: none; }
        .app-main.layout-slider .action-btn { flex: 0 0 85%; height: 70%; scroll-snap-align: center; }

        /* 模式二：3x3 圖像九宮格模式 */
        .app-main.layout-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; align-content: start; padding-top: 10px;

        .app-main.layout-grid .btn-overlay { padding: 15px 10px 10px; }
        .app-main.layout-grid .btn-title { font-size: 1rem; letter-spacing: 1px; text-align: center; width: 100%; }

        /* 模式三：列表模式 */
        .app-main.layout-list {
            display: flex; flex-direction: column; gap: 10px; padding: 15px;
        }
        .app-main.layout-list .action-btn {
            height: 60px; border-radius: 14px; background-image: none !important;
            background-color: var(--card-bg) !important; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: none;

        .app-main.layout-list .btn-overlay { position: static; padding: 0; background: none; display: flex; width: 100%; justify-content: space-between; align-items: center; }
        .app-main.layout-list .btn-title { color: var(--text-main); font-size: 1.1rem; font-weight: 600; letter-spacing: 1px; }
        .app-main.layout-list .btn-overlay::after { content: "〉"; font-size: 12px; opacity: 0.4; color: var(--text-main); }

        /* 通用按鈕基礎 */
        .action-btn {
            text-decoration: none; border-radius: 40px; position: relative; overflow: hidden; border: 1px solid var(--border-color);
            background-color: #1e272e; background-position: center; background-size: cover;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); transition: var(--transition);

        .action-btn:active { transform: scale(0.96); filter: brightness(0.8); }

        .btn-title { color: #fff; font-size: 1.85rem; font-weight: 800; letter-spacing: 3px; }

        /* iOS 原生系統級通知彈窗 */
        #ios-alert {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4);
            z-index: 10000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        #ios-alert.active { opacity: 1; visibility: visible; }
        .alert-box {
            width: 270px; background: rgba(230, 230, 235, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 14px; text-align: center; animation: alertPop 0.3s cubic-bezier(0.1, 0.8, 0.25, 1); overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); border: 0.5px solid rgba(255,255,255,0.2);

        @keyframes alertPop { 0% { transform: scale(1.15); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .alert-content { padding: 20px 16px; color: #000; }
        .alert-title { font-weight: 600; font-size: 17px; margin-bottom: 5px; }
        .alert-desc { font-size: 13px; line-height: 1.4; color: #333; max-height: 150px; overflow-y: auto; }

        #control-sheet {

        .setting-row { display: flex; justify-content: space-between; align-items: center; min-height: 40px; border-bottom: 0.5px solid rgba(255,255,255,0.05); }
        .setting-row:last-child { border-bottom: none; }
        .setting-name { font-size: 15px; color: #fff; }
        
        /* iOS 原生控制組件樣式 */
        .ios-switch { position: relative; display: inline-block; width: 51px; height: 31px; }
        .ios-switch input { opacity: 0; width: 0; height: 0; }
        .ios-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.15); transition: .4s; border-radius: 34px; }
        .ios-slider:before { position: absolute; content: ""; height: 27px; width: 27px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; box-shadow: 0 3px 8px rgba(0,0,0,0.15); }
        input:checked + .ios-slider { background-color: #30d158; }
        input:checked + .ios-slider:before { transform: translateX(20px); }

        .ios-input { width: 100%; box-sizing: border-box; margin-top: 5px; }
        .ios-range { -webkit-appearance: none; width: 120px; background: rgba(255,255,255,0.2); height: 4px; border-radius: 2px; }
        .ios-range::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }

        .ios-btn { background: var(--primary-color); color: #000; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; width: 100%; margin-top: 5px; transition: opacity 0.2s; cursor: pointer; }
        .ios-btn:active { opacity: 0.8; }

        .app-footer {
            flex-shrink: 0; padding: 15px 20px calc(15px + env(safe-area-inset-bottom));
            background: rgba(11, 11, 12, 0.4); border-top: 1px solid var(--border-color); text-align: center; z-index: 10;

    </style>

const TARGET_REPO = 'mobsp/mobsp.github.io';

const MobiConfig = {
    storageKey: 'mobsp_2026_settings',
    defaults: {
        alertTitle: '重要通知',
        alertDesc: '歡迎造訪 Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁⲠⲉ (莫比空間) 第二階段全新升級版入口導航網。',
        alertHasShown: false,
        layout: 'layout-slider',
        theme: 'dark',
        mqSource: 'supabase',
        customMqText: '此處為本機自訂實時跑馬燈串流文字數據...',
        mqSpeed: 45,
        mqColor: '#f1f2f6',
        indicatorActive: true,
        indicatorColor: 'var(--primary-color)',
        indicatorSpeed: '2s'
    },

    load() {
        const local = localStorage.getItem(this.storageKey);
        return local ? { ...this.defaults, ...JSON.parse(local) } : { ...this.defaults };
    },

    save(data) {
        localStorage.setItem(this.storageKey, JSON.stringify(data));
    }
};

document.addEventListener('DOMContentLoaded', () => {
    // 啟動 Splash 畫面移除常規機制
    const splash = document.getElementById('fake-splash');
    const hideSplash = () => {
        setTimeout(() => {
            if (splash) {
                splash.classList.add('fade-out');
                setTimeout(() => { if(splash.parentNode) splash.remove(); }, 800);
            }
        }, 800);
    };
    window.addEventListener('load', hideSplash);
    setTimeout(hideSplash, 3000);

    // 核心初始化
    initMobiSpace();
});

async function initMobiSpace() {
    const config = MobiConfig.load();
    
    // --- 節點快取 ---
    const mainContainer = document.getElementById('main-container');
    const iosAlert = document.getElementById('ios-alert');
    const alertTitle = document.getElementById('alert-title');
    const alertDesc = document.getElementById('alert-desc');
    const alertCloseBtn = document.getElementById('alert-close-btn');
    const controlSheet = document.getElementById('control-sheet');
    
    // --- 介面外觀即時初始化渲染 ---
    const applyRealtimeUI = (cfg) => {
        document.body.setAttribute('data-theme', cfg.theme);
        mainContainer.className = `app-main ${cfg.layout}`;
        
        // 跑馬燈自訂控制
        document.documentElement.style.setProperty('--mq-duration', `${cfg.mqSpeed}s`);
        document.documentElement.style.setProperty('--mq-color', cfg.mqColor);
        document.documentElement.style.setProperty('--indicator-color', cfg.indicatorColor);
        document.documentElement.style.setProperty('--indicator-duration', cfg.indicatorSpeed);
        
        const vTag = document.getElementById('v-tag');
        if (!cfg.indicatorActive) {
            vTag.classList.add('tag-disabled');
        } else {
            vTag.classList.remove('tag-disabled');
        }
    };
    applyRealtimeUI(config);

    // --- 渲染首頁卡片模組 ---
    const renderCards = (cardsArray) => {
        if (!cardsArray || cardsArray.length === 0) return;
        mainContainer.innerHTML = '';
        cardsArray.forEach(card => {
            const a = document.createElement('a');
            a.href = card.url;
            a.className = `action-btn btn-${card.id}`;
            a.style.backgroundImage = `url('${card.image}')`;
            a.setAttribute('aria-label', `前往${card.title}`);
            
            const overlay = document.createElement('div');
            overlay.className = 'btn-overlay';
            
            const title = document.createElement('div');
            title.className = 'btn-title';
            title.innerText = card.title;
            
            overlay.appendChild(title);
            a.appendChild(overlay);
            mainContainer.appendChild(a);
        });
    };

    // 載入卡片策略：優先抓取靜態配置 json
    let cardsData = [];
    try {
        const res = await fetch('pages-config.json');
        if (res.ok) cardsData = await res.json();
    } catch(e) { console.warn("未發現本地快取 JSON，轉用原版備份結構"); }
    
    if (cardsData.length > 0) {
        renderCards(cardsData);
    }

    // --- 彈窗處理邏輯 ---
    if (!config.alertHasShown) {
        alertTitle.innerText = config.alertTitle;
        alertDesc.innerText = config.alertDesc;
        setTimeout(() => iosAlert.classList.add('active'), 1200);
    }
    alertCloseBtn.addEventListener('click', () => {
        iosAlert.classList.remove('active');
        config.alertHasShown = true;
        MobiConfig.save(config);
    });

    // --- 跑馬燈數據源系統處理 ---
    const initNoticeLine = async () => {
        const vTag = document.getElementById('v-tag');
        const mqText = document.getElementById('mq-text');
        
        if (config.mqSource === 'custom') {
            vTag.innerText = 'LOCAL | CUSTOM';
            mqText.innerText = config.customMqText;
            return;
        }

        // 預設走雲端 Supabase
        try {
            if (typeof supabase !== 'undefined') {
                const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                const { data, error } = await client.from('notices').select('type, message').order('created_at', { ascending: false });
                if (!error && data.length > 0) {
                    const randomItem = data[Math.floor(Math.random() * data.length)];
                    const category = randomItem.type || "NEWS";
                    vTag.innerText = `v2.5 | ${category}`;
                    mqText.innerText = randomItem.message || "";
                }
            }
        } catch(err) {
            vTag.innerText = 'OFFLINE | STABLE';
            mqText.innerText = '正在從本機快取提供安全環境安全防線常駐中...';
        }
    };
    initNoticeLine();

    // --- 控制中心抽屜開啟關閉機制交互 ---
    const openBtn = document.getElementById('open-control-btn');
    const closeBtnHeader = document.getElementById('sheet-header-close');
    const closeBtnHandle = document.getElementById('sheet-handle-close');

    const toggleSheet = (show) => {
        if (show) {
            document.getElementById('cfg-alert-title').value = config.alertTitle;
            document.getElementById('cfg-alert-desc').value = config.alertDesc;
            document.getElementById('cfg-layout').value = config.layout;
            document.getElementById('cfg-theme').value = config.theme;
            document.getElementById('cfg-mq-source').value = config.mqSource;
            document.getElementById('cfg-mq-text').value = config.customMqText;
            document.getElementById('cfg-mq-speed').value = config.mqSpeed;
            document.getElementById('cfg-mq-color').value = config.mqColor;
            document.getElementById('cfg-indicator-toggle').checked = config.indicatorActive;
            document.getElementById('cfg-indicator-color').value = config.indicatorColor;
            document.getElementById('cfg-indicator-speed').value = config.indicatorSpeed;

            document.getElementById('custom-mq-row').style.display = config.mqSource === 'custom' ? 'flex' : 'none';

            controlSheet.classList.add('active');
        } else {
            controlSheet.classList.remove('active');
        }
    };

    openBtn.addEventListener('click', (e) => { e.preventDefault(); toggleSheet(true); });
    closeBtnHeader.addEventListener('click', () => toggleSheet(false));
    closeBtnHandle.addEventListener('click', () => toggleSheet(false));

    // --- 控制中心元件動態監聽變更事件 ---
    document.getElementById('cfg-alert-title').addEventListener('input', (e) => { config.alertTitle = e.target.value; MobiConfig.save(config); });
    document.getElementById('cfg-alert-desc').addEventListener('input', (e) => { config.alertDesc = e.target.value; config.alertHasShown = false; MobiConfig.save(config); });
    
    document.getElementById('cfg-layout').addEventListener('change', (e) => {
        config.layout = e.target.value;
        MobiConfig.save(config);
        applyRealtimeUI(config);
    });

    document.getElementById('cfg-theme').addEventListener('change', (e) => {
        config.theme = e.target.value;
        MobiConfig.save(config);
        applyRealtimeUI(config);
    });

    document.getElementById('cfg-mq-source').addEventListener('change', (e) => {
        config.mqSource = e.target.value;
        document.getElementById('custom-mq-row').style.display = config.mqSource === 'custom' ? 'flex' : 'none';
        MobiConfig.save(config);
        initNoticeLine();
    });

    document.getElementById('cfg-mq-text').addEventListener('input', (e) => {
        config.customMqText = e.target.value;
        MobiConfig.save(config);
        if(config.mqSource === 'custom') initNoticeLine();
    });

    document.getElementById('cfg-mq-speed').addEventListener('input', (e) => {
        config.mqSpeed = e.target.value;
        MobiConfig.save(config);
        applyRealtimeUI(config);
    });

    document.getElementById('cfg-mq-color').addEventListener('input', (e) => {
        config.mqColor = e.target.value;
        MobiConfig.save(config);
        applyRealtimeUI(config);
    });

    document.getElementById('cfg-indicator-toggle').addEventListener('change', (e) => {
        config.indicatorActive = e.target.checked;
        MobiConfig.save(config);
        applyRealtimeUI(config);
    });

    document.getElementById('cfg-indicator-color').addEventListener('change', (e) => {
        config.indicatorColor = e.target.value;
        MobiConfig.save(config);
        applyRealtimeUI(config);
    });

    document.getElementById('cfg-indicator-speed').addEventListener('change', (e) => {
        config.indicatorSpeed = e.target.value;
        MobiConfig.save(config);
        applyRealtimeUI(config);
    });

    // --- 核心免憑證深度遞迴掃描功能：遍歷任何層級的 .html 與 index.html ---
    document.getElementById('btn-sync-now').addEventListener('click', async () => {
        const btn = document.getElementById('btn-sync-now');
        btn.innerText = '正在全站深度掃描中...';
        btn.disabled = true;

        try {
            // 使用 GitHub Git Tree API 進行遞迴抓取（recursive=1 取得所有深度的檔案與資料夾結構）
            const response = await fetch(`https://api.github.com/repos/${TARGET_REPO}/git/trees/HEAD?recursive=1`);
            
            if (response.ok) {
                const data = await response.json();
                const items = data.tree || [];
                
                // 過濾出所有 .html 檔案，並且排除根目錄的 index.html（首頁本身）
                const htmlFiles = items.filter(item => {
                    if (item.type !== 'blob') return false;
                    const path = item.path.toLowerCase();
                    if (!path.endsWith('.html')) return false;
                    if (path === 'index.html') return false;
                    return true;
                });

                const presetMeta = {
                    "blog": "部落格", "tol": "工具庫", "music": "音樂頻道",
                    "shorts": "Shorts", "wiki": "支援中心", "setting": "設定"
                };

                const dynamicCards = htmlFiles.map(file => {
                    const parts = file.path.split('/');
                    let id, url;
                    
                    if (parts.length > 1 && parts[parts.length - 1] === 'index.html') {
                        id = parts[parts.length - 2]; // 子資料夾名稱
                        url = `/${parts.slice(0, -1).join('/')}/`;
                    } else {
                        id = parts[parts.length - 1].replace('.html', '');
                        url = `/${file.path}`;
                    }

                    return {
                        id: id,
                        title: presetMeta[id] || id.toUpperCase(),
                        url: url,
                        image: `/assets/brand/ms-${id}.webp`
                    };
                });

                if (dynamicCards.length > 0) {
                    renderCards(dynamicCards);
                    alert(`深度掃描成功！共找到 ${dynamicCards.length} 個 HTML 頁面並完成渲染。`);
                } else {
                    alert('未在儲存庫中找到其他有效的 HTML 頁面。');
                }
            } else {
                if (response.status === 403) {
                    alert('API 請求次數超限（GitHub 限制同 IP 每小時 60 次），請稍後再試。');
                } else {
                    alert(`深度掃描失敗 (錯誤代碼: ${response.status})`);
                }
            }
        } catch (err) {
            alert('網路異常，無法連接至 GitHub API。');
        } finally {
            btn.innerText = '🔄 立即全站深度掃描儲存庫';
            btn.disabled = false;
        }
    });
}
</script>

<script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {})); }</script>
