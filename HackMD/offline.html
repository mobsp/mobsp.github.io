<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>莫比空間｜Ⲙ𝔬ⲃⳝ𝔭 文學網</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            background: #000; color: #d1d5db; margin: 0; padding: 20px;
            -webkit-user-select: none; user-select: none;
        }
        .offline-header {
            border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px;
            font-size: 14px; color: #ff3b30; font-weight: bold;
        }
        #offline-content {
            font-size: 16px; line-height: 1.8; white-space: pre-wrap; word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="offline-header">⚠️ 狀態: 離線中 🔴  - 切換至純文字快取閱讀模式</div>
    <div id="offline-content">讀取 Cache 內容中...</div>
    <script>
        const cachedText = localStorage.getItem('last_read_pure_text') || "🔴 離線中，無法載入緩存的內容";
        document.getElementById('offline-content').innerText = cachedText;
    </script>
</body>
</html>
