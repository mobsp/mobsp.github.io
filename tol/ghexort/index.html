<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Mobsp LINE Style Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Mobsp Explorer</h1>
  </header>

  <main id="app">
    <section id="home" class="page active">
      <h2>首頁</h2>
      <p>這裡是首頁內容</p>
    </section>

    <section id="chat" class="page">
      <h2>聊天</h2>
      <p>這裡模擬聊天列表</p>
    </section>

    <section id="friends" class="page">
      <h2>好友</h2>
      <p>這裡顯示好友清單</p>
    </section>

    <section id="settings" class="page">
      <h2>設定</h2>
      <p>這裡是設定頁面</p>
    </section>
  </main>

  <nav id="tabbar">
    <button data-target="home">首頁</button>
    <button data-target="chat">聊天</button>
    <button data-target="friends">好友</button>
    <button data-target="settings">設定</button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
