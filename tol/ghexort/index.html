<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Mobsp LINE Style Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 頂部固定 Header -->
  <header>
    <h1>Mobsp Explorer</h1>
  </header>

  <!-- 中間內容區 (SPA 子頁面) -->
  <main id="app">
    <!-- 首頁 -->
    <section id="home" class="page active">
      <h2>首頁</h2>
      <p>這裡是首頁內容</p>
      <button id="home-btn">點我互動</button>
    </section>

    <!-- 聊天 -->
    <section id="chat" class="page">
      <h2>聊天</h2>
      <ul id="chat-list"></ul>
      <input id="chat-input" type="text" placeholder="輸入訊息">
      <button id="chat-send">送出</button>
    </section>

    <!-- 好友 -->
    <section id="friends" class="page">
      <h2>好友</h2>
      <ul id="friends-list">
        <li>好友 A <button class="add-friend">加好友</button></li>
        <li>好友 B <button class="add-friend">加好友</button></li>
      </ul>
    </section>

    <!-- 設定 -->
    <section id="settings" class="page">
      <h2>設定</h2>
      <button id="toggle-theme">切換主題</button>
    </section>
  </main>

  <!-- 底部固定 Tab Bar -->
  <nav id="tabbar">
    <button data-target="home" class="active">首頁</button>
    <button data-target="chat">聊天</button>
    <button data-target="friends">好友</button>
    <button data-target="settings">設定</button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
