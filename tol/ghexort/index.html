<meta name="description" content="GitHub Repo Explorer | MOBSP"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="canonical" href="https://mobsp.qzz.io/tol/ghexort/index.html"><meta property="og:type" content="website"><meta property="og:title" content="GitHub Repo Explorer"><meta property="og:description" content="GitHub Repo Explorer | MOBSP"><meta property="og:url" content="https://mobsp.qzz.io/tol/ghexort/index.html"><meta property="og:site_name" content="MOBSP"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="GitHub Repo Explorer"><meta name="twitter:description" content="GitHub Repo Explorer | MOBSP"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="/manifest.json"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="/icons/icon-192.webp"></head>
<body>
  <header>
    <h1>GitHub Repo Explorer</h1>
    <input id="repo-input" type="text" placeholder="輸入 username/repo">
    <button id="load-btn">載入</button>
  </header>
  <main>
    <aside id="sidebar">
      <h2>檔案清單</h2>
      <ul id="file-tree"></ul>

    <section id="viewer">

    </section>
