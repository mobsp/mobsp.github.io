<!DOCTYPE html>
<html lang="zh-TW" class="h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>莫比空間｜AdvancEditor編輯器＋</title>

    <!-- PWA Manifest 與品牌 Icon 設定 (連動根目錄 manifest.json) -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/jpeg" href="https://mobsp.qzz.io/assets/brand/ms-logo1.JPEG">

    <!-- iOS Safari 原生 App 全螢幕與狀態列最佳化 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Supreme Editor">
    <link rel="apple-touch-icon" href="https://mobsp.qzz.io/assets/brand/ms-logo1.JPEG">

    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- KaTeX 數學公式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <!-- Mermaid 圖表 -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.2.4/dist/mermaid.min.js"></script>
    <!-- DOMPurify XSS 防護 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js"></script>
    <!-- Prism.js 靜態語法高亮 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <style>
        /* 全域鎖死防晃動與橡皮筋效應 */
        html, body {
            height: 100dvh;
            width: 100vw;
            overflow: hidden !important;
            overscroll-behavior: none !important;
            position: fixed;
            inset: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            background-color: #000000;
        }

        .ios-blur {
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            background-color: rgba(28, 28, 30, 0.85);
        }

        .sheet-transition {
            transition: transform 0.35s cubic-bezier(0.15, 0.85, 0.35, 1.2);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 順暢慣性滾動 */
        .smooth-scroll {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }

        /* 沉浸專注模式 (Zen Mode) */
        body.zen-mode header, body.zen-mode #tabBarNav {
            opacity: 0.05;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* 閱後即焚 / 隱私模糊模式 */
        body.burn-mode #editor, body.burn-mode #previewContainer {
            filter: blur(12px);
            transition: filter 0.3s ease;
        }
        body.burn-mode #editor:focus, body.burn-mode #previewContainer:hover {
            filter: blur(0px);
        }

        /* Markdown 樣式與渲染優化 */
        .prose { content-visibility: auto; contain-intrinsic-size: 1px 500px; }
        .prose h1 { font-size: 1.65rem; font-weight: 700; margin-bottom: 0.5rem; border-bottom: 1px solid #38383A; padding-bottom: 0.25rem; }
        .prose h2 { font-size: 1.35rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; }
        .prose p { margin-bottom: 0.75rem; line-height: 1.65; }
        .prose ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 1rem; }
        .prose code { background: #2C2C2E; padding: 0.15rem 0.4rem; border-radius: 6px; font-family: ui-monospace, monospace; font-size: 0.88em; color: #FF9F0A; }
        .prose pre code { background: transparent; color: inherit; }
        
        /* 動態島與浮動選單動畫 */
        #dynamicPill, #floatingBubbleBar {
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Wiki-Link 與 Hashtag 高亮 */
        .wiki-link { color: #0A84FF; font-weight: 600; text-decoration: underline; cursor: pointer; }
        .hashtag { color: #30D158; font-weight: 600; }
    </style>
</head>
<body class="text-white h-[100dvh] w-screen flex flex-col justify-between select-none bg-black">

    <!-- 動態島膠囊通知 (Dynamic Island Pill) -->
    <div id="dynamicPill" class="fixed top-3 left-1/2 -translate-x-1/2 bg-[#1C1C1E]/90 ios-blur border border-[#38383A] text-white text-xs px-4 py-1.5 rounded-full shadow-2xl z-50 opacity-0 pointer-events-none flex items-center gap-2">
        <i id="pillIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="pillText">系統已同步</span>
    </div>

    <!-- Spotlight 全域搜尋與命令面板 -->
    <div id="spotlightOverlay" class="hidden fixed inset-0 bg-black/60 ios-blur z-50 flex flex-col pt-16 px-4" onclick="toggleSpotlight(false)">
        <div class="bg-[#1C1C1E] border border-[#38383A] rounded-2xl p-3 shadow-2xl max-w-lg mx-auto w-full" onclick="event.stopPropagation()">
            <div class="flex items-center gap-2 bg-[#2C2C2E] px-3 py-2 rounded-xl">
                <i class="fa-solid fa-magnifying-glass text-[#8E8E93]"></i>
                <input id="spotlightInput" type="text" placeholder="搜尋筆記、標籤 (#)、Wiki 連結或指令..." class="w-full bg-transparent text-white outline-none text-base" oninput="handleSpotlightSearch(this.value)">
                <button onclick="toggleSpotlight(false)" class="text-[#0A84FF] text-sm font-semibold">關閉</button>
            </div>
            <div id="spotlightResults" class="mt-3 max-h-60 overflow-y-auto space-y-2 text-sm text-[#8E8E93]">
                <div class="p-2">輸入關鍵字進行模糊搜尋...</div>
            </div>
        </div>
    </div>

    <!-- Git 本地版本時間軸面板 -->
    <div id="timelineOverlay" class="hidden fixed inset-0 bg-black/70 ios-blur z-50 flex flex-col justify-end" onclick="toggleTimeline(false)">
        <div class="bg-[#1C1C1E] rounded-t-[24px] p-5 max-h-[70vh] overflow-y-auto border-t border-[#38383A] max-w-lg mx-auto w-full" onclick="event.stopPropagation()">
            <div class="w-10 h-1.5 bg-[#48484A] rounded-full mx-auto mb-4"></div>
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-clock-rotate-left text-[#0A84FF]"></i> Git 本地版本時間軸</h3>
                <button onclick="toggleTimeline(false)" class="text-[#0A84FF] font-semibold">關閉</button>
            </div>
            <div id="timelineList" class="space-y-3"></div>
        </div>
    </div>

    <!-- 虛擬檔案系統 (VFS) 檔案管理面板 -->
    <div id="vfsOverlay" class="hidden fixed inset-0 bg-black/70 ios-blur z-50 flex flex-col justify-end" onclick="toggleVFS(false)">
        <div class="bg-[#1C1C1E] rounded-t-[24px] p-5 max-h-[75vh] overflow-y-auto border-t border-[#38383A] max-w-lg mx-auto w-full" onclick="event.stopPropagation()">
            <div class="w-10 h-1.5 bg-[#48484A] rounded-full mx-auto mb-4"></div>
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-folder-tree text-amber-400"></i> 本地虛擬檔案系統 (VFS)</h3>
                <button onclick="createNewFilePrompt()" class="text-[#0A84FF] text-sm font-semibold">+ 新增檔案</button>
            </div>
            <div id="vfsFileList" class="space-y-2"></div>
        </div>
    </div>

    <!-- 頁首與導航欄容器 (固定鎖死 flex-none) -->
    <div class="flex-none z-30 pt-[env(safe-area-inset-top)] bg-black">
        <!-- 頂部導航欄 -->
        <header id="mainHeader" class="ios-blur px-4 py-2.5 flex items-center justify-between border-b border-[#38383A] transition-all duration-300">
            <button onclick="toggleZenMode()" class="text-[#0A84FF] text-base active:opacity-50 transition flex items-center gap-1" title="專注模式">
                <i class="fa-solid fa-expand text-sm"></i>
                <span>專注</span>
            </button>
            
            <div class="flex flex-col items-center cursor-pointer" onclick="toggleSpotlight(true)">
                <span id="docTitle" class="text-base font-semibold leading-tight flex items-center gap-1">
                    <span id="currentFileNameDisplay">預設筆記.md</span>
                    <i class="fa-solid fa-chevron-down text-[10px] text-[#8E8E93]"></i>
                </span>
                <span id="wordCount" class="text-[10px] text-[#8E8E93] font-medium leading-none mt-0.5">0 字元 · 預估 0 分鐘閱讀</span>
            </div>
            
            <button onclick="openActionSheet()" class="w-8 h-8 rounded-full bg-[#2C2C2E] flex items-center justify-center text-[#0A84FF] active:bg-[#3A3A3C] transition">
                <i class="fa-solid fa-ellipsis"></i>
            </button>
        </header>

        <!-- iOS 分段控制頁籤 (Segmented Control) -->
        <div id="tabBarNav" class="bg-[#000000] px-4 py-2 border-b border-[#38383A] flex items-center justify-between">
            <div class="bg-[#1C1C1E] p-1 rounded-lg flex w-full max-w-sm mx-auto shadow-sm items-center">
                <button id="tabEdit" onclick="switchTab('edit')" class="flex-1 bg-[#3A3A3C] text-white rounded-md py-1.5 text-sm font-semibold shadow-sm transition-all duration-200">
                    編輯
                </button>
                <button id="tabSplit" onclick="switchTab('split')" class="px-3 text-[#8E8E93] rounded-md py-1.5 text-xs font-medium transition-all duration-200">
                    雙欄
                </button>
                <button id="tabPreview" onclick="switchTab('preview')" class="flex-1 text-[#8E8E93] rounded-md py-1.5 text-sm font-medium transition-all duration-200">
                    預覽
                </button>
            </div>
        </div>
    </div>

    <!-- 編輯器主體區域 (完全沉浸純潔寫作視角) -->
    <main id="mainViewport" class="flex-1 min-h-0 w-full relative bg-[#000000] flex overflow-hidden">
        
        <!-- 編輯區容器 -->
        <div id="editContainer" class="flex-1 w-full flex flex-col h-full min-w-0 overflow-hidden">
            <textarea id="editor" class="w-full flex-1 bg-transparent text-white text-[16px] sm:text-[17px] p-4 outline-none resize-none leading-relaxed smooth-scroll no-scrollbar" spellcheck="false" placeholder="開始撰寫筆記... (點擊右下角按鈕或選取文字時，將自動跳出浮動工具列)"></textarea>
        </div>

        <!-- 預覽區容器 -->
        <div id="previewContainer" class="hidden flex-1 w-full h-full min-w-0 bg-[#000000] p-4 md:p-6 overflow-y-auto smooth-scroll prose text-white transition-all duration-300"></div>
    </main>

    <!-- 🌟 選取文字 / 長按觸發：iOS 原生感浮動編輯膠囊選單 (Floating Bubble Bar) -->
    <div id="floatingBubbleBar" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#1C1C1E]/90 ios-blur border border-[#38383A] rounded-full px-3 py-1.5 shadow-2xl z-40 scale-95 opacity-0 pointer-events-none flex items-center gap-1.5">
        <button onclick="insertFormat('# ')" class="px-2.5 py-1 bg-[#2C2C2E] active:bg-[#3A3A3C] rounded-full text-white text-xs font-bold">H1</button>
        <button onclick="insertFormat('## ')" class="px-2.5 py-1 bg-[#2C2C2E] active:bg-[#3A3A3C] rounded-full text-white text-xs font-bold">H2</button>
        <button onclick="wrapSelection('**', '**')" class="px-2.5 py-1 bg-[#2C2C2E] active:bg-[#3A3A3C] rounded-full text-white text-xs font-bold">B</button>
        <button onclick="insertFormat('- ')" class="px-2 py-1 bg-[#2C2C2E] active:bg-[#3A3A3C] rounded-full text-white text-xs"><i class="fa-solid fa-list-ul"></i></button>
        <div class="h-4 w-[1px] bg-[#38383A] mx-0.5"></div>
        <button onclick="wrapSelection('$$\n', '\n$$')" class="px-2.5 py-1 bg-[#2C2C2E] active:bg-[#3A3A3C] rounded-full text-white text-[11px] font-mono">KaTeX</button>
        <button onclick="wrapSelection('```mermaid\ngraph TD;\nA-->B;\n
