<!DOCTYPE html>
<html lang="zh-TW" class="h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>莫比空間｜AdvancEditor編輯器＋</title>

    <!-- PWA Manifest 與品牌 Icon 設定 -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/jpeg" href="https://mobsp.qzz.io/assets/brand/ms-logo1.webp">

    <!-- iOS Safari 原生 App 全螢幕與狀態列最佳化 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Supreme Editor">
    <link rel="apple-touch-icon" href="https://mobsp.qzz.io/assets/brand/ms-logo1.webp">

    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- KaTeX 數學公式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <!-- Mermaid 圖表 -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.2.4/dist/mermaid.min.js"></script>
    <!-- DOMPurify XSS 防護 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js"></script>
    <!-- Prism.js 靜態語法高亮 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <style>
        /* 全域鎖死防晃動與橡皮筋效應 */
        html, body {
            height: 100dvh;
            width: 100vw;
            overflow: hidden !important;
            overscroll-behavior: none !important;
            position: fixed;
            inset: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            background-color: #000000;
        }

        .ios-blur {
            backdrop-filter: saturate(190%) blur(25px);
            -webkit-backdrop-filter: saturate(190%) blur(25px);
            background-color: rgba(28, 28, 30, 0.82);
        }

        .sheet-transition {
            transition: transform 0.35s cubic-bezier(0.15, 0.85, 0.35, 1.2);
        }

        .popover-anim {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .smooth-scroll {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }

        /* 沉浸專注模式 (Zen Mode) */
        body.zen-mode header, body.zen-mode #tabBarNav, body.zen-mode #accessoryBar {
            opacity: 0.05;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* 閱後即焚 / 隱私模糊模式 */
        body.burn-mode #editor, body.burn-mode #previewContainer {
            filter: blur(14px);
            transition: filter 0.3s ease;
        }
        body.burn-mode #editor:focus, body.burn-mode #previewContainer:hover {
            filter: blur(0px);
        }

        /* Markdown 樣式與渲染優化 */
        .prose { content-visibility: auto; contain-intrinsic-size: 1px 500px; }
        .prose h1 { font-size: 1.65rem; font-weight: 700; margin-bottom: 0.5rem; border-bottom: 1px solid #38383A; padding-bottom: 0.25rem; }
        .prose h2 { font-size: 1.35rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; }
        .prose p { margin-bottom: 0.75rem; line-height: 1.65; }
        .prose ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 1rem; }
        .prose code { background: #2C2C2E; padding: 0.15rem 0.4rem; border-radius: 6px; font-family: ui-monospace, monospace; font-size: 0.88em; color: #FF9F0A; }
        .prose pre code { background: transparent; color: inherit; }
        
        #dynamicPill {
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }

        .wiki-link { color: #0A84FF; font-weight: 600; text-decoration: underline; cursor: pointer; }
        .hashtag { color: #30D158; font-weight: 600; }
    </style>
</head>
<body class="text-white h-[100dvh] w-screen flex flex-col justify-between select-none bg-black">

    <!-- 動態島膠囊通知 (Dynamic Island Pill) -->
    <div id="dynamicPill" class="fixed top-3 left-1/2 -translate-x-1/2 bg-[#1C1C1E]/90 ios-blur border border-[#38383A] text-white text-xs px-4 py-1.5 rounded-full shadow-2xl z-50 opacity-0 pointer-events-none flex items-center gap-2">
        <i id="pillIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="pillText">系統已同步</span>
    </div>

    <!-- iOS 長按/點擊選取浮動工具列 -->
    <div id="floatingMenu" class="fixed hidden z-50 bg-[#1C1C1E]/95 ios-blur border border-[#38383A] rounded-2xl p-1.5 shadow-2xl text-xs flex items-center gap-1 popover-anim scale-95 opacity-0">
        <button onclick="insertText('**', '**'); hideFloatingMenu();" class="px-2.5 py-1.5 bg-[#2C2C2E] active:bg-[#3A3A3C] rounded-xl font-bold text-white transition active:scale-95">B</button>
        <button onclick="insertText('# '); hideFloatingMenu();" class="px-2.5 py-1.5 bg-[#2C2C2E] active:bg-[#3A3A3C] rounded-xl font-semibold text-white transition active:scale-95">H1</button>
        <button onclick="insertText('## '); hideFloatingMenu();" class="px-2.5 py-1.5 bg-[#2C2C2E] active:bg-[#3A3A3C] rounded-xl font-semibold text-white transition active:scale-95">H2</button>
        <button onclick="insertText('- '); hideFloatingMenu();" class="px-2.5 py-1.5 bg-[#2C2C2E] active:bg-[#3A3A3C] rounded-xl text-white transition active:scale-95"><i class="fa-solid fa-list-ul"></i></button>
        <div class="w-[1px] h-4 bg-[#38383A] mx-0.5"></div>
        <button onclick="insertText('$$\n', '\n$$'); hideFloatingMenu();" class="px-2.5 py-1.5 bg-[#2C2C2E] active:bg-[#3A3A3C] rounded-xl font-mono text-amber-400 transition active:scale-95">KaTeX</button>
        <button onclick="insertText('```mermaid\ngraph TD;\nA-->B;\n```'); hideFloatingMenu();" class="px-2.5 py-1.5 bg-[#2C2C2E] active:bg-[#3A3A3C] rounded-xl font-mono text-cyan-400 transition active:scale-95"><i class="fa-solid fa-diagram-project"></i></button>
        <button onclick="insertText('[[', ']]'); hideFloatingMenu();" class="px-2.5 py-1.5 bg-[#2C2C2E] active:bg-[#3A3A3C] rounded-xl text-blue-400 font-semibold transition active:scale-95">Wiki</button>
    </div>

    <!-- 筆記詳細資訊 Modal -->
    <div id="docDetailModal" class="hidden fixed inset-0 bg-black/70 ios-blur z-50 flex items-center justify-center p-4" onclick="closeDocDetailModal()">
        <div class="bg-[#1C1C1E] border border-[#38383A] rounded-2xl p-5 shadow-2xl max-w-sm w-full space-y-4" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center border-b border-[#38383A] pb-3">
                <h3 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-circle-info text-[#0A84FF]"></i> 筆記詳細資訊
                </h3>
                <button onclick="closeDocDetailModal()" class="text-[#8E8E93] hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div class="space-y-1.5">
                <label class="text-xs text-[#8E8E93] font-medium">筆記檔名 (含副檔名)</label>
                <div class="flex items-center gap-2">
                    <input id="detailFileNameInput" type="text" class="flex-1 bg-[#2C2C2E] border border-[#38383A] rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-[#0A84FF]">
                    <button onclick="saveRenamedFile()" class="bg-[#0A84FF] text-white px-3.5 py-2 rounded-xl text-xs font-semibold active:opacity-80">儲存</button>
                </div>
            </div>

            <div class="bg-[#2C2C2E] rounded-xl p-3 space-y-2 text-xs">
                <div class="flex justify-between text-[#8E8E93]">
                    <span>建立時間：</span>
                    <span id="detailCreatedAt" class="text-white font-mono">-</span>
                </div>
                <div class="flex justify-between text-[#8E8E93]">
                    <span>最後編輯：</span>
                    <span id="detailUpdatedAt" class="text-white font-mono">-</span>
                </div>
                <div class="flex justify-between text-[#8E8E93]">
                    <span>字數統計：</span>
                    <span id="detailWordCount" class="text-white font-mono">-</span>
                </div>
            </div>

            <div class="flex items-center justify-between pt-1">
                <span class="text-xs text-white font-medium">顯示檔案副檔名</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="toggleExtCheckbox" class="sr-only peer" onchange="toggleExtensionDisplay(this.checked)">
                    <div class="w-9 h-5 bg-[#3A3A3C] peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#30D158]"></div>
                </label>
            </div>
        </div>
    </div>

    <!-- Spotlight 全域搜尋面板 -->
    <div id="spotlightOverlay" class="hidden fixed inset-0 bg-black/60 ios-blur z-50 flex flex-col pt-16 px-4" onclick="toggleSpotlight(false)">
        <div class="bg-[#1C1C1E] border border-[#38383A] rounded-2xl p-3 shadow-2xl max-w-lg mx-auto w-full" onclick="event.stopPropagation()">
            <div class="flex items-center gap-2 bg-[#2C2C2E] px-3 py-2 rounded-xl">
                <i class="fa-solid fa-magnifying-glass text-[#8E8E93]"></i>
                <input id="spotlightInput" type="text" placeholder="搜尋筆記、標籤 (#)、Wiki 連結或指令..." class="w-full bg-transparent text-white outline-none text-base" oninput="handleSpotlightSearch(this.value)">
                <button onclick="toggleSpotlight(false)" class="text-[#0A84FF] text-sm font-semibold">關閉</button>
            </div>
            <div id="spotlightResults" class="mt-3 max-h-60 overflow-y-auto space-y-2 text-sm text-[#8E8E93]">
                <div class="p-2">輸入關鍵字進行模糊搜尋...</div>
            </div>
        </div>
    </div>

    <!-- Git 本地版本時間軸面板 -->
    <div id="timelineOverlay" class="hidden fixed inset-0 bg-black/70 ios-blur z-50 flex flex-col justify-end" onclick="toggleTimeline(false)">
        <div class="bg-[#1C1C1E] rounded-t-[24px] p-5 max-h-[70vh] overflow-y-auto border-t border-[#38383A] max-w-lg mx-auto w-full" onclick="event.stopPropagation()">
            <div class="w-10 h-1.5 bg-[#48484A] rounded-full mx-auto mb-4"></div>
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-clock-rotate-left text-[#0A84FF]"></i> Git 本地版本時間軸</h3>
                <button onclick="toggleTimeline(false)" class="text-[#0A84FF] font-semibold">關閉</button>
            </div>
            <div id="timelineList" class="space-y-3"></div>
        </div>
    </div>

    <!-- 虛擬檔案系統 (VFS) 檔案管理面板 -->
    <div id="vfsOverlay" class="hidden fixed inset-0 bg-black/70 ios-blur z-50 flex flex-col justify-end" onclick="toggleVFS(false)">
        <div class="bg-[#1C1C1E] rounded-t-[24px] p-5 max-h-[75vh] overflow-y-auto border-t border-[#38383A] max-w-lg mx-auto w-full" onclick="event.stopPropagation()">
            <div class="w-10 h-1.5 bg-[#48484A] rounded-full mx-auto mb-4"></div>
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-folder-tree text-amber-400"></i> 本地虛擬檔案系統 (VFS)</h3>
                <button onclick="createNewFilePrompt()" class="text-[#0A84FF] text-sm font-semibold">+ 新增檔案</button>
            </div>
            <div id="vfsFileList" class="space-y-2"></div>
        </div>
    </div>

    <!-- 頁首與導航欄容器 -->
    <div class="flex-none z-30 pt-[env(safe-area-inset-top)] bg-black">
        <!-- 頂部導航欄 -->
        <header id="mainHeader" class="ios-blur px-3 py-2 flex items-center justify-between border-b border-[#38383A] transition-all duration-300">
            <!-- 左上角：筆記名稱與鉛筆圖示（點擊開啟詳情 Modal） -->
            <div class="flex items-center gap-1.5 cursor-pointer max-w-[50%] active:opacity-70 transition" onclick="openDocDetailModal()">
                <span id="currentFileNameDisplay" class="text-sm font-semibold truncate text-white">預設筆記.md</span>
                <svg class="w-3.5 h-3.5 text-[#8E8E93] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                </svg>
            </div>

            <!-- 右上角：伸縮搜尋框與小倒三角形選單融合系統 -->
            <div class="flex items-center gap-1.5">
                <!-- 向左伸縮搜尋欄 -->
                <div id="searchWrapper" class="relative flex items-center transition-all duration-300 w-8 focus-within:w-44 sm:focus-within:w-56 bg-[#2C2C2E]/80 rounded-full border border-[#38383A] overflow-hidden">
                    <button onclick="focusHeaderSearch()" class="w-8 h-8 flex items-center justify-center text-[#8E8E93] flex-shrink-0 hover:text-white">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </button>
                    <input id="headerSearchInput" type="text" placeholder="搜尋筆記..." class="w-full bg-transparent text-xs text-white outline-none pr-2" onfocus="toggleSpotlight(true)" oninput="handleHeaderSearch(this.value)">
                </div>

                <!-- 小倒三角形 SVG 選單按鈕 -->
                <button onclick="openActionSheet()" class="w-8 h-8 rounded-full bg-[#2C2C2E] border border-[#38383A] flex items-center justify-center text-[#0A84FF] active:bg-[#3A3A3C] transition flex-shrink-0" title="選單">
                    <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- 頂部分段控制頁籤: [檔案] [單欄] [雙欄] [專注] -->
        <div id="tabBarNav" class="bg-[#000000] px-3 py-1.5 border-b border-[#38383A] flex items-center justify-center">
            <div class="bg-[#1C1C1E] p-1 rounded-xl flex w-full max-w-sm mx-auto shadow-inner border border-[#38383A]/50 items-center gap-1">
                <button id="btnTabFile" onclick="openActionSheet()" class="flex-1 text-[#8E8E93] rounded-lg py-1 text-xs font-medium transition-all duration-200 hover:text-white">
                    檔案
                </button>
                <button id="btnTabSingle" onclick="switchTab('edit')" class="flex-1 bg-[#3A3A3C] text-white rounded-lg py-1 text-xs font-semibold shadow transition-all duration-200">
                    單欄
                </button>
                <button id="btnTabSplit" onclick="switchTab('split')" class="flex-1 text-[#8E8E93] rounded-lg py-1 text-xs font-medium transition-all duration-200">
                    雙欄
                </button>
                <button id="btnTabZen" onclick="toggleZenMode()" class="flex-1 text-[#8E8E93] rounded-lg py-1 text-xs font-medium transition-all duration-200">
                    專注
                </button>
            </div>
        </div>
    </div>

    <!-- 編輯器主體區域 -->
    <main id="mainViewport" class="flex-1 min-h-0 w-full relative bg-[#000000] flex overflow-hidden">
        
        <!-- 編輯區容器 -->
        <div id="editContainer" class="flex-1 w-full flex flex-col h-full min-w-0 overflow-hidden transition-all duration-300">
            <textarea id="editor" class="w-full flex-1 bg-transparent text-white text-[16px] sm:text-[17px] p-4 outline-none resize-none leading-relaxed smooth-scroll no-scrollbar" spellcheck="false" placeholder="開始撰寫筆記... (支援長按/右鍵彈出 iOS 浮動工具列、檔案拖曳與圖片貼上)"></textarea>
            
            <!-- 底部輔助列：僅留左下角顯示/關閉浮動工具列按鈕 -->
            <div id="accessoryBar" class="flex-none bg-[#1C1C1E]/95 ios-blur border-t border-[#38383A] px-3 py-1.5 flex items-center justify-between text-sm z-20 pb-[env(safe-area-inset-bottom)]">
                <button onclick="toggleFloatingMenuAtCenter()" class="px-3 py-1 bg-[#2C2C2E] active:bg-[#3A3A3C] rounded-full text-xs text-white font-medium flex items-center gap-1.5 border border-[#38383A] transition active:scale-95" title="切換浮動工具列">
                    <i class="fa-solid fa-wand-magic-sparkles text-[#0A84FF]"></i>
                    <span id="floatingBtnLabel">開啟浮動工具列</span>
                </button>
                
                <button onclick="dismissKeyboard()" class="px-3 py-1 text-[#0A84FF] text-xs font-semibold active:opacity-50 whitespace-nowrap">
                    完成
                </button>
            </div>
        </div>

        <!-- 預覽區容器 -->
        <div id="previewContainer" class="hidden flex-1 w-full h-full min-w-0 bg-[#000000] p-4 md:p-6 overflow-y-auto smooth-scroll prose text-white transition-all duration-300"></div>
    </main>

    <!-- iOS 系統 Action Sheet 操作選單 (檔案彈窗選單) -->
    <div id="sheetOverlay" class="hidden fixed inset-0 bg-black/50 z-50 opacity-0 transition-opacity duration-300 flex items-end justify-center" onclick="closeActionSheet()">
        <div id="actionSheet" class="w-full max-w-md bg-[#1C1C1E] rounded-t-[24px] px-4 pt-3 pb-8 transform translate-y-full sheet-transition border-t border-[#38383A]" onclick="event.stopPropagation()">
            <div class="w-10 h-1.5 bg-[#48484A] rounded-full mx-auto mb-5"></div>
            
            <p class="text-center text-[13px] font-medium text-[#8E8E93] mb-3">檔案與系統高階操作</p>

            <div class="bg-[#2C2C2E] rounded-[14px] overflow-hidden mb-4">
                <button onclick="createNewFilePrompt(); closeActionSheet();" class="w-full px-4 py-3 text-left active:bg-[#3A3A3C] flex items-center justify-between border-b border-[#38383A] text-[16px] text-white">
                    <span>建立新筆記檔案</span>
                    <i class="fa-solid fa-file-circle-plus text-[#30D158]"></i>
                </button>
                <button onclick="toggleVFS(true); closeActionSheet();" class="w-full px-4 py-3 text-left active:bg-[#3A3A3C] flex items-center justify-between border-b border-[#38383A] text-[16px] text-white">
                    <span>開啟筆記目錄 (VFS)</span>
                    <i class="fa-solid fa-folder-tree text-amber-400"></i>
                </button>
                <button onclick="triggerFileInput()" class="w-full px-4 py-3 text-left active:bg-[#3A3A3C] flex items-center justify-between border-b border-[#38383A] text-[16px] text-white">
                    <span>匯入任意文檔 (.md / .txt / .py / .json ...)</span>
                    <i class="fa-solid fa-file-import text-[#0A84FF]"></i>
                </button>
                <button onclick="exportAction('file')" class="w-full px-4 py-3 text-left active:bg-[#3A3A3C] flex items-center justify-between border-b border-[#38383A] text-[16px] text-white">
                    <span>匯出當前檔案</span>
                    <i class="fa-solid fa-file-arrow-down text-[#8E8E93]"></i>
                </button>
                <button onclick="exportAction('copy')" class="w-full px-4 py-3 text-left active:bg-[#3A3A3C] flex items-center justify-between border-b border-[#38383A] text-[16px] text-white">
                    <span>複製淨化全文</span>
                    <i class="fa-regular fa-copy text-[#8E8E93]"></i>
                </button>
                <button onclick="exportAction('docx')" class="w-full px-4 py-3 text-left active:bg-[#3A3A3C] flex items-center justify-between border-b border-[#38383A] text-[16px] text-white">
                    <span>匯出為 Word (.docx)</span>
                    <i class="fa-solid fa-file-word text-[#0A84FF]"></i>
                </button>
                <button onclick="exportAction('share')" class="w-full px-4 py-3 text-left active:bg-[#3A3A3C] flex items-center justify-between border-b border-[#38383A] text-[16px] text-[#0A84FF]">
                    <span>系統分享 (Share...)</span>
                    <i class="fa-solid fa-arrow-up-from-bracket"></i>
                </button>
                <button onclick="toggleTimeline(true); closeActionSheet();" class="w-full px-4 py-3 text-left active:bg-[#3A3A3C] flex items-center justify-between text-[16px] text-white">
                    <span>Git 本地版本時間軸</span>
                    <i class="fa-solid fa-clock-rotate-left text-[#0A84FF]"></i>
                </button>
            </div>

            <div class="bg-[#2C2C2E] rounded-[14px] overflow-hidden mb-4">
                <button onclick="toggleBurnMode()" class="w-full px-4 py-3 text-left active:bg-[#3A3A3C] flex items-center justify-between border-b border-[#38383A] text-[16px] text-amber-400">
                    <span>閱後即焚 / 隱私防偷看模式</span>
                    <i class="fa-solid fa-eye-slash"></i>
                </button>
                <button onclick="clearText()" class="w-full px-4 py-3 text-left active:bg-[#3A3A3C] flex items-center justify-between text-[16px] text-[#FF453A]">
                    <span>清除當前內容</span>
                    <i class="fa-regular fa-trash-can"></i>
                </button>
            </div>

            <button onclick="closeActionSheet()" class="w-full bg-[#2C2C2E] text-[#0A84FF] font-semibold py-3 rounded-[14px] text-center text-[16px] active:bg-[#3A3A3C]">
                取消
            </button>
        </div>
    </div>

    <!-- 通用檔案選擇器（支援任意文字檔案類型） -->
    <input type="file" id="hiddenFileInput" class="hidden" accept="*/*" onchange="handleFileImport(event)">

    <!-- JS 核心系統機制 -->
    <script>
        const editor = document.getElementById('editor');
        const overlay = document.getElementById('sheetOverlay');
        const sheet = document.getElementById('actionSheet');
        const editContainer = document.getElementById('editContainer');
        const previewContainer = document.getElementById('previewContainer');
        const btnTabSingle = document.getElementById('btnTabSingle');
        const btnTabSplit = document.getElementById('btnTabSplit');
        const btnTabZen = document.getElementById('btnTabZen');
        const dynamicPill = document.getElementById('dynamicPill');
        const pillText = document.getElementById('pillText');
        const floatingMenu = document.getElementById('floatingMenu');

        let db = null;
        let isZenMode = false;
        let isBurnMode = false;
        let isComposing = false;
        let showExtension = localStorage.getItem('show_ext') !== 'false';
        let currentFileId = "default_note.md";
        let fileMetadata = { createdAt: Date.now(), updatedAt: Date.now() };
        let longPressTimer = null;
        
        let historyStack = [];
        let redoStack = [];
        const MAX_HISTORY = 50;

        // 1. IndexedDB 核心資料庫
        const initDB = () => {
            return new Promise((resolve) => {
                const request = indexedDB.open("iOSNativeProEditorDB_Masterpiece", 4);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains("files")) db.createObjectStore("files", { keyPath: "id" });
                    if (!db.objectStoreNames.contains("versions")) db.createObjectStore("versions", { keyPath: "id", autoIncrement: true });
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    loadActiveFile(currentFileId);
                    resolve();
                };
            });
        };

        // 2. 觸覺震動回饋
        function triggerHaptic(ms = 10) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        // 3. 動態島通知
        function showPill(text, isSuccess = true) {
            triggerHaptic(15);
            pillText.innerText = text;
            document.getElementById('pillIcon').className = isSuccess ? "fa-solid fa-circle-check text-emerald-400" : "fa-solid fa-triangle-exclamation text-amber-400";
            dynamicPill.classList.remove('opacity-0');
            dynamicPill.style.transform = "translateX(-50%) translateY(4px)";
            setTimeout(() => {
                dynamicPill.classList.add('opacity-0');
                dynamicPill.style.transform = "translateX(-50%) translateY(0px)";
            }, 2200);
        }

        // 4. 筆記檔名與副檔名顯示控制
        function updateFileNameDisplay() {
            const displayElem = document.getElementById('currentFileNameDisplay');
            if (showExtension) {
                displayElem.innerText = currentFileId;
            } else {
                const lastDotIndex = currentFileId.lastIndexOf('.');
                displayElem.innerText = (lastDotIndex > 0) ? currentFileId.substring(0, lastDotIndex) : currentFileId;
            }
        }

        function toggleExtensionDisplay(checked) {
            showExtension = checked;
            localStorage.setItem('show_ext', checked);
            updateFileNameDisplay();
        }

        // 5. 筆記詳細資訊 Modal 控制與重命名
        function openDocDetailModal() {
            document.getElementById('detailFileNameInput').value = currentFileId;
            document.getElementById('detailCreatedAt').innerText = new Date(fileMetadata.createdAt || Date.now()).toLocaleString();
            document.getElementById('detailUpdatedAt').innerText = new Date(fileMetadata.updatedAt || Date.now()).toLocaleString();
            
            const text = editor.value;
            const charLen = text.length;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            document.getElementById('detailWordCount').innerText = `${charLen} 字元 · ${words} 單詞`;
            
            document.getElementById('toggleExtCheckbox').checked = showExtension;
            document.getElementById('docDetailModal').classList.remove('hidden');
        }

        function closeDocDetailModal() {
            document.getElementById('docDetailModal').classList.add('hidden');
        }

        function saveRenamedFile() {
            const newName = document.getElementById('detailFileNameInput').value.trim();
            if (!newName || newName === currentFileId) {
                closeDocDetailModal();
                return;
            }

            if (db) {
                const tx = db.transaction("files", "readwrite");
                tx.objectStore("files").delete(currentFileId);
            }
            localStorage.removeItem("session_crash_guard_" + currentFileId);

            currentFileId = newName;
            saveActiveFile();
            updateFileNameDisplay();
            closeDocDetailModal();
            showPill("筆記已改名為: " + currentFileId);
        }

        // 6. 浮動工具列控制
        function showFloatingMenu(x, y) {
            triggerHaptic(15);
            floatingMenu.classList.remove('hidden');
            const menuWidth = 280;
            const menuHeight = 45;
            let posX = Math.min(Math.max(10, x - menuWidth / 2), window.innerWidth - menuWidth - 10);
            let posY = Math.max(10, y - menuHeight - 20);
            if (posY < 60) posY = y + 25;

            floatingMenu.style.left = `${posX}px`;
            floatingMenu.style.top = `${posY}px`;

            requestAnimationFrame(() => {
                floatingMenu.classList.remove('scale-95', 'opacity-0');
                floatingMenu.classList.add('scale-100', 'opacity-100');
            });
            document.getElementById('floatingBtnLabel').innerText = "關閉浮動工具列";
        }

        function hideFloatingMenu() {
            floatingMenu.classList.remove('scale-100', 'opacity-100');
            floatingMenu.classList.add('scale-95', 'opacity-0');
            setTimeout(() => floatingMenu.classList.add('hidden'), 200);
            document.getElementById('floatingBtnLabel').innerText = "開啟浮動工具列";
        }

        function toggleFloatingMenuAtCenter() {
            if (!floatingMenu.classList.contains('hidden')) {
                hideFloatingMenu();
            } else {
                showFloatingMenu(window.innerWidth / 2, window.innerHeight - 110);
            }
        }

        editor.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            showFloatingMenu(e.clientX, e.clientY);
        });

        editor.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                const touch = e.touches[0];
                longPressTimer = setTimeout(() => {
                    showFloatingMenu(touch.clientX, touch.clientY);
                }, 450);
            }
        }, { passive: true });

        editor.addEventListener('touchend', () => clearTimeout(longPressTimer));
        editor.addEventListener('touchmove', () => clearTimeout(longPressTimer));

        document.addEventListener('click', (e) => {
            if (!floatingMenu.contains(e.target) && e.target !== editor && !e.target.closest('#accessoryBar')) {
                hideFloatingMenu();
            }
        });

        // 7. CJK IME 組合語言事件監聽
        editor.addEventListener('compositionstart', () => { isComposing = true; });
        editor.addEventListener('compositionend', () => { 
            isComposing = false; 
            saveActiveFile();
            recordHistory();
        });

        // 8. 撤銷 / 重做機制
        function recordHistory() {
            if (isComposing) return;
            const currentText = editor.value;
            if (historyStack.length === 0 || historyStack[historyStack.length - 1] !== currentText) {
                historyStack.push(currentText);
                if (historyStack.length > MAX_HISTORY) historyStack.shift();
                redoStack = [];
            }
        }

        function undo() {
            if (historyStack.length > 1) {
                redoStack.push(historyStack.pop());
                editor.value = historyStack[historyStack.length - 1];
                saveActiveFile();
                triggerHaptic(10);
            }
        }

        function redo() {
            if (redoStack.length > 0) {
                const text = redoStack.pop();
                historyStack.push(text);
                editor.value = text;
                saveActiveFile();
                triggerHaptic(10);
            }
        }

        // 9. VFS 虛擬檔案系統存取
        const saveActiveFile = () => {
            if (isBurnMode) return;
            const content = editor.value;
            fileMetadata.updatedAt = Date.now();
            localStorage.setItem("session_crash_guard_" + currentFileId, content);
            if (db) {
                const tx = db.transaction("files", "readwrite");
                tx.objectStore("files").put({ id: currentFileId, name: currentFileId, content: content, createdAt: fileMetadata.createdAt, updatedAt: fileMetadata.updatedAt });
            }
        };

        const loadActiveFile = (fileId) => {
            currentFileId = fileId;
            updateFileNameDisplay();
            const sessionContent = localStorage.getItem("session_crash_guard_" + fileId);
            if (sessionContent !== null) {
                editor.value = sessionContent;
            } else if (db) {
                const tx = db.transaction("files", "readonly");
                const req = tx.objectStore("files").get(fileId);
                req.onsuccess = (e) => {
                    if (e.target.result) {
                        editor.value = e.target.result.content;
                        fileMetadata.createdAt = e.target.result.createdAt || Date.now();
                        fileMetadata.updatedAt = e.target.result.updatedAt || Date.now();
                    } else {
                        editor.value = "";
                        fileMetadata.createdAt = Date.now();
                        fileMetadata.updatedAt = Date.now();
                    }
                };
            }
        };

        const saveGitVersion = () => {
            if (!db || !editor.value.trim() || isBurnMode) return;
            const tx = db.transaction("versions", "readwrite");
            tx.objectStore("versions").add({ fileId: currentFileId, content: editor.value, timestamp: new Date().toLocaleString() });
        };

        // 10. VFS 檔案清單面板
        function toggleVFS(show) {
            const overlay = document.getElementById('vfsOverlay');
            if (show) {
                overlay.classList.remove('hidden');
                renderVFSFileList();
            } else {
                overlay.classList.add('hidden');
            }
        }

        function renderVFSFileList() {
            if (!db) return;
            const list = document.getElementById('vfsFileList');
            list.innerHTML = '';
            const tx = db.transaction("files", "readonly");
            tx.objectStore("files").getAll().onsuccess = (e) => {
                const files = e.target.result;
                if (files.length === 0) {
                    list.innerHTML = '<div class="text-[#8E8E93] text-center py-4">尚無檔案，點擊右上方新增。</div>';
                    return;
                }
                files.forEach(f => {
                    list.innerHTML += `
                        <div class="bg-[#2C2C2E] p-3 rounded-xl flex justify-between items-center active:bg-[#3A3A3C]" onclick="loadActiveFile('${f.id}'); toggleVFS(false);">
                            <div class="flex items-center gap-2">
                                <i class="fa-regular fa-file-code text-[#0A84FF]"></i>
                                <span class="text-sm font-semibold text-white">${f.name}</span>
                            </div>
                            <span class="text-xs text-[#8E8E93]">${new Date(f.updatedAt).toLocaleTimeString()}</span>
                        </div>
                    `;
                });
            };
        }

        function createNewFilePrompt() {
            const name = prompt("請輸入新檔案名稱與副檔名 (例如: Note.md / Script.py):");
            if (name) {
                currentFileId = name;
                fileMetadata = { createdAt: Date.now(), updatedAt: Date.now() };
                editor.value = "";
                saveActiveFile();
                loadActiveFile(currentFileId);
                toggleVFS(false);
                showPill("已建立檔案: " + currentFileId);
            }
        }

        // 11. 頁籤切換 (單欄 / 雙欄 / 專注)
        function switchTab(mode) {
            triggerHaptic(10);
            btnTabSingle.className = "flex-1 text-[#8E8E93] rounded-lg py-1 text-xs font-medium transition-all duration-200";
            btnTabSplit.className = "flex-1 text-[#8E8E93] rounded-lg py-1 text-xs font-medium transition-all duration-200";

            if (mode === 'edit') {
                btnTabSingle.className = "flex-1 bg-[#3A3A3C] text-white rounded-lg py-1 text-xs font-semibold shadow transition-all duration-200";
                editContainer.className = "flex-1 w-full flex flex-col h-full min-w-0 overflow-hidden";
                previewContainer.className = "hidden";
            } else if (mode === 'split') {
                btnTabSplit.className = "flex-1 bg-[#3A3A3C] text-white rounded-lg py-1 text-xs font-semibold shadow transition-all duration-200";
                editContainer.className = "flex-1 w-1/2 flex flex-col h-full min-w-0 overflow-hidden border-r border-[#38383A]";
                previewContainer.className = "flex-1 w-1/2 flex flex-col h-full min-w-0 overflow-y-auto smooth-scroll prose text-white p-4 md:p-6";
                renderPreview();
            }
        }

        // 12. 渲染預覽 (KaTeX, Mermaid, Prism.js, DOMPurify)
        function processTokenizerAndTypography(text) {
            let processed = text.replace(/---/g, '—').replace(/\.\.\./g, '…');
            processed = processed.replace(/\[\[(.*?)\]\]/g, '<span class="wiki-link" onclick="loadActiveFile(\'$1.md\')">[[ $1 ]]</span>');
            processed = processed.replace(/(^|\s)#([^\s#]+)/g, '$1<span class="hashtag">#$2</span>');
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            processed = processed.replace(urlRegex, '<a href="$1" target="_blank" class="text-[#0A84FF] underline break-all">$1</a>');
            return processed;
        }

        function renderPreview() {
            let text = editor.value;
            if (!text.trim()) {
                previewContainer.innerHTML = '<div class="text-center text-[#8E8E93] mt-10">尚無內容可預覽</div>';
                return;
            }

            if (text.startsWith('---')) {
                const parts = text.split('---');
                if (parts.length >= 3) text = parts.slice(2).join('---');
            }

            let html = processTokenizerAndTypography(text);

            html = html.replace(/> \[!(NOTE|WARNING|TIP)\]\s+(.*)/g, '<div class="bg-[#2C2C2E] border-l-4 border-[#0A84FF] p-3 rounded-r-xl my-2"><strong>$1</strong>: $2</div>');

            html = html
                .replace(/^# (.*?)$/gm, '<h1>$1</h1>')
                .replace(/^## (.*?)$/gm, '<h2>$2</h2>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/^- (.*?)$/gm, '<ul><li>$1</li></ul>')
                .replace(/\n/g, '<br>');

            html = html.replace(/<\/ul><br><ul>/g, '');

            const cleanHTML = DOMPurify.sanitize(html);
            previewContainer.innerHTML = `<div class="prose w-full">${cleanHTML}</div>`;

            try {
                previewContainer.innerHTML = previewContainer.innerHTML.replace(/\$\$([\s\S]*?)\$\$/g, (match, p1) => {
                    return katex.renderToString(p1, { displayMode: true, throwOnError: false });
                }).replace(/\$([^\$]+?)\$/g, (match, p1) => {
                    return katex.renderToString(p1, { displayMode: false, throwOnError: false });
                });
            } catch (err) {}

            try {
                mermaid.init(undefined, previewContainer.querySelectorAll('.language-mermaid'));
            } catch (err) {}

            Prism.highlightAllUnder(previewContainer);
        }

        editor.addEventListener('input', () => {
            recordHistory();
            saveActiveFile();
        });

        // 13. Smart Auto-Pairing
        editor.addEventListener('keydown', (e) => {
            const pairs = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'" };
            if (pairs[e.key]) {
                e.preventDefault();
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const val = editor.value;
                editor.value = val.substring(0, start) + e.key + val.substring(start, end) + pairs[e.key] + val.substring(end);
                editor.selectionStart = start + 1;
                editor.selectionEnd = end + 1;
                saveActiveFile();
            }
        });

        // 14. 通用檔案匯入與匯出 (支援任意副檔名)
        function triggerFileInput() {
            document.getElementById('hiddenFileInput').click();
            closeActionSheet();
        }

        function handleFileImport(e) {
            const files = e.target.files;
            if (files.length === 0) return;
            const file = files[0];
            const reader = new FileReader();
            reader.onload = (ev) => {
                currentFileId = file.name;
                editor.value = ev.target.result;
                fileMetadata = { createdAt: Date.now(), updatedAt: Date.now() };
                saveActiveFile();
                updateFileNameDisplay();
                showPill("已匯入檔案: " + file.name);
            };
            reader.readAsText(file);
        }

        function exportAction(type) {
            const content = editor.value;
            if (type === 'copy') {
                navigator.clipboard.writeText(content);
                showPill('已複製淨化全文至剪貼簿');
            } else if (type === 'file') {
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = currentFileId;
                link.click();
                showPill('已匯出檔案: ' + currentFileId);
            } else if (type === 'docx') {
                const docxBlob = new Blob([`<html><body>${editor.value}</body></html>`], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(docxBlob);
                link.download = `${currentFileId}.docx`;
                link.click();
                showPill('已匯出 Word 檔案');
            } else if (type === 'share') {
                if (navigator.share) {
                    navigator.share({ title: currentFileId, text: content }).catch(console.error);
                } else {
                    showPill('瀏覽器不支援 Web Share API', false);
                }
            }
            closeActionSheet();
        }

        // 15. 頂部搜尋框與 Spotlight 控制
        function focusHeaderSearch() {
            document.getElementById('headerSearchInput').focus();
        }

        function handleHeaderSearch(query) {
            if (query.trim()) {
                handleSpotlightSearch(query);
            }
        }

        function toggleSpotlight(show) {
            const spotlight = document.getElementById('spotlightOverlay');
            if (show) {
                spotlight.classList.remove('hidden');
                document.getElementById('spotlightInput').focus();
            } else {
                spotlight.classList.add('hidden');
            }
        }

        function handleSpotlightSearch(query) {
            const results = document.getElementById('spotlightResults');
            if (!query.trim()) {
                results.innerHTML = '<div class="p-2">輸入關鍵字進行模糊搜尋...</div>';
                return;
            }
            results.innerHTML = `
                <div class="p-2 bg-[#2C2C2E] rounded-xl cursor-pointer" onclick="insertText('\\n# 引用: ${query}\\n'); toggleSpotlight(false);">
                    📄 插入搜尋引用片段: <span class="text-white">${query}</span>
                </div>
            `;
        }

        // 16. Git 時間軸控制
        function toggleTimeline(show) {
            const overlay = document.getElementById('timelineOverlay');
            if (show) {
                overlay.classList.remove('hidden');
                loadTimelineVersions();
            } else {
                overlay.classList.add('hidden');
            }
        }

        function loadTimelineVersions() {
            if (!db) return;
            const list = document.getElementById('timelineList');
            list.innerHTML = '';
            const tx = db.transaction("versions", "readonly");
            tx.objectStore("versions").getAll().onsuccess = (e) => {
                const versions = e.target.result.filter(v => v.fileId === currentFileId);
                if (versions.length === 0) {
                    list.innerHTML = '<div class="text-[#8E8E93] text-center py-4">尚無版本紀錄。</div>';
                    return;
                }
                versions.reverse().forEach((ver) => {
                    list.innerHTML += `
                        <div class="bg-[#2C2C2E] p-3 rounded-xl flex justify-between items-center">
                            <div>
                                <div class="text-xs text-[#8E8E93]">${ver.timestamp}</div>
                                <div class="text-sm truncate max-w-[200px]">${ver.content}</div>
                            </div>
                            <button onclick="restoreVersion('${ver.content.replace(/'/g, "\\'")}')" class="bg-[#0A84FF] px-3 py-1 rounded-lg text-xs font-semibold">還原</button>
                        </div>
                    `;
                });
            };
        }

        function restoreVersion(content) {
            editor.value = content;
            saveActiveFile();
            toggleTimeline(false);
            showPill('已成功還原快照版本');
        }

        // 17. 專注與閱後即焚模式 (點擊切換)
        function toggleZenMode() {
            isZenMode = !isZenMode;
            document.body.classList.toggle('zen-mode', isZenMode);
            btnTabZen.className = isZenMode 
                ? "flex-1 bg-amber-500 text-black rounded-lg py-1 text-xs font-semibold shadow transition-all duration-200" 
                : "flex-1 text-[#8E8E93] rounded-lg py-1 text-xs font-medium transition-all duration-200";
            showPill(isZenMode ? '已進入沉浸專注模式' : '已退出專注模式');
        }

        function toggleBurnMode() {
            isBurnMode = !isBurnMode;
            document.body.classList.toggle('burn-mode', isBurnMode);
            closeActionSheet();
            showPill(isBurnMode ? '已開啟防偷看/閱後即焚' : '已關閉閱後即焚');
        }

        // 18. 基礎編輯輔助函式
        function insertText(before, after = '') {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value;
            editor.value = text.substring(0, start) + before + text.substring(start, end) + after + text.substring(end);
            editor.selectionStart = start + before.length;
            editor.selectionEnd = end + before.length;
            editor.focus();
            saveActiveFile();
            recordHistory();
        }

        function dismissKeyboard() { editor.blur(); }

        function openActionSheet() {
            dismissKeyboard();
            saveGitVersion();
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                sheet.classList.remove('translate-y-full');
            }, 10);
        }

        function closeActionSheet() {
            overlay.classList.add('opacity-0');
            sheet.classList.add('translate-y-full');
            setTimeout(() => overlay.classList.add('hidden'), 350);
        }

        function clearText() {
            if(confirm('確定要清除當前內容嗎？')) {
                editor.value = '';
                localStorage.removeItem("session_crash_guard_" + currentFileId);
                closeActionSheet();
                if(!previewContainer.classList.contains('hidden')) renderPreview();
                showPill('已清空當前筆記內容');
            }
        }

        // 19. 頁面初始化與 Service Worker 註冊
        window.addEventListener('DOMContentLoaded', () => {
            initDB();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('data:text/javascript;charset=utf-8,' + encodeURIComponent(`
                    self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                `)).catch(() => {});
            }
        });
    </script>
</body>
</html>
