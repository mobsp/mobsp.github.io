<body>

<div class="container">
    <h1>Zero kpsw</h1>
    <div class="subtitle">ULTIMATE SECURITY MINT</div>

    <div class="control-group">
        <label>Length: <b id="val">24</b></label>
        <input type="range" id="len" min="8" max="64" value="24">
    </div>

    <div class="control-group">
        <label style="cursor:pointer">
            Include Symbols
            <input type="checkbox" id="sym" checked="">
        </label>
    </div>

    <button class="btn-main" onclick="generate()">Generate Key</button>

    <div class="display-box" id="out" onclick="copy()">
        Click to Generate
        <div class="strength-bar" id="bar"></div>
    </div>
    <div class="copy-hint" id="hint">Copied to clipboard!</div>
</div>

<script>
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    const syms = "!@#$%^&*()_+-=[]{}|;:,.<>?";

    function generate() {
        const length = document.getElementById('len').value;
        const useSym = document.getElementById('sym').checked;
        const pool = useSym ? chars + syms : chars;
        
        // 天才級隨機算法：直接使用 CSPRNG 映射，效能與安全兼具
        const uint32 = new Uint32Array(length);
        window.crypto.getRandomValues(uint32);
        
        let pw = "";
        for (let i = 0; i < length; i++) {
            pw += pool[uint32[i] % pool.length];
        }

        const out = document.getElementById('out');
        out.textContent = pw;
        out.appendChild(document.getElementById('bar')); / 保持 bar 在裡面
        
        // 更新強度條
        const strength = (length / 64) * 100;
        const bar = document.getElementById('bar');
        bar.style.width = strength + "%";
        bar.style.background = length < 16 ? "#fa5252" : (length < 32 ? "#fab005" : "#40c057");
    }

    function copy() {
        const text = document.getElementById('out').textContent;
        if (text.includes('Click')) return;
        navigator.clipboard.writeText(text);
        const hint = document.getElementById('hint');
        hint.style.opacity = 1;
        setTimeout(() => hint.style.opacity = 0, 2000);
    }

    document.getElementById('len').oninput = function() {
        document.getElementById('val').textContent = this.value;
    }
</script>
