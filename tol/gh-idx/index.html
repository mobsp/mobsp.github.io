<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>莫比空間｜Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁ𝔠ⲉ - GIX</title>
    <style>
        :root {
            --ios-blue: #0A84FF;
            --glass-bg: rgba(28, 28, 30, 0.7);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        /* [動畫指南] 深色流光背景 (Flowing Gradient)
           透過 400% 的背景縮放配合位移，營造出 visionOS 的空間感。
        */
        @keyframes flowingGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body.dark-mode {
            background: linear-gradient(-45deg, #020617, #0f172a, #1e293b, #020617);
            background-size: 400% 400%;
            animation: flowingGradient 15s ease infinite;
            --text-main: #ffffff;
        }

        body.light-mode {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --text-main: #1d1d1f;
            --glass-bg: rgba(255, 255, 255, 0.6);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; color: var(--text-main); font-family: -apple-system, system-ui, sans-serif;
        }

        .app-container {
            display: flex; flex-direction: column; 
            height: 100%; height: 100dvh;
            padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
        }

        header, footer {
            flex-shrink: 0; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            background: var(--glass-bg); border-bottom: 0.5px solid var(--glass-border);
            padding: 15px 20px; z-index: 100;
        }

        /* [佈局建議] Footer 採用 Column 排版
           為了容納導航按鈕與新增的版權聲明區塊。
        */
        footer { 
            border-bottom: none; 
            border-top: 0.5px solid var(--glass-border); 
            display: flex; 
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .nav-links {
            display: flex;
            width: 100%;
            justify-content: space-around;
            font-size: 14px;
        }

        /* [品牌樣式] 版權聲明區塊
           使用 Flexbox 確保 Logo 與文字對齊，並加入點擊縮放效果。
        */
        .copyright-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 10px;
            cursor: pointer;
            transition: transform 0.2s ease;
            opacity: 0.8;
        }
        .copyright-bar:active { transform: scale(0.95); }
        .brand-logo {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            object-fit: cover;
        }
        .copyright-text {
            font-size: 11px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        main { flex-grow: 1; overflow-y: auto; padding: 15px; -webkit-overflow-scrolling: touch; }

        .card {
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border-radius: 20px; padding: 15px; margin-bottom: 15px;
            border: 1px solid var(--glass-border);
        }

        .branch-slider {
            display: flex; gap: 10px; overflow-x: auto; padding: 10px 0;
            scrollbar-width: none; -webkit-overflow-scrolling: touch;
        }
        .branch-slider::-webkit-scrollbar { display: none; }
        .branch-item {
            padding: 10px 20px; background: rgba(255,255,255,0.1);
            border-radius: 25px; font-size: 14px; cursor: pointer;
            white-space: nowrap; transition: 0.3s;
            border: 1px solid transparent;
        }
        .branch-item.active {
            background: var(--ios-blue); color: white;
            box-shadow: 0 4px 15px rgba(10, 132, 255, 0.4);
        }

        select {
            width: 100%; background: var(--glass-bg); color: var(--text-main);
            border: 1px solid var(--glass-border); padding: 12px; border-radius: 12px;
            margin-bottom: 15px; outline: none; font-size: 16px;
        }

        .scroll-x { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; min-width: 450px; }
        th { text-align: left; opacity: 0.5; font-size: 12px; padding: 10px; border-bottom: 0.5px solid var(--glass-border); }
        td { padding: 12px 10px; border-bottom: 0.5px solid rgba(255,255,255,0.05); font-size: 14px; }
        
        .file-link { color: var(--ios-blue); text-decoration: underline; cursor: pointer; }

        .half-modal {
            position: fixed; bottom: -100%; left: 0; width: 100%; height: 70vh;
            background: var(--glass-bg); backdrop-filter: blur(40px);
            border-radius: 30px 30px 0 0; z-index: 2000;
            transition: bottom 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
            padding: 25px; display: flex; flex-direction: column;
            border-top: 1px solid var(--glass-border);
        }
        .half-modal.active { bottom: 0; }
        .modal-header { width: 40px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 10px; margin: 0 auto 20px; }
        .modal-body { flex: 1; overflow-y: auto; }

        .editor-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--glass-bg); backdrop-filter: blur(30px);
            z-index: 3000; display: none; flex-direction: column; padding: var(--safe-top) 20px 20px 20px;
        }
        .editor-input {
            background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
            color: var(--text-main); padding: 12px; border-radius: 10px; margin-bottom: 10px;
            font-size: 14px; outline: none; width: 100%;
        }
        .editor-textarea {
            flex: 1; width: 100%; margin-bottom: 15px; border-radius: 12px;
            border: 1px solid var(--glass-border); padding: 15px; font-family: monospace;
            background: rgba(0,0,0,0.3); color: var(--text-main); font-size: 13px;
            resize: none; outline: none;
        }

        .settings-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
            z-index: 4000; display: none; flex-direction: column; padding: 60px 30px;
        }

        .copy-box {
            background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px;
            margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px;
        }
        .copy-box label { font-size: 11px; opacity: 0.5; text-transform: uppercase; }
        .copy-box div { font-family: monospace; font-size: 12px; word-break: break-all; }

        .btn-action {
            background: var(--ios-blue); color: white; border: none;
            padding: 12px; border-radius: 12px; font-weight: bold; width: 100%;
            cursor: pointer;
        }
        .tiny-btn { background: var(--ios-blue); border: none; color: white; padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; }
    </style>
</head>
<body class="dark-mode" id="appBody">

<div class="app-container">
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin:0; font-size: 22px; letter-spacing: -0.5px;">Indexer</h2>
            <div id="rateLimit" style="font-size: 12px; padding: 4px 10px; background: rgba(255,255,255,0.1); border-radius: 20px;">API: -- / 60</div>
        </div>
    </header>

    <main>
        <section class="card">
            <input type="text" id="userInput" placeholder="使用者名稱 (逗號分隔)" value="mobsp" 
                style="width: 100%; background: rgba(0,0,0,0.2); border: none; padding: 14px; border-radius: 12px; color: white; margin-bottom: 12px; font-size: 16px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button onclick="startDeepScan()" class="btn-action">⚡ 掃描</button>
                <button onclick="exportFullReport()" style="background: #34C759;" class="btn-action">📥 匯出</button>
            </div>
        </section>

        <select id="folderSelect" onchange="updateView()">
            <option value="ALL">📂 顯示所有資料夾</option>
            <option value="ROOT">📂 根目錄 (Root)</option>
        </select>

        <div class="branch-slider" id="branchSlider"></div>

        <div id="displayTable"></div>
    </main>

    <footer>
        <div class="nav-links">
            <div onclick="location.reload()" style="cursor:pointer">🏠 首頁</div>
            <div onclick="toggleSettings(true)" style="cursor:pointer">⚙️ 設定</div>
            <div id="scanStatus">Ready</div>
        </div>
        
        <div class="copyright-bar" onclick="window.open('https://mobsp.qzz.io/', '_blank')">
            <img src="https://mobsp.qzz.io/assets/brand/ms-logo1.webp" alt="Logo" class="brand-logo">
            <span class="copyright-text"> GIX power By 莫比空間 Ⓒ Ⲙ𝔬ⲃⳝ𝔭 • 2026. </span>
        </div>
    </footer>
</div>

<div id="infoModal" class="half-modal">
    <div class="modal-header"></div>
    <h3 id="infoName" style="margin: 0 0 20px 0;">檔案資訊</h3>
    <div class="modal-body" id="infoBody"></div>
    <button class="btn-action" style="background: rgba(255,255,255,0.1); margin-top: 20px;" onclick="closeModal()">關閉</button>
</div>

<div id="editorModal" class="editor-overlay">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="margin:0;">編輯器</h3>
        <button onclick="closeEditor()" class="tiny-btn" style="background:#ff3b30; padding:8px 15px;">取消</button>
    </div>
    
    <label style="font-size:12px; opacity:0.6; margin-bottom:5px;">修改檔名與副檔名 (連同路徑)：</label>
    <input type="text" id="editFileName" class="editor-input">
    
    <label style="font-size:12px; opacity:0.6; margin-bottom:5px;">修改程式碼/內容：</label>
    <textarea id="editContent" class="editor-textarea"></textarea>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button onclick="copyEditedContent()" class="btn-action" style="background:rgba(255,255,255,0.2);">複製內容</button>
        <button onclick="downloadEditedFile()" class="btn-action" style="background:#34C759;">📥 儲存匯出檔案</button>
    </div>
</div>

<div id="settingsPopup" class="settings-overlay">
    <h1 style="margin-bottom: 30px;">Settings</h1>
    <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
        <span>深色流光模式</span>
        <button onclick="switchMode()" id="modeLabel" style="background: var(--ios-blue); border: none; color: white; padding: 8px 15px; border-radius: 10px;">已開啟</button>
    </div>
    <div class="card">
        <label>減少透明度</label>
        <input type="checkbox" onchange="document.body.classList.toggle('reduce-trans')" style="float: right;">
    </div>
    <button class="btn-action" style="margin-top: auto;" onclick="toggleSettings(false)">完成並返回</button>
</div>

<script>
    /**
     * [全局變數說明]
     * allFiles: 儲存從 API 抓取的所有檔案物件。
     * currentBranch: 當前用戶選中的 GitHub 分支。
     * folderSet: 掃描過程中自動提取的資料夾目錄樹。
     */
    let allFiles = [];
    let currentBranch = "";
    let folderSet = new Set();

    /**
     * [教程指南 - 核心掃描邏輯]
     * 1. 透過 GitHub REST API 抓取 User 的 Repos。
     * 2. 遍歷 Repos 抓取 Branches。
     * 3. 利用 /git/trees/{sha}?recursive=1 獲取完整檔案樹，避免多次請求消耗 Rate Limit。
     */
    async function startDeepScan() {
        const users = document.getElementById('userInput').value.split(',').map(s => s.trim());
        const status = document.getElementById('scanStatus');
        allFiles = [];
        folderSet = new Set();
        status.innerText = "掃描中...";

        try {
            for (let user of users) {
                const repos = await (await fetch(`https://api.github.com/users/${user}/repos?per_page=100`)).json();
                for (let repo of repos) {
                    const branches = await (await fetch(`https://api.github.com/repos/${user}/${repo.name}/branches`)).json();
                    for (let b of branches) {
                        const treeData = await (await fetch(`https://api.github.com/repos/${user}/${repo.name}/git/trees/${b.name}?recursive=1`)).json();
                        if (treeData.tree) {
                            treeData.tree.filter(i => i.type === 'blob').forEach(f => {
                                let folder = f.path.includes('/') ? f.path.substring(0, f.path.lastIndexOf('/')) : 'ROOT';
                                folderSet.add(folder);
                                
                                /**
                                 * [修改建議] 頁面連結修正
                                 * 根據部長要求，將連結統一指向 https://mobsp.qzz.io/(檔案路徑)
                                 */
                                allFiles.push({
                                    user, 
                                    repo: repo.name, 
                                    branch: b.name,
                                    path: f.path, 
                                    name: f.path.split('/').pop(),
                                    raw: `https://raw.githubusercontent.com/${user}/${repo.name}/${b.name}/${f.path}`,
                                    link: `https://mobsp.qzz.io/${f.path}`, // 修正後的頁面連結
                                    githubLink: `https://github.com/${user}/${repo.name}/blob/${b.name}/${f.path}`, // 保留原始 GitHub 供備用
                                    folder: folder
                                });
                            });
                        }
                    }
                }
            }
            buildUI();
            status.innerText = "完成";
            updateLimit();
        } catch (e) {
            alert("掃描中斷：API 次數可能已達上限或網路錯誤");
            console.error(e);
        }
    }

    /**
     * [UI 構建指南]
     * 根據掃描結果，動態生成資料夾下拉選單與分支切換滑塊。
     */
    function buildUI() {
        const select = document.getElementById('folderSelect');
        select.innerHTML = '<option value="ALL">📂 顯示所有資料夾</option><option value="ROOT">📂 根目錄 (Root)</option>';
        Array.from(folderSet).sort().forEach(f => {
            if(f !== 'ROOT') select.innerHTML += `<option value="${f}">${f}</option>`;
        });

        const uniqueBranches = [...new Set(allFiles.map(f => f.branch))];
        currentBranch = uniqueBranches[0] || "";
        renderBranches(uniqueBranches);
        updateView();
    }

    function renderBranches(list) {
        const slider = document.getElementById('branchSlider');
        slider.innerHTML = list.map(b => `
            <div class="branch-item ${b === currentBranch ? 'active' : ''}" onclick="selectBranch('${b}')">${b}</div>
        `).join('');
    }

    function selectBranch(b) {
        currentBranch = b;
        const uniqueBranches = [...new Set(allFiles.map(f => f.branch))];
        renderBranches(uniqueBranches);
        updateView();
    }

    /**
     * [視圖刷新邏輯]
     * 同時過濾「分支」與「資料夾」兩個維度，並渲染 HTML 表格。
     */
    function updateView() {
        const folderVal = document.getElementById('folderSelect').value;
        const area = document.getElementById('displayTable');
        
        const filtered = allFiles.filter(f => 
            f.branch === currentBranch && (folderVal === 'ALL' || f.folder === folderVal)
        );

        area.innerHTML = `
            <div class="card scroll-x">
                <table>
                    <thead><tr><th>分支</th><th>檔案名稱</th><th>管理</th></tr></thead>
                    <tbody>
                        ${filtered.map(f => `
                            <tr>
                                <td><code style="font-size:10px; opacity:0.6">${f.branch}</code></td>
                                <td class="file-link" onclick="openFileDetails('${f.path}')">${f.name}</td>
                                <td><button class="btn-action" style="font-size:10px; padding:5px;" onclick="openEditor('${f.raw}', '${f.path}')">編輯</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }

    /**
     * [功能說明] 檔案詳細資訊彈窗
     * 展示各種路徑格式，並包含修正後的 https://mobsp.qzz.io/ 連結。
     */
    function openFileDetails(path) {
        const f = allFiles.find(item => item.path === path && item.branch === currentBranch);
        document.getElementById('infoName').innerText = f.name;
        const body = document.getElementById('infoBody');

        const data = [
            { label: "絕對路徑", val: `/${f.path}` },
            { label: "相對路徑", val: `./${f.path}` },
            { label: "預覽連結 (qzz.io)", val: f.link }, // 部長指定連結
            { label: "原始碼 Raw", val: f.raw },
            { label: "GitHub 來源", val: f.githubLink }
        ];

        body.innerHTML = data.map(d => `
            <div class="copy-box">
                <label>${d.label}</label>
                <div>${d.val}</div>
                <div style="display:flex; gap:10px; margin-top:5px;">
                    <button class="tiny-btn" onclick="copyIt('${d.val}')">一鍵複製</button>
                    ${d.label.includes('連結') || d.label.includes('Raw') || d.label.includes('來源') ? 
                        `<button class="tiny-btn" style="background:#5856D6;" onclick="window.open('${d.val}')">前往頁面</button>` : ''}
                </div>
            </div>
        `).join('');

        document.getElementById('infoModal').classList.add('active');
    }

    /**
     * [編輯器系統]
     * 支援 Raw 內容抓取與前端虛擬編輯，並能匯出下載。
     */
    async function openEditor(rawUrl, fullPath) {
        document.getElementById('editorModal').style.display = 'flex';
        document.getElementById('editFileName').value = fullPath;
        const ta = document.getElementById('editContent');
        ta.value = "讀取原始碼中 (Loading)...";
        
        try {
            const res = await fetch(rawUrl);
            const text = await res.text();
            ta.value = text;
        } catch(e) {
            ta.value = "讀取失敗：\n1. 可能是二進位檔案 (Image/Binary)\n2. 目標伺服器 CORS 限制\n3. 網路連線逾時";
        }
    }

    function closeEditor() {
        document.getElementById('editorModal').style.display = 'none';
    }

    function copyEditedContent() {
        const content = document.getElementById('editContent').value;
        navigator.clipboard.writeText(content);
        alert("內容已複製到剪貼簿");
    }

    function downloadEditedFile() {
        const content = document.getElementById('editContent').value;
        const fileName = document.getElementById('editFileName').value.split('/').pop() || "export.txt";
        
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    /**
     * [匯出指南]
     * 生成包含完整路徑與對應 qzz.io 連結的 CSV 報表。
     */
    function exportFullReport() {
        if(allFiles.length === 0) return alert("目前沒有資料可以匯出，請先執行掃描。");
        let csvContent = "\uFEFFUser,Repo,Branch,Folder,Path,CustomLink,RawURL\n";
        allFiles.forEach(f => {
            csvContent += `"${f.user}","${f.repo}","${f.branch}","${f.folder}","${f.path}","${f.link}","${f.raw}"\n`;
        });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", `Ⲙ𝔬ⲃⳝ𝔭_Indexer_Report.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function closeModal() { document.getElementById('infoModal').classList.remove('active'); }
    function toggleSettings(show) { document.getElementById('settingsPopup').style.display = show ? 'flex' : 'none'; }
    
    function switchMode() {
        const b = document.body;
        const l = document.getElementById('modeLabel');
        if(b.classList.contains('dark-mode')) {
            b.classList.replace('dark-mode', 'light-mode');
            l.innerText = "切換為深色";
        } else {
            b.classList.replace('light-mode', 'dark-mode');
            l.innerText = "已開啟深色";
        }
    }

    function copyIt(t) {
        navigator.clipboard.writeText(t);
        alert("複製成功");
    }

    /**
     * [API 優化建議]
     * 定時或手動檢查 GitHub API 配額剩餘次數，避免掃描到一半失敗。
     */
    async function updateLimit() {
        try {
            const res = await (await fetch('https://api.github.com/rate_limit')).json();
            document.getElementById('rateLimit').innerText = `API: ${res.rate.remaining} / ${res.rate.limit}`;
        } catch(e) {
            document.getElementById('rateLimit').innerText = `API: 離線中`;
        }
    }

    // 初始化 API 配額顯示
    updateLimit();
</script>

</body>
</html>
