        /* 深色流光背景：加入 prefers-reduced-motion 優化效能 */
        @keyframes flowingGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }

            background-size: 400% 400%;

        /* 搜尋與選單樣式 */

        .search-bar:focus { background: rgba(255,255,255,0.15); box-shadow: 0 0 0 2px var(--ios-blue); }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: 0.6; pointer-events: none; font-size: 14px; }
        
        select { width: 100%; background: var(--glass-bg); color: var(--text-main); border: 1px solid var(--glass-border); padding: 12px; border-radius: 12px; margin-bottom: 15px; outline: none; font-size: 16px; }

        /* 表格與列表互動 */

        .editor-input { background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: var(--text-main); padding: 12px; border-radius: 10px; margin-bottom: 10px; font-size: 14px; outline: none; width: 100%; }

        .tiny-btn:active { opacity: 0.8; }

<body class="dark-mode" id="appBody">

<div class="app-container">
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin:0; font-size: 22px; letter-spacing: -0.5px;">Indexer</h2>

<div id="settingsPopup" class="settings-overlay">
    <h1 style="margin-bottom: 30px;">Settings</h1>
    <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
        <span>深色流光模式</span>

<script>
    let allFiles = [];
    let currentBranch = "";
    let folderSet = new Set();

    async function startDeepScan() {
        const users = document.getElementById('userInput').value.split(',').map(s => s.trim());
        const status = document.getElementById('scanStatus');
        allFiles = [];
        folderSet = new Set();
        status.innerText = "掃描中...";

        try {
            for (let user of users) {
                const repos = await (await fetch(`https://api.github.com/users/${user}/repos?per_page=100`)).json();
                for (let repo of repos) {
                    const branches = await (await fetch(`https://api.github.com/repos/${user}/${repo.name}/branches`)).json();
                    for (let b of branches) {
                        const treeData = await (await fetch(`https://api.github.com/repos/${user}/${repo.name}/git/trees/${b.name}?recursive=1`)).json();
                        if (treeData.tree) {
                            treeData.tree.filter(i => i.type === 'blob').forEach(f => {
                                let folder = f.path.includes('/') ? f.path.substring(0, f.path.lastIndexOf('/')) : 'ROOT';
                                folderSet.add(folder);
                                
                                allFiles.push({
                                    user, 
                                    repo: repo.name, 
                                    branch: b.name,
                                    path: f.path, 
                                    name: f.path.split('/').pop(),
                                    raw: `https://raw.githubusercontent.com/${user}/${repo.name}/${b.name}/${f.path}`,
                                    link: `https://mobsp.qzz.io/${f.path}`,
                                    githubLink: `https://github.com/${user}/${repo.name}/blob/${b.name}/${f.path}`,
                                    folder: folder
                                });
                            });
                        }
                    }
                }
            }
            buildUI();
            status.innerText = "完成";
            updateLimit();
        } catch (e) {
            alert("掃描中斷：API 次數可能已達上限或網路錯誤");
            console.error(e);
        }
    }

    function buildUI() {
        const select = document.getElementById('folderSelect');
        select.innerHTML = '<option value="ALL">📂 顯示所有資料夾</option><option value="ROOT">📂 根目錄 (Root)</option>';
        Array.from(folderSet).sort().forEach(f => {
            if(f !== 'ROOT') select.innerHTML += `<option value="${f}">${f}</option>`;
        });

        const uniqueBranches = [...new Set(allFiles.map(f => f.branch))];
        currentBranch = uniqueBranches[0] || "";
        renderBranches(uniqueBranches);
        updateView();
    }

    function renderBranches(list) {
        const slider = document.getElementById('branchSlider');
        slider.innerHTML = list.map(b => `
            <div class="branch-item ${b === currentBranch ? 'active' : ''}" onclick="selectBranch('${b}')">${b}</div>
        `).join('');
    }

    function selectBranch(b) {
        currentBranch = b;
        const uniqueBranches = [...new Set(allFiles.map(f => f.branch))];
        renderBranches(uniqueBranches);
        updateView();
    }

    /* 新增：判斷檔案類型並回傳對應的顏色圓點 Class */
    function getFileIconDot(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        if (['html', 'htm'].includes(ext)) return 'dot-html';
        if (['js'].includes(ext)) return 'dot-js';
        if (['css'].includes(ext)) return 'dot-css';
        if (['vue'].includes(ext)) return 'dot-vue';
        if (['json'].includes(ext)) return 'dot-json';
        if (['md'].includes(ext)) return 'dot-md';
        if (['jpg', 'jpeg', 'png', 'gif', 'svg'].includes(ext)) return 'dot-img';
        return 'dot-other';
    }

    function updateView() {
        const folderVal = document.getElementById('folderSelect').value;
        const searchVal = document.getElementById('searchInput').value.toLowerCase(); / 取得搜尋關鍵字
        const area = document.getElementById('displayTable');
        
        // 加入搜尋關鍵字過濾
        const filtered = allFiles.filter(f => 
            f.branch === currentBranch && 
            (folderVal === 'ALL' || f.folder === folderVal) &&
            f.name.toLowerCase().includes(searchVal)
        );

        area.innerHTML = `
            <div class="card scroll-x">
                <table>
                    <thead><tr><th>分支</th><th>檔案名稱</th><th>管理</th></tr></thead>
                    <tbody>
                        ${filtered.map(f => `
                            <tr>
                                <td><code style="font-size:10px; opacity:0.6">${f.branch}</code></td>
                                <td class="file-link" onclick="openFileDetails('${f.path}')">
                                    <span class="type-dot ${getFileIconDot(f.name)}"></span>
                                    ${f.name}
                                </td>
                                <td><button class="btn-action" style="font-size:10px; padding:6px 10px; border-radius: 8px;" onclick="openEditor('${f.raw}', '${f.path}')">編輯</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }

    function openFileDetails(path) {
        const f = allFiles.find(item => item.path === path && item.branch === currentBranch);
        document.getElementById('infoName').innerText = f.name;
        const body = document.getElementById('infoBody');

        const data = [
            { label: "絕對路徑", val: `/${f.path}` },
            { label: "相對路徑", val: `./${f.path}` },
            { label: "預覽連結 (qzz.io)", val: f.link },
            { label: "原始碼 Raw", val: f.raw },
            { label: "GitHub 來源", val: f.githubLink }
        ];

        body.innerHTML = data.map(d => `
            <div class="copy-box">
                <label>${d.label}</label>
                <div>${d.val}</div>
                <div style="display:flex; gap:10px; margin-top:5px;">
                    <button class="tiny-btn" onclick="copyIt('${d.val}')">一鍵複製</button>
                    ${d.label.includes('連結') || d.label.includes('Raw') || d.label.includes('來源') ? 
                        `<button class="tiny-btn" style="background:#5856D6;" onclick="window.open('${d.val}')">前往頁面</button>` : ''}
                </div>
            </div>
        `).join('');

        document.getElementById('infoModal').classList.add('active');
    }

    async function openEditor(rawUrl, fullPath) {
        document.getElementById('editorModal').style.display = 'flex';
        document.getElementById('editFileName').value = fullPath;
        const ta = document.getElementById('editContent');
        ta.value = "讀取原始碼中 (Loading)...";
        
        try {
            const res = await fetch(rawUrl);
            const text = await res.text();
            ta.value = text;
        } catch(e) {
            ta.value = "讀取失敗：\n1. 可能是二進位檔案 (Image/Binary)\n2. 目標伺服器 CORS 限制\n3. 網路連線逾時";
        }
    }

    function closeEditor() { document.getElementById('editorModal').style.display = 'none'; }

    function copyEditedContent() {
        const content = document.getElementById('editContent').value;
        navigator.clipboard.writeText(content);
        alert("內容已複製到剪貼簿");
    }

    function downloadEditedFile() {
        const content = document.getElementById('editContent').value;
        const fileName = document.getElementById('editFileName').value.split('/').pop() || "export.txt";
        
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function exportFullReport() {
        if(allFiles.length === 0) return alert("目前沒有資料可以匯出，請先執行掃描。");
        let csvContent = "\uFEFFUser,Repo,Branch,Folder,Path,CustomLink,RawURL\n";
        allFiles.forEach(f => {
            csvContent += `"${f.user}","${f.repo}","${f.branch}","${f.folder}","${f.path}","${f.link}","${f.raw}"\n`;
        });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", `Ⲙ𝔬ⲃⳝ𝔭_Indexer_Report.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function closeModal() { document.getElementById('infoModal').classList.remove('active'); }
    function toggleSettings(show) { document.getElementById('settingsPopup').style.display = show ? 'flex' : 'none'; }
    
    function switchMode() {
        const b = document.body;
        const l = document.getElementById('modeLabel');
        if(b.classList.contains('dark-mode')) {
            b.classList.replace('dark-mode', 'light-mode');
            l.innerText = "切換為深色";
        } else {
            b.classList.replace('light-mode', 'dark-mode');
            l.innerText = "已開啟深色";
        }
    }

    function copyIt(t) {
        navigator.clipboard.writeText(t);
        alert("複製成功");
    }

    async function updateLimit() {
        try {
            const res = await (await fetch('https://api.github.com/rate_limit')).json();
            document.getElementById('rateLimit').innerText = `API: ${res.rate.remaining} / ${res.rate.limit}`;
        } catch(e) {
            document.getElementById('rateLimit').innerText = `API: 離線中`;
        }
    }

    updateLimit();
</script>
