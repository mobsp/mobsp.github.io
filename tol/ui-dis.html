<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobi UI System Ultimate</title>

<style>
:root{
  --bg:#070b12;
  --surface:#0f172a;
  --surface2:#111827;
  --panel:rgba(17,24,39,.78);
  --line:rgba(255,255,255,.12);
  --text:#f8fafc;
  --muted:#94a3b8;

  --brand:#7c5cff;
  --brand2:#06b6d4;
  --success:#22c55e;
  --warning:#f59e0b;
  --danger:#ef4444;

  --radius:22px;
  --shadow:0 18px 70px rgba(0,0,0,.45);

  --motion:180ms cubic-bezier(.2,.8,.2,1);
}

[data-theme="light"]{
  --bg:#f4f7fb;
  --surface:#ffffff;
  --surface2:#eef2ff;
  --panel:rgba(255,255,255,.82);
  --line:rgba(15,23,42,.12);
  --text:#111827;
  --muted:#64748b;
  --shadow:0 18px 60px rgba(15,23,42,.12);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans TC",sans-serif;
  background:
    radial-gradient(circle at 10% 10%,rgba(124,92,255,.25),transparent 26%),
    radial-gradient(circle at 90% 0%,rgba(6,182,212,.16),transparent 24%),
    radial-gradient(circle at 80% 80%,rgba(245,158,11,.10),transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

.app{
  display:grid;
  grid-template-columns:320px 1fr 420px;
  min-height:100vh;
}

.sidebar,
.inspector{
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto;
  backdrop-filter:blur(22px);
  background:var(--panel);
  border-right:1px solid var(--line);
}

.inspector{
  border-right:none;
  border-left:1px solid var(--line);
}

.sidebar,
.inspector,
.main{
  padding:20px;
}

.brand{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:20px;
}

.logo{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  border-radius:18px;
  font-weight:900;
  color:white;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  box-shadow:var(--shadow);
}

.brand h1{
  margin:0;
  font-size:18px;
}

.brand p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:12px;
}

.section-title{
  margin:18px 0 10px;
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.15em;
  font-weight:800;
}

.nav{
  display:grid;
  gap:8px;
}

.nav button,
.control{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  color:var(--muted);
  border-radius:14px;
  padding:11px 12px;
  text-align:left;
  cursor:pointer;
  transition:var(--motion);
}

.nav button:hover,
.nav button.active,
.control:hover{
  background:var(--surface);
  color:var(--text);
  border-color:var(--line);
}

.main{
  overflow:hidden;
}

.hero{
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--panel);
  backdrop-filter:blur(18px);
  padding:26px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}

.hero h2{
  margin:0;
  font-size:54px;
  letter-spacing:-.08em;
  line-height:.92;
}

.hero p{
  margin:14px 0 0;
  max-width:900px;
  color:var(--muted);
  line-height:1.8;
}

.toolbar{
  display:grid;
  grid-template-columns:1fr repeat(4,auto);
  gap:12px;
  margin-bottom:18px;
}

.search,
.select{
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  border-radius:16px;
  padding:13px 14px;
  outline:none;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:16px;
}

.card{
  grid-column:span 6;
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  background:var(--panel);
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow);
}

.card-top{
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:18px 18px 0;
}

.card h3{
  margin:0;
  font-size:21px;
}

.en{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:13px;
}

.level{
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 10px;
  color:var(--muted);
  font-size:12px;
}

.preview{
  padding:18px;
}

.device{
  min-height:200px;
  border:1px dashed var(--line);
  border-radius:20px;
  display:grid;
  place-items:center;
  padding:18px;
  overflow:auto;
  background:
    linear-gradient(135deg,rgba(124,92,255,.08),transparent),
    rgba(127,127,127,.03);
}

.device.mobile{
  max-width:260px;
  min-height:320px;
  margin:auto;
  border-radius:28px;
}

.device.tablet{
  max-width:500px;
  margin:auto;
}

.variants{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:0 18px 18px;
}

.variant{
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  border-radius:999px;
  padding:7px 10px;
  font-size:12px;
  cursor:pointer;
}

.variant.active,
.variant:hover{
  background:var(--brand);
  border-color:transparent;
  color:white;
}

.field{
  display:grid;
  gap:8px;
  margin-bottom:16px;
}

.field label{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-weight:800;
}

pre{
  margin:0;
  border-radius:18px;
  padding:14px;
  background:#020617;
  color:#dbeafe;
  font-size:12px;
  overflow:auto;
  max-height:320px;
}

.action-row{
  display:flex;
  gap:10px;
}

.action-row button{
  flex:1;
}

.btn{
  border:0;
  border-radius:14px;
  padding:11px 16px;
  font-weight:800;
  cursor:pointer;
  transition:var(--motion);
}

.btn.primary{
  background:var(--brand);
  color:white;
}

.btn.outline{
  background:transparent;
  border:1px solid var(--brand);
  color:var(--brand);
}

.btn.ghost{
  background:transparent;
  color:var(--text);
}

.btn.success{background:var(--success);color:white}
.btn.warning{background:var(--warning);color:black}
.btn.danger{background:var(--danger);color:white}

.demo-card{
  width:min(260px,100%);
  border-radius:20px;
  background:var(--surface);
  border:1px solid var(--line);
  padding:16px;
}

.demo-card.media::before{
  content:"";
  display:block;
  height:76px;
  border-radius:14px;
  margin-bottom:12px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
}

.demo-card h4{
  margin:0 0 6px;
}

.demo-card p{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

.demo-input{
  width:min(280px,100%);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 14px;
  background:var(--surface);
  color:var(--text);
}

.demo-alert{
  max-width:320px;
  border-radius:18px;
  padding:14px;
  background:rgba(124,92,255,.12);
  border:1px solid rgba(124,92,255,.3);
}

.layout-demo{
  width:320px;
  height:160px;
  display:grid;
  gap:8px;
}

.layout-demo.sidebar{
  grid-template-columns:70px 1fr;
}

.layout-demo.columns{
  grid-template-columns:repeat(3,1fr);
}

.layout-demo.stack{
  grid-template-rows:repeat(3,1fr);
}

.layout-demo div{
  border-radius:14px;
  background:var(--surface);
  border:1px solid var(--line);
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:black;
  color:white;
  padding:12px 14px;
  border-radius:14px;
  opacity:0;
  transition:var(--motion);
}

.toast.show{
  opacity:1;
}

@media(max-width:1400px){
  .app{
    grid-template-columns:280px 1fr;
  }
  .inspector{
    position:fixed;
    right:0;
    width:420px;
    z-index:40;
    transform:translateX(100%);
    transition:var(--motion);
  }
  .inspector.open{
    transform:translateX(0);
  }
}

@media(max-width:900px){
  .app{
    grid-template-columns:1fr;
  }

  .sidebar{
    position:relative;
    height:auto;
    border-right:none;
    border-bottom:1px solid var(--line);
  }

  .gallery .card{
    grid-column:span 12;
  }

  .toolbar{
    grid-template-columns:1fr;
  }

  .hero h2{
    font-size:40px;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">
  <div class="brand">
    <div class="logo">UI</div>
    <div>
      <h1>Mobi UI Ultimate</h1>
      <p>Design System Runtime</p>
    </div>
  </div>

  <div class="section-title">Categories</div>
  <nav class="nav" id="nav"></nav>

  <div class="section-title">Theme</div>
  <button class="control" id="themeBtn">切換主題</button>

  <div class="section-title">Density</div>
  <button class="control" id="densityBtn">切換密度</button>

  <div class="section-title">Inspector</div>
  <button class="control" id="inspectorBtn">開關 Inspector</button>
</aside>

<main class="main">

<section class="hero">
  <h2>Ultimate UI System</h2>
  <p>
    最終版整合：UI Gallery、Schema Runtime、Theme Engine、Component Inspector、Code Preview、Import / Export、裝置模擬與 Builder Lite。
    已經不是單純元件展示頁，而是接近「可視化 UI 系統平台」。
  </p>
</section>

<div class="toolbar">
  <input class="search" id="search" placeholder="搜尋元件、變體、分類...">

  <select class="select" id="device">
    <option value="desktop">Desktop</option>
    <option value="tablet">Tablet</option>
    <option value="mobile">Mobile</option>
  </select>

  <select class="select" id="state">
    <option value="default">Default</option>
    <option value="loading">Loading</option>
    <option value="disabled">Disabled</option>
  </select>

  <button class="btn primary" id="exportBtn">Export JSON</button>
  <button class="btn outline" id="importBtn">Import JSON</button>
</div>

<section class="gallery" id="gallery"></section>

</main>

<aside class="inspector open" id="inspector">

<div class="field">
  <label>Component</label>
  <select class="select" id="componentSelect"></select>
</div>

<div class="field">
  <label>Variant</label>
  <select class="select" id="variantSelect"></select>
</div>

<div class="field">
  <label>Schema</label>
  <pre id="schema"></pre>
</div>

<div class="field">
  <label>HTML</label>
  <pre id="html"></pre>
</div>

<div class="action-row">
  <button class="btn primary" id="copyHtml">Copy HTML</button>
  <button class="btn outline" id="copySchema">Copy Schema</button>
</div>

</aside>

</div>

<div class="toast" id="toast">Copied</div>

<script>

const components = [

{
category:"Actions",
level:"基礎",
zh:"按鈕",
en:"Button",
variants:["Primary","Outline","Ghost","Success","Warning","Danger"],
render(v,state){

let cls="btn";

if(v==="Primary") cls+=" primary";
if(v==="Outline") cls+=" outline";
if(v==="Ghost") cls+=" ghost";
if(v==="Success") cls+=" success";
if(v==="Warning") cls+=" warning";
if(v==="Danger") cls+=" danger";

const disabled = state==="disabled" ? "disabled" : "";
const text = state==="loading" ? "載入中..." : "操作按鈕";

return `<button class="${cls}" ${disabled}>${text}</button>`;
}
},

{
category:"Containers",
level:"基礎",
zh:"卡片",
en:"Card",
variants:["Basic","Media","Glass"],
render(v){

const media = v==="Media" ? "media":"";

return `
<article class="demo-card ${media}">
<h4>${v} Card</h4>
<p>這是一張 UI 卡片元件。</p>
</article>
`;
}
},

{
category:"Forms",
level:"互動",
zh:"輸入框",
en:"Input",
variants:["Text","Search","Password"],
render(v,state){

const type = v==="Password" ? "password":"text";
const disabled = state==="disabled" ? "disabled":"";

return `
<input class="demo-input" type="${type}" placeholder="${v} Input" ${disabled}>
`;
}
},

{
category:"Feedback",
level:"系統",
zh:"警報",
en:"Alert",
variants:["Info","Success","Warning"],
render(v){

return `
<div class="demo-alert">
<strong>${v}</strong><br>
這是系統提示訊息。
</div>
`;
}
},

{
category:"Layout",
level:"系統",
zh:"邊欄佈局",
en:"Sidebar Layout",
variants:["Sidebar","Columns","Stack"],
render(v){

let cls="layout-demo";

if(v==="Sidebar") cls+=" sidebar";
if(v==="Columns") cls+=" columns";
if(v==="Stack") cls+=" stack";

return `
<div class="${cls}">
<div></div>
<div></div>
<div></div>
</div>
`;
}
}

];

const state = {
category:"All",
component:"Button",
variant:"Primary",
device:"desktop",
uiState:"default"
};

const gallery = document.getElementById("gallery");
const nav = document.getElementById("nav");

const schemaEl = document.getElementById("schema");
const htmlEl = document.getElementById("html");

const componentSelect = document.getElementById("componentSelect");
const variantSelect = document.getElementById("variantSelect");

function init(){

renderNav();
renderGallery();
renderSelects();
updateInspector();

bind();

}

function bind(){

document.getElementById("themeBtn").onclick=()=>{

const root=document.documentElement;
root.dataset.theme = root.dataset.theme==="dark" ? "light":"dark";

};

document.getElementById("densityBtn").onclick=()=>{

document.documentElement.style.setProperty(
"--radius",
getComputedStyle(document.documentElement).getPropertyValue("--radius")==="22px"
? "12px":"22px"
);

};

document.getElementById("device").onchange=(e)=>{

state.device=e.target.value;
renderGallery();

};

document.getElementById("state").onchange=(e)=>{

state.uiState=e.target.value;
renderGallery();
updateInspector();

};

document.getElementById("search").oninput=renderGallery;

componentSelect.onchange=(e)=>{

state.component=e.target.value;

const comp=getCurrentComponent();

state.variant=comp.variants[0];

renderSelects();
updateInspector();
renderGallery();

};

variantSelect.onchange=(e)=>{

state.variant=e.target.value;

updateInspector();
renderGallery();

};

document.getElementById("copyHtml").onclick=()=>copy(htmlEl.textContent);
document.getElementById("copySchema").onclick=()=>copy(schemaEl.textContent);

document.getElementById("exportBtn").onclick=exportSchema;
document.getElementById("importBtn").onclick=importSchema;

document.getElementById("inspectorBtn").onclick=()=>{

document.getElementById("inspector").classList.toggle("open");

};

}

function renderNav(){

const cats=["All",...new Set(components.map(c=>c.category))];

nav.innerHTML="";

cats.forEach(cat=>{

const btn=document.createElement("button");

btn.textContent=cat;

if(cat===state.category) btn.classList.add("active");

btn.onclick=()=>{

state.category=cat;

renderNav();
renderGallery();

};

nav.appendChild(btn);

});

}

function renderGallery(){

const q=document.getElementById("search").value.toLowerCase();

gallery.innerHTML="";

components
.filter(c=>{

const catOk = state.category==="All" || c.category===state.category;

const text=(c.zh+c.en+c.category+c.variants.join(" ")).toLowerCase();

return catOk && text.includes(q);

})
.forEach(comp=>{

const selected = comp.en===state.component
? state.variant
: comp.variants[0];

const html=comp.render(selected,state.uiState);

const card=document.createElement("article");

card.className="card";

card.innerHTML=`
<div class="card-top">
<div>
<h3>${comp.zh}<span class="en">${comp.en}</span></h3>
</div>
<div class="level">${comp.level}</div>
</div>

<div class="preview">
<div class="device ${state.device}">
${html}
</div>
</div>

<div class="variants">
${comp.variants.map(v=>`
<button
class="variant ${selected===v && comp.en===state.component ? "active":""}"
data-component="${comp.en}"
data-variant="${v}">
${v}
</button>
`).join("")}
</div>
`;

gallery.appendChild(card);

});

document.querySelectorAll(".variant").forEach(btn=>{

btn.onclick=()=>{

state.component=btn.dataset.component;
state.variant=btn.dataset.variant;

renderSelects();
updateInspector();
renderGallery();

};

});

}

function renderSelects(){

componentSelect.innerHTML=components.map(c=>`
<option value="${c.en}">
${c.zh} / ${c.en}
</option>
`).join("");

componentSelect.value=state.component;

const comp=getCurrentComponent();

variantSelect.innerHTML=comp.variants.map(v=>`
<option value="${v}">
${v}
</option>
`).join("");

variantSelect.value=state.variant;

}

function getCurrentComponent(){

return components.find(c=>c.en===state.component);

}

function updateInspector(){

const comp=getCurrentComponent();

const schema={
type:comp.en,
name:comp.zh,
category:comp.category,
variant:state.variant,
device:state.device,
state:state.uiState,
tokens:{
brand:"var(--brand)",
radius:"var(--radius)"
}
};

schemaEl.textContent=JSON.stringify(schema,null,2);

htmlEl.textContent=comp.render(state.variant,state.uiState);

}

async function copy(text){

await navigator.clipboard.writeText(text);

const toast=document.getElementById("toast");

toast.classList.add("show");

setTimeout(()=>{
toast.classList.remove("show");
},1400);

}

function exportSchema(){

const data={
app:"Mobi UI Ultimate",
state
};

const blob=new Blob(
[JSON.stringify(data,null,2)],
{type:"application/json"}
);

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);
a.download="mobi-ui-schema.json";
a.click();

}

function importSchema(){

const input=document.createElement("input");

input.type="file";
input.accept=".json";

input.onchange=e=>{

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=()=>{

try{

const data=JSON.parse(reader.result);

Object.assign(state,data.state);

renderNav();
renderGallery();
renderSelects();
updateInspector();

}catch(err){

alert("JSON 匯入失敗");

}

};

reader.readAsText(file);

};

input.click();

}

init();

</script>

</body>
</html>
