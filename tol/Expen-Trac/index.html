<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>LINE Ledger</title>
  <style>
    :root {
      --line-green: #06C755;
      --bg-chat: #8CABD9;
      --bg-dark: #111111;
      --card-dark: #1D1D1F;
      --text-white: #FFFFFF;
      --text-gray: #8E8E93;
      --bubble-mine: #85E249;
      --border-color: #2C2C2E;
      --font-ios: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-ios);
      -webkit-tap-highlight-color: transparent;
      user-select: none; /* 全域防止文字被長按選取 */
      -webkit-user-select: none;
      -webkit-touch-callout: none; /* 防選單彈出 */
    }

    /* 2. 徹底禁止全頁彈跳與滑動晃動 */
    html, body {
      width: 100vw;
      height: 100dvh; /* 動態 Viewport 高度，徹底解決 iOS 網址列遮蔽 */
      overflow: hidden;
      position: fixed; /* 鎖死 Body 避免橡皮筋拉動 */
      top: 0; left: 0;
      background-color: #000;
      color: var(--text-white);
      overscroll-behavior: none; /* 防邊緣晃動彈跳 */
      touch-action: none; /* 預設禁用所有瀏覽器手勢 */
    }

    /* App 視圖容器 */
    #app-viewport {
      width: 100%;
      height: 100dvh;
      max-width: 430px; /* 模擬 Pro Max 寬度，在大螢幕桌機自動置中 */
      margin: 0 auto;
      background-color: var(--bg-dark);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 3. 頂部固定 Header (安全區域適應) */
    header {
      height: calc(44px + env(safe-area-inset-top, 0px));
      padding-top: env(safe-area-inset-top, 0px);
      background: rgba(17, 17, 17, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 16px;
      padding-right: 16px;
      border-bottom: 0.5px solid var(--border-color);
      z-index: 100;
      flex-shrink: 0; /* 禁止被擠壓 */
    }

    .header-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.4px;
    }

    .header-icon {
      color: var(--text-white);
      font-size: 20px;
      cursor: pointer;
    }

    /* 4. 主要視圖 (確保只有中間區域可滾動) */
    main {
      flex: 1;
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    .view {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      transform: translateX(100%);
      height: 100%;
    }

    .view.active {
      transform: translateX(0);
    }

    /* 聊天視圖滾動鎖定 */
    #view-chat {
      background-color: var(--bg-chat);
    }

    /* 5. 獨立可滾動區域 (解鎖單向縱向滑動與彈性質感) */
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch; /* iOS 原生滑動順暢度 */
      touch-action: pan-y; /* 僅允許垂直滑動 */
      overscroll-behavior-y: contain; /* 滾動到頂/底部時不影響外層 */
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-all;
      position: relative;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      user-select: text; /* 允許對話框文字選取 */
      -webkit-user-select: text;
    }

    .chat-bubble.mine {
      align-self: flex-end;
      background-color: var(--bubble-mine);
      color: #000;
      border-top-right-radius: 2px;
    }

    .chat-bubble.system {
      align-self: flex-start;
      background-color: #FFFFFF;
      color: #000;
      border-top-left-radius: 2px;
    }

    .bubble-meta {
      font-size: 10px;
      color: rgba(0,0,0,0.4);
      margin-top: 4px;
      text-align: right;
    }

    /* 6. 輸入欄防 UI 遮蔽處理 */
    .chat-input-bar {
      min-height: 52px;
      background-color: #1C1C1E;
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 8px;
      border-top: 0.5px solid var(--border-color);
      padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      background-color: #2C2C2E;
      border: none;
      border-radius: 20px;
      padding: 10px 16px;
      color: #FFF;
      font-size: 16px; /* 防止 iOS 輸入時自動放大畫面 (需 >= 16px) */
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .send-btn {
      color: var(--line-green);
      font-weight: 600;
      font-size: 16px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* 收支明細滾動區 */
    .ledger-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      overscroll-behavior-y: contain;
      padding: 16px;
    }

    .summary-card {
      background-color: var(--card-dark);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-row {
      background-color: var(--card-dark);
      padding: 14px 16px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .item-category { font-weight: 600; font-size: 15px; }
    .item-note { font-size: 12px; color: var(--text-gray); margin-top: 2px; }
    .item-amount { font-weight: 600; font-size: 16px; color: #FF453A; }

    /* 7. 底部 TabBar 鎖死與 HomeBar 適應 */
    nav {
      height: calc(49px + env(safe-area-inset-bottom, 0px));
      background-color: rgba(25, 25, 25, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 0.5px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding-top: 6px;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      z-index: 100;
      flex-shrink: 0;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: var(--text-gray);
      cursor: pointer;
      width: 25%;
    }

    .tab-item.active { color: var(--line-green); }
    .tab-icon { font-size: 20px; }
    .tab-label { font-size: 10px; }

    /* Modal 設定彈窗 */
    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      z-index: 200;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--card-dark);
      border-radius: 14px;
      width: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-content input {
      background: #2C2C2E;
      border: none;
      padding: 12px;
      border-radius: 8px;
      color: #FFF;
      font-size: 16px;
      user-select: text;
      -webkit-user-select: text;
    }

    .modal-content button {
      background: var(--line-green);
      border: none;
      padding: 12px;
      border-radius: 8px;
      color: #FFF;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div id="app-viewport">
  <header>
    <span class="header-title" id="header-title">LINE 記帳助手</span>
    <span class="header-icon" onclick="toggleModal(true)">⚙️</span>
  </header>

  <main>
    <div class="view active" id="view-chat">
      <div class="chat-messages" id="chat-messages">
        <div class="chat-bubble system">
          👋 你好！我是你的 LINE 記帳助手。<br>請直接發送訊息記帳，例如：<br><b>午餐 120</b> 或 <b>買衣服 1500 購物</b>
        </div>
      </div>
      <div class="chat-input-bar">
        <input type="text" class="chat-input" id="chat-input" placeholder="輸入品項與金額，例如: 晚餐 250">
        <button class="send-btn" onclick="handleSend()">發送</button>
      </div>
    </div>

    <div class="view" id="view-ledger">
      <div class="ledger-list">
        <div class="summary-card">
          <div>
            <div style="font-size:12px; color:var(--text-gray)">本月累積總支出</div>
            <div style="font-size:28px; font-weight:700; margin-top:4px" id="total-amount">$ 0</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:12px; color:var(--text-gray)">筆數</div>
            <div style="font-size:20px; font-weight:600;" id="total-count">0 筆</div>
          </div>
        </div>
        <div id="records-container"></div>
      </div>
    </div>
  </main>

  <nav>
    <div class="tab-item active" onclick="switchTab('chat', this)">
      <span class="tab-icon">💬</span>
      <span class="tab-label">對話記帳</span>
    </div>
    <div class="tab-item" onclick="switchTab('ledger', this)">
      <span class="tab-icon">📊</span>
      <span class="tab-label">收支明細</span>
    </div>
  </nav>

  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <h3>GitHub API 雲端備份設定</h3>
      <p style="font-size: 12px; color: var(--text-gray);">輸入 Personal Access Token 即可將記帳數據即時備份至 GitHub 倉庫：</p>
      <input type="text" id="gh-repo" placeholder="Repo (例: username/ledger-db)">
      <input type="password" id="gh-token" placeholder="GitHub Personal Access Token">
      <button onclick="saveSettings()">儲存並測試同步</button>
      <button onclick="toggleModal(false)" style="background:#3A3A3C">取消</button>
    </div>
  </div>
</div>

<script>
  // 8. JS 防縮放與手勢雙重鎖定 (針對 Safari / Chrome)
  document.addEventListener('gesturestart', function (e) {
    e.preventDefault();
  });

  // 防止 iOS 雙點擊畫面被放大
  let lastTouchEnd = 0;
  document.addEventListener('touchend', function (event) {
    const now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, false);

  // 業務邏輯
  let records = JSON.parse(localStorage.getItem('line_ledger_records') || '[]');
  let config = JSON.parse(localStorage.getItem('line_ledger_config') || '{}');

  document.addEventListener("DOMContentLoaded", () => {
    renderLedger();
  });

  function switchTab(tabName, el) {
    document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
    el.classList.add('active');

    const chatView = document.getElementById('view-chat');
    const ledgerView = document.getElementById('view-ledger');
    const title = document.getElementById('header-title');

    if (tabName === 'chat') {
      chatView.classList.add('active');
      ledgerView.classList.remove('active');
      title.innerText = "LINE 記帳助手";
    } else {
      ledgerView.classList.add('active');
      chatView.classList.remove('active');
      title.innerText = "收支明細分析";
      renderLedger();
    }
  }

  function handleSend() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    appendMessage(text, 'mine');
    input.value = '';

    const match = text.match(/^(.+?)\s*(\d+)\s*(.*)$/);
    
    if (match) {
      const item = match[1];
      const amount = parseInt(match[2], 10);
      const category = match[3] || '一般消費';

      const newRecord = {
        id: Date.now(),
        item,
        amount,
        category,
        date: new Date().toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
      };

      records.unshift(newRecord);
      saveData();

      setTimeout(() => {
        appendMessage(`✅ 已成功上記算！\n品項：${item}\n金額：$${amount}\n分類：${category}`, 'system');
      }, 400);

    } else {
      setTimeout(() => {
        appendMessage(`⚠️ 格式不理解，請輸入例如：「午餐 100」或「電影 300 娛樂」`, 'system');
      }, 400);
    }
  }

  function appendMessage(text, type) {
    const container = document.getElementById('chat-messages');
    const bubble = document.createElement('div');
    bubble.className = `chat-bubble ${type}`;
    
    const timeStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
    bubble.innerHTML = `${text.replace(/\n/g, '<br>')}<div class="bubble-meta">${timeStr}</div>`;
    
    container.appendChild(bubble);
    container.scrollTop = container.scrollHeight;
  }

  function renderLedger() {
    const container = document.getElementById('records-container');
    const totalEl = document.getElementById('total-amount');
    const countEl = document.getElementById('total-count');

    container.innerHTML = '';
    let total = 0;

    records.forEach(r => {
      total += r.amount;
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <div>
          <div class="item-category">${r.item} <span style="font-size:11px; font-weight:normal; color:var(--text-gray)">(${r.category})</span></div>
          <div class="item-note">${r.date}</div>
        </div>
        <div class="item-amount">-$${r.amount}</div>
      `;
      container.appendChild(row);
    });

    totalEl.innerText = `$ ${total.toLocaleString()}`;
    countEl.innerText = `${records.length} 筆`;
  }

  function saveData() {
    localStorage.setItem('line_ledger_records', JSON.stringify(records));
    syncToGitHub();
  }

  function toggleModal(show) {
    document.getElementById('settings-modal').style.display = show ? 'flex' : 'none';
    if (show && config.repo) {
      document.getElementById('gh-repo').value = config.repo || '';
      document.getElementById('gh-token').value = config.token || '';
    }
  }

  function saveSettings() {
    config.repo = document.getElementById('gh-repo').value.trim();
    config.token = document.getElementById('gh-token').value.trim();
    localStorage.setItem('line_ledger_config', JSON.stringify(config));
    toggleModal(false);
    syncToGitHub();
  }

  async function syncToGitHub() {
    if (!config.repo || !config.token) return;

    const path = 'ledger_data.json';
    const url = `https://api.github.com/repos/${config.repo}/contents/${path}`;
    
    try {
      let sha = '';
      const getRes = await fetch(url, {
        headers: { 'Authorization': `token ${config.token}` }
      });
      if (getRes.ok) {
        const fileData = await getRes.json();
        sha = fileData.sha;
      }

      const content = btoa(unescape(encodeURIComponent(JSON.stringify(records, null, 2))));
      await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${config.token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: 'auto: sync ledger data',
          content: content,
          sha: sha || undefined
        })
      });
    } catch (e) {
      console.error('GitHub 同步失敗:', e);
    }
  }
</script>
</body>
</html>
