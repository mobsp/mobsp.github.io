  <!-- =========================================================
       Mobispace Code Visual Editor｜單欄運行式
       - 單檔可部署（GitHub Pages）
       - 單欄：原始碼編輯模式
       - 點擊「運行」→ 切換至預覽視窗（iframe）
       - 點擊「暫停」→ 返回原始碼編輯
       - 內建 console 日誌攔截（debug 可視化）
  ========================================================== -->

  <style>

<body>

<header>
  🧩 Mobispace Code Visual Editor（單欄運行式）
</header>

<main>
  <!-- ========================
       原始碼編輯區（單欄）
  ======================== -->
  <textarea id="editor">&lt;!DOCTYPE html&gt;
&lt;html lang="zh-Hant"&gt;
&lt;head&gt;
  &lt;meta charset="UTF-8"&gt;
  &lt;title&gt;Preview&lt;/title&gt;
  &lt;style&gt;
    body { font-family: sans-serif; padding: 2rem; }
    h1 { color: #2563eb; }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;Hello Mobispace&lt;/h1&gt;
  &lt;p&gt;請在此編輯 HTML，點擊「運行」查看效果。&lt;/p&gt;

  &lt;script&gt;
    console.log('頁面已載入');
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;</textarea>

  <!-- ========================
       預覽視窗（Sandbox iframe）
  ======================== -->
  <iframe id="preview" sandbox="allow-scripts allow-same-origin"></iframe>
</main>

<footer>
  <div class="status" id="status">編輯模式</div>
  <div>
    <button id="run">▶ 運行</button>
    <button id="pause" class="secondary">⏸ 暫停</button>
  </div>
</footer>

<script>
/* ============================================================
   核心控制邏輯（模式切換 + 日誌）
============================================================ */

const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const status = document.getElementById('status');
const runBtn = document.getElementById('run');
const pauseBtn = document.getElementById('pause');

// ------------------------------------------------------------
// 運行模式：隱藏編輯器 → 顯示 iframe
// ------------------------------------------------------------
runBtn.addEventListener('click', () => {
  console.log('[Editor] Run clicked');

  const code = editor.value;

  preview.srcdoc = code;          / 將原始碼送入 sandbox iframe
  editor.style.display = 'none';  / 隱藏編輯區
  preview.style.display = 'block';/ 顯示預覽

  status.textContent = '運行中（Preview Mode）';
});

// ------------------------------------------------------------
// 暫停模式：停止顯示 iframe → 回到編輯
// ------------------------------------------------------------
pauseBtn.addEventListener('click', () => {
  console.log('[Editor] Pause clicked');

  preview.srcdoc = '';             / 清空 iframe（停止執行）
  preview.style.display = 'none';  / 隱藏預覽
  editor.style.display = 'block';  / 顯示編輯器

  status.textContent = '編輯模式';
});

console.log('[Editor] Mobispace Code Visual Editor initialized');
</script>
