  <title>Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁⲁ𝔠ⲉ | 工具庫展示牆</title>
  
  <link rel="icon" href="https://mobsp.github.io/assets/brand/ms-logo1.JPEG" type="image/jpeg">

  <style>
    :root {
      --bg: #0b0b0c;
      --panel: rgba(25, 27, 31, 0.95);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f1f2f6;
      --muted: #9aa3b2;
      --accent: #00cec9; /* 莫比空間主色調 */
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'PingFang TC', system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }

    /* 啟動畫面模擬背景 */
    .bg-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: url('https://mobsp.github.io/assets/brand/ms-tools.JPEG') center/cover no-repeat;
      opacity: 0.15; z-index: -1;
    }

    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(11, 11, 12, 0.85);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: 1.5rem; border-bottom: 1px solid var(--border);
      text-align: center;
    }

    header h1 {
      margin: 0 0 1rem 0; font-size: 1.5rem; letter-spacing: 4px; color: var(--accent);
    }

    #search {
      width: 100%; max-width: 400px; padding: .8rem 1.2rem;
      border-radius: 999px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text);
      font-size: 1rem; outline: none; transition: 0.3s;
    }

    #search:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 206, 201, 0.3); }

    main { padding: 2rem 1.5rem; max-width: 1200px; margin: 0 auto; }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0;
      text-align: center;
      text-decoration: none;
      color: inherit;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: var(--accent);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* 工具預覽圖區塊 */
    .img-container {
      width: 100%; aspect-ratio: 1/1;
      background: #1e272e;
      overflow: hidden;
    }

    .tool-img {
      width: 100%; height: 100%; object-fit: cover;
      transition: 0.5s;
    }

    .card:hover .tool-img { transform: scale(1.1); }

    .name-box { padding: 1rem; }

    .name {
      font-size: 0.95rem; font-weight: 600;
      color: var(--text); margin-bottom: 4px;
    }

    .url-hint {
      font-size: 0.7rem; color: var(--muted); letter-spacing: 0.5px;
    }

    footer {
      text-align: center; padding: 3rem 1rem;
      font-size: .75rem; color: var(--muted); opacity: 0.6;
    }
  </style>

<body>
  <div class="bg-overlay"></div>

  <header>
    <h1>Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁ𝔠ⲉ 工具庫</h1>
    <input id="search" type="search" placeholder="搜尋線上工具...">
  </header>

  <main>
    <section id="grid"></section>
  </main>

  <footer>
    © 2026 Ⲙ𝔬ⲃ¡ⳝ𝔭ⲁ𝔠ⲉ｜資源整合與數位服務
  </footer>

  <script>
    /**
     * 🛠️ 工具清單設定
     * 這裡列出你在 /tol/ 資料夾下的所有工具路徑
     */
    const TOOLS = [
      "json-formatter",
      "color-palette",
      "markdown-editor",
      "base64-decoder",
      "timestamp-converter",
      "unit-converter"
    ];

    const BASE_URL = "https://mobsp.github.io/tol/";
    const PREVIEW_IMG = "https://mobsp.github.io/assets/brand/ms-logo1.JPEG";

    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("search");

    // 渲染工具卡片
    function render(list) {
      grid.innerHTML = ""; 

      list.forEach(toolPath => {
        const fullUrl = `${BASE_URL}${toolPath}/`;
        const displayName = toolPath.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');

        const a = document.createElement("a");
        a.href = fullUrl;                    
        a.className = "card";            

        a.innerHTML = `
          <div class="img-container">
            <img src="${PREVIEW_IMG}" class="tool-img" alt="${displayName}" loading="lazy">
          </div>
          <div class="name-box">
            <div class="name">${displayName}</div>
            <div class="url-hint">/tol/${toolPath}</div>
          </div>
        `;

        grid.appendChild(a);
      });
    }

    // 搜尋功能
    searchInput.addEventListener("input", () => {
      const keyword = searchInput.value.toLowerCase();
      const filtered = TOOLS.filter(t => t.toLowerCase().includes(keyword));
      render(filtered);
    });

    // 初始化
    render(TOOLS);
  </script>



<script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {})); }</script></body></html>
