<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>莫比空間｜空間雲 - 為開發者而設計的檔案庫</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #1C1C1E;
            --surface-hover: #2C2C2E;
            --text-primary: #FFFFFF;
            --text-secondary: #8E8E93;
            --divider: #38383A;
            --accent-blue: #0A84FF;
            --accent-red: #FF453A;
            --nav-height: 44px;
            --tab-height: 83px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 導航列 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: var(--nav-height);
            padding: 0 16px;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            border-bottom: 1px solid transparent;
        }
        .navbar.scrolled { border-bottom-color: var(--divider); }
        .nav-btn {
            background: var(--surface-color);
            border: none;
            color: var(--text-primary);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .nav-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .nav-title { font-size: 17px; font-weight: 600; text-align: center; flex: 1; }
        .nav-text-btn { background: none; border: none; color: var(--accent-blue); font-size: 17px; cursor: pointer; display: none; }

        /* 搜尋與分類 */
        .controls-container { padding: 8px 16px; z-index: 99; background: var(--bg-color); }
        .search-bar {
            background: var(--surface-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            margin-bottom: 12px;
        }
        .search-bar svg { width: 16px; height: 16px; fill: var(--text-secondary); margin-right: 8px; }
        .search-bar input {
            background: transparent; border: none; color: var(--text-primary);
            font-size: 17px; width: 100%; outline: none;
        }
        .segment-control {
            display: flex;
            background: var(--surface-color);
            border-radius: 8px;
            padding: 2px;
        }
        .segment-btn {
            flex: 1; text-align: center; padding: 6px 0; font-size: 13px;
            border-radius: 6px; cursor: pointer; color: var(--text-primary);
        }
        .segment-btn.active { background: #636366; font-weight: 500; }

        /* 滾動容器 (取代原本的 main-content 滾動功能，讓版權聲明可以置底) */
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: calc(var(--tab-height) + 20px);
            display: flex;
            flex-direction: column;
        }

        /* 主內容區 (檔案列表/網格) */
        .main-content {
            width: 100%;
        }
        
        /* 空狀態 */
        .empty-state {
            display: none; flex: 1; flex-direction: column;
            justify-content: center; align-items: center; color: var(--text-secondary);
            min-height: 40vh;
        }
        .empty-state svg { width: 64px; height: 64px; fill: var(--surface-color); margin-bottom: 16px; }

        /* 頁尾版權聲明 (iOS 系統備註風格) */
        .footer-copyright {
            display: block;
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 32px 0 16px 0;
            margin-top: auto; /* 檔案少時自動將 footer 推到畫面底部 */
            letter-spacing: 0.5px;
        }
        .footer-copyright:active {
            opacity: 0.5;
        }

        /* 格狀檢視 (Grid) */
        .grid-view { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .grid-item {
            background: var(--surface-color);
            border-radius: 16px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .grid-item:active { background: var(--surface-hover); }
        .grid-item .preview {
            flex: 1; display: flex; justify-content: center; align-items: center;
            font-size: 10px; color: var(--text-secondary); padding: 12px;
            background: #121212; overflow: hidden; position: relative;
        }
        .grid-item .preview svg { width: 32px; height: 32px; fill: var(--accent-blue); }
        .grid-item .preview.img-preview { background-size: cover; background-position: center; }
        .grid-item .info {
            padding: 12px; height: 50px; border-top: 1px solid var(--divider);
            display: flex; flex-direction: column; justify-content: center;
        }
        .grid-item .title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 清單檢視 (List) */
        .list-view { display: flex; flex-direction: column; }
        .list-item {
            display: flex; align-items: center; padding: 12px 0;
            border-bottom: 1px solid var(--divider); cursor: pointer; position: relative;
        }
        .list-item:active { background: rgba(255,255,255,0.05); }
        .list-item .icon {
            width: 40px; height: 40px; border-radius: 8px; background: var(--surface-color);
            display: flex; justify-content: center; align-items: center; margin-right: 12px; flex-shrink: 0;
        }
        .list-item .icon svg { width: 24px; height: 24px; fill: var(--accent-blue); }
        .list-item .info { flex: 1; overflow: hidden; }
        .list-item .title { font-size: 17px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .list-item .subtext { font-size: 13px; color: var(--text-secondary); }
        
        /* 選取模式 UI */
        .checkbox {
            width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--text-secondary);
            margin-right: 12px; display: none; align-items: center; justify-content: center;
        }
        .checkbox.checked { background: var(--accent-blue); border-color: var(--accent-blue); }
        .checkbox.checked::after { content: ''; width: 6px; height: 10px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); margin-bottom: 2px; }
        .selection-mode .checkbox { display: flex; }
        .selection-mode .grid-item .checkbox { position: absolute; top: 8px; left: 8px; z-index: 10; background: rgba(0,0,0,0.5); }
        .selection-mode .grid-item.selected { border: 2px solid var(--accent-blue); }

        /* 底部工具列 */
        .tab-bar {
            position: fixed; bottom: 0; left: 0; right: 0; height: var(--tab-height);
            background: rgba(28, 28, 30, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; padding-top: 8px; z-index: 100;
            border-top: 1px solid var(--divider);
        }
        .tab-item { display: flex; flex-direction: column; align-items: center; color: var(--text-secondary); font-size: 10px; cursor: pointer; }
        .tab-item svg { width: 24px; height: 24px; fill: currentColor; margin-bottom: 4px; }
        .tab-item.active { color: var(--text-primary); }

        /* 底部彈出選單 (Bottom Sheet) */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 200; display: none; opacity: 0; transition: opacity 0.3s;
        }
        .overlay.show { display: block; opacity: 1; }
        .bottom-sheet {
            position: absolute; bottom: -100%; left: 0; right: 0;
            background: var(--surface-color); border-radius: 20px 20px 0 0;
            padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
            transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .overlay.show .bottom-sheet { bottom: 0; }
        .sheet-menu-item {
            display: flex; align-items: center; padding: 16px; font-size: 17px;
            border-bottom: 1px solid var(--divider); cursor: pointer;
        }
        .sheet-menu-item:last-child { border-bottom: none; }
        .sheet-menu-item svg { width: 20px; height: 20px; fill: currentColor; margin-right: 16px; }
        .sheet-menu-item.danger { color: var(--accent-red); }

        /* Dialog (對話框) */
        .dialog {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            background: rgba(44, 44, 46, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 14px; width: 270px; display: none; flex-direction: column; z-index: 201;
            opacity: 0; transition: all 0.2s;
        }
        .dialog.show { display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .dialog-title { text-align: center; font-size: 17px; font-weight: 600; padding: 20px 16px 8px; }
        .dialog-input {
            margin: 0 16px 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--divider);
            color: white; padding: 8px; border-radius: 6px; font-size: 13px; outline: none;
        }
        .dialog-actions { display: flex; border-top: 1px solid var(--divider); }
        .dialog-btn {
            flex: 1; padding: 12px; text-align: center; font-size: 17px;
            color: var(--accent-blue); cursor: pointer;
        }
        .dialog-btn:first-child { border-right: 1px solid var(--divider); }
        .dialog-btn.bold { font-weight: 600; }
        .dialog-btn.danger { color: var(--accent-red); }

        /* SVG 圖示庫隱藏 */
        #svg-defs { display: none; }
    </style>
</head>
<body>

            <path id="icon-list" d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
        </defs>
    </svg>

    <div class="navbar" id="navbar">
        <button class="nav-btn" id="btn-left">
            <svg><use href="#icon-menu" id="icon-left-use"></use></svg>
        </button>
        <div class="nav-title" id="nav-title">檔案庫</div>
        <button class="nav-btn" id="btn-right">
            <svg><use href="#icon-more"></use></svg>
        </button>
        <button class="nav-text-btn" id="btn-cancel-select">取消</button>
        <button class="nav-text-btn" id="btn-done-select" style="display:none; font-weight:600;">完成</button>
    </div>

    <div class="controls-container" id="controls">
        <div class="search-bar">
            <svg><use href="#icon-search"></use></svg>
            <input type="text" id="search-input" placeholder="搜尋檔案庫">
