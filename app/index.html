<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ⲙ𝔬ⲃⳝ𝔭 Nexus Sync</title>
    
    <style>
        /* --- 1. CSS 變數與基礎設定 --- */
        :root {
            --bg: #050507;
            --card: #111114;
            --accent: #00ffc8;
            --text: #e2e8f0;
            --border: #22262e;
            --header-h: 60px;
            --footer-h: 60px;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; /* 防止全域滑動 */
        }

        /* --- 2. 佈局架構 (固定頁首頁尾) --- */
        #nexus-app {
            display: grid;
            grid-template-rows: calc(var(--header-h) + var(--safe-top)) 1fr calc(var(--footer-h) + var(--safe-bottom));
            height: 100vh;
        }

        /* 頂部頁首 (1-6) */
        .mobi-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: var(--safe-top) 15px 0;
            background: rgba(10, 10, 12, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .header-left, .header-right { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 1px solid var(--border); }
        .symbol { color: var(--accent); font-weight: 900; font-size: 1.2rem; }
        .breadcrumb { font-size: 0.8rem; opacity: 0.6; background: #1a1a1d; padding: 4px 8px; border-radius: 4px; }

        /* 中間滾動區 */
        .mobi-main {
            overflow-y: auto; overflow-x: hidden;
            padding: 15px;
            -webkit-overflow-scrolling: touch;
        }

        /* --- 3. 編輯器模組 (8-10) --- */
        .universal-editor {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 15px; margin-bottom: 20px;
        }

        .module-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .editor-core { display: flex; flex-direction: column; gap: 10px; }
        
        .toolbar-top { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
        .tool-btn { background: #222; border: 1px solid var(--border); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; white-space: nowrap; }

        textarea {
            width: 100%; height: 280px; background: #000; color: var(--accent);
            border: 1px solid var(--border); border-radius: 8px; padding: 12px;
            font-family: 'Fira Code', monospace; font-size: 14px; outline: none;
        }
        
        #preview-area {
            width: 100%; min-height: 280px; background: #0a0a0c;
            border: 1px solid var(--accent); border-radius: 8px; padding: 12px;
        }

        .editor-footer-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .full-width { grid-column: span 2; }
        
        input, select {
            background: #1a1a1d; border: 1px solid var(--border); color: #fff;
            padding: 8px; border-radius: 6px; outline: none; width: 100%;
        }

        .btn-primary { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 10px; border-radius: 6px; cursor: pointer; }

        /* --- 4. 動態表格列表 (11-24) --- */
        .asset-section { margin-bottom: 20px; }
        .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px; border-left: 3px solid var(--accent); padding-left: 10px; }
        .table-body { background: var(--card); border: 1px solid var(--border); border-radius: 10px; min-height: 100px; padding: 10px; }

        /* --- 5. 底部導覽列 --- */
        .mobi-footer {
            display: grid; grid-template-columns: repeat(5, 1fr);
            background: #000; border-top: 1px solid var(--border);
            padding-bottom: var(--safe-bottom);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.7rem; opacity: 0.7; cursor: pointer; }
        .nav-item:hover { color: var(--accent); opacity: 1; }

        /* 通用元件 */
        .hidden { display: none !important; }
        .icon-svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>

<div id="nexus-app">
    <header class="mobi-header">
        <div class="header-left">
            <div id="hamburger" class="tool-btn">☰</div>
            <img src="https://github.com/mobsp.png" class="brand-logo" alt="Logo">
            <span class="breadcrumb">Ⲙ𝔬ⲃⳝ𝔭 / Control</span>
        </div>
        <div class="header-right">
            <span class="tool-btn">🔍</span>
            <span class="tool-btn" onclick="Nexus.backup()" title="備份還原">📦</span>
            <img src="https://github.com/mobsp.png" class="brand-logo" alt="Logo">
        </div>
    </header>

    <main class="mobi-main">
        <section class="universal-editor">
            <div class="module-header">
                <span class="symbol">#8 萬能編輯發佈器</span>
                <div style="display:flex; gap:5px;">
                    <button class="tool-btn" onclick="Nexus.togglePreview()">#9 預覽</button>
                    <button class="tool-btn" onclick="Nexus.feedback()">#9-1 反饋</button>
                </div>
            </div>

            <div class="editor-core">
                <div class="toolbar-top">
                    <button class="tool-btn">#10-1 💬</button>
                    <button class="tool-btn" onclick="Nexus.modal('範本庫')">#10-2 🔖</button>
                    <button class="tool-btn">#10-3 ➕</button>
                    <select id="pub-mode" class="tool-btn" style="background:#000; border-color:var(--accent)">
                        <option>#10-4 發佈模式: 編輯/同步</option>
                        <option>新增資產</option>
                        <option>移除路徑</option>
                    </select>
                    <button class="btn-primary" style="padding:5px 15px">#10-5 🚀</button>
                </div>

                <div id="editor-container">
                    <textarea id="main-editor" placeholder="在此輸入內容或代碼..."></textarea>
                    <div id="preview-area" class="hidden"></div>
                </div>

                <div class="editor-footer-controls">
                    <button class="tool-btn" onclick="document.getElementById('upload').click()">#10-6 上傳檔案</button>
                    <input type="file" id="upload" class="hidden">
                    
                    <select><option>#10-7 下載格式 (Any)</option></select>
                    <select><option>#10-8 編輯格式 (Any)</option></select>
                    <input type="text" placeholder="#10-9 發佈路徑 (e.g. pages/home)" class="full-width">
                    <select class="full-width"><option>#10-10 自定義進階設定</option></select>
                </div>
            </div>
        </section>

        <div id="dynamic-sections"></div>

        <section class="asset-section">
            <div class="table-body" style="text-align:center; border: 1px dashed var(--accent)">
                #25 推薦網站連結清單 (可於設定內新增/移除)
            </div>
        </section>

        <footer style="text-align:center; padding: 20px; font-size: 0.8rem; opacity: 0.5;" onclick="location.href='https://github.com/mobsp'">
            Ⲙ𝔬ⲃⳝ𝔭 莫比空間 © 2026 • Nexus Sync
        </footer>
    </main>

    <nav class="mobi-footer">
        <div class="nav-item">
            <select style="width:80%; font-size:10px; background:none; border:none; color:inherit;">
                <option>索引選單</option>
                <option>部落格</option>
                <option>音樂頻道</option>
            </select>
        </div>
        <div class="nav-item">實驗室</div>
        <div class="nav-item">工具庫</div>
        <div class="nav-item">支援</div>
        <div class="nav-item">設定</div>
    </nav>
</div>

<div id="nexus-modal" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:9999; padding:40px;">
    <div id="modal-body" style="background:var(--card); height:100%; border-radius:15px; padding:20px; position:relative;">
        <button onclick="Nexus.closeModal()" style="position:absolute; right:15px; top:15px;" class="tool-btn">關閉</button>
        <div id="modal-content"></div>
    </div>
</div>

<script>
    /* --- 6. JS 核心邏輯 (Nexus Engine) --- */
    const Nexus = {
        config: {
            initialData: "", // 儲存最初讀取版本
            isShowingPreview: false
        },

        init() {
            console.log("Ⲙ𝔬ⲃⳝ𝔭 Nexus Sync 啟動...");
            this.renderLists();
            this.config.initialData = document.getElementById('main-editor').value;
            this.loadSvgs();
        },

        // 渲染 11/14/17/18/19/21/23 列表
        renderLists() {
            const listTypes = [
                { id: 11, name: "頁面&連結/路徑表格清單" },
                { id: 14, name: "檔案&路徑/連結表格清單" },
                { id: 17, name: "SVG&路徑連結表格清單" },
                { id: 18, name: "圖片&路徑連結表格清單" },
                { id: 19, name: "影片&連結/路徑表格清單" },
                { id: 21, name: "音樂&連結/路徑表格清單" },
                { id: 23, name: "文章列表表格清單" }
            ];

            const container = document.getElementById('dynamic-sections');
            container.innerHTML = listTypes.map(item => `
                <section class="asset-section">
                    <div class="section-header">
                        <span style="font-size:0.9rem; font-weight:bold;">#${item.id} ${item.name}</span>
                        <div style="font-size:0.7rem;">
                            <span style="cursor:pointer; color:var(--accent)">View All</span> | 
                            <span style="cursor:pointer">排序 ⇵</span>
                        </div>
                    </div>
                    <div class="table-body" id="section-body-${item.id}">
                        <div style="opacity:0.3; font-size:0.8rem">正在同步 GitHub 數據...</div>
                    </div>
                </section>
            `).join('');
        },

        // #9 預覽切換
        togglePreview() {
            const editor = document.getElementById('main-editor');
            const preview = document.getElementById('preview-area');
            this.config.isShowingPreview = !this.config.isShowingPreview;

            if (this.config.isShowingPreview) {
                preview.innerHTML = `<div style="color:var(--accent)">[PREVIEW MODE]</div>` + editor.value.replace(/\n/g, '<br>');
                editor.classList.add('hidden');
                preview.classList.remove('hidden');
            } else {
                editor.classList.remove('hidden');
                preview.classList.add('hidden');
            }
        },

        // #5 備份功能
        backup() {
            const current = document.getElementById('main-editor').value;
            const confirmAction = confirm("要還原至最初讀取版本，還是備份當前內容？\nOK: 還原最初版\nCancel: 備份當前版");
            if(confirmAction) {
                document.getElementById('main-editor').value = this.config.initialData;
                alert("已還原至最初版本");
            } else {
                this.config.initialData = current;
                alert("當前內容已設為新的備份點");
            }
        },

        // #9-1 反饋功能
        feedback() {
            const mail = "mailto:mobsp@example.com?subject=Feedback for Ⲙ𝔬ⲃⳝ𝔭";
            window.location.href = mail;
        },

        // 彈窗系統
        modal(title) {
            const m = document.getElementById('nexus-modal');
            document.getElementById('modal-content').innerHTML = `<h3>${title}</h3><p>內容正在從 GitHub API 加載...</p>`;
            m.classList.remove('hidden');
        },
        closeModal() { document.getElementById('nexus-modal').classList.add('hidden'); },

        // SVG 自適應加載器
        async loadSvgs() {
            // 優先從你的 Repo 抓取，失敗則使用內建適配
            const svgUrl = "https://api.github.com/repos/mobsp/mobsp.github.io/contents/assets/icon/svg";
            try {
                const res = await fetch(svgUrl);
                const data = await res.json();
                console.log("SVG Assets 已同步:", data.length);
            } catch (e) {
                console.warn("無法連接 GitHub API，啟用本地備用 SVG 方案");
            }
        }
    };

    // 啟動系統
    Nexus.init();
</script>

</body>
</html>
