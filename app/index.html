<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ⲙ𝔬ⲃⳝ𝔭 Nexus Explorer</title>
    <style>
        :root {
            --bg: #050507; --card: #111114; --accent: #00ffc8; --text: #e2e8f0; --border: #22262e;
            --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; }
        
        #nexus-app { display: grid; grid-template-rows: calc(60px + var(--safe-top)) 1fr 60px; height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: var(--safe-top) 15px 0; background: #0a0a0c; border-bottom: 1px solid var(--border); }
        main { overflow-y: auto; padding: 15px; -webkit-overflow-scrolling: touch; }

        /* 清單外框 */
        .asset-section { margin-bottom: 20px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--card); }
        .section-header { 
            padding: 15px; background: #16161a; display: flex; justify-content: space-between; align-items: center; 
            cursor: pointer; border-bottom: 1px solid var(--border);
        }
        .section-header:active { background: #1c1c22; }
        .list-title { font-size: 0.9rem; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        
        /* 表格主體 */
        .table-body { display: none; padding: 5px; max-height: 400px; overflow-y: auto; background: #08080a; }
        .table-body.active { display: block; }
        
        .api-item { 
            display: flex; flex-direction: column; padding: 12px; border-bottom: 1px solid #1a1a1d; 
            cursor: pointer; transition: 0.2s;
        }
        .api-item:hover { background: #121215; }
        .file-info { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .file-name { font-size: 0.85rem; font-weight: 500; color: #fff; }
        .path-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
        .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #1a1a1d; color: #888; border: 1px solid #333; }

        /* 彈窗 */
        #modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); 
            display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px;
        }
        .modal-card { width: 100%; max-width: 450px; background: #1a1a1d; border-radius: 16px; padding: 20px; border: 1px solid var(--border); }
        .link-row { background: #000; padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px solid #222; }
        .link-row label { font-size: 10px; color: var(--accent); display: block; margin-bottom: 4px; }
        .link-row code { font-size: 11px; word-break: break-all; color: #ccc; }

        footer { display: grid; grid-template-columns: repeat(5, 1fr); background: #000; border-top: 1px solid var(--border); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: #555; }
    </style>
</head>
<body>

<div id="nexus-app">
    <header>
        <div class="list-title"><img src="https://mobsp.qzz.io/assets/brand/ms-logo1.JPEG" style="width:28px; border-radius:50%;"> Ⲙ𝔬ⲃⳝ𝔭 Nexus Sync</div>
        <div style="font-size: 11px; color: var(--accent);" onclick="location.reload()">REFRESH</div>
    </header>

    <main id="main-container">
        </main>

    <footer>
        <div class="nav-item">首頁</div>
        <div class="nav-item" style="color:var(--accent);">清單</div>
        <div class="nav-item">工具</div>
        <div class="nav-item">文章</div>
        <div class="nav-item">設定</div>
    </footer>
</div>

<div id="modal-overlay" onclick="this.style.display='none'">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div id="m-title" style="font-weight:bold; color:var(--accent); margin-bottom:15px;"></div>
        <div id="m-links"></div>
        <button onclick="document.getElementById('modal-overlay').style.display='none'" style="width:100%; margin-top:15px; padding:12px; background:var(--accent); border:none; border-radius:8px; font-weight:bold;">關閉視窗</button>
    </div>
</div>

<script>
    const CONFIG = {
        user: "mobsp",
        repo: "mobsp.github.io",
        domain: "mobsp.qzz.io",
        branch: "main"
    };

    // 定義清單內容 (對應您的需求 11-24 + 追加)
    const SECTIONS = [
        { id: "major", num: "追加", name: "主要頁面連結 (index/README)", path: "", filter: (f) => f.name.includes('index.html') || f.name.includes('README.md') },
        { id: "pages", num: "11-13", name: "所有前端頁面連結", path: "", filter: (f) => f.name.endsWith('.html') },
        { id: "files", num: "14-16", name: "所有格式檔案清單", path: "" },
        { id: "svgs", num: "17", name: "SVG 圖示路徑清單", path: "assets/icon/svg" },
        { id: "brands", num: "18", name: "品牌圖片路徑清單", path: "assets/brand" },
        { id: "shorts", num: "19-20", name: "影片連結 (shorts.json)", path: "data/shorts.json", isJson: true },
        { id: "music", num: "21-22", name: "音樂連結 (music.json)", path: "data/music.json", isJson: true },
        { id: "blog", num: "23-24", name: "文章文檔路徑清單", path: "blog/p/list" }
    ];

    const Nexus = {
        init() {
            this.renderStructure();
            this.loadAllData();
        },

        renderStructure() {
            const html = SECTIONS.map(s => `
                <div class="asset-section">
                    <div class="section-header" onclick="Nexus.toggle('${s.id}')">
                        <div class="list-title"><span>${s.num}.</span> ${s.name}</div>
                        <div style="font-size:10px; color:#555;">展開/排序 ▾</div>
                    </div>
                    <div class="table-body" id="list-${s.id}"></div>
                </div>
            `).join('');
            document.getElementById('main-container').innerHTML = html;
        },

        toggle(id) {
            document.getElementById(`list-${id}`).classList.toggle('active');
        },

        async loadAllData() {
            for (const s of SECTIONS) {
                this.fetchData(s);
            }
        },

        async fetchData(section) {
            const container = document.getElementById(`list-${section.id}`);
            const url = `https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${section.path}`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (section.isJson) {
                    // 處理 JSON 格式 (音樂、影片)
                    const content = JSON.parse(atob(data.content));
                    this.renderJsonItems(container, content, section.name);
                } else {
                    // 處理目錄格式
                    let files = Array.isArray(data) ? data : [];
                    if (section.filter) files = files.filter(section.filter);
                    this.renderFileItems(container, files);
                }
            } catch (e) {
                container.innerHTML = `<div style="padding:15px; color:red;">讀取失敗</div>`;
            }
        },

        renderFileItems(container, files) {
            container.innerHTML = files.map(f => {
                const fullUrl = `https://${CONFIG.domain}/${f.path}`;
                const relPath1 = f.path;
                const relPath2 = `./${f.path}`;

                return `
                    <div class="api-item" onclick="Nexus.openModal('${f.name}', '${fullUrl}', '${relPath1}', '${relPath2}')">
                        <div class="file-info">
                            <span style="font-size:14px;">${f.type === 'dir' ? '📁' : '📄'}</span>
                            <span class="file-name">${f.name}</span>
                        </div>
                        <div class="path-badges">
                            <span class="badge">/${f.path}</span>
                        </div>
                    </div>
                `;
            }).join('');
        },

        renderJsonItems(container, items, category) {
            // 假設 JSON 格式為 [{title: '', url: ''}...]
            container.innerHTML = (Array.isArray(items) ? items : []).map(item => `
                <div class="api-item" onclick="Nexus.openModal('${item.title || '無標題'}', '${item.url}', '', '')">
                    <div class="file-info">
                        <span style="font-size:14px;">🔗</span>
                        <span class="file-name">${item.title || item.name || '外部連結'}</span>
                    </div>
                    <div class="path-badges"><span class="badge">${item.url.substring(0, 30)}...</span></div>
                </div>
            `).join('');
        },

        openModal(name, full, rel1, rel2) {
            document.getElementById('m-title').innerText = name;
            let html = `
                <div class="link-row"><label>HTTPS 全域連結</label><code>${full}</code></div>
                <div class="link-row"><label>路徑格式 (xxx/xxx)</label><code>${rel1 || 'N/A'}</code></div>
                <div class="link-row"><label>相對格式 (./xxx/xxx)</label><code>${rel2 || 'N/A'}</code></div>
            `;
            document.getElementById('m-links').innerHTML = html;
            document.getElementById('modal-overlay').style.display = 'flex';
        }
    };

    window.onload = () => Nexus.init();
</script>
</body>
</html>
