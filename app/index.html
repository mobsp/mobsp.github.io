<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ⲙ𝔬ⲃⳝ𝔭 Nexus Sync</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg: #050507;
            --card: #111114;
            --accent: #00ffc8;
            --text: #e2e8f0;
            --border: #22262e;
            --header-h: 60px;
            --footer-h: 65px;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: -apple-system, "Noto Sans TC", sans-serif; 
            overflow: hidden; /* 防止全域滾動 */
        }

        #nexus-app {
            display: grid;
            grid-template-rows: calc(var(--header-h) + var(--safe-top)) 1fr calc(var(--footer-h) + var(--safe-bottom));
            height: 100vh;
        }

        /* --- 1-6 頁首 --- */
        .mobi-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: var(--safe-top) 15px 0;
            background: #0a0a0c; border-bottom: 1px solid var(--border);
            z-index: 100;
        }
        .header-left, .header-right { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent); cursor: pointer; }
        .breadcrumb { font-size: 0.8rem; color: #888; font-weight: 500; }

        /* --- 中間可滾動區域 --- */
        .mobi-main {
            overflow-y: auto; overflow-x: hidden;
            padding: 15px; -webkit-overflow-scrolling: touch;
        }

        /* --- 8-10 編輯器區塊 --- */
        .editor-section { background: var(--card); border-radius: 16px; border: 1px solid var(--border); padding: 15px; margin-bottom: 20px; }
        .editor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .editor-title { font-size: 0.9rem; font-weight: bold; color: var(--accent); }
        .editor-toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .tool-btn { background: #1a1a1d; border: 1px solid #333; color: white; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; }
        
        #editor-core {
            width: 100%; height: 200px; background: #000; color: #fff;
            border: 1px solid #333; border-radius: 8px; padding: 10px;
            font-family: monospace; font-size: 0.85rem; resize: none;
        }
        #preview-core {
            width: 100%; min-height: 200px; background: #fff; color: #000;
            border-radius: 8px; display: none; padding: 10px; overflow: auto;
        }

        /* --- 11-24 表格清單樣式 --- */
        .asset-section { margin-bottom: 30px; }
        .section-header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 12px; padding: 0 5px;
        }
        .section-title { font-size: 0.9rem; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .view-all { font-size: 0.75rem; color: var(--accent); cursor: pointer; opacity: 0.8; }
        
        .list-container { 
            background: var(--card); border: 1px solid var(--border); 
            border-radius: 12px; overflow: hidden; 
        }
        .list-item {
            display: flex; align-items: center; padding: 12px 15px;
            border-bottom: 1px solid #1a1a1d; transition: 0.2s; cursor: pointer;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item:active { background: #1a1a1d; }
        .item-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
        .item-info { flex: 1; margin-left: 12px; overflow: hidden; }
        .item-name { font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-path { font-size: 0.65rem; color: #555; margin-top: 2px; }

        /* --- 25-27 頁尾與導覽 --- */
        .recommended-links { background: #0a0a0c; border: 1px solid var(--border); padding: 15px; border-radius: 12px; margin-top: 20px; }
        .copyright { text-align: center; padding: 20px 0; font-size: 0.7rem; color: #444; }
        
        .mobi-footer { 
            display: grid; grid-template-columns: repeat(5, 1fr); 
            background: #000; border-top: 1px solid var(--border); 
            padding-bottom: var(--safe-bottom);
        }
        .nav-item { 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; font-size: 0.65rem; color: #666; 
            padding-top: 8px; gap: 4px; text-decoration: none;
        }
        .nav-item.active { color: var(--accent); }
        .nav-svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }

        /* 隱藏滾動條但保持功能 */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body>

<div id="nexus-app">
    <header class="mobi-header">
        <div class="header-left">
            <svg class="nav-svg" style="width:24px; height:24px;" viewBox="0 0 24 24" stroke="white"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
            <img src="https://mobsp.qzz.io/assets/brand/ms-logo1.webp" class="brand-logo" alt="Logo">
            <span class="breadcrumb">目前頁面名稱</span>
        </div>
        <div class="header-right">
            <svg class="nav-svg" viewBox="0 0 24 24" stroke="white"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <svg class="nav-svg" viewBox="0 0 24 24" stroke="white"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"/></svg>
            <img src="https://mobsp.qzz.io/assets/brand/ms-logo1.webp" class="brand-logo" alt="Home">
        </div>
    </header>

    <main class="mobi-main">
        <section class="editor-section">
            <div class="editor-header">
                <span class="editor-title">萬能編輯發佈器</span>
                <div style="display:flex; gap:10px;">
                    <button class="tool-btn" onclick="togglePreview()">預覽 / 編輯</button>
                    <button class="tool-btn" style="color:var(--accent);">提供反饋</button>
                </div>
            </div>
            
            <div class="editor-toolbar">
                <button class="tool-btn">💬 留言</button>
                <button class="tool-btn">📚 範本</button>
                <button class="tool-btn">➕ 插入</button>
                <select class="tool-btn"><option>發佈模式</option></select>
                <button class="tool-btn" style="background:var(--accent); color:#000;">🚀 發佈</button>
            </div>

            <div id="editor-container">
                <textarea id="editor-core" placeholder="在此輸入內容..."></textarea>
                <div id="preview-core"></div>
            </div>

            <div class="editor-toolbar" style="margin-top:15px;">
                <button class="tool-btn">上傳檔案</button>
                <select class="tool-btn"><option>下載格式</option></select>
                <select class="tool-btn"><option>編輯格式</option></select>
                <input type="text" class="tool-btn" style="flex:1;" placeholder="GitHub Pages 路徑...">
                <button class="tool-btn">⚙️</button>
            </div>
        </section>

        <div id="dynamic-lists">
            </div>

        <div class="recommended-links">
            <div class="section-header">
                <span class="section-title">推薦網站連結清單</span>
                <span class="view-all">+ 新增</span>
            </div>
            <div id="fav-links" class="list-container">
                </div>
        </div>

        <div class="copyright" onclick="window.location.href='https://mobsp.qzz.io'">
            <img src="https://mobsp.qzz.io/assets/brand/ms-logo1.webp" style="width:20px; vertical-align:middle; border-radius:50%; margin-right:5px;">
            莫比空間 © 2026 • Moⲃjδpacϵ.
        </div>
    </main>

    <nav class="mobi-footer">
        <a href="#" class="nav-item active">
            <svg class="nav-svg" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            首頁
        </a>
        <a href="#" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            檔案
        </a>
        <a href="#" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1.33.15 1.65 1.65 0 0 0-1 1.49V20a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.08a1.65 1.65 0 0 0-1-1.49 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.1-1.3l-.08-.02a2 2 0 0 1-1.5-2.1v-.13a2 2 0 0 1 1.5-2.1l.08-.02a1.65 1.65 0 0 0 1.1-1.3l.1-.33a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1.3-1.1l.02-.08a2 2 0 0 1 2.1-1.5h.13a2 2 0 0 1 2.1 1.5l.02.08a1.65 1.65 0 0 0 1.3 1.1h.33a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.1 1.3l.08.02a2 2 0 0 1 1.5 2.1v.13a2 2 0 0 1-1.5 2.1l-.08.02a1.65 1.65 0 0 0-1.1 1.3z"/></svg>
            工具庫
        </a>
        <a href="#" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            支援
        </a>
        <a href="#" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
            設定
        </a>
    </nav>
</div>

<script>
    const CONFIG = {
        owner: "mobsp",
        repo: "mobsp.github.io",
        base: "https://mobsp.qzz.io",
        rawBase: "https://raw.githubusercontent.com/mobsp/mobsp.github.io/main"
    };

    const SECTIONS = [
        { id: "pages", title: "頁面連結&路徑表格清單", path: "", filter: (f) => f.name.endsWith('.html') },
        { id: "files", title: "檔案連結&路徑表格清單", path: "" },
        { id: "svgs", title: "SVG連結&路徑表格清單", path: "assets/icon/svg" },
        { id: "images", title: "圖片連結&路徑表格清單", path: "assets/brand" },
        { id: "videos", title: "影片連結&路徑表格清單", json: "data/shorts.json" },
        { id: "music", title: "音樂連結&路徑表格清單", json: "data/music.json" },
        { id: "articles", title: "文章列表表格清單", path: "blog/p/list" },
        { id: "major", title: "主要頁面(Index/README)", path: "", filter: (f) => f.name === 'index.html' || f.name === 'README.md' }
    ];

    async function init() {
        const container = document.getElementById('dynamic-lists');
        
        for (const sec of SECTIONS) {
            const sectionHtml = `
                <section class="asset-section">
                    <div class="section-header">
                        <span class="section-title">${sec.title}</span>
                        <div style="display:flex; gap:10px;">
                            <span class="view-all">View all</span>
                            <span class="view-all">⇅</span>
                        </div>
                    </div>
                    <div id="list-${sec.id}" class="list-container">
                        <div style="padding:20px; font-size:0.7rem; color:#555;">正在同步 GitHub 資料庫...</div>
                    </div>
                </section>
            `;
            container.insertAdjacentHTML('beforeend', sectionHtml);
            
            if (sec.json) {
                fetchJsonData(sec);
            } else {
                fetchGithubData(sec);
            }
        }
    }

    async function fetchGithubData(sec) {
        try {
            const response = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${sec.path}`);
            let data = await response.json();
            
            if (sec.filter) data = data.filter(sec.filter);
            
            const listEl = document.getElementById(`list-${sec.id}`);
            listEl.innerHTML = data.slice(0, 5).map(item => `
                <div class="list-item" onclick="window.open('${CONFIG.base}/${item.path}', '_blank')">
                    <div class="item-icon">${getFileIcon(item.name)}</div>
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-path">${CONFIG.base}/${item.path}</div>
                    </div>
                    <div style="color:#333; font-size:0.6rem;">❯</div>
                </div>
            `).join('');
        } catch (e) {
            console.error(e);
        }
    }

    async function fetchJsonData(sec) {
        try {
            const response = await fetch(`${CONFIG.rawBase}/${sec.json}`, { cache: 'no-store' });
            const data = await response.json();
            const listEl = document.getElementById(`list-${sec.id}`);
            
            // 假設 JSON 格式為陣列，取前5筆
            const items = Array.isArray(data) ? data : (data.list || []);
            listEl.innerHTML = items.slice(0, 5).map(item => `
                <div class="list-item">
                    <div class="item-icon">${sec.id === 'music' ? '🎵' : '🎬'}</div>
                    <div class="item-info">
                        <div class="item-name">${item.title || item.name || '未命名項目'}</div>
                        <div class="item-path">${item.url || '內部連結'}</div>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            document.getElementById(`list-${sec.id}`).innerHTML = '<div style="padding:10px; color:red;">讀取失敗</div>';
        }
    }

    function getFileIcon(filename) {
        if (filename.endsWith('.html')) return '📄';
        if (filename.endsWith('.svg')) return '🎨';
        if (filename.endsWith('.webp') || filename.endsWith('.webp') || filename.endsWith('.webp')) return '🖼️';
        if (filename.endsWith('.md')) return '📝';
        return '📁';
    }

    function togglePreview() {
        const editor = document.getElementById('editor-core');
        const preview = document.getElementById('preview-core');
        if (editor.style.display !== 'none') {
            preview.innerHTML = editor.value; // 簡單預覽
            editor.style.display = 'none';
            preview.style.display = 'block';
        } else {
            editor.style.display = 'block';
            preview.style.display = 'none';
        }
    }

    // 防止 iOS 橡皮筋回彈但保持內部滾動
    document.addEventListener('touchmove', function(e) {
        if (!e.target.closest('.mobi-main')) {
            e.preventDefault();
        }
    }, { passive: false });

    window.onload = init;
</script>

</body>
</html>
