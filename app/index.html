<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ⲙ𝔬ⲃⳝ𝔭 Nexus Sync</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="mobi-skeleton">
        
        <header class="mobi-header">
            <div class="header-left">
                <div class="hamburger" id="nav-toggle"><span></span><span></span><span></span></div>
                <div class="brand-group" onclick="location.reload()">
                    <span class="symbol">Ⲙ𝔬ⲃⳝ𝔭</span>
                    <span class="nexus-text">Nexus</span>
                </div>
                <nav class="breadcrumb">Control Center</nav>
            </div>
            <div class="header-right">
                <button class="icon-btn" title="全局搜索">🔍</button>
                <button class="icon-btn backup-trigger" onclick="MobiSpace.triggerBackup()" title="手動備份庫">📦</button>
                <div class="logo-circle">M</div>
            </div>
        </header>

        <main class="mobi-main">
            <section class="universal-editor">
                <div class="module-header">
                    <h2 class="module-title">Universal Nexus Editor</h2>
                    <div class="header-actions">
                        <button class="mobi-btn secondary" id="preview-toggle" onclick="MobiSpace.togglePreview()">切換預覽</button>
                        <button class="mobi-btn secondary" onclick="MobiSpace.openFeedback()">反饋</button>
                    </div>
                </div>

                <div class="editor-core">
                    <div class="toolbar-top">
                        <button onclick="MobiSpace.toast('備註功能開發中')">💬 留言</button>
                        <button onclick="MobiSpace.showTemplates()">🔖 範本庫</button>
                        <button>➕ 插入</button>
                    </div>
                    
                    <div class="input-wrapper">
                        <textarea id="main-editor" placeholder="輸入高維度代碼或內容..."></textarea>
                        <div id="preview-area" class="hidden"></div>
                    </div>

                    <div class="editor-footer-controls">
                        <div class="control-group">
                            <button class="mobi-btn" onclick="document.getElementById('file-input').click()">⬆️ 任意上傳</button>
                            <input type="file" id="file-input" hidden>
                            <select class="mobi-select"><option>下載格式 (Any)</option></select>
                            <select class="mobi-select"><option>編輯格式 (Any)</option></select>
                        </div>
                        <div class="control-group full-width">
                            <input type="text" id="gh-path" class="mobi-input" placeholder="GitHub Pages 發佈路徑 (例如: pages/home)">
                            <select class="mobi-select" id="publish-target">
                                <option value="page">發佈至：頁面列表</option>
                                <option value="svg">發佈至：SVG 庫</option>
                                <option value="article">發佈至：文章清單</option>
                            </select>
                            <button class="mobi-btn primary" onclick="MobiSpace.performPublish()">🚀 發佈並同步 GitHub</button>
                        </div>
                    </div>
                </div>
            </section>

            <div id="dynamic-asset-grid" class="asset-grid">
                </div>

            <section class="recommend-section">
                <h3>🔗 推薦網站連結清單</h3>
                <div class="recommend-links" id="recommend-list">
                    <a href="#" class="link-item">GitHub Repository</a>
                    <a href="#" class="link-item">Vercel Edge</a>
                </div>
            </section>
            
            <div class="copyright-area" onclick="location.href='/'">
                <p>Ⲙ𝔬ⲃⳝ𝔭 Nexus Sync © 2026</p>
            </div>
        </main>

        <nav class="mobi-bottom-nav">
            <div class="nav-item dropdown">
                <span class="dropdown-trigger">索引選單 ▾</span>
                <div class="dropdown-menu">
                    <a href="#">索引頁</a>
                    <a href="#">部落格</a>
                    <a href="#">音樂頻道</a>
                    <a href="#">Shorts</a>
                </div>
            </div>
            <div class="nav-item">實驗室</div>
            <div class="nav-item">工具庫</div>
            <div class="nav-item">支援中心</div>
            <div class="nav-item">設定</div>
        </nav>
    </div>

    <div id="modal-overlay" class="modal-hidden" onclick="MobiSpace.closeModal()">
        <div class="modal-window" onclick="event.stopPropagation()">
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
