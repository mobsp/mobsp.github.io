<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ⲙ𝔬ⲃⳝ𝔭 Nexus Local</title>
    
    <style>
        /* --- 基礎設定 --- */
        :root {
            --bg: #050507; --card: #111114; --accent: #ffb400; /* 修改為金黃色代表本地模式 */
            --text: #e2e8f0; --border: #22262e;
            --header-h: 60px; --footer-h: 60px;
            --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* --- 佈局架構 --- */
        #nexus-app {
            display: grid;
            grid-template-rows: calc(var(--header-h) + var(--safe-top)) 1fr calc(var(--footer-h) + var(--safe-bottom));
            height: 100vh;
        }

        .mobi-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: var(--safe-top) 15px 0; background: #0a0a0c; border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .header-left, .header-right { display: flex; align-items: center; gap: 10px; }
        .brand-logo { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 1px solid var(--border); object-fit: cover; }
        .breadcrumb { font-size: 0.8rem; background: #1a1a1d; padding: 4px 10px; border-radius: 4px; color: var(--accent); }

        .mobi-main { overflow-y: auto; overflow-x: hidden; padding: 15px; -webkit-overflow-scrolling: touch; }

        /* --- 編輯器模組 --- */
        .universal-editor { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 25px; }
        .module-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .module-title { font-weight: bold; font-size: 0.9rem; color: #fff; }
        
        .toolbar-top { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; align-items: center; }
        .tool-btn { 
            background: #1a1a1d; border: 1px solid var(--border); color: #fff; 
            padding: 8px; border-radius: 8px; font-size: 0.8rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .tool-btn:hover, .tool-btn:active { border-color: var(--accent); color: var(--accent); }

        textarea { width: 100%; height: 280px; background: #000; color: var(--accent); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: monospace; resize: none; }
        #preview-area { width: 100%; min-height: 280px; background: #08080a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-y: auto; color: #fff; }

        .editor-footer-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        .full-width { grid-column: span 2; }
        input, select { background: #1a1a1d; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 8px; font-size: 0.85rem; width: 100%; }

        /* 修改發佈按鈕為「導出」 */
        .btn-export { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* --- 動態列表區 --- */
        .asset-section { margin-bottom: 25px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-left: 3px solid var(--accent); padding-left: 10px; }
        .list-name { font-size: 0.9rem; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 8px; }
        .table-body { background: var(--card); border: 1px solid var(--border); border-radius: 12px; min-height: 80px; padding: 15px; font-size: 0.8rem; color: #888; }

        /* --- 底部導覽列 --- */
        .mobi-footer { display: grid; grid-template-columns: repeat(5, 1fr); background: #000; border-top: 1px solid var(--border); padding-bottom: var(--safe-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.7rem; color: #888; cursor: pointer; padding-top: 10px; gap: 4px; }
        .nav-item:hover { color: var(--accent); }

        .svg-icon { display: inline-block; width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
        .svg-md { font-size: 18px; } .svg-lg { font-size: 24px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="nexus-app">
    <header class="mobi-header">
        <div class="header-left">
            <div id="btn-menu" class="tool-btn" style="border:none; padding:4px;"></div>
            <img src="https://mobsp.qzz.io/assets/brand/ms-logo1.webp" class="brand-logo" onclick="location.reload()">
            <span class="breadcrumb">本地管理器 (無同步)</span>
        </div>
        <div class="header-right">
            <div id="btn-search" class="tool-btn" style="border:none; padding:4px;"></div>
            <div id="btn-backup" class="tool-btn" style="border:none; padding:4px; color:var(--accent);" onclick="Nexus.backup()"></div>
        </div>
    </header>

    <main class="mobi-main">
        <section class="universal-editor">
            <div class="module-header">
                <span class="module-title">離線內容編輯器</span>
                <div style="display:flex; gap:8px;">
                    <button class="tool-btn" onclick="Nexus.togglePreview()"><span id="icon-preview"></span>預覽</button>
                </div>
            </div>

            <div class="editor-core">
                <div class="toolbar-top">
                    <button class="tool-btn" id="icon-comment"></button>
                    <button class="tool-btn" id="icon-template"></button>
                    <button class="tool-btn" id="icon-plus"></button>
                    <select style="flex:1;">
                        <option>本地顯示模式</option>
                        <option>僅查看</option>
                        <option>草稿模式</option>
                    </select>
                </div>

                <div id="editor-container">
                    <textarea id="main-editor" placeholder="在此輸入內容或路徑備忘錄..."></textarea>
                    <div id="preview-area" class="hidden"></div>
                </div>

                <div class="editor-footer-controls">
                    <button class="tool-btn" onclick="alert('本地模式：請手動貼上內容')"><span id="icon-upload"></span>插入內容</button>
                    <select><option>文字編碼 (UTF-8)</option></select>
                    <input type="text" placeholder="自定義標籤 (不推送)" class="full-width">
                    
                    <button class="btn-export full-width" onclick="Nexus.saveLocal()">
                        <span id="icon-rocket"></span> 儲存至瀏覽器緩存 (Local)
                    </button>
                </div>
            </div>
        </section>

        <div id="dynamic-sections"></div>

        <footer style="text-align:center; padding: 20px 0 40px; font-size: 0.8rem; opacity: 0.5;">
            Ⲙ𝔬ⲃⳝ𝔭 莫比空間 © 2026 • Local Mode
        </footer>
    </main>

    <nav class="mobi-footer">
        <div class="nav-item"><span id="icon-nav-index"></span>首頁</div>
        <div class="nav-item"><span id="icon-nav-grid"></span>頁面</div>
        <div class="nav-item"><span id="icon-nav-tool"></span>工具</div>
        <div class="nav-item"><span id="icon-nav-support"></span>幫助</div>
        <div class="nav-item"><span id="icon-nav-setting"></span>設定</div>
    </nav>
</div>

<script>
    const SVG = {
        render: (path, sizeClass) => `<svg class="svg-icon ${sizeClass}" viewBox="0 0 24 24">${path}</svg>`,
        paths: {
            menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
            search: '<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>',
            backup: '<path d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>',
            preview: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
            comment: '<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>',
            template: '<path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>',
            plus: '<path d="M12 5v14M5 12h14"/>',
            upload: '<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
            rocket: '<path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>', // 改為磁碟片圖示
            page: '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M3 9h18M9 21V9"/>',
            home: '<path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
            grid: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
            tool: '<path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>',
            support: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3M12 17h.01"/>',
            setting: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>'
        },
        inject() {
            const injectMap = {
                'btn-menu': ['menu', 'svg-lg'], 'btn-search': ['search', 'svg-lg'], 'btn-backup': ['backup', 'svg-lg'],
                'icon-preview': ['preview', 'svg-md'], 'icon-comment': ['comment', 'svg-md'], 'icon-template': ['template', 'svg-md'], 
                'icon-plus': ['plus', 'svg-md'], 'icon-upload': ['upload', 'svg-md'], 'icon-rocket': ['rocket', 'svg-md'],
                'icon-nav-index': ['home', 'svg-lg'], 'icon-nav-grid': ['grid', 'svg-lg'],
                'icon-nav-tool': ['tool', 'svg-lg'], 'icon-nav-support': ['support', 'svg-lg'], 'icon-nav-setting': ['setting', 'svg-lg']
            };
            for (let [id, args] of Object.entries(injectMap)) {
                if(document.getElementById(id)) document.getElementById(id).innerHTML = this.render(this.paths[args[0]], args[1]);
            }
        }
    };

    const Nexus = {
        init() {
            SVG.inject();
            this.renderLists();
            // 從 localStorage 讀取先前儲存的內容
            const saved = localStorage.getItem('nexus_draft');
            if(saved) document.getElementById('main-editor').value = saved;
        },

        renderLists() {
            const lists = [
                { name: "本地自定義路徑", icon: "page" },
                { name: "臨時連結紀錄", icon: "grid" }
            ];

            document.getElementById('dynamic-sections').innerHTML = lists.map(l => `
                <section class="asset-section">
                    <div class="section-header">
                        <span class="list-name">${SVG.render(SVG.paths[l.icon], 'svg-md')} ${l.name}</span>
                    </div>
                    <div class="table-body">
                        (本地模式下不讀取 GitHub 數據)
                    </div>
                </section>
            `).join('');
        },

        togglePreview() {
            const ed = document.getElementById('main-editor');
            const pv = document.getElementById('preview-area');
            const isHidden = pv.classList.toggle('hidden');
            ed.classList.toggle('hidden');
            if(!isHidden) pv.innerHTML = ed.value.replace(/\n/g, '<br>') || "無內容";
        },

        backup() {
            alert("本地模式：請使用下方的「儲存至瀏覽器緩存」進行備份。");
        },

        saveLocal() {
            const content = document.getElementById('main-editor').value;
            localStorage.setItem('nexus_draft', content);
            alert("✅ 內容已儲存至瀏覽器緩存！下次開啟將自動載入。");
        }
    };

    window.onload = () => Nexus.init();
</script>

</body>
</html>
