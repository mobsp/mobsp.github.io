<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ⲙ𝔬ⲃⳝ𝔭 Nexus Explorer</title>
    <style>
        :root {
            --bg: #050507; --card: #111114; --accent: #00ffc8; --text: #e2e8f0; --border: #22262e;
            --header-h: 60px; --footer-h: 60px;
            --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; }
        
        #nexus-app { display: grid; grid-template-rows: calc(var(--header-h) + var(--safe-top)) 1fr calc(var(--footer-h) + var(--safe-bottom)); height: 100vh; }
        .mobi-header { display: flex; justify-content: space-between; align-items: center; padding: var(--safe-top) 15px 0; background: #0a0a0c; border-bottom: 1px solid var(--border); z-index: 10; }
        .brand-logo { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); }
        
        .mobi-main { overflow-y: auto; padding: 15px; -webkit-overflow-scrolling: touch; }

        /* 列表區塊樣式 */
        .asset-section { margin-bottom: 15px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--card); }
        .section-header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px; cursor: pointer; transition: background 0.3s;
            background: linear-gradient(90deg, #16161a 0%, #111114 100%);
        }
        .section-header:active { background: #1c1c22; }
        .list-name { font-size: 0.85rem; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        
        /* 表格主體 (預設收起) */
        .table-body { display: none; border-top: 1px solid var(--border); background: #08080a; max-height: 400px; overflow-y: auto; }
        .table-body.expanded { display: block; }
        
        .api-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #1a1a1d; cursor: pointer; }
        .api-item:active { background: #1a1a1d; }
        .api-item-name { flex: 1; margin-left: 10px; font-size: 0.8rem; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 彈出視窗 */
        #modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-card { width: 90%; max-width: 450px; background: #16161a; border: 1px solid var(--border); border-radius: 20px; padding: 20px; animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-title { font-weight: bold; font-size: 0.95rem; color: var(--accent); margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        .link-group { margin-bottom: 12px; }
        .link-label { font-size: 0.65rem; color: #666; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
        .link-value { 
            background: #000; padding: 8px 12px; border-radius: 6px; font-size: 0.75rem; color: #fff; 
            word-break: break-all; font-family: 'Courier New', monospace; border: 1px solid #222;
            display: flex; justify-content: space-between; align-items: center;
        }

        .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .m-btn { padding: 12px; border-radius: 10px; border: none; font-size: 0.8rem; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-cancel { background: #222; color: #888; }
        .btn-go { background: var(--accent); color: #000; }

        @keyframes modalIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 底部導覽 */
        .mobi-footer { display: grid; grid-template-columns: repeat(5, 1fr); background: #000; border-top: 1px solid var(--border); padding-bottom: var(--safe-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.65rem; color: #555; gap: 4px; }
        .svg-icon { width: 1.2em; height: 1.2em; fill: none; stroke: currentColor; stroke-width: 2; }
    </style>
</head>
<body>

<div id="nexus-app">
    <header class="mobi-header">
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="https://mobsp.qzz.io/assets/brand/ms-logo1.JPEG" class="brand-logo">
            <span style="font-size:0.8rem; font-weight:bold; color:var(--accent);">Nexus Sync v2.0</span>
        </div>
        <div style="font-size:0.6rem; color:#444; border:1px solid #222; padding:2px 8px; border-radius:20px;" onclick="location.reload()">SYNC NOW</div>
    </header>

    <main class="mobi-main" id="api-lists-container">
        </main>

    <nav class="mobi-footer">
        <div class="nav-item"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>HOME</div>
        <div class="nav-item" style="color:var(--accent);"><svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>LISTS</div>
        <div class="nav-item"><svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82"/></svg>TOOLS</div>
        <div class="nav-item"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>BLOG</div>
        <div class="nav-item"><svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>DOCS</div>
    </nav>
</div>

<div id="modal-overlay" onclick="Nexus.closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-title" id="m-filename">檔案路徑詳情</div>
        
        <div id="modal-links-content">
            </div>

        <div class="modal-btns">
            <button class="m-btn btn-cancel" onclick="Nexus.closeModal()">關閉</button>
            <a id="m-btn-go" href="#" target="_blank" class="m-btn btn-go">直接跳轉</a>
        </div>
    </div>
</div>

<script>
    const Nexus = {
        config: {
            user: "mobsp",
            repo: "mobsp.github.io",
            domain: "mobsp.qzz.io",
            branch: "main"
        },

        // 定義清單與對應邏輯 (對齊需求 11-24 & 追加)
        sections: [
            { id: "major", name: "主要頁面連結 (index/README)", icon: "⭐️", path: "", filter: f => f.name.includes('index.html') || f.name.includes('README.md') },
            { id: "pages", name: "所有頁面連結 (Frontend)", icon: "📄", path: "", filter: f => f.name.endsWith('.html') || f.name.endsWith('.php') },
            { id: "files", name: "所有格式檔案清單", icon: "📁", path: "" },
            { id: "svg", name: "SVG 圖示連結清單", icon: "🎨", path: "assets/icon/svg" },
            { id: "image", name: "品牌圖片連結清單", icon: "🖼️", path: "assets/brand" },
            { id: "video", name: "影片連結 (Shorts JSON)", icon: "🎬", path: "data/shorts.json", isJson: true },
            { id: "music", name: "音樂連結 (Music JSON)", icon: "🎵", path: "data/music.json", isJson: true },
            { id: "blog", name: "文章文檔路徑清單", icon: "📝", path: "blog/p/list" }
        ],

        init() {
            this.renderLayout();
            this.fetchAll();
        },

        renderLayout() {
            document.getElementById('api-lists-container').innerHTML = this.sections.map(s => `
                <section class="asset-section">
                    <div class="section-header" onclick="Nexus.toggleSection('${s.id}')">
                        <span class="list-name">${s.icon} ${s.name}</span>
                        <span style="font-size:0.6rem; color:#444;">展開/排序 ▾</span>
                    </div>
                    <div class="table-body" id="list-${s.id}">
                        <div style="padding:15px; font-size:0.7rem; color:#444;">正在讀取 GitHub 資料...</div>
                    </div>
                </section>
            `).join('');
        },

        toggleSection(id) {
            const el = document.getElementById(`list-${id}`);
            el.classList.toggle('expanded');
        },

        async fetchAll() {
            for (const s of this.sections) {
                const url = `https://api.github.com/repos/${this.config.user}/${this.config.repo}/contents/${s.path}`;
                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    
                    let finalItems = [];
                    if (s.isJson) {
                        // 解析 JSON 檔案內容
                        const content = JSON.parse(atob(data.content));
                        finalItems = content.map(item => ({ 
                            name: item.title || item.name || "未命名資源", 
                            path: item.url || "#", 
                            isExternal: true 
                        }));
                    } else if (Array.isArray(data)) {
                        // 目錄列表
                        finalItems = s.filter ? data.filter(s.filter) : data;
                        // 12-1, 15-1, 17-2 等排序需求：按名稱排序
                        finalItems.sort((a, b) => a.name.localeCompare(b.name));
                    }

                    this.renderItems(s.id, finalItems);
                } catch (e) {
                    document.getElementById(`list-${s.id}`).innerHTML = `<div style="padding:15px; color:red; font-size:0.7rem;">讀取失敗</div>`;
                }
            }
        },

        renderItems(id, items) {
            const container = document.getElementById(`list-${id}`);
            if (items.length === 0) {
                container.innerHTML = `<div style="padding:15px; color:#444; font-size:0.7rem;">暫無資料</div>`;
                return;
            }
            container.innerHTML = items.map(item => `
                <div class="api-item" onclick="Nexus.openModal('${item.name}', '${item.path}', ${item.isExternal || false})">
                    <span style="font-size:0.8rem;">${item.isExternal ? '🔗' : '📄'}</span>
                    <span class="api-item-name">${item.name}</span>
                    <span style="color:#222; font-size:0.6rem;">❯</span>
                </div>
            `).join('');
        },

        openModal(name, path, isExternal) {
            const domain = this.config.domain;
            const filename = document.getElementById('m-filename');
            const content = document.getElementById('modal-links-content');
            
            filename.innerText = name;
            
            // 如果是儲存庫檔案，生成 5 種格式；如果是 JSON 外部連結，則顯示原始連結
            let links = [];
            if (isExternal) {
                links = [{ label: "外部資源連結", value: path }];
            } else {
                links = [
                    { label: "HTTPS 全域連結", value: `https://${domain}/${path}` },
                    { label: "標準路徑格式 (xxx/xxx.xxx)", value: path },
                    { label: "相對路徑格式 (./xxx/xxx.xxx)", value: `./${path}` },
                    { label: "深層路徑格式 (xxx/xxx/xxx.xxx)", value: path }, // GitHub API path 已是完整路徑
                    { label: "相對深層格式 (./xxx/xxx/xxx.xxx)", value: `./${path}` }
                ];
            }

            content.innerHTML = links.map(l => `
                <div class="link-group">
                    <div class="link-label">${l.label}</div>
                    <div class="link-value">
                        <span>${l.value}</span>
                    </div>
                </div>
            `).join('');

            document.getElementById('m-btn-go').href = isExternal ? path : `https://${domain}/${path}`;
            document.getElementById('modal-overlay').style.display = 'flex';
        },

        closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }
    };

    window.onload = () => Nexus.init();
</script>

</body>
</html>
