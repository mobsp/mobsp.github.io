<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ⲙ𝔬ⲃⳝ𝔭 Nexus Sync</title>
    
    <style>
        /* --- 基礎變數與 iOS 適配 --- */
        :root {
            --bg: #050507;
            --card: #111114;
            --accent: #00ffc8;
            --text: #e2e8f0;
            --border: #22262e;
            --header-h: 60px;
            --footer-h: 60px;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; /* 禁止全域縮放與非必要滑動 */
        }

        /* --- 佈局架構 --- */
        #nexus-app {
            display: grid;
            grid-template-rows: calc(var(--header-h) + var(--safe-top)) 1fr calc(var(--footer-h) + var(--safe-bottom));
            height: 100vh;
        }

        /* 頂部頁首 (1-6) */
        .mobi-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: var(--safe-top) 15px 0;
            background: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .header-left, .header-right { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 1px solid var(--border); transition: 0.3s; }
        .brand-logo:hover { border-color: var(--accent); transform: scale(1.05); }
        .breadcrumb { font-size: 0.8rem; opacity: 0.6; background: #1a1a1d; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border); }

        /* 中間主要滾動區 */
        .mobi-main {
            overflow-y: auto; overflow-x: hidden;
            padding: 15px;
            -webkit-overflow-scrolling: touch;
        }

        /* --- 編輯器模組 (8-10) --- */
        .universal-editor {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 18px; margin-bottom: 20px;
        }

        .module-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .module-title { font-weight: bold; font-size: 0.9rem; color: #fff; }
        
        .toolbar-top { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
        .tool-btn { 
            background: #1a1a1d; border: 1px solid var(--border); color: #fff; 
            padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .tool-btn:hover { border-color: var(--accent); color: var(--accent); }

        textarea {
            width: 100%; height: 300px; background: #000; color: var(--accent);
            border: 1px solid var(--border); border-radius: 8px; padding: 15px;
            font-family: 'Fira Code', monospace; font-size: 14px; outline: none; resize: none;
        }
        
        #preview-area {
            width: 100%; min-height: 300px; background: #08080a;
            border: 1px solid var(--accent); border-radius: 8px; padding: 15px;
            overflow-y: auto;
        }

        .editor-footer-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        .full-width { grid-column: span 2; }
        
        input, select {
            background: #1a1a1d; border: 1px solid var(--border); color: #fff;
            padding: 10px; border-radius: 8px; outline: none; font-size: 0.85rem; width: 100%;
        }
        input:focus, select:focus { border-color: var(--accent); }

        .btn-publish { 
            background: var(--accent); color: #000; font-weight: bold; border: none; 
            padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-publish:active { transform: scale(0.98); opacity: 0.9; }

        /* --- 動態表格列表 (11-24) --- */
        .asset-section { margin-bottom: 25px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .list-name { font-size: 0.9rem; font-weight: bold; color: var(--text); border-left: 3px solid var(--accent); padding-left: 10px; }
        .list-actions { font-size: 0.75rem; color: var(--accent); display: flex; gap: 12px; cursor: pointer; }
        
        .table-body { 
            background: var(--card); border: 1px solid var(--border); 
            border-radius: 12px; min-height: 100px; padding: 20px;
            display: flex; align-items: center; justify-content: center;
            color: #444; font-size: 0.8rem;
        }

        /* --- 底部導覽列 --- */
        .mobi-footer {
            display: grid; grid-template-columns: repeat(5, 1fr);
            background: #000; border-top: 1px solid var(--border);
            padding-bottom: var(--safe-bottom);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.75rem; color: #888; cursor: pointer; }
        .nav-item:hover, .nav-item.active { color: var(--accent); }

        /* --- 通用元件 --- */
        .hidden { display: none !important; }
        .icon-svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>

<div id="nexus-app">
    <header class="mobi-header">
        <div class="header-left">
            <div id="hamburger" class="tool-btn">☰</div>
            <img src="https://github.com/mobsp.webp" class="brand-logo" title="回首頁" onclick="location.reload()">
            <span class="breadcrumb" id="page-name-display">目前頁面名稱</span>
        </div>
        <div class="header-right">
            <div class="tool-btn">🔍</div>
            <div class="tool-btn" onclick="Nexus.backup()" title="資料備份與還原">📦</div>
            <img src="https://github.com/mobsp.webp" class="brand-logo" onclick="location.reload()">
        </div>
    </header>

    <main class="mobi-main">
        <section class="universal-editor">
            <div class="module-header">
                <span class="module-title">萬能編輯發佈器</span>
                <div style="display:flex; gap:8px;">
                    <button class="tool-btn" onclick="Nexus.togglePreview()">預覽</button>
                    <button class="tool-btn" onclick="Nexus.feedback()">提供反饋</button>
                </div>
            </div>

            <div class="editor-core">
                <div class="toolbar-top">
                    <button class="tool-btn" title="留言備註">💬</button>
                    <button class="tool-btn" onclick="Nexus.modal('範本庫')" title="範本庫">🔖</button>
                    <button class="tool-btn" title="插入項目">➕</button>
                    <select id="pub-mode" style="flex:1; border-color:var(--accent); background: #000;">
                        <option>發佈模式選擇</option>
                        <option>編輯/同步模式</option>
                        <option>新增資產</option>
                        <option>移除路徑</option>
                    </select>
                    <button class="tool-btn" style="background:var(--accent); color:#000; border:none;" title="發送">➤</button>
                </div>

                <div id="editor-container">
                    <textarea id="main-editor" placeholder="在此輸入內容、代碼或路徑..."></textarea>
                    <div id="preview-area" class="hidden"></div>
                </div>

                <div class="editor-footer-controls">
                    <button class="tool-btn" onclick="document.getElementById('upload').click()">上傳檔案</button>
                    <input type="file" id="upload" class="hidden">
                    
                    <select><option>下載格式選擇</option></select>
                    <select><option>編輯模式選擇</option></select>
                    <input type="text" placeholder="欲發佈的 GitHub Pages 路徑" class="full-width">
                    <select class="full-width"><option>自定義 & 進階設定選項</option></select>
                    
                    <button class="btn-publish full-width" onclick="Nexus.publish()">
                        🚀 發佈並同步至 GitHub 儲存庫
                    </button>
                </div>
            </div>
        </section>

        <div id="dynamic-sections"></div>

        <section class="asset-section">
            <div class="table-body" style="text-align:center; border: 1px dashed var(--accent); color:var(--text); cursor:pointer;">
                推薦網站連結清單 (可於設定內新增或移除連結)
            </div>
        </section>

        <footer style="text-align:center; padding: 25px 0; font-size: 0.8rem; opacity: 0.5;" onclick="location.href='https://github.com/mobsp'">
            <img src="https://github.com/mobsp.webp" style="width:24px; vertical-align:middle; border-radius:50%; margin-right:8px;">
            莫比空間 © 2026 • Ⲙ𝔬ⲃⳝ𝔭 Nexus Sync
        </footer>
    </main>

    <nav class="mobi-footer">
        <div class="nav-item">
            <select onchange="if(this.value) location.href=this.value" style="background:none; border:none; width:auto; padding:0; color:inherit; font-size: inherit; text-align-last: center;">
                <option value="">索引選單</option>
                <option value="#blog">部落格</option>
                <option value="#music">音樂頻道</option>
                <option value="#shorts">Shorts</option>
            </select>
        </div>
        <div class="nav-item">其它頁面</div>
        <div class="nav-item">工具庫</div>
        <div class="nav-item">支援中心</div>
        <div class="nav-item">設定</div>
    </nav>
</div>

<div id="nexus-modal" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:9999; padding:20px; display:flex; align-items:center; justify-content:center;">
    <div id="modal-body" style="background:var(--card); width:100%; height:90%; border-radius:20px; padding:20px; position:relative; border: 1px solid var(--border);">
        <button onclick="Nexus.closeModal()" style="position:absolute; right:15px; top:15px;" class="tool-btn">關閉</button>
        <div id="modal-content" style="margin-top:40px; height: calc(100% - 50px); overflow-y:auto;"></div>
    </div>
</div>

<script>
    /* --- Nexus Engine 核心邏輯 --- */
    const Nexus = {
        // --- Token 注入與配置區 (由 GitHub Actions 替換) ---
        config: {
            tokens: TOKEN_ARRAY_PLACEHOLDER, // 預留 Token 陣列注入位置
            currentTokenIndex: 0,
            repo: "mobsp/mobsp.github.io"
        },

        state: {
            initialSnapshot: "", // 儲存最初讀取版本
            isPreview: false
        },

        init() {
            console.log("Ⲙ𝔬ⲃⳝ𝔭 Nexus Sync Engine Started.");
            this.renderAssetLists();
            // 抓取最初讀取儲存庫檔案時 & 未做任何動作的內容版本
            this.state.initialSnapshot = document.getElementById('main-editor').value;
        },

        // --- Token 輪替請求核心 ---
        getValidToken() {
            return (Array.isArray(this.config.tokens) && this.config.tokens.length > 0) 
                ? this.config.tokens[this.config.currentTokenIndex] 
                : null;
        },

        async fetchWithRotation(path) {
            const token = this.getValidToken();
            if (!token) return console.error("Token 未注入");

            try {
                const response = await fetch(`https://api.github.com/repos/${this.config.repo}/${path}`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (response.status === 401 || response.status === 403) {
                    if (this.config.currentTokenIndex < this.config.tokens.length - 1) {
                        this.config.currentTokenIndex++;
                        console.warn("Token 切換至索引:", this.config.currentTokenIndex);
                        return this.fetchWithRotation(path);
                    }
                }
                return await response.json();
            } catch (e) {
                console.error("API 請求失敗", e);
            }
        },

        // 渲染所有表格清單 (11, 14, 17, 18, 19, 21, 23)
        renderAssetLists() {
            const listConfigs = [
                { title: "頁面&連結/路徑表格清單" },
                { title: "檔案&路徑/連結表格清單" },
                { title: "SVG&路徑連結表格清單" },
                { title: "圖片&路徑連結表格清單" },
                { title: "影片&連結/路徑表格清單" },
                { title: "音樂&連結/路徑表格清單" },
                { title: "文章列表表格清單" }
            ];

            const container = document.getElementById('dynamic-sections');
            container.innerHTML = listConfigs.map(config => `
                <section class="asset-section">
                    <div class="section-header">
                        <span class="list-name">${config.title}</span>
                        <div class="list-actions">
                            <span onclick="Nexus.toast('查看所有資產...')">View All</span>
                            <span onclick="Nexus.toast('切換排序...')">排序 ⇵</span>
                        </div>
                    </div>
                    <div class="table-body">
                        正在通過 GitHub API 獲取數據...
                    </div>
                </section>
            `).join('');
        },

        // 預覽切換 (9)
        togglePreview() {
            const editor = document.getElementById('main-editor');
            const preview = document.getElementById('preview-area');
            this.state.isPreview = !this.state.isPreview;

            if (this.state.isPreview) {
                preview.innerHTML = editor.value ? editor.value.replace(/\n/g, '<br>') : "無可預覽內容";
                editor.classList.add('hidden');
                preview.classList.remove('hidden');
            } else {
                editor.classList.remove('hidden');
                preview.classList.add('hidden');
            }
        },

        // 資料備份與還原 (5)
        backup() {
            const current = document.getElementById('main-editor').value;
            const choice = confirm("【資料備份中心】\n\n確定：還原至最初讀取版本\n取消：備份當前內容為最新基準點");
            
            if (choice) {
                document.getElementById('main-editor').value = this.state.initialSnapshot;
                this.toast("已還原至最初原始版本");
            } else {
                this.state.initialSnapshot = current;
                this.toast("已成功手動備份當前版本");
            }
        },

        // 提供反饋 (9-1)
        feedback() {
            const subject = encodeURIComponent("Ⲙ𝔬ⲃⳝ𝔭 Nexus Sync 反饋");
            const body = encodeURIComponent("請在此輸入您的建議...");
            window.location.href = `mailto:mobsp@example.com?subject=${subject}&body=${body}`;
        },

        publish() {
            this.toast("🚀 正在觸發 GitHub Action 部署腳本...");
            // 此處後續可接入 Octokit.js 進行 API 調用
        },

        // 彈窗系統
        modal(title) {
            const m = document.getElementById('nexus-modal');
            document.getElementById('modal-content').innerHTML = `<h2>${title}</h2><p>功能開發中，將與 GitHub 儲存庫同步...</p>`;
            m.classList.remove('hidden');
        },
        closeModal() { document.getElementById('nexus-modal').classList.add('hidden'); },

        toast(msg) { alert(msg); }
    };

    // 啟動系統
    Nexus.init();
</script>

</body>
</html>
