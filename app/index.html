<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ⲙ𝔬ⲃⳝ𝔭 Nexus Sync</title>
    
    <style>
        /* --- 基礎美學設定 --- */
        :root {
            --bg: #050507;
            --card: #111114;
            --accent: #00ffc8;
            --text: #e2e8f0;
            --border: #22262e;
            --header-h: 60px;
            --footer-h: 60px;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden; /* 防止全域縮放與隨意滑動 */
        }

        #nexus-app {
            display: grid;
            grid-template-rows: calc(var(--header-h) + var(--safe-top)) 1fr calc(var(--footer-h) + var(--safe-bottom));
            height: 100vh;
        }

        /* --- 頁首 (Header) --- */
        .mobi-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: var(--safe-top) 15px 0;
            background: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .header-group { display: flex; align-items: center; gap: 10px; }
        .brand-logo { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 1px solid var(--border); }
        .symbol { color: var(--accent); font-weight: 900; font-size: 1.1rem; }
        .breadcrumb { font-size: 0.75rem; opacity: 0.5; background: #1a1a1d; padding: 3px 8px; border-radius: 4px; }

        /* --- 主滾動區 --- */
        .mobi-main {
            overflow-y: auto; overflow-x: hidden;
            padding: 15px;
            -webkit-overflow-scrolling: touch;
        }

        /* --- 編輯器主體 --- */
        .universal-editor {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 16px; margin-bottom: 20px;
        }

        .module-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .module-title { font-weight: bold; font-size: 0.95rem; color: #fff; }
        
        .toolbar-top { display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; }
        .icon-btn { 
            background: #1a1a1d; border: 1px solid var(--border); color: #fff; 
            width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

        textarea {
            width: 100%; height: 280px; background: #000; color: var(--accent);
            border: 1px solid var(--border); border-radius: 8px; padding: 15px;
            font-family: 'Fira Code', monospace; font-size: 14px; outline: none; resize: none;
        }
        
        #preview-area {
            width: 100%; min-height: 280px; background: #08080a;
            border: 1px solid var(--accent); border-radius: 8px; padding: 15px;
        }

        .editor-footer { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        .full-width { grid-column: span 2; }
        
        input, select {
            background: #1a1a1d; border: 1px solid var(--border); color: #fff;
            padding: 10px; border-radius: 8px; outline: none; font-size: 0.85rem;
        }

        .publish-btn { 
            background: var(--accent); color: #000; font-weight: bold; border: none; 
            padding: 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* --- 列表項目樣式 --- */
        .asset-section { margin-bottom: 24px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .list-title { font-size: 0.9rem; font-weight: bold; color: var(--text); border-left: 3px solid var(--accent); padding-left: 10px; }
        .list-ops { font-size: 0.75rem; color: var(--accent); cursor: pointer; display: flex; gap: 10px; }
        
        .table-container { 
            background: var(--card); border: 1px solid var(--border); 
            border-radius: 10px; min-height: 80px; padding: 15px; 
            display: flex; align-items: center; justify-content: center; color: #444; font-size: 0.8rem;
        }

        /* --- 底部導覽 (Footer) --- */
        .mobi-footer {
            display: grid; grid-template-columns: repeat(5, 1fr);
            background: #000; border-top: 1px solid var(--border);
            padding-bottom: var(--safe-bottom);
        }
        .nav-item { display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: #888; cursor: pointer; }
        .nav-item.active { color: var(--accent); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="nexus-app">
    <header class="mobi-header">
        <div class="header-group">
            <div class="icon-btn">☰</div>
            <img src="https://github.com/mobsp.png" class="brand-logo" onclick="location.reload()">
            <span class="breadcrumb">目前頁面名稱</span>
        </div>
        <div class="header-group">
            <div class="icon-btn">🔍</div>
            <div class="icon-btn" onclick="Nexus.backup()" title="備份還原">📥</div>
            <img src="https://github.com/mobsp.png" class="brand-logo">
        </div>
    </header>

    <main class="mobi-main">
        <section class="universal-editor">
            <div class="module-header">
                <span class="module-title">萬能編輯發佈器</span>
                <div style="display:flex; gap:8px;">
                    <button class="icon-btn" style="width:auto; padding:0 12px; font-size:12px;" onclick="Nexus.togglePreview()">預覽</button>
                    <button class="icon-btn" style="width:auto; padding:0 12px; font-size:12px;" onclick="Nexus.feedback()">提供反饋</button>
                </div>
            </div>

            <div class="editor-core">
                <div class="toolbar-top">
                    <div class="icon-btn" title="留言備註">💬</div>
                    <div class="icon-btn" title="範本庫" onclick="Nexus.toast('開啟範本庫')">🔖</div>
                    <div class="icon-btn" title="插入項目">➕</div>
                    <select style="flex:1; border-color:var(--accent)">
                        <option>發佈模式選擇</option>
                        <option>新增資產模式</option>
                        <option>移除內容模式</option>
                    </select>
                    <div class="icon-btn" style="background:var(--accent); color:#000;">➤</div>
                </div>

                <div id="editor-wrapper">
                    <textarea id="main-editor" placeholder="輸入內容或代碼..."></textarea>
                    <div id="preview-area" class="hidden"></div>
                </div>

                <div class="editor-footer">
                    <button class="icon-btn" style="width:100%" onclick="document.getElementById('f-up').click()">上傳檔案</button>
                    <input type="file" id="f-up" class="hidden">
                    
                    <select><option>下載格式選擇</option></select>
                    <select><option>編輯模式選擇</option></select>
                    <input type="text" placeholder="發佈路徑 (GitHub Pages Path)" class="full-width">
                    <select class="full-width"><option>自定義設定選項</option></select>
                </div>
                
                <button class="publish-btn full-width" onclick="Nexus.publish()">
                    🚀 發佈並同步至 GitHub 儲存庫
                </button>
            </div>
        </section>

        <div id="nexus-lists"></div>

        <section class="asset-section">
            <div class="table-container" style="border-style: dashed; color:var(--text)">
                推薦網站連結清單 (可於設定內編輯)
            </div>
        </section>

        <div style="text-align:center; padding:30px 0; opacity:0.4; font-size:0.7rem;" onclick="location.href='https://github.com/mobsp'">
            <img src="https://github.com/mobsp.png" style="width:20px; vertical-align:middle; margin-right:5px; filter:grayscale(1)">
            莫比空間 © 2026 • Ⲙ𝔬ⲃⳝ𝔭 Nexus
        </div>
    </main>

    <nav class="mobi-footer">
        <div class="nav-item">
            <select style="background:none; border:none; width:auto; padding:0; color:inherit;">
                <option>索引選單</option>
                <option>部落格</option>
                <option>音樂頻道</option>
                <option>Shorts</option>
            </select>
        </div>
        <div class="nav-item">實驗室</div>
        <div class="nav-item">工具庫</div>
        <div class="nav-item">支援中心</div>
        <div class="nav-item">設定</div>
    </nav>
</div>

<script>
    const Nexus = {
        state: { initialContent: "", isPreview: false },

        init() {
            this.renderLayout();
            this.state.initialContent = document.getElementById('main-editor').value;
            console.log("Ⲙ𝔬ⲃⳝ𝔭 系統就緒");
        },

        renderLayout() {
            const listConfigs = [
                { title: "頁面&連結/路徑表格清單" },
                { title: "檔案&路徑/連結表格清單" },
                { title: "SVG&路徑連結表格清單" },
                { title: "圖片&路徑連結表格清單" },
                { title: "影片&連結/路徑表格清單" },
                { title: "音樂&連結/路徑表格清單" },
                { title: "文章列表表格清單" }
            ];

            document.getElementById('nexus-lists').innerHTML = listConfigs.map(config => `
                <section class="asset-section">
                    <div class="section-header">
                        <span class="list-title">${config.title}</span>
                        <div class="list-ops">
                            <span onclick="Nexus.toast('查看所有項目')">View All</span>
                            <span>排序 ⇵</span>
                        </div>
                    </div>
                    <div class="table-container">
                        資料同步中...
                    </div>
                </section>
            `).join('');
        },

        togglePreview() {
            const editor = document.getElementById('main-editor');
            const preview = document.getElementById('preview-area');
            this.state.isPreview = !this.state.isPreview;
            
            if(this.state.isPreview) {
                preview.innerHTML = editor.value.replace(/\n/g, '<br>') || "無預覽內容";
                editor.classList.add('hidden');
                preview.classList.remove('hidden');
            } else {
                editor.classList.remove('hidden');
                preview.classList.add('hidden');
            }
        },

        backup() {
            if(confirm("確定要將當前編輯框內容重置為最初讀取的版本嗎？")) {
                document.getElementById('main-editor').value = this.state.initialContent;
            }
        },

        publish() {
            this.toast("🚀 正在執行 GitHub Action 同步腳本...");
        },

        feedback() {
            window.location.href = "mailto:mobsp@github.io?subject=反饋給莫比空間";
        },

        toast(msg) { alert(msg); }
    };

    Nexus.init();
</script>

</body>
</html>
