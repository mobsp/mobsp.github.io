<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ⲙ𝔬ⲃⳝ𝔭 Nexus Explorer</title>
    <style>
        :root {
            --bg: #050507; --card: #111114; --accent: #00ffc8; --text: #e2e8f0; --border: #22262e;
            --header-h: 60px; --footer-h: 60px;
            --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; }
        
        #nexus-app { display: grid; grid-template-rows: calc(var(--header-h) + var(--safe-top)) 1fr calc(var(--footer-h) + var(--safe-bottom)); height: 100vh; }
        .mobi-header { display: flex; justify-content: space-between; align-items: center; padding: var(--safe-top) 15px 0; background: #0a0a0c; border-bottom: 1px solid var(--border); }
        .brand-logo { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); }
        .mobi-main { overflow-y: auto; padding: 15px; -webkit-overflow-scrolling: touch; }

        /* 列表樣式 */
        .asset-section { margin-bottom: 25px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-left: 3px solid var(--accent); padding-left: 10px; }
        .table-body { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 5px; }
        .api-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #1a1a1d; cursor: pointer; transition: 0.2s; }
        .api-item:active { background: #1a1a1d; }
        .api-item-name { flex: 1; margin-left: 10px; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- 彈出視窗 (Modal) --- */
        #modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-card { 
            width: 85%; max-width: 400px; background: #1a1a1d; border: 1px solid var(--border); 
            border-radius: 16px; padding: 20px; animation: modalIn 0.3s ease;
        }
        .modal-title { font-weight: bold; font-size: 1rem; color: var(--accent); margin-bottom: 15px; word-break: break-all; }
        .link-box { background: #000; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        .link-label { font-size: 0.7rem; color: #888; margin-bottom: 5px; }
        .link-url { font-size: 0.75rem; color: #fff; word-break: break-all; font-family: monospace; }
        .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .m-btn { 
            padding: 12px; border-radius: 8px; border: none; font-size: 0.8rem; font-weight: bold; cursor: pointer; 
            text-align: center; text-decoration: none; display: inline-block;
        }
        .btn-cancel { background: #333; color: #fff; }
        .btn-go { background: var(--accent); color: #000; }

        @keyframes modalIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        /* 導覽列 */
        .mobi-footer { display: grid; grid-template-columns: repeat(5, 1fr); background: #000; border-top: 1px solid var(--border); padding-bottom: var(--safe-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.7rem; color: #888; padding-top: 10px; gap: 4px; }
        .svg-icon { width: 1.2em; height: 1.2em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>
<body>

<div id="nexus-app">
    <header class="mobi-header">
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="https://mobsp.qzz.io/assets/brand/ms-logo1.webp" class="brand-logo">
            <span style="font-size:0.8rem; font-weight:bold; color:var(--accent);">Nexus Explorer</span>
        </div>
        <div style="font-size:0.7rem; color:#555;" onclick="location.reload()">REFRESH</div>
    </header>

    <main class="mobi-main" id="api-lists-container">
        </main>

    <nav class="mobi-footer">
        <div class="nav-item"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>首頁</div>
        <div class="nav-item" style="color:var(--accent);"><svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>檔案</div>
        <div class="nav-item"><svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33"/></svg>工具</div>
        <div class="nav-item"><svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/></svg>支援</div>
        <div class="nav-item"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg>設定</div>
    </nav>
</div>

<div id="modal-overlay" onclick="Nexus.closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-title" id="m-filename">檔案名稱</div>
        
        <div class="link-box">
            <div class="link-label">GITHUB RAW (原始檔案)</div>
            <div class="link-url" id="m-raw-url">loading...</div>
        </div>

        <div class="link-box">
            <div class="link-label">GITHUB PAGES (預覽頁面)</div>
            <div class="link-url" id="m-page-url">loading...</div>
        </div>

        <div class="modal-btns">
            <button class="m-btn btn-cancel" onclick="Nexus.closeModal()">關閉</button>
            <a id="m-btn-go" href="#" target="_blank" class="m-btn btn-go">跳轉頁面</a>
        </div>
    </div>
</div>

<script>
    const Nexus = {
        config: {
            user: "mobsp",
            repo: "mobsp.github.io",
            branch: "main"
        },

        sections: [
            { id: "page", name: "頁面連結表格", icon: "📄", path: "" },
            { id: "file", name: "檔案連結表格", icon: "📁", path: "assets" },
            { id: "svg", name: "SVG連結表格", icon: "🎨", path: "assets/icon/svg" },
            { id: "image", name: "圖片連結表格", icon: "🖼️", path: "assets/brand" }
        ],

        init() {
            this.renderLayout();
            this.fetchAll();
        },

        renderLayout() {
            document.getElementById('api-lists-container').innerHTML = this.sections.map(s => `
                <section class="asset-section">
                    <div class="section-header"><span class="list-name">${s.icon} ${s.name}</span></div>
                    <div class="table-body" id="list-${s.id}"><div style="padding:20px; color:#555; font-size:0.7rem;">Loading...</div></div>
                </section>
            `).join('');
        },

        async fetchAll() {
            for (const s of this.sections) {
                const url = `https://api.github.com/repos/${this.config.user}/${this.config.repo}/contents/${s.path}`;
                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        document.getElementById(`list-${s.id}`).innerHTML = data.map(item => `
                            <div class="api-item" onclick="Nexus.openModal('${item.name}', '${item.path}')">
                                <span>${item.type === 'dir' ? '📁' : '📄'}</span>
                                <span class="api-item-name">${item.name}</span>
                                <span style="color:#444; font-size:10px;">❯</span>
                            </div>
                        `).join('');
                    }
                } catch (e) { console.error(e); }
            }
        },

        openModal(name, path) {
            const rawUrl = `https://raw.githubusercontent.com/${this.config.user}/${this.config.repo}/${this.config.branch}/${path}`;
            // 如果是 HTML 檔案，Pages 連結去掉 .html 或保留路徑，其餘檔案直接指向該路徑
            const pageUrl = `https://${this.config.user}.github.io/${path}`;

            document.getElementById('m-filename').innerText = name;
            document.getElementById('m-raw-url').innerText = rawUrl;
            document.getElementById('m-page-url').innerText = pageUrl;
            document.getElementById('m-btn-go').href = pageUrl;
            
            document.getElementById('modal-overlay').style.display = 'flex';
        },

        closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }
    };

    window.onload = () => Nexus.init();
</script>

</body>
</html>
