<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ⲙ𝔬ⲃⳝ𝔭 Nexus Sync</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg: #050507; --card: #111114; --accent: #00ffc8; --text: #e2e8f0; --border: #22262e;
            --header-h: 60px; --footer-h: 70px;
            --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: -apple-system, sans-serif; overflow: hidden; 
        }

        #nexus-app {
            display: grid;
            grid-template-rows: calc(var(--header-h) + var(--safe-top)) 1fr calc(var(--footer-h) + var(--safe-bottom));
            height: 100vh;
        }

        /* --- 1-6 頁首導覽 --- */
        .mobi-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: var(--safe-top) 15px 0; background: #0a0a0c;
            border-bottom: 1px solid var(--border); z-index: 100;
        }
        .header-left, .header-right { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--accent); object-fit: cover; cursor: pointer; }
        .breadcrumb { font-size: 0.75rem; color: #666; font-weight: bold; letter-spacing: 1px; }

        /* --- 10 核心主體 (可滑動) --- */
        .mobi-main {
            overflow-y: auto; overflow-x: hidden; padding: 15px;
            -webkit-overflow-scrolling: touch;
        }

        /* 8-10 編輯器面板 */
        .editor-container { background: var(--card); border-radius: 20px; border: 1px solid var(--border); padding: 18px; margin-bottom: 25px; }
        .editor-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .editor-actions { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
        .editor-actions::-webkit-scrollbar { display: none; }
        
        .btn { 
            background: #1a1a1d; border: 1px solid #333; color: #fff; padding: 8px 15px; 
            border-radius: 10px; font-size: 0.7rem; cursor: pointer; white-space: nowrap; transition: 0.2s;
        }
        .btn-active { background: var(--accent); color: #000; font-weight: bold; }
        
        #editor-core {
            width: 100%; height: 240px; background: #000; color: var(--accent);
            border: 1px solid #222; border-radius: 12px; padding: 12px;
            font-family: 'Fira Code', monospace; font-size: 0.8rem; resize: none;
        }
        #preview-box {
            width: 100%; min-height: 240px; background: #fff; color: #000;
            border-radius: 12px; padding: 12px; display: none; overflow: auto;
        }

        /* 11-24 表格清單樣式 */
        .list-section { margin-bottom: 30px; }
        .list-header { 
            display: flex; justify-content: space-between; align-items: flex-end; 
            margin-bottom: 12px; border-left: 4px solid var(--accent); padding-left: 12px;
        }
        .list-title { font-size: 0.9rem; font-weight: bold; }
        .list-ops { font-size: 0.7rem; color: var(--accent); opacity: 0.8; }

        .data-table { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
        .data-row { 
            display: grid; grid-template-columns: 45px 1fr 40px; align-items: center; 
            padding: 12px 15px; border-bottom: 1px solid #1a1a1d; cursor: pointer;
        }
        .data-row:last-child { border-bottom: none; }
        .data-row:active { background: #1a1a1d; }
        .row-icon { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
        .row-name { font-size: 0.8rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row-meta { font-size: 0.6rem; color: #555; margin-top: 3px; font-family: monospace; }

        /* 25-27 頁尾導覽 */
        .recom-site { background: #0a0a0c; border: 1px dashed var(--border); border-radius: 15px; padding: 15px; margin-top: 20px; }
        .copyright { text-align: center; padding: 25px 0; font-size: 0.65rem; color: #444; }
        
        .mobi-footer {
            display: grid; grid-template-columns: repeat(5, 1fr);
            background: rgba(0,0,0,0.9); backdrop-filter: blur(15px);
            border-top: 1px solid var(--border); padding-bottom: var(--safe-bottom);
        }
        .nav-item { 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #666; text-decoration: none; font-size: 0.65rem; gap: 4px; padding-top: 10px;
        }
        .nav-item.active { color: var(--accent); }
        .nav-svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; }
    </style>
</head>
<body>

<div id="nexus-app">
    <header class="mobi-header">
        <div class="header-left">
            <svg class="nav-svg" id="btn-1" viewBox="0 0 24 24" stroke="white"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
            <img src="https://mobsp.qzz.io/assets/brand/ms-logo1.JPEG" class="brand-logo" id="btn-2">
            <span class="breadcrumb" id="btn-3">NEXUS / SYNC</span>
        </div>
        <div class="header-right">
            <svg class="nav-svg" id="btn-4" viewBox="0 0 24 24" stroke="white"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <div id="btn-5" onclick="Nexus.backup()" title="備份原始版本"><svg class="nav-svg" viewBox="0 0 24 24" stroke="var(--accent)"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"/></svg></div>
            <img src="https://mobsp.qzz.io/assets/brand/ms-logo1.JPEG" class="brand-logo" id="btn-6">
        </div>
    </header>

    <main class="mobi-main">
        <section class="editor-container">
            <div class="editor-top">
                <span class="list-title">⚡ 萬能編輯發佈器</span>
                <div style="display:flex; gap:8px;">
                    <button class="btn" onclick="Nexus.togglePreview()">預覽</button>
                    <button class="btn" style="color:var(--accent);">反饋</button>
                </div>
            </div>
            
            <div class="editor-actions">
                <button class="btn">💬 備註</button>
                <button class="btn">📚 範本</button>
                <button class="btn">➕ 插入</button>
                <select class="btn"><option>發佈模式</option></select>
                <button class="btn btn-active">🚀 發佈</button>
            </div>

            <textarea id="editor-core" placeholder="在此處編輯代碼..."></textarea>
            <div id="preview-box"></div>

            <div class="editor-actions" style="margin-top:15px;">
                <button class="btn">上傳</button>
                <button class="btn">下載</button>
                <button class="btn">格式</button>
                <input type="text" class="btn" style="flex:1; text-align:left;" placeholder="GitHub Path...">
                <button class="btn">⚙️</button>
            </div>
        </section>

        <div id="list-render-root"></div>

        <div class="recom-site">
            <div class="list-header">
                <span class="list-title">推薦網站連結清單</span>
                <span class="list-ops">管理連結</span>
            </div>
            <div class="data-table" id="list-25">
                </div>
        </div>

        <div class="copyright" onclick="location.href='https://mobsp.qzz.io'">
            <img src="https://mobsp.qzz.io/assets/brand/ms-logo1.JPEG" style="width:14px; border-radius:50%; vertical-align:middle; margin-right:4px;">
            莫比空間 © 2026 Nexus Sync
        </div>
    </main>

    <nav class="mobi-footer">
        <a href="#" class="nav-item active"><svg class="nav-svg" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>首頁</a>
        <a href="#" class="nav-item"><svg class="nav-svg" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>檔案</a>
        <a href="#" class="nav-item"><svg class="nav-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06"/></svg>工具庫</a>
        <a href="#" class="nav-item"><svg class="nav-svg" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>支援</a>
        <a href="#" class="nav-item"><svg class="nav-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>設定</a>
    </nav>
</div>

<script>
const Nexus = {
    settings: {
        owner: "mobsp",
        repo: "mobsp.github.io",
        domain: "mobsp.qzz.io",
        rawBase: "https://raw.githubusercontent.com/mobsp/mobsp.github.io/main"
    },

    // 11-24 定義
    sections: [
        { id: '11', title: '頁面連結表格', path: '', filter: f => f.name.endsWith('.html') },
        { id: '14', title: '檔案連結表格', path: '' },
        { id: '17', title: 'SVG連結表格', path: 'assets/icon/svg' },
        { id: '18', title: '圖片連結表格', path: 'assets/brand' },
        { id: '19', title: '影片連結表格', json: 'data/shorts.json' },
        { id: '21', title: '音樂連結表格', json: 'data/music.json' },
        { id: '23', title: '文章列表表格', path: 'blog/p/list' },
        { id: 'extra', title: '主要頁面(Index/README)', path: '', filter: f => f.name === 'index.html' || f.name === 'README.md' }
    ],

    async init() {
        this.renderSkeleton();
        await this.syncData();
        // 初始化備份 (如果還沒有備份的話)
        if(!localStorage.getItem('nexus_init_backup')) this.backup(true);
    },

    renderSkeleton() {
        const root = document.getElementById('list-render-root');
        root.innerHTML = this.sections.map(s => `
            <div class="list-section" id="sec-${s.id}">
                <div class="list-header">
                    <span class="list-title">${s.title}</span>
                    <div class="list-ops"><span onclick="Nexus.syncData('${s.id}')">🔄 刷新</span> | ⇅ 排序</div>
                </div>
                <div class="data-table" id="body-${s.id}">
                    <div style="padding:20px; font-size:0.7rem; color:#444;">同步中...</div>
                </div>
            </div>
        `).join('');
    },

    async syncData() {
        for (const s of this.sections) {
            try {
                let items = [];
                if (s.json) {
                    const res = await fetch(`${this.settings.rawBase}/${s.json}`);
                    const data = await res.json();
                    items = Array.isArray(data) ? data : (data.list || []);
                } else {
                    const res = await fetch(`https://api.github.com/repos/${this.settings.owner}/${this.settings.repo}/contents/${s.path}`);
                    items = await res.json();
                    if (s.filter) items = items.filter(s.filter);
                }
                this.renderItems(s.id, items.slice(0, 10));
            } catch (e) {
                document.getElementById(`body-${s.id}`).innerHTML = `<div style="padding:10px; color:red;">讀取失敗</div>`;
            }
        }
    },

    renderItems(id, items) {
        const body = document.getElementById(`body-${id}`);
        body.innerHTML = items.map(item => {
            const name = item.name || item.title || "Unknown";
            const path = item.path || item.url || "";
            // 路徑轉換邏輯 (ABS, REL, ROOT)
            const absPath = `https://${this.settings.domain}/${path}`;
            const isSvg = name.endsWith('.svg');
            const iconId = `icon-${Math.random().toString(36).substr(2, 5)}`;

            if (isSvg) this.loadSvgInline(iconId, path);

            return `
                <div class="data-row" onclick="window.open('${absPath}', '_blank')">
                    <div class="row-icon" id="${iconId}">${this.getEmoji(name)}</div>
                    <div class="row-info">
                        <div class="row-name">${name}</div>
                        <div class="row-meta">${absPath}</div>
                    </div>
                    <div style="font-size:0.6rem; color:#222;">❯</div>
                </div>
            `;
        }).join('');
    },

    async loadSvgInline(targetId, path) {
        try {
            const res = await fetch(`${this.settings.rawBase}/${path}`);
            const svgText = await res.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(svgText, "image/svg+xml");
            const svgTag = doc.querySelector('svg');
            if (svgTag) {
                svgTag.style.width = "100%";
                svgTag.style.height = "100%";
                svgTag.style.fill = "var(--accent)";
                setTimeout(() => {
                    const el = document.getElementById(targetId);
                    if(el) { el.innerHTML = ''; el.appendChild(svgTag); }
                }, 100);
            }
        } catch (e) {}
    },

    getEmoji(n) {
        if (n.endsWith('.html')) return '📄';
        if (n.endsWith('.json')) return '📦';
        if (n.match(/\.(jpg|jpeg|png|gif)$/i)) return '🖼️';
        if (n.endsWith('.mp3')) return '🎵';
        return '📁';
    },

    togglePreview() {
        const core = document.getElementById('editor-core');
        const prev = document.getElementById('preview-box');
        if (core.style.display !== 'none') {
            prev.innerHTML = core.value;
            core.style.display = 'none';
            prev.style.display = 'block';
        } else {
            core.style.display = 'block';
            prev.style.display = 'none';
        }
    },

    backup(isInit = false) {
        const key = isInit ? 'nexus_init_backup' : 'nexus_manual_backup';
        const data = {
            time: new Date().toLocaleString(),
            content: document.body.innerHTML
        };
        localStorage.setItem(key, JSON.stringify(data));
        if(!isInit) alert(`✨ 備份成功！已保存至：${data.time}`);
    }
};

// 啟動系統
window.onload = () => Nexus.init();

// 防止隨意縮放
document.addEventListener('gesturestart', (e) => e.preventDefault());
</script>

</body>
</html>
