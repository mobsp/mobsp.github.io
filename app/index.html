<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ⲙ𝔬ⲃⳝ𝔭 Nexus Explorer</title>
    
    <style>
        /* --- 基礎 UI 設定 --- */
        :root {
            --bg: #050507; --card: #111114; --accent: #00ffc8; --text: #e2e8f0; --border: #22262e;
            --header-h: 60px; --footer-h: 60px;
            --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; touch-action: manipulation;
        }

        #nexus-app {
            display: grid;
            grid-template-rows: calc(var(--header-h) + var(--safe-top)) 1fr calc(var(--footer-h) + var(--safe-bottom));
            height: 100vh;
        }

        /* 頁首 */
        .mobi-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: var(--safe-top) 15px 0; background: #0a0a0c; border-bottom: 1px solid var(--border);
            z-index: 1000;
        }
        .brand-logo { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); cursor: pointer; }
        .breadcrumb { font-size: 0.8rem; background: #1a1a1d; padding: 4px 10px; border-radius: 4px; color: var(--accent); }

        /* 中間滾動區 */
        .mobi-main { overflow-y: auto; padding: 15px; -webkit-overflow-scrolling: touch; }

        /* 編輯器模組 (保留 UI 用於本地草稿) */
        .universal-editor { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 25px; }
        textarea { width: 100%; height: 200px; background: #000; color: var(--accent); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: monospace; resize: none; }

        /* --- API 資料列表樣式 --- */
        .asset-section { margin-bottom: 25px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-left: 3px solid var(--accent); padding-left: 10px; }
        .list-name { font-size: 0.9rem; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 8px; }
        .table-body { background: var(--card); border: 1px solid var(--border); border-radius: 12px; min-height: 80px; padding: 12px; font-size: 0.8rem; overflow: hidden; }
        
        /* 列表項目 */
        .api-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #1a1a1d; animation: fadeIn 0.3s ease; }
        .api-item:last-child { border-bottom: none; }
        .api-item-name { flex: 1; margin: 0 10px; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-view { color: var(--accent); text-decoration: none; border: 1px solid var(--accent); padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; }

        .loading { color: #555; text-align: center; padding: 20px; font-style: italic; }
        .error-msg { color: #ff4d4d; font-size: 0.75rem; }

        /* 底部導覽 */
        .mobi-footer { display: grid; grid-template-columns: repeat(5, 1fr); background: #000; border-top: 1px solid var(--border); padding-bottom: var(--safe-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.7rem; color: #888; padding-top: 10px; gap: 4px; }
        .nav-item.active { color: var(--accent); }

        /* SVG */
        .svg-icon { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .svg-md { font-size: 18px; } .svg-lg { font-size: 24px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="nexus-app">
    <header class="mobi-header">
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="https://mobsp.qzz.io/assets/brand/ms-logo1.JPEG" class="brand-logo" onclick="location.reload()">
            <span class="breadcrumb">Repo Explorer</span>
        </div>
        <div id="btn-refresh-all" class="breadcrumb" style="cursor:pointer;" onclick="Nexus.fetchAll()">⚡ 刷新全部</div>
    </header>

    <main class="mobi-main">
        <section class="universal-editor">
            <div style="font-size:0.8rem; margin-bottom:10px; color:#888;">本地快取編輯器 (不推送到 GitHub)</div>
            <textarea id="local-editor" placeholder="在此貼上路徑或備註，點擊刷新同步顯示儲存庫內容..."></textarea>
        </section>

        <div id="api-lists-container"></div>

        <footer style="text-align:center; padding: 40px 0; font-size: 0.75rem; opacity: 0.4;">
            Ⲙ𝔬ⲃⳝ𝔭 莫比空間 © 2026 • GitHub API 直接讀取模式
        </footer>
    </main>

    <nav class="mobi-footer">
        <div class="nav-item active"><span id="icon-home"></span>首頁</div>
        <div class="nav-item"><span id="icon-page"></span>頁面</div>
        <div class="nav-item"><span id="icon-tool"></span>工具</div>
        <div class="nav-item"><span id="icon-support"></span>支援</div>
        <div class="nav-item"><span id="icon-setting"></span>設定</div>
    </nav>
</div>

<script>
    /* --- SVG 圖示路徑 --- */
    const SVG_DATA = {
        home: '<path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
        page: '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M3 9h18M9 21V9"/>',
        file: '<path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M13 2v7h7"/>',
        vector: '<path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>',
        image: '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
        video: '<rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5"/>',
        music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
        article: '<path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>',
        tool: '<path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>',
        support: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3M12 17h.01"/>',
        setting: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>'
    };

    function getSVG(name, size = 'svg-md') {
        return `<svg class="svg-icon ${size}" viewBox="0 0 24 24">${SVG_DATA[name]}</svg>`;
    }

    /* --- Nexus 核心邏輯 --- */
    const Nexus = {
        config: {
            user: "mobsp",
            repo: "mobsp.github.io",
            branch: "main"
        },

        // 定義 7 大對應關係
        sections: [
            { id: "page", name: "頁面連結表格", icon: "page", path: "" }, // 根目錄
            { id: "file", name: "檔案連結表格", icon: "file", path: "assets" },
            { id: "svg", name: "SVG連結表格", icon: "vector", path: "assets/icon/svg" },
            { id: "image", name: "圖片連結表格", icon: "image", path: "assets/brand" },
            { id: "video", name: "影片路徑清單", icon: "video", path: "data/shorts.json" },
            { id: "music", name: "音樂路徑清單", icon: "music", path: "data/music.json" },
            { id: "article", name: "文章連結表格", icon: "article", path: "blog" }
        ],

        init() {
            this.injectNavIcons();
            this.renderLayout();
            this.fetchAll();
        },

        injectNavIcons() {
            document.getElementById('icon-home').innerHTML = getSVG('home', 'svg-lg');
            document.getElementById('icon-page').innerHTML = getSVG('page', 'svg-lg');
            document.getElementById('icon-tool').innerHTML = getSVG('tool', 'svg-lg');
            document.getElementById('icon-support').innerHTML = getSVG('support', 'svg-lg');
            document.getElementById('icon-setting').innerHTML = getSVG('setting', 'svg-lg');
        },

        renderLayout() {
            const container = document.getElementById('api-lists-container');
            container.innerHTML = this.sections.map(s => `
                <section class="asset-section">
                    <div class="section-header">
                        <span class="list-name">${getSVG(s.icon)} ${s.name}</span>
                        <span style="font-size:0.7rem; color:var(--accent); cursor:pointer;" onclick="Nexus.fetchSingle('${s.id}')">刷新</span>
                    </div>
                    <div class="table-body" id="list-${s.id}">
                        <div class="loading">正在連線 GitHub...</div>
                    </div>
                </section>
            `).join('');
        },

        async fetchAll() {
            for (const s of this.sections) {
                await this.fetchSingle(s.id);
            }
        },

        async fetchSingle(sectionId) {
            const section = this.sections.find(s => s.id === sectionId);
            const container = document.getElementById(`list-${sectionId}`);
            const url = `https://api.github.com/repos/${this.config.user}/${this.config.repo}/contents/${section.path}?ref=${this.config.branch}`;

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                if (Array.isArray(data)) {
                    // 渲染目錄列表
                    container.innerHTML = data.map(item => `
                        <div class="api-item">
                            <span style="font-size:12px;">${item.type === 'dir' ? '📁' : '📄'}</span>
                            <span class="api-item-name">${item.name}</span>
                            <a class="btn-view" href="${item.html_url}" target="_blank">View</a>
                        </div>
                    `).join('') || '<div class="loading">此目錄為空</div>';
                } else if (data.content) {
                    // 渲染 JSON 檔案內容 (自動解碼 Base64)
                    const content = JSON.parse(atob(data.content));
                    container.innerHTML = `<pre style="color:var(--accent); font-size:9px; padding:10px; background:#000; border-radius:8px; overflow-x:auto;">${JSON.stringify(content, null, 2)}</pre>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="error-msg">讀取失敗: ${err.message}</div>`;
            }
        }
    };

    window.onload = () => Nexus.init();
</script>
</body>
</html>
