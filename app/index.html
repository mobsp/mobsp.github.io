    <style>
        :root {
            --bg: #050507; --card: #111114; --accent: #00ffc8; --text: #e2e8f0; --border: #22262e;
            --header-h: 55px; --footer-h: 60px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body, html { 
            height: 100%; width: 100%; background: var(--bg); color: var(--text); 
            font-family: -apple-system, sans-serif; overflow: hidden; 
        }

        /* 主容器 */
        #nexus-app {
            display: flex; flex-direction: column; height: 100vh; width: 100vw;
        }

        /* 1-6 頁首 (置頂) */
        .mobi-header {
            height: var(--header-h); background: #0a0a0c;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 15px; border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .brand-logo { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--accent); }

        /* 10 核心主體 (滾動區) */
        .mobi-main {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            padding: 15px; -webkit-overflow-scrolling: touch;
        }

        /* 編輯器 */
        .editor-box { background: var(--card); border-radius: 15px; border: 1px solid var(--border); padding: 15px; margin-bottom: 20px; }
        #editor-input {
            width: 100%; height: 200px; background: #000; color: var(--accent);
            border: 1px solid #333; border-radius: 10px; padding: 10px; font-size: 0.8rem;
        }

        /* 11-24 清單容器 */
        .list-section { margin-bottom: 25px; }
        .list-title { font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; border-left: 3px solid var(--accent); padding-left: 8px; }
        .data-table { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .data-row { 
            display: grid; grid-template-columns: 40px 1fr 30px; align-items: center; 
            padding: 12px; border-bottom: 1px solid #1a1a1d; font-size: 0.8rem;
        }
        .data-row:active { background: #1a1a1d; }
        .row-meta { font-size: 0.6rem; color: #555; font-family: monospace; }

        /* 27 底部導覽列 - 強制置底移除預留 */
        .mobi-footer {
            height: var(--footer-h);
            display: grid; grid-template-columns: repeat(5, 1fr);
            background: #000; border-top: 1px solid var(--border);
            flex-shrink: 0; position: relative; bottom: 0;
        }
        .nav-item { 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #666; font-size: 0.6rem; gap: 4px; text-decoration: none;
        }
        .nav-item.active { color: var(--accent); }
        .nav-svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; }
    </style>

<body>

<div id="nexus-app">
    <header class="mobi-header">
        <div style="display:flex; align-items:center; gap:8px;">
            <img src="https://mobsp.qzz.io/assets/brand/ms-logo1.JPEG" class="brand-logo">
            <span style="font-weight:bold; font-size:0.8rem;">Nexus Sync</span>
        </div>
        <div id="btn-5" onclick="Nexus.backup()" style="cursor:pointer;">
            <svg class="nav-svg" viewBox="0 0 24 24" stroke="var(--accent)"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"></path></svg>
        </div>
    </header>

    <main class="mobi-main">
        <section class="editor-box">
            <div class="list-title">10. 編輯與發佈</div>
            <textarea id="editor-input" placeholder="代碼編寫..."></textarea>
            <div style="margin-top:10px; display:flex; gap:5px;">
                <button onclick="Nexus.toggleView()" style="padding:5px 15px; background:var(--accent); color:#000; border:none; border-radius:5px; font-size:0.7rem; font-weight:bold;">9. 切換預覽</button>
            </div>
        </section>

        <div id="render-lists"></div>

        <div style="text-align:center; padding:20px; opacity:0.3; font-size:0.6rem;">
            26. 莫比空間 © 2026 Nexus v2.1
        </div>

        <a href="#" class="nav-item"><svg class="nav-svg" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>支援</a>
        <a href="#" class="nav-item"><svg class="nav-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4m0 4h.01"></path></svg>設定</a>
    </nav>
</div>

<script>
const Nexus = {
    env: {
        owner: "mobsp",
        repo: "",
        domain: "mobsp.qzz.io",
        raw: "https://raw.githubusercontent.com/mobsp/main"
    },

    // 定義 11-24 所有的讀取邏輯
    sections: [
        { id: '11', title: '根目錄 HTML 清單', path: '', filter: f => f.name.endsWith('.html') },
        { id: '17', title: 'SVG 圖示資產', path: 'assets/icon/svg', filter: f => f.name.endsWith('.svg') },
        { id: '18', title: '品牌圖片資產', path: 'assets/brand' },
        { id: '23', title: 'Blog 文章列表', path: 'blog/p/list', filter: f => f.name.endsWith('.html') },
        { id: 'data', title: '核心數據庫 (JSON)', path: 'data', filter: f => f.name.endsWith('.json') }
    ],

    async init() {
        this.renderShell();
        await this.syncAll();
    },

    renderShell() {
        const root = document.getElementById('render-lists');
        root.innerHTML = this.sections.map(s => `
            <div class="list-section">
                <div class="list-title">${s.id}. ${s.title}</div>
                <div class="data-table" id="list-body-${s.id}"><div style="padding:15px; font-size:0.6rem;">🔄 同步中...</div></div>
            </div>
        `).join('');
    },

    async syncAll() {
        for (const sec of this.sections) {
            try {
                const res = await fetch(`https://api.github.com/repos/${this.env.owner}/${this.env.repo}/contents/${sec.path}`);
                let items = await res.json();
                
                // 強大讀取邏輯：過濾檔案並確保是 HTML 或指定類型
                if (sec.filter) items = items.filter(sec.filter);
                
                this.renderItems(sec.id, items);
            } catch (e) {
                document.getElementById(`list-body-${sec.id}`).innerHTML = `<div style="padding:10px; color:red;">讀取失敗</div>`;
            }
        }
    },

    renderItems(id, items) {
        const container = document.getElementById(`list-body-${id}`);
        if (!items.length) {
            container.innerHTML = `<div style="padding:15px; font-size:0.6rem; color:#444;">無匹配內容</div>`;
            return;
        }
        
        container.innerHTML = items.map(item => {
            const url = `https://${this.env.domain}/${item.path}`;
            return `
                <div class="data-row" onclick="window.open('${url}', '_blank')">
                    <div style="font-size:1rem;">${this.getIco(item.name)}</div>
                    <div>
                        <div style="font-weight:bold;">${item.name}</div>
                        <div class="row-meta">${url}</div>
                    </div>
                    <div style="text-align:right; color:#222;">❯</div>
                </div>
            `;
        }).join('');
    },

    getIco(n) {
        if(n.endsWith('.html')) return '📄';
        if(n.endsWith('.svg')) return '🎨';
        if(n.endsWith('.json')) return '📦';
        return '📁';
    },

    backup() {
        const snapshot = document.getElementById('render-lists').innerHTML;
        localStorage.setItem('nexus_backup', JSON.stringify({
            time: new Date().toLocaleString(),
            html: snapshot
        }));
        alert('✅ 5. 已將讀取到的內容備份至 LocalStorage');
    },

    toggleView() {
        const input = document.getElementById('editor-input');
        input.style.background = (input.style.background === 'rgb(255, 255, 255)') ? '#000' : '#fff';
        input.style.color = (input.style.color === 'rgb(0, 0, 0)') ? 'var(--accent)' : '#000';
    }
};

window.onload = () => Nexus.init();
</script>
