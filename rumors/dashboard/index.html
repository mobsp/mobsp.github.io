<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rumors CMS Dashboard (Standalone)</title>
    <link rel="stylesheet" href="../css/core/reset.css">
    <link rel="stylesheet" href="../css/design-system/tokens.css">
    <style>
        body {
            background-color: var(--color-bg-base);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 250px;
            background: var(--color-bg-surface);
            border-right: 1px solid var(--color-divider);
            padding: var(--space-lg) var(--space-md);
        }
        .main-content {
            flex: 1;
            padding: var(--space-xl);
            overflow-y: auto;
        }
        .nav-item {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            background: var(--color-primary);
            color: white;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h1 style="font-size: 20px; font-weight: 600; margin-bottom: 32px; padding-left: 16px;">Rumors Admin</h1>
        <nav>
            <div class="nav-item active">Overview</div>
            <div class="nav-item">Articles (CMS)</div>
            <div class="nav-item">Users & RBAC</div>
            <div class="nav-item">System Settings</div>
        </nav>
    </aside>
    <main class="main-content">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
            <h2 style="font-size: 28px; font-weight: 600;">System Overview</h2>
            <div style="display: flex; align-items: center; gap: 16px;">
                <span style="background: var(--color-success); color: white; padding: 4px 12px; border-radius: 12px; font-size: 14px;">Mode B Active</span>
                <img src="../assets/images/avatars/default.svg" style="width: 40px; height: 40px; border-radius: 50%;">
            </div>
        </header>
        
        <div style="background: var(--color-bg-surface); padding: 24px; border-radius: 16px; border: 1px solid var(--color-border);">
            <h3>Welcome to Backend Dedicated Dashboard</h3>
            <p style="color: var(--color-text-secondary); margin-top: 12px; line-height: 1.6;">
                此為獨立的 Web 桌面版後台入口。與行動版的 App Shell 切開，提供更廣闊的表格檢視與文章編輯器 (Rich Text Editor) 空間。
            </p>
        </div>
    </main>
</body>
</html>
