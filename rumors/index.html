<!DOCTYPE html>
<html lang="zh-TW" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rumors">
    
    <title>莫比空間日｜報訊站</title>
    
    <!-- PWA -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="apple-touch-icon" href="./assets/brand/favicon.svg">
    
    <!-- CSS Core & Design System -->
    <link rel="stylesheet" href="./css/core/reset.css">
    <link rel="stylesheet" href="./css/design-system/tokens.css">
    <link rel="stylesheet" href="./css/design-system/liquid-glass.css">
    <link rel="stylesheet" href="./css/design-system/typography.css">
    <link rel="stylesheet" href="./css/layouts/app-shell.css">
    <link rel="stylesheet" href="./css/components/tabbar.css">
    <link rel="stylesheet" href="./css/components/navigation.css">
</head>
<body>
    <!-- App Shell Container -->
    <div id="app-root" class="app-container" data-mode="loading" data-theme="system">
        
        <!-- Navigation Bar (Top) -->
        <header class="nav-bar liquid-glass-header">
            <div class="nav-left">
                <button class="nav-button icon-btn" id="btn-profile" aria-label="Profile">
                    <img src="./assets/images/avatars/default.svg" alt="User" class="avatar-sm">
                </button>
            </div>
            <div class="nav-center">
                <h1 class="nav-title">Rumors</h1>
            </div>
            <div class="nav-right">
                <button class="nav-button icon-btn" id="btn-notification" aria-label="Notifications">
                    <span class="badge-dot"></span>
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </button>
            </div>
        </header>

        <!-- Main Content Area (Scrollable) -->
        <main id="main-view" class="view-container safe-area-pt safe-area-pb">
            <!-- Dynamic Module Content Injection Point -->
            <div class="feed-skeleton">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </main>

        <!-- Bottom Tab Bar (iOS Style) -->
        <nav class="tab-bar liquid-glass-tabbar safe-area-pb-ext">
            <button class="tab-item active" data-target="home">
                <svg class="tab-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span class="tab-label">Home</span>
            </button>
            <button class="tab-item" data-target="search">
                <svg class="tab-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <span class="tab-label">Search</span>
            </button>
            <button class="tab-item" data-target="chat">
                <svg class="tab-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span class="tab-label">Chat</span>
            </button>
            <button class="tab-item" data-target="dashboard">
                <svg class="tab-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                <span class="tab-label">CMS</span>
            </button>
        </nav>

        <!-- Global Modals & Sheets Overlay Container -->
        <div id="overlay-container"></div>
    </div>

    <!-- Core JavaScript Module -->
    <script type="module" src="./js/core/app.js"></script>
</body>
</html>
