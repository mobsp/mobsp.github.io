# Rumors Platform v4.0 GraphQL Schema
# 此定義供 Mode B (Backend) 與 Mode C (Hybrid) 使用

scalar DateTime
scalar JSON

type User {
    id: ID!
    username: String!
    avatarUrl: String
    role: Role!
    membershipTier: MembershipTier!
    status: UserStatus!
    createdAt: DateTime!
    lastLoginAt: DateTime
}

enum Role {
    OWNER
    ADMIN
    EDITOR
    USER
    GUEST
}

enum MembershipTier {
    FREE
    BASIC
    ADVANCED
    PREMIUM
    ULTIMATE
}

enum UserStatus {
    ACTIVE
    BANNED
    SUSPENDED
}

type Article {
    id: ID!
    title: String!
    content: String!
    author: User!
    isPremium: Boolean!
    tags: [String!]
    version: Int!
    status: ArticleStatus!
    publishedAt: DateTime
    updatedAt: DateTime!
}

enum ArticleStatus {
    DRAFT
    REVIEW
    PUBLISHED
    ARCHIVED
}

type Query {
    # Public APIs
    getArticle(id: ID!): Article
    listArticles(limit: Int = 10, offset: Int = 0, tag: String): [Article!]!
    
    # Private / Protected APIs
    me: User
    listUsers(role: Role): [User!]!
    getSystemLogs(limit: Int = 50): [JSON!]!
}

type Mutation {
    # Auth
    login(token: String!): User!
    logout: Boolean!
    
    # CMS Content Management
    createArticle(title: String!, content: String!, isPremium: Boolean!): Article!
    updateArticle(id: ID!, title: String, content: String, isPremium: Boolean): Article!
    publishArticle(id: ID!): Article!
    rollbackArticle(id: ID!, targetVersion: Int!): Article!
    
    # User Management
    updateUserRole(userId: ID!, newRole: Role!): User!
    upgradeMembership(userId: ID!, newTier: MembershipTier!): User!
}
